<!DOCTYPE html>
<html>
<head>
    <title>Kayıt Ol</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: white; padding: 30px; border-radius: 15px; width: 350px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .prev-img { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 4px solid #25D366; cursor: pointer; transition: 0.3s; }
        .prev-img:hover { transform: scale(1.05); }
        input, select { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
        button { width: 100%; padding: 12px; background: #25D366; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 10px; }
        button:hover { background: #1ebe57; }
    </style>
</head>
<body>
    <div class="box">
        <h2 style="color: #075e54;">Hesap Oluştur</h2>
        <div onclick="document.getElementById('fileIn').click()">
            <img src="https://cdn-icons-png.flaticon.com/512/4140/4140037.png" id="view" class="prev-img">
            <p style="font-size:12px; color:gray; margin-top:5px;">Fotoğraf Değiştir</p>
        </div>

        <form method="POST" id="regForm">
            <input type="hidden" name="avatar_data" id="avatar_data">
            <input type="text" name="username" placeholder="Kullanıcı Adı" required>
            <input type="password" name="password" placeholder="Şifre" required>
            
            <label style="font-size: 12px; color: gray; display: block; text-align: left; margin-left: 5px;">Cinsiyet Seçimi</label>
            <select name="gender" id="gender" onchange="updateDefaultAva()">
                <option value="Erkek">Erkek</option>
                <option value="Kadın">Kadın</option>
            </select>
            
            <button type="submit">Kayıt Ol ve Başlat</button>
        </form>
        <input type="file" id="fileIn" style="display:none" accept="image/*" onchange="processFile(this)">
    </div>

    <script>
        // Cinsiyet değiştikçe varsayılan resmi ayarlar
        function updateDefaultAva() {
            const gender = document.getElementById('gender').value;
            const view = document.getElementById('view');
            const hiddenInput = document.getElementById('avatar_data');
            
            // Eğer kullanıcı manuel resim seçmemişse varsayılanı değiştir
            if (!hiddenInput.value) {
                if (gender === "Erkek") {
                    view.src = "https://cdn-icons-png.flaticon.com/512/4140/4140037.png";
                } else {
                    view.src = "https://cdn-icons-png.flaticon.com/512/4140/4140047.png";
                }
            }
        }

        // Seçilen dosyayı Base64'e çevirip inputa yazar
        function processFile(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('view').src = e.target.result;
                    document.getElementById('avatar_data').value = e.target.result;
                };
                reader.readAsDataURL(input.files[0]);
            }
        }
    </script>
</body>
</html>
