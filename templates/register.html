<form method="POST">
    <input type="text" name="username" placeholder="Kullanıcı Adı" required>
    <input type="password" name="password" placeholder="Şifre" required>
    <div style="margin:10px 0;">
        <label>Profil Resmi Seç:</label>
        <input type="file" accept="image/*" onchange="encodeImage(this)">
        <input type="hidden" name="avatar_data" id="avatar_data" value="https://www.w3schools.com/howto/img_avatar.png">
    </div>
    <button type="submit">Kayıt Ol</button>
</form>
<script>
    function encodeImage(input) {
        const reader = new FileReader();
        reader.onload = e => document.getElementById('avatar_data').value = e.target.result;
        reader.readAsDataURL(input.files[0]);
    }
</script>
