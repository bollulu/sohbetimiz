<!DOCTYPE html>
<html>
<head>
    <title>Kayıt Ol - WhatsApp</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); width: 350px; text-align: center; }
        h2 { color: #075e54; margin-bottom: 20px; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #25D366; border: none; color: white; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; margin-top: 10px; }
        .avatar-preview { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 3px solid #25D366; margin-bottom: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Hesap Oluştur</h2>
        <img id="prev" src="https://www.w3schools.com/howto/img_avatar.png" class="avatar-preview" onclick="document.getElementById('fileIn').click()">
        <p style="font-size: 12px; color: #777;">Resme tıklayarak profil resmi seçin</p>
        <form method="POST">
            <input type="text" name="username" placeholder="Kullanıcı Adı" required>
            <input type="password" name="password" placeholder="Şifre" required>
            <select name="gender">
                <option value="Erkek">Erkek</option>
                <option value="Kız">Kız</option>
            </select>
            <input type="file" id="fileIn" style="display:none" accept="image/*" onchange="previewImg(this)">
            <input type="hidden" name="avatar_data" id="avatar_data">
            <button type="submit">Kayıt Ol</button>
        </form>
        <p style="font-size: 14px;">Zaten üye misiniz? <a href="/login" style="color:#075e54; text-decoration:none; font-weight:bold;">Giriş Yap</a></p>
    </div>
    <script>
        function previewImg(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = e => {
                    document.getElementById('prev').src = e.target.result;
                    document.getElementById('avatar_data').value = e.target.result;
                }
                reader.readAsDataURL(input.files[0]);
            }
        }
    </script>
</body>
</html>
