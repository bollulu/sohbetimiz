<!DOCTYPE html>
<html>
<head>
    <title>WhatsApp - Kayıt Ol</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: white; padding: 35px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 360px; text-align: center; }
        h2 { color: #075e54; margin-bottom: 25px; font-size: 28px; }
        .avatar-area { position: relative; display: inline-block; margin-bottom: 15px; }
        .prev-img { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 3px solid #25D366; cursor: pointer; background: #eee; }
        input, select { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; outline: none; }
        input:focus { border-color: #25D366; }
        button { width: 100%; padding: 13px; background: #25D366; border: none; color: white; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; margin-top: 15px; transition: 0.3s; }
        button:hover { background: #1ebe57; }
        .link { font-size: 14px; margin-top: 15px; color: #666; }
        .link a { color: #075e54; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="box">
    <h2>Kayıt Ol</h2>
    
    <div class="avatar-area" onclick="document.getElementById('fileIn').click()">
        <img id="view" src="https://www.w3schools.com/howto/img_avatar.png" class="prev-img">
        <div style="font-size: 11px; color: #25D366; margin-top: 5px; font-weight: bold;">FOTOĞRAF SEÇ</div>
    </div>

    <form method="POST">
        <input type="text" name="username" placeholder="Kullanıcı Adı" required>
        <input type="password" name="password" placeholder="Şifre" required>
        <select name="gender">
            <option value="Erkek">Erkek</option>
            <option value="Kız">Kız</option>
        </select>
        
        <input type="hidden" name="avatar_data" id="avatar_data">
        
        <button type="submit">Hesabı Oluştur</button>
    </form>

    <input type="file" id="fileIn" style="display:none" accept="image/*" onchange="compressAndPreview(this)">
    
    <div class="link">
        Zaten bir hesabın var mı? <a href="/login">Giriş Yap</a>
    </div>
</div>

<script>
function compressAndPreview(input) {
    if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function (e) {
            const img = new Image();
            img.src = e.target.result;
            img.onload = function () {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                // Hedef boyut: 300x300 (Profil için ideal)
                const size = 300;
                canvas.width = size;
                canvas.height = size;

                // Resmi kare olarak kırp ve boyutlandır
                const minSide = Math.min(img.width, img.height);
                ctx.drawImage(img, (img.width - minSide) / 2, (img.height - minSide) / 2, minSide, minSide, 0, 0, size, size);

                // Veriyi JPEG formatında %70 kalitede sıkıştır
                const compressed = canvas.toDataURL('image/jpeg', 0.7);
                document.getElementById('view').src = compressed;
                document.getElementById('avatar_data').value = compressed;
            }
        };
        reader.readAsDataURL(input.files[0]);
    }
}
</script>

</body>
</html>
