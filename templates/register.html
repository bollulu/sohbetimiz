<!DOCTYPE html>
<html>
<head>
    <title>Kayıt Ol</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: white; padding: 30px; border-radius: 15px; width: 350px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .prev-img { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 4px solid #25D366; cursor: pointer; }
        input, select { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #25D366; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Kayıt Ol</h2>
        <div onclick="document.getElementById('fileIn').click()">
            <img src="https://cdn-icons-png.flaticon.com/512/4140/4140037.png" id="view" class="prev-img">
            <p style="font-size:12px; color:gray">Profil Resmi Seç</p>
        </div>
        <form method="POST">
            <input type="hidden" name="avatar_data" id="avatar_data">
            <input type="text" name="username" placeholder="Kullanıcı Adı" required>
            <input type="password" name="password" placeholder="Şifre" required>
            <select name="gender" id="gender" onchange="updateDef()">
                <option value="Erkek">Erkek</option>
                <option value="Kadın">Kadın</option>
            </select>
            <button type="submit">Hesabı Oluştur</button>
        </form>
        <input type="file" id="fileIn" style="display:none" accept="image/*" onchange="preview(this)">
    </div>

    <script>
        function updateDef() {
            const g = document.getElementById('gender').value;
            const h = document.getElementById('avatar_data');
            if(!h.value) document.getElementById('view').src = g === "Erkek" ? "https://cdn-icons-png.flaticon.com/512/4140/4140037.png" : "https://cdn-icons-png.flaticon.com/512/4140/4140047.png";
        }

        function preview(i) {
            if (i.files && i.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        const MAX_SIZE = 500;
                        let w = img.width;
                        let h = img.height;

                        if (w > h) { if (w > MAX_SIZE) { h *= MAX_SIZE / w; w = MAX_SIZE; } }
                        else { if (h > MAX_SIZE) { w *= MAX_SIZE / h; h = MAX_SIZE; } }

                        canvas.width = w;
                        canvas.height = h;
                        ctx.drawImage(img, 0, 0, w, h);
                        
                        const compressed = canvas.toDataURL('image/jpeg', 0.7);
                        document.getElementById('view').src = compressed;
                        document.getElementById('avatar_data').value = compressed;
                    };
                };
                reader.readAsDataURL(i.files[0]);
            }
        }
    </script>
</body>
</html>
