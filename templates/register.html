<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kayıt Ol</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f0f2f5; margin:0; }
        .card { background: white; padding: 25px; border-radius: 15px; width: 90%; max-width: 400px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input, select { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
        .avatar-preview { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; margin: 10px auto; display: block; background: #eee; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Kayıt Ol</h2>
        <form method="POST">
            <input type="text" name="username" placeholder="Kullanıcı Adı" required>
            <input type="password" name="password" placeholder="Şifre" required>
            <select name="gender">
                <option value="Erkek">Erkek</option>
                <option value="Kadın">Kadın</option>
                <option value="Belirtmek İstemiyorum">Belirtmek İstemiyorum</option>
            </select>
            <label>Profil Fotoğrafı Seç:</label>
            <input type="file" id="fileIn" accept="image/*" onchange="preview(this)">
            <img id="p-prev" class="avatar-preview" src="">
            <input type="hidden" name="avatar_data" id="avatar_data">
            <button type="submit" style="width:100%; padding:12px; background:#25D366; color:white; border:none; border-radius:8px; cursor:pointer;">Kayıt Tamamla</button>
        </form>
    </div>
    <script>
        function preview(i) {
            const r = new FileReader();
            r.onload = e => { 
                document.getElementById('p-prev').src = e.target.result;
                document.getElementById('avatar_data').value = e.target.result;
            };
            r.readAsDataURL(i.files[0]);
        }
    </script>
</body>
</html>
