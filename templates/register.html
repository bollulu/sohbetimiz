<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Kayıt Ol</title></head>
<body style="font-family:sans-serif; background:#f0f2f5; display:flex; justify-content:center; align-items:center; height:100vh; margin:0;">
    <div style="background:white; padding:40px; border-radius:15px; box-shadow:0 10px 25px rgba(0,0,0,0.1); width:320px; text-align:center;">
        <h2 style="color:#075e54">Yeni Hesap Oluştur</h2>
        <form method="POST">
            <input type="text" name="username" placeholder="Kullanıcı Adı" style="width:100%; padding:12px; margin:10px 0; border:1px solid #ddd; border-radius:8px; box-sizing:border-box;" required>
            <input type="password" name="password" placeholder="Şifre" style="width:100%; padding:12px; margin:10px 0; border:1px solid #ddd; border-radius:8px; box-sizing:border-box;" required>
            <button type="submit" style="width:100%; padding:12px; background:#075e54; color:white; border:none; border-radius:8px; cursor:pointer; font-weight:bold;">KAYIT OL</button>
        </form>
        <p style="margin-top:15px; font-size:14px;">Zaten üye misin? <a href="/login" style="color:#075e54; text-decoration:none;">Giriş Yap</a></p>
    </div>
</body>
</html>
