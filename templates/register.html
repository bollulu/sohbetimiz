<!DOCTYPE html>
<html>
<head><title>Kayıt Ol</title></head>
<body style="display:flex; justify-content:center; align-items:center; height:100vh; background:#f0f2f5; font-family:sans-serif;">
    <div style="background:white; padding:40px; border-radius:15px; box-shadow:0 4px 15px rgba(0,0,0,0.1); width:300px; text-align:center;">
        <h2 style="color:#075e54;">Kayıt Ol</h2>
        <form method="POST">
            <input type="text" name="username" placeholder="Kullanıcı Adı" required style="width:100%; padding:12px; margin:10px 0; border:1px solid #ddd; border-radius:8px; box-sizing:border-box;">
            <input type="password" name="password" placeholder="Şifre" required style="width:100%; padding:12px; margin:10px 0; border:1px solid #ddd; border-radius:8px; box-sizing:border-box;">
            <input type="hidden" name="avatar_data" id="ava_data" value="https://www.w3schools.com/howto/img_avatar.png">
            <button type="submit" style="width:100%; padding:12px; background:#075e54; color:white; border:none; border-radius:8px; cursor:pointer; font-weight:bold; margin-top:10px;">Kayıt Ol</button>
        </form>
        <p style="margin-top:20px; font-size:14px;"><a href="{{ url_for('login') }}">Giriş Sayfasına Dön</a></p>
    </div>
</body>
</html>
