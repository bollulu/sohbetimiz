<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kayıt Ol</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin:0; }
        .card { background: white; padding: 25px; border-radius: 20px; width: 320px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 10px; }
        #preview { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 3px solid #25D366; margin: 10px auto; display: block; }
        .cam-box { display:none; background: #000; border-radius: 10px; margin-top: 10px; overflow: hidden; }
        video { width: 100%; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Yeni Hesap</h2>
        <form method="POST">
            <input type="text" name="username" placeholder="Kullanıcı Adı" required>
            <input type="password" name="password" placeholder="Şifre" required>
            <select name="gender" id="gender" onchange="defAva()">
                <option value="Erkek">Erkek</option>
                <option value="Kadın">Kadın</option>
            </select>
            <img id="preview" src="">
            <input type="hidden" name="avatar_data" id="avatar_data">
            <div style="display:flex; gap:5px;">
                <button type="button" onclick="document.getElementById('fileIn').click()">Dosya</button>
                <button type="button" onclick="startCam()">Kamera</button>
            </div>
            <div id="cam-ui" class="cam-box">
                <video id="vid" autoplay playsinline></video>
                <button type="button" onclick="capture()">Çek</button>
            </div>
            <input type="file" id="fileIn" style="display:none" onchange="processFile(this.files[0])">
            <button type="submit" style="width:100%; padding:15px; background:#075e54; color:white; border:none; border-radius:10px; margin-top:15px;">Kayıt Ol</button>
        </form>
    </div>
    <script>
        const a = {"Erkek":"https://cdn-icons-png.flaticon.com/512/4128/4128176.png", "Kadın":"https://cdn-icons-png.flaticon.com/512/6997/6997662.png"};
        function defAva() {
            const g = document.getElementById('gender').value;
            document.getElementById('preview').src = a[g];
            document.getElementById('avatar_data').value = a[g];
        }
        defAva();

        function processFile(f) {
            const r = new FileReader();
            r.onload = e => compress(e.target.result);
            r.readAsDataURL(f);
        }

        function compress(s) {
            const img = new Image();
            img.src = s;
            img.onload = () => {
                const c = document.createElement('canvas');
                c.width = 400; c.height = 400;
                c.getContext('2d').drawImage(img, 0, 0, 400, 400);
                const d = c.toDataURL('image/jpeg', 0.7);
                document.getElementById('preview').src = d;
                document.getElementById('avatar_data').value = d;
            }
        }

        async function startCam() {
            document.getElementById('cam-ui').style.display='block';
            const s = await navigator.mediaDevices.getUserMedia({video:true});
            document.getElementById('vid').srcObject = s;
        }

        function capture() {
            const v = document.getElementById('vid');
            const c = document.createElement('canvas');
            c.width = v.videoWidth; c.height = v.videoHeight;
            c.getContext('2d').drawImage(v, 0, 0);
            compress(c.toDataURL('image/jpeg'));
            v.srcObject.getTracks().forEach(t => t.stop());
            document.getElementById('cam-ui').style.display='none';
        }
    </script>
</body>
</html>
