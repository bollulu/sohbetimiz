<!DOCTYPE html>
<html>
<head>
    <title>Kayıt Ol - WhatsApp Ultra</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: white; padding: 30px; border-radius: 15px; width: 350px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .prev-img { width: 110px; height: 110px; border-radius: 50%; object-fit: cover; border: 3px solid #25D366; cursor: pointer; }
        input, select { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #25D366; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Hesap Oluştur</h2>
        <div onclick="document.getElementById('fileIn').click()">
            <img src="https://cdn-icons-png.flaticon.com/512/4140/4140037.png" id="view" class="prev-img">
            <p style="font-size:12px; color:gray">Fotoğraf Seç</p>
        </div>
        <form method="POST" onsubmit="return validateForm()">
            <input type="hidden" name="avatar_data" id="avatar_data">
            <input type="text" name="username" placeholder="Kullanıcı Adı" required>
            <input type="password" name="password" placeholder="Şifre" required>
            <select name="gender" id="gender" onchange="updateDefault()">
                <option value="Erkek">Erkek</option>
                <option value="Kadın">Kadın</option>
            </select>
            <button type="submit">Kayıt Ol</button>
        </form>
        <input type="file" id="fileIn" style="display:none" accept="image/*" onchange="preview(this)">
    </div>
    <script>
        function updateDefault() {
            const g = document.getElementById('gender').value;
            const h = document.getElementById('avatar_data');
            if(!h.value) document.getElementById('view').src = g === "Erkek" ? "https://cdn-icons-png.flaticon.com/512/4140/4140037.png" : "https://cdn-icons-png.flaticon.com/512/4140/4140047.png";
        }
        function preview(i) {
            const r = new FileReader();
            r.onload = e => {
                document.getElementById('view').src = e.target.result;
                document.getElementById('avatar_data').value = e.target.result;
            };
            r.readAsDataURL(i.files[0]);
        }
        function validateForm() { return true; }
    </script>
</body>
</html>
