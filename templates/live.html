<!DOCTYPE html>
<html>
<head>
    <title>Canlı Görüşme</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        body { background: #000; color: #fff; margin: 0; font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; }
        .video-container { flex: 1; position: relative; background: #111; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        #remoteVideo { width: 100%; height: 100%; object-fit: cover; }
        #localVideo { position: absolute; right: 20px; top: 20px; width: 120px; height: 160px; border: 2px solid #fff; border-radius: 12px; object-fit: cover; z-index: 10; background: #222; }
        .controls { padding: 30px; display: flex; justify-content: center; gap: 15px; background: rgba(0,0,0,0.8); }
        .btn { padding: 15px 25px; border-radius: 30px; border: none; font-weight: bold; cursor: pointer; color: white; font-size: 14px; }
        .btn-camera { background: #3498db; }
        .btn-switch { background: #f39c12; }
        .btn-stop { background: #e74c3c; text-decoration: none; display: flex; align-items: center; }
    </style>
</head>
<body>
    <div class="video-container">
        <video id="remoteVideo" autoplay playsinline></video>
        <video id="localVideo" autoplay playsinline muted></video>
    </div>
    <div id="status" style="background:#222; padding:5px; font-size:0.8em; color:#888;">Sistem hazır</div>
    
    <div class="controls">
        <button id="frontCamBtn" class="btn btn-camera" onclick="initCall('user')">Kamerayı Aç</button>
        <button id="rearCamBtn" class="btn btn-switch" onclick="initCall('environment')" style="display:none;">Arka Kamera</button>
        <a href="/chat" class="btn btn-stop">Kapat</a>
    </div>

    <script>
        const socket = io();
        let localStream, peer;
        const cfg = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

        // CİHAZ TESPİTİ
        document.addEventListener("DOMContentLoaded", function() {
            const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
            const rearBtn = document.getElementById('rearCamBtn');
            const frontBtn = document.getElementById('frontCamBtn');

            if (isMobile) {
                rearBtn.style.display = "inline-block";
                frontBtn.innerText = "Ön Kamera";
            } else {
                frontBtn.innerText = "Kamerayı Aç";
            }
        });

        async function initCall(mode) {
            if(localStream) localStream.getTracks().forEach(t => t.stop());
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: mode }, audio: true });
                document.getElementById('localVideo').srcObject = localStream;
                document.getElementById('status').innerText = "Bağlantı bekleniyor...";
                socket.emit('join_live', { room: 'live_room' });
            } catch(e) { alert("Kamera hatası veya izni reddedildi!"); }
        }

        socket.on('user_joined', async () => {
            setupPeer();
            const offer = await peer.createOffer();
            await peer.setLocalDescription(offer);
            socket.emit('signal', { type: 'offer', sdp: offer });
        });

        socket.on('signal', async data => {
            if(data.type === 'offer') {
                setupPeer();
                await peer.setRemoteDescription(new RTCSessionDescription(data.sdp));
                const answer = await peer.createAnswer();
                await peer.setLocalDescription(answer);
                socket.emit('signal', { type: 'answer', sdp: answer });
            } else if(data.type === 'answer') {
                await peer.setRemoteDescription(new RTCSessionDescription(data.sdp));
            } else if(data.type === 'candidate') {
                await peer.addIceCandidate(new RTCIceCandidate(data.candidate));
            }
        });

        function setupPeer() {
            if(peer) return;
            peer = new RTCPeerConnection(cfg);
            localStream.getTracks().forEach(t => peer.addTrack(t, localStream));
            peer.onicecandidate = e => e.candidate && socket.emit('signal', { type: 'candidate', candidate: e.candidate });
            peer.ontrack = e => {
                document.getElementById('remoteVideo').srcObject = e.streams[0];
                document.getElementById('status').innerText = "Görüşme Aktif";
            };
        }
    </script>
</body>
</html>
