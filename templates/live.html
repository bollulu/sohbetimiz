<!DOCTYPE html>
<html>
<head>
    <title>Görüntülü Arama</title>
    <style>
        body { margin: 0; background: #111; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; }
        .v-container { position: relative; width: 80%; max-width: 800px; height: 60vh; background: #222; border-radius: 20px; overflow: hidden; }
        video { width: 100%; height: 100%; object-fit: cover; }
        #localVideo { position: absolute; width: 150px; height: 100px; bottom: 20px; right: 20px; border: 2px solid #25D366; border-radius: 10px; }
        .btns { margin-top: 30px; display: flex; gap: 20px; }
        .b { padding: 15px 40px; border-radius: 30px; border: none; cursor: pointer; font-weight: bold; font-size: 16px; }
    </style>
</head>
<body>
    <h2>Canlı Görüşme</h2>
    <div class="v-container">
        <video id="remoteVideo" autoplay playsinline></video>
        <video id="localVideo" autoplay playsinline muted></video>
    </div>
    <div class="btns">
        <button class="b" style="background:#25D366; color:white;" onclick="start()">Aramayı Başlat</button>
        <button class="b" style="background:#ff3b30; color:white;" onclick="location.href='/chat'">Görüşmeyi Kapat</button>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script>
        const socket = io();
        async function start() {
            const stream = await navigator.mediaDevices.getUserMedia({video: true, audio: true});
            document.getElementById('localVideo').srcObject = stream;
            // WebRTC kodları buraya entegre edilebilir.
        }
    </script>
</body>
</html>
