<!DOCTYPE html>
<html>
<head><title>Live</title><style>
    body { margin: 0; background: #111; color: white; display: flex; flex-direction: column; align-items: center; height: 100vh; font-family: sans-serif; }
    video { width: 80%; max-width: 600px; border-radius: 15px; margin-top: 20px; background: #222; }
    .controls { margin-top: 20px; }
    .btn { padding: 15px 30px; border-radius: 30px; border: none; cursor: pointer; font-weight: bold; margin: 10px; }
    .hangup { background: #ff3b30; color: white; }
</style></head>
<body>
    <h2>Canlı Görüşme</h2>
    <video id="localVideo" autoplay playsinline muted></video>
    <div class="controls">
        <button class="btn" style="background:#25D366; color:white;" onclick="start()">Aramayı Başlat</button>
        <button class="btn hangup" onclick="location.href='/chat'">Kapat ve Geri Dön</button>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script>
        const socket = io();
        async function start() {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            document.getElementById('localVideo').srcObject = stream;
            // WebRTC sinyalleşme buraya eklenebilir
        }
    </script>
</body>
</html>
