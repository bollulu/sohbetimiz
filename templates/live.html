<!DOCTYPE html>
<html>
<head>
    <title>Canlı Görüşme - Sohbetimiz</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        body { background: #000; color: #fff; margin: 0; font-family: 'Segoe UI', sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        .video-container { flex: 1; position: relative; background: #111; display: flex; align-items: center; justify-content: center; }
        #remoteVideo { width: 100%; height: 100%; object-fit: cover; }
        #localVideo { position: absolute; right: 20px; top: 20px; width: 110px; height: 150px; border: 2px solid #fff; border-radius: 12px; object-fit: cover; z-index: 10; background: #222; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .controls { padding: 25px; display: flex; justify-content: center; gap: 15px; background: linear-gradient(transparent, rgba(0,0,0,0.9)); position: absolute; bottom: 0; width: 100%; box-sizing: border-box; }
        .btn { padding: 14px 22px; border-radius: 30px; border: none; font-weight: bold; cursor: pointer; color: white; font-size: 14px; transition: 0.3s; }
        .btn-camera { background: #3498db; }
        .btn-camera:hover { background: #2980b9; }
        .btn-switch { background: #f39c12; }
        .btn-switch:hover { background: #e67e22; }
        .btn-stop { background: #e74c3c; text-decoration: none; display: flex; align-items: center; }
        .btn-stop:hover { background: #c0392b; }
        #status { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.5); padding: 5px 12px; border-radius: 15px; font-size: 0.75em; color: #ccc; z-index: 20; }
    </style>
</head>
<body>
    <div id="status">Sistem hazır. Başlamak için kamerayı açın.</div>
    
    <div class="video-container">
        <video id="remoteVideo" autoplay playsinline></video>
        <video id="localVideo" autoplay playsinline muted></video>
    </div>
    
    <div class="controls">
        <button id="frontCamBtn" class="btn btn-camera" onclick="initCall('user')">Kamerayı Aç</button>
        <button id="rearCamBtn" class="btn btn-switch" onclick="initCall('environment')" style="display:none;">Arka Kamera</button>
        <a href="/chat" class="btn btn-stop">Görüşmeyi Kapat</a>
    </div>

    <script>
        const socket = io();
        let localStream, peer;
        const cfg = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

        // 1. CİHAZ TESPİTİ: Bilgisayarda arka kamera butonunu gizler
        document.addEventListener("DOMContentLoaded", function() {
            const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
            const rearBtn = document.getElementById('rearCamBtn');
            const frontBtn = document.getElementById('frontCamBtn');

            if (isMobile) {
                rearBtn.style.display = "inline-block";
                frontBtn.innerText = "Ön Kamera";
            } else {
                frontBtn.innerText = "Kamerayı Başlat";
            }
        });

        // 2. ANA FONKSİYON: Kamera açma ve değiştirme
        async function initCall(mode) {
            try {
                // Yeni akışı al
                const newStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: mode }, 
                    audio: true 
                });

                // Eğer aktif bir bağlantı (peer) varsa, sadece video kanalını değiştir (Donmayı engeller)
                if (peer) {
                    const videoTrack = newStream.getVideoTracks()[0];
                    const sender = peer.getSenders().find(s => s.track && s.track.kind === 'video');
                    if (sender) {
                        sender.replaceTrack(videoTrack);
                    }
                    // Eski akışı durdur
                    if (localStream) localStream.getTracks().forEach(t => t.stop());
                } else {
                    // İlk defa bağlanılıyorsa odaya katıl
                    socket.emit('join_live', { room: 'live_room' });
                }

                localStream = newStream;
                document.getElementById('localVideo').srcObject = localStream;
                document.getElementById('status').innerText = "Kamera aktif. Bağlantı kuruluyor...";

            } catch(e) { 
                alert("Kamera izni reddedildi veya hata oluştu: " + e); 
            }
        }

        // 3. SİNYALLEŞME MANTIĞI
        socket.on('user_joined', async () => {
            setupPeer();
            const offer = await peer.createOffer
