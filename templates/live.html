<!DOCTYPE html>
<html>
<head>
    <title>Canlı Görüşme - Sohbetimiz</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        body { background: #000; color: #fff; margin: 0; font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; }
        .video-box { flex: 1; position: relative; background: #111; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        #remoteVideo { width: 100%; height: 100%; object-fit: cover; }
        #localVideo { position: absolute; right: 15px; top: 15px; width: 100px; height: 140px; border: 2px solid white; border-radius: 10px; object-fit: cover; z-index: 10; background: #222; }
        .controls { padding: 20px; display: flex; justify-content: center; gap: 10px; background: #000; }
        .btn { padding: 15px 20px; border-radius: 25px; border: none; font-weight: bold; cursor: pointer; color: white; font-size: 14px; }
        .btn-blue { background: #007bff; }
        .btn-orange { background: #fd7e14; }
        .btn-red { background: #dc3545; text-decoration: none; }
        #status { background: #333; padding: 8px; font-size: 12px; text-align: center; color: #ccc; }
    </style>
</head>
<body>

    <div id="status">Sistem hazır. Lütfen kamerayı başlatın.</div>

    <div class="video-box">
        <video id="remoteVideo" autoplay playsinline></video>
        <video id="localVideo" autoplay playsinline muted></video>
    </div>

    <div class="controls">
        <button id="startBtn" class="btn btn-blue" onclick="startStream('user')">Kamerayı Başlat</button>
        <button id="switchBtn" class="btn btn-orange" onclick="startStream('environment')" style="display:none;">Arka Kamera</button>
        <a href="/chat" class="btn btn-red">Kapat</a>
    </div>

    <script>
        const socket = io();
        let localStream, peer;
        const config = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

        // Cihaz Kontrolü: Telefon mu Bilgisayar mı?
        function checkDevice() {
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            if (isMobile) {
                document.getElementById('switchBtn').style.display = 'inline-block';
                document.getElementById('startBtn').innerText = 'Ön Kamera';
            }
        }
        checkDevice(); // Sayfa açılır açılmaz çalıştır

        async function startStream(mode) {
            try {
                const constraints = {
                    video: { facingMode: mode },
                    audio: true
                };

                const newStream = await navigator.mediaDevices.getUserMedia(constraints);
                
                // Eğer zaten bir görüşme varsa (donmayı engellemek için replaceTrack kullan)
                if (peer) {
                    const videoTrack = newStream.getVideoTracks()[0];
                    const sender = peer.getSenders().find(s => s.track && s.track.kind === 'video');
                    if (sender) {
                        sender.replaceTrack(videoTrack);
                    }
                    // Eski stream'i kapat
                    if (localStream) {
                        localStream.getTracks().forEach(t => t.stop());
                    }
                } else {
                    // İlk kez oda kuruluyor
                    socket.emit('join_live', { room: 'live_room' });
                }

                localStream = newStream;
                document.getElementById('localVideo').srcObject = localStream;
                document.getElementById('status').innerText = "Kamera aktif. Bağlantı bekleniyor...";

            } catch (err) {
                console.error("Kamera hatası:", err);
                document.getElementById('status').innerText = "Hata: Kameraya erişilemedi.";
                alert("Kamera başlatılamadı. Lütfen izin verdiğinizden emin olun.");
            }
        }

        socket.on('user_joined', async () => {
            setupPeer();
            const offer = await peer.createOffer();
            await peer.setLocalDescription(offer);
            socket.emit('signal', { type: 'offer', sdp: offer });
        });

        socket.on('signal', async (data) => {
            if (data.type === 'offer') {
                setupPeer();
                await peer.setRemoteDescription(new RTCSessionDescription(data.sdp));
                const answer = await peer.createAnswer();
                await peer.setLocalDescription(answer);
                socket.emit('signal', { type: 'answer', sdp: answer });
            } else if (data.type === 'answer') {
                await peer.setRemoteDescription(new RTCSessionDescription(data.sdp));
            } else if (data.type === 'candidate') {
                if (peer) {
                    await peer.addIceCandidate(new RTCIceCandidate(data.candidate)).catch(e => {});
                }
            }
        });

        function setupPeer() {
            if (peer) return;
            peer = new RTCPeerConnection(config);

            localStream.getTracks().forEach(track => peer.addTrack(track, localStream));

            peer.onicecandidate = (event) => {
                if (event.candidate) {
                    socket.emit('signal', { type: 'candidate', candidate: event.candidate });
                }
            };

            peer.ontrack = (event) => {
                document.getElementById('remoteVideo').srcObject = event.streams[0];
                document.getElementById('status').innerText = "Görüşme başladı!";
            };

            peer.onconnectionstatechange = () => {
                if (peer.connectionState === 'disconnected') {
                    document.getElementById('status').innerText = "Bağlantı kesildi.";
                }
            };
        }
    </script>
</body>
</html>
