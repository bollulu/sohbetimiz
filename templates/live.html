<!DOCTYPE html>
<html>
<head>
    <title>Canlı Görüşme</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        body { background: #000; color: #fff; margin: 0; font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        .video-box { flex: 1; position: relative; background: #111; display: flex; align-items: center; justify-content: center; }
        #remoteVideo { width: 100%; height: 100%; object-fit: cover; }
        #localVideo { 
            position: absolute; right: 20px; top: 20px; 
            width: 120px; height: 160px; 
            border: 2px solid white; border-radius: 10px; 
            object-fit: cover; z-index: 10; background: #333; 
            transform: scaleX(-1); /* Ayna efekti */
        }
        
        .controls { padding: 20px; display: flex; justify-content: center; gap: 20px; background: rgba(0,0,0,0.8); position: absolute; bottom: 0; width: 100%; box-sizing: border-box; }
        .btn { width: 50px; height: 50px; border-radius: 50%; border: none; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .btn-end { background: red; color: white; }
        .btn-cam { background: #444; color: white; }
        
        #status { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 18px; color: #aaa; z-index: 0; }
        
        @media (min-width: 800px) {
            /* Bilgisayarda kamera değiştir butonunu gizle (genelde tek kamera vardır) */
            #switch-cam-btn { display: none; }
        }
    </style>
</head>
<body>

<div class="video-box">
    <div id="status">Bağlantı bekleniyor...</div>
    <video id="remoteVideo" autoplay playsinline></video>
    <video id="localVideo" autoplay playsinline muted></video>
    
    <div class="controls">
        <button class="btn btn-cam" id="switch-cam-btn" onclick="switchCamera()">📷</button>
        <button class="btn btn-end" onclick="window.close()">📞</button>
    </div>
</div>

<script>
    const socket = io();
    const localVideo = document.getElementById('localVideo');
    const remoteVideo = document.getElementById('remoteVideo');
    
    let localStream;
    let peer;
    let currentFacingMode = 'user'; // 'user' (ön) veya 'environment' (arka)

    // STUN sunucuları bağlantı kurmak için şarttır
    const rtcConfig = {
        iceServers: [
            { urls: "stun:stun.l.google.com:19302" },
            { urls: "stun:stun1.l.google.com:19302" }
        ]
    };

    async function startCamera() {
        try {
            const constraints = {
                audio: true,
                video: { facingMode: currentFacingMode }
            };
            localStream = await navigator.mediaDevices.getUserMedia(constraints);
            localVideo.srcObject = localStream;
            socket.emit('signal', { type: 'ready' });
        } catch(e) {
            alert("Kameraya erişilemedi: " + e);
        }
    }

    async function switchCamera() {
        if(localStream) {
            localStream.getTracks().forEach(t => t.stop());
        }
        currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';
        startCamera().then(() => {
             // Eğer peer varsa track'i değiştirmek gerekir ama basitlik için
             // sayfayı yenilemek en temiz yöntemdir mobilde.
             // Ancak bağlantıyı koparmadan yapmak için replaceTrack gerekir.
             // Bu örnekte basitçe akışı yeniliyoruz, karşı tarafa yeniden offer gitmesi gerekebilir.
             if(peer) {
                 const videoTrack = localStream.getVideoTracks()[0];
                 const sender = peer.getSenders().find(s => s.track.kind === 'video');
                 if(sender) sender.replaceTrack(videoTrack);
             }
        });
    }

    socket.on('signal', async (data) => {
        if (data.type === 'ready') {
            if (!peer) makeCall();
        } else if (data.type === 'offer') {
            if (!peer) createPeer();
            await peer.setRemoteDescription(new RTCSessionDescription(data.sdp));
            const answer = await peer.createAnswer();
            await peer.setLocalDescription(answer);
            socket.emit('signal', { type: 'answer', sdp: answer });
        } else if (data.type === 'answer') {
            await peer.setRemoteDescription(new RTCSessionDescription(data.sdp));
        } else if (data.type === 'candidate') {
            if (peer) await peer.addIceCandidate(new RTCIceCandidate(data.candidate));
        }
    });

    function createPeer() {
        peer = new RTCPeerConnection(rtcConfig);
        peer.onicecandidate = e => {
            if (e.candidate) socket.emit('signal', { type: 'candidate', candidate: e.candidate });
        };
        peer.ontrack = e => {
            remoteVideo.srcObject = e.streams[0];
            document.getElementById('status').style.display = 'none';
        };
        localStream.getTracks().forEach(track => peer.addTrack(track, localStream));
    }

    function makeCall() {
        createPeer();
        peer.createOffer().then(offer => {
            peer.setLocalDescription(offer);
            socket.emit('signal', { type: 'offer', sdp: offer });
        });
    }

    startCamera();
</script>
</body>
</html>
