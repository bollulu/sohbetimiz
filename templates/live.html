<!DOCTYPE html>
<html>
<head>
    <title>Canlı Görüşme - Sohbetimiz</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        body { background: #1a1a1a; color: white; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; }
        .video-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 20px; }
        video { width: 45%; max-width: 400px; min-width: 300px; border-radius: 15px; background: #000; border: 2px solid #444; }
        .controls { margin-top: 30px; }
        .btn { padding: 12px 25px; border-radius: 25px; border: none; cursor: pointer; font-weight: bold; margin: 5px; }
        .btn-start { background: #2e7d32; color: white; }
        .btn-stop { background: #c62828; color: white; }
        #status { color: #aaa; margin-top: 10px; font-size: 0.9em; }
    </style>
</head>
<body>
    <h2>Görüntülü Sohbet</h2>
    <p id="status">Bağlantı bekleniyor...</p>
    
    <div class="video-container">
        <div>
            <p>Sen</p>
            <video id="localVideo" autoplay playsinline muted></video>
        </div>
        <div>
            <p>Karşıdaki</p>
            <video id="remoteVideo" autoplay playsinline></video>
        </div>
    </div>

    <div class="controls">
        <button class="btn btn-start" onclick="startCall()">Görüşmeyi Başlat</button>
        <a href="/chat"><button class="btn btn-stop">Ayrıl</button></a>
    </div>

    <script>
        const socket = io();
        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');
        const statusText = document.getElementById('status');
        
        let localStream;
        let peerConnection;
        const config = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

        async function startCall() {
            statusText.innerText = "Kamera açılıyor...";
            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            localVideo.srcObject = localStream;

            socket.emit('join_live', { room: 'live_room' });
            statusText.innerText = "Bağlantı kuruluyor...";
        }

        socket.on('user_joined', async () => {
            statusText.innerText = "Birisi bağlandı, arama başlatılıyor...";
            createPeerConnection();
            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);
            socket.emit('signal', { type: 'offer', sdp: offer });
        });

        socket.on('signal', async (data) => {
            if (data.type === 'offer') {
                createPeerConnection();
                await peerConnection.setRemoteDescription(new RTCSessionDescription(data.sdp));
                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);
                socket.emit('signal', { type: 'answer', sdp: answer });
            } else if (data.type === 'answer') {
                await peerConnection.setRemoteDescription(new RTCSessionDescription(data.sdp));
            } else if (data.type === 'candidate') {
                await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
            }
        });

        function createPeerConnection() {
            if (peerConnection) return;
            peerConnection = new RTCPeerConnection(config);
            
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    socket.emit('signal', { type: 'candidate', candidate: event.candidate });
                }
            };

            peerConnection.ontrack = (event) => {
                remoteVideo.srcObject = event.streams[0];
                statusText.innerText = "Görüşme başladı!";
            };
        }
    </script>
</body>
</html>
