<!DOCTYPE html>
<html>
<head>
    <title>Canlı Görüşme - Sohbetimiz</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        body { background: #000; color: white; font-family: sans-serif; margin: 0; text-align: center; }
        .video-box { position: relative; width: 100%; height: 70vh; background: #111; display: flex; align-items: center; justify-content: center; }
        #remoteVideo { width: 100%; height: 100%; object-fit: cover; }
        #localVideo { position: absolute; right: 10px; bottom: 10px; width: 120px; height: 160px; border: 2px solid white; border-radius: 10px; object-fit: cover; z-index: 10; }
        .controls { padding: 20px; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
        .btn { padding: 15px 25px; border-radius: 30px; border: none; font-weight: bold; cursor: pointer; }
        .btn-start { background: #2e7d32; color: white; }
        .btn-switch { background: #f39c12; color: white; }
        .btn-stop { background: #c62828; color: white; text-decoration: none; }
    </style>
</head>
<body>
    <div class="video-box">
        <video id="remoteVideo" autoplay playsinline></video>
        <video id="localVideo" autoplay playsinline muted></video>
    </div>
    
    <div id="status" style="padding:10px; color:#aaa;">Görüşme başlatmak için kamerayı açın</div>

    <div class="controls">
        <button class="btn btn-start" onclick="initMedia('user')">Ön Kamera</button>
        <button class="btn btn-switch" onclick="initMedia('environment')">Arka Kamera</button>
        <a href="/chat" class="btn btn-stop">Kapat</a>
    </div>

    <script>
        const socket = io();
        let localStream, peerConnection;
        const config = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

        async function initMedia(mode) {
            if (localStream) localStream.getTracks().forEach(t => t.stop());
            
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: mode }, 
                    audio: true 
                });
                document.getElementById('localVideo').srcObject = localStream;
                document.getElementById('status').innerText = "Bağlantı kuruluyor...";
                
                socket.emit('join_live', { room: 'live_room' });
            } catch (e) { alert("Kamera hatası: " + e); }
        }

        socket.on('user_joined', async () => {
            createPeer();
            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);
            socket.emit('signal', { type: 'offer', sdp: offer });
        });

        socket.on('signal', async (data) => {
            if (data.type === 'offer') {
                createPeer();
                await peerConnection.setRemoteDescription(new RTCSessionDescription(data.sdp));
                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);
                socket.emit('signal', { type: 'answer', sdp: answer });
            } else if (data.type === 'answer') {
                await peerConnection.setRemoteDescription(new RTCSessionDescription(data.sdp));
            } else if (data.type === 'candidate') {
                await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
            }
        });

        function createPeer() {
            if (peerConnection) return;
            peerConnection = new RTCPeerConnection(config);
            localStream.getTracks().forEach(t => peerConnection.addTrack(t, localStream));
            
            peerConnection.onicecandidate = e => {
                if (e.candidate) socket.emit('signal', { type: 'candidate', candidate: e.candidate });
            };
            
            peerConnection.ontrack = e => {
                document.getElementById('remoteVideo').srcObject = e.streams[0];
                document.getElementById('status').innerText = "Canlı Görüşme Başladı!";
            };
        }
    </script>
</body>
</html>
