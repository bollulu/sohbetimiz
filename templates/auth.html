<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width">
<title>Giriş</title>
<style>
body{margin:0;background:#f0f2f5;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh}
form{background:#fff;padding:20px;width:300px;border-radius:10px}
input,select,button{width:100%;padding:10px;margin:6px 0}
</style>
</head>
<body>

<form method="post" enctype="multipart/form-data">
<h3>WhatsApp Clone</h3>

<input name="username" placeholder="Kullanıcı adı" required>
<input name="password" type="password" placeholder="Şifre" required>

<select name="gender" required>
  <option value="">Cinsiyet</option>
  <option>Erkek</option>
  <option>Kadın</option>
</select>

<input type="file" name="avatar" required>

<button>Giriş / Kayıt</button>
</form>

</body>
</html>
