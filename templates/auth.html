<!DOCTYPE html>
<html>
<head>
    <title>Giriş / Kayıt</title>
    <style>
        body { font-family: sans-serif; background: #075e54; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 12px; width: 320px; text-align: center; }
        input, button { width: 100%; padding: 10px; margin: 8px 0; border-radius: 5px; border: 1px solid #ddd; box-sizing: border-box; }
        button { background: #25d366; color: white; border: none; font-weight: bold; cursor: pointer; }
        #preview { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 2px solid #25d366; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h2 id="t">Giriş</h2>
        <form id="f" action="/login" method="POST">
            <div id="reg" style="display:none">
                <img id="preview" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" onclick="document.getElementById('i').click()">
                <input type="file" id="i" style="display:none" accept="image/*" onchange="proc(this)">
                <input type="hidden" name="avatar_data" id="a_d">
            </div>
            <input type="text" name="username" placeholder="Kullanıcı Adı" required>
            <input type="password" name="password" placeholder="Şifre" required>
            <button type="submit" id="b">Giriş Yap</button>
        </form>
        <small onclick="toggle()" style="cursor:pointer; color:#075e54">Hesap Oluştur</small>
    </div>
    <script>
        let isL = true;
        function toggle() {
            isL = !isL;
            document.getElementById('t').innerText = isL ? "Giriş" : "Kayıt";
            document.getElementById('b').innerText = isL ? "Giriş Yap" : "Kayıt Ol";
            document.getElementById('f').action = isL ? "/login" : "/register";
            document.getElementById('reg').style.display = isL ? "none" : "block";
        }
        function proc(input) {
            const reader = new FileReader();
            reader.onload = e => {
                const img = new Image();
                img.src = e.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = 200; canvas.height = 200;
                    canvas.getContext('2d').drawImage(img, 0, 0, 200, 200);
                    const data = canvas.toDataURL('image/jpeg', 0.8);
                    document.getElementById('preview').src = data;
                    document.getElementById('a_d').value = data;
                };
            };
            reader.readAsDataURL(input.files[0]);
        }
    </script>
</body>
</html>
