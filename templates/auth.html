<!DOCTYPE html>
<html>
<head>
    <title>Sohbetimiz - Giriş</title>
    <style>
        body { background: #075e54; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 20px; width: 320px; text-align: center; }
        input, select, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 20px; border: 1px solid #ddd; }
        button { background: #25D366; color: white; font-weight: bold; border: none; cursor: pointer; }
        .hidden { display: none; }
        #avatar-prev { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 2px solid #25D366; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <div id="box">
            <img id="avatar-prev" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" onclick="document.getElementById('ava-in').click()">
            <form action="/register" method="post" id="reg-form">
                <input type="text" name="username" placeholder="Kullanıcı Adı" required>
                <input type="password" name="password" placeholder="Şifre" required>
                <select name="gender"><option value="Erkek">Erkek</option><option value="Kadın">Kadın</option></select>
                <input type="hidden" id="avatar_data" name="avatar_data">
                <button type="submit">Kayıt Ol / Giriş Yap</button>
            </form>
        </div>
    </div>
    <input type="file" id="ava-in" style="display:none" accept="image/*" onchange="proc(this)">
    <script>
        function proc(i) {
            if(i.files[0]) {
                const r = new FileReader();
                r.onload = e => {
                    const img = new Image(); img.src = e.target.result;
                    img.onload = () => {
                        const c = document.createElement('canvas'); c.width=200; c.height=200;
                        c.getContext('2d').drawImage(img,0,0,200,200);
                        const data = c.toDataURL('image/jpeg', 0.6);
                        document.getElementById('avatar-prev').src = data;
                        document.getElementById('avatar_data').value = data;
                    }
                }
                r.readAsDataURL(i.files[0]);
            }
        }
    </script>
</body>
</html>
