<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sohbetimiz - Giriş/Kayıt</title>
    <style>
        body { background: #e9ecef; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; }
        .container { background: white; padding: 30px; border-radius: 10px; width: 350px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .toggle-btn { display: flex; justify-content: space-around; margin-bottom: 20px; }
        .toggle-btn button { border: none; background: none; font-size: 18px; cursor: pointer; padding-bottom: 5px; }
        .active { border-bottom: 2px solid #007bff; color: #007bff; }
        input, select { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        button.submit { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="text-align: center;">Sohbetimiz</h2>
        
        <div class="toggle-btn">
            <button id="loginBtn" class="active" onclick="toggle('login')">Giriş Yap</button>
            <button id="registerBtn" onclick="toggle('register')">Kayıt Ol</button>
        </div>

        {% with messages = get_flashed_messages() %}
            {% if messages %}<p style="color:red; text-align:center;">{{ messages[0] }}</p>{% endif %}
        {% endwith %}

        <form method="POST" enctype="multipart/form-data">
            <input type="text" name="username" placeholder="Kullanıcı Adı" required>
            <input type="password" name="password" placeholder="Şifre" required>
            
            <div id="registerFields" class="hidden">
                <select name="gender">
                    <option value="male">Erkek</option>
                    <option value="female">Kadın</option>
                    <option value="other">Diğer</option>
                </select>
                <label style="font-size: 12px;">Profil Resmi:</label>
                <input type="file" name="avatar">
            </div>

            <button type="submit" name="action" value="login" id="submitBtn" class="submit">Giriş Yap</button>
        </form>
    </div>

    <script>
        function toggle(type) {
            const regFields = document.getElementById('registerFields');
            const submitBtn = document.getElementById('submitBtn');
            const loginBtn = document.getElementById('loginBtn');
            const regBtn = document.getElementById('registerBtn');

            if (type === 'register') {
                regFields.classList.remove('hidden');
                submitBtn.value = 'register';
                submitBtn.innerText = 'Kayıt Ol';
                regBtn.classList.add('active');
                loginBtn.classList.remove('active');
            } else {
                regFields.classList.add('hidden');
                submitBtn.value = 'login';
                submitBtn.innerText = 'Giriş Yap';
                loginBtn.classList.add('active');
                regBtn.classList.remove('active');
            }
        }
    </script>
</body>
</html>
