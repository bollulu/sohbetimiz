<!DOCTYPE html>
<html>
<head>
    <title>Sohbetimiz - Giriş</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { 
            margin: 0; 
            font-family: sans-serif; 
            background: url('https://images.unsplash.com/photo-1497215728101-856f4ea42174?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed; 
            background-size: cover;
            display: flex; justify-content: center; align-items: center; height: 100vh;
        }
        .card { background: rgba(255,255,255,0.15); backdrop-filter: blur(15px); padding: 30px; border-radius: 15px; width: 320px; text-align: center; color: white; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
        input, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 20px; border: none; outline: none; }
        button { background: #25D366; color: white; font-weight: bold; cursor: pointer; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Sohbetimiz</h2>
        <div id="login-box">
            <form action="/login" method="post">
                <input type="text" name="username" placeholder="Kullanıcı Adı" required>
                <input type="password" name="password" placeholder="Şifre" required>
                <button type="submit">Giriş Yap</button>
            </form>
            <p onclick="toggle()" style="cursor:pointer">Hesabın yok mu? Kayıt Ol</p>
        </div>
        <div id="register-box" class="hidden">
            <form action="/register" method="post">
                <input type="text" name="username" placeholder="Kullanıcı Adı" required>
                <input type="password" name="password" placeholder="Şifre" required>
                <input type="hidden" id="ava-data" name="avatar_data" value="https://cdn-icons-png.flaticon.com/512/149/149071.png">
                <button type="button" onclick="document.getElementById('ava-in').click()" style="background:#34b7f1">Avatar Seç</button>
                <button type="submit" style="background:#25D366">Kayıt Ol</button>
            </form>
            <p onclick="toggle()" style="cursor:pointer">Zaten üyen misin? Giriş Yap</p>
        </div>
    </div>
    <input type="file" id="ava-in" style="display:none" onchange="processAva(this)">
    <script>
        function toggle(){ document.getElementById('login-box').classList.toggle('hidden'); document.getElementById('register-box').classList.toggle('hidden'); }
        function processAva(input){
            const r = new FileReader();
            r.onload = e => document.getElementById('ava-data').value = e.target.result;
            r.readAsDataURL(input.files[0]);
        }
    </script>
</body>
</html>
