<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Giriş / Kayıt</title>
</head>
<body>
<h2>Giriş</h2>
<form method="POST">
    <input name="username" placeholder="Kullanıcı adı" required>
    <input type="password" name="password" placeholder="Şifre" required>
    <button>Giriş</button>
</form>

<hr>

<h2>Kayıt Ol</h2>
<form method="POST" action="/register">
    <input name="username" placeholder="Kullanıcı adı" required>
    <input type="password" name="password" placeholder="Şifre" required>
    <button>Kayıt</button>
</form>
</body>
</html>
