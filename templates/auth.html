<!DOCTYPE html>
<html>
<head>
    <title>Giriş</title>
    <style>
        body { background: #075e54; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .card { background: white; padding: 30px; border-radius: 10px; color: #333; width: 300px; text-align: center; }
        input { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; }
        button { background: #25D366; color: white; border: none; width: 100%; padding: 10px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
<div class="card">
    <h2>Sohbetimiz</h2>
    <form action="/login" method="post">
        <input type="text" name="username" placeholder="Kullanıcı Adı" required>
        <input type="password" name="password" placeholder="Şifre" required>
        <button type="submit">GİRİŞ YAP</button>
    </form>
    <p>veya</p>
    <form action="/register" method="post">
        <input type="text" name="username" placeholder="Yeni Kullanıcı" required>
        <input type="password" name="password" placeholder="Şifre" required>
        <input type="hidden" id="ava" name="avatar_data" value="https://cdn-icons-png.flaticon.com/512/149/149071.png">
        <button type="submit" style="background: #34b7f1;">KAYIT OL</button>
    </form>
</div>
</body>
</html>
