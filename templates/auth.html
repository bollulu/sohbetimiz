<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Giriş / Kayıt</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {background: #f0f2f5; display:flex; justify-content:center; align-items:center; height:100vh;}
        .login-box {background:white; padding:30px; border-radius:8px; width:350px; box-shadow:0 0 10px rgba(0,0,0,0.1);}
        button {width:100%;}
    </style>
</head>
<body>
    <div class="login-box text-center">
        <h3>💬 Süper Chat</h3>
        <form action="/login" method="POST">
            <input class="form-control mb-2" type="text" name="username" placeholder="Kullanıcı Adı" required>
            <input class="form-control mb-2" type="password" name="password" placeholder="Şifre" required>
            <button class="btn btn-primary">Giriş Yap</button>
        </form>
        <hr>
        <form action="/register" method="POST">
            <input class="form-control mb-2" type="text" name="username" placeholder="Yeni Kullanıcı Adı" required>
            <input class="form-control mb-2" type="password" name="password" placeholder="Şifre" required>
            <select class="form-select mb-2" name="gender">
                <option>Erkek</option>
                <option>Kadın</option>
            </select>
            <button class="btn btn-success">Kayıt Ol</button>
        </form>
    </div>
</body>
</html>
