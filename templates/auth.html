<!DOCTYPE html>
<html>
<head>
    <title>Sohbetimiz - Giriş</title>
    <style>
        body { font-family: sans-serif; background: #075e54; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 10px; width: 300px; text-align: center; }
        input { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #25d366; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Sohbetimiz</h2>
        <form action="/login" method="post">
            <input type="text" name="username" placeholder="Kullanıcı Adı" required>
            <input type="password" name="password" placeholder="Şifre" required>
            <button type="submit">Giriş Yap</button>
        </form>
        <hr>
        <form action="/register" method="post">
            <input type="text" name="username" placeholder="Yeni Kullanıcı Adı" required>
            <input type="password" name="password" placeholder="Yeni Şifre" required>
            <button type="submit" style="background:#34b7f1">Kayıt Ol</button>
        </form>
    </div>
</body>
</html>
