<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Sohbetimiz - Giriş</title>
    <style>
        body { background: #f0f2f5; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 340px; text-align: center; }
        .tab-btns { display: flex; margin-bottom: 20px; }
        .tab-btns button { flex: 1; padding: 10px; cursor: pointer; border: none; background: #eee; }
        .tab-btns .active { background: #075e54; color: white; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        .btn-main { width: 100%; padding: 12px; background: #075e54; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Sohbetimiz</h2>
        <div class="tab-btns">
            <button id="lBtn" class="active" onclick="toggle('login')">Giriş</button>
            <button id="rBtn" onclick="toggle('register')">Kayıt</button>
        </div>
        {% with m = get_flashed_messages() %}{% if m %}<p style="color:red; font-size:12px;">{{m[0]}}</p>{% endif %}{% endwith %}
        
        <form method="POST" enctype="multipart/form-data">
            <input type="text" name="username" placeholder="Kullanıcı Adı" required>
            <input type="password" name="password" placeholder="Şifre" required>
            
            <div id="regExtra" class="hidden">
                <select name="gender">
                    <option value="Erkek">Erkek</option>
                    <option value="Kadın">Kadın</option>
                </select>
                <label style="font-size:12px; display:block; text-align:left;">Profil Resmi:</label>
                <input type="file" name="avatar" accept="image/*">
            </div>

            <button type="submit" name="action" id="actionBtn" value="login" class="btn-main">Giriş Yap</button>
        </form>
    </div>

    <script>
        function toggle(mode) {
            const regExtra = document.getElementById('regExtra');
            const actionBtn = document.getElementById('actionBtn');
            const lBtn = document.getElementById('lBtn');
            const rBtn = document.getElementById('rBtn');
            
            if(mode === 'register') {
                regExtra.classList.remove('hidden');
                actionBtn.value = 'register';
                actionBtn.innerText = 'Kayıt Ol';
                rBtn.classList.add('active');
                lBtn.classList.remove('active');
            } else {
                regExtra.classList.add('hidden');
                actionBtn.value = 'login';
                actionBtn.innerText = 'Giriş Yap';
                lBtn.classList.add('active');
                rBtn.classList.remove('active');
            }
        }
    </script>
</body>
</html>
