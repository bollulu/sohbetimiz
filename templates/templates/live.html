<!DOCTYPE html>
<html>
<head>
    <title>Canlı Yayın - Sohbetimiz</title>
    <style>
        body { background: #000; color: white; text-align: center; font-family: sans-serif; }
        video { width: 90%; max-width: 600px; border: 2px solid #333; border-radius: 10px; background: #222; margin-top: 20px; }
        .controls { margin-top: 20px; }
        .btn { padding: 15px 30px; border-radius: 30px; border: none; font-size: 1em; cursor: pointer; margin: 5px; }
        .start { background: #2e7d32; color: white; }
        .stop { background: #c62828; color: white; }
    </style>
</head>
<body>
    <h2>Canlı Yayın Ekranı</h2>
    <video id="localVideo" autoplay playsinline muted></video>
    <div class="controls">
        <button class="btn start" onclick="startVideo()">Kamerayı Aç</button>
        <a href="/chat"><button class="btn stop">Yayından Çık</button></a>
    </div>

    <script>
        async function startVideo() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({video: true, audio: true});
                document.getElementById('localVideo').srcObject = stream;
            } catch (e) {
                alert("Kamera erişimi reddedildi veya bulunamadı!");
            }
        }
    </script>
</body>
</html>
