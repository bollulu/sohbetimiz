<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Sohbet</title>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<style>
body {
    margin:0;
    font-family:Arial;
    background:#ece5dd;
}
#chat {
    height:90vh;
    overflow-y:auto;
    padding:10px;
}
.msg {
    display:flex;
    margin-bottom:8px;
}
.me {
    justify-content:flex-end;
}
.bubble {
    max-width:60%;
    padding:10px;
    border-radius:8px;
}
.me .bubble {
    background:#dcf8c6;
}
.other .bubble {
    background:white;
}
.avatar {
    width:30px;
    height:30px;
    border-radius:50%;
    margin-right:6px;
}
#input {
    display:flex;
    padding:10px;
    background:#f0f0f0;
}
#input input {
    flex:1;
    padding:10px;
}
</style>
</head>

<body>

<div id="chat"></div>

<div id="input">
    <input id="text" placeholder="Mesaj yaz..." autocomplete="off">
</div>

<script>
const socket = io();
const chat = document.getElementById("chat");
const text = document.getElementById("text");

socket.emit("join");

socket.on("history", msgs => {
    msgs.forEach(addMsg);
});

socket.on("new", addMsg);

function addMsg(m){
    const div = document.createElement("div");
    div.className = "msg " + (m.me ? "me" : "other");

    div.innerHTML = `
        ${!m.me ? `<img class="avatar" src="${m.avatar}">` : ""}
        <div class="bubble"><b>${m.user}</b><br>${m.text}</div>
    `;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

text.addEventListener("keydown", e => {
    if(e.key === "Enter"){
        socket.emit("send", {text:text.value});
        text.value="";
    }
});
</script>

</body>
</html>
