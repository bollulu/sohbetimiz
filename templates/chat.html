<!DOCTYPE html>
<html>
<head>
    <title>Sohbetimiz</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        body { font-family: sans-serif; background: #e5ddd5; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        #header { background: #075e54; color: white; padding: 10px; display: flex; align-items: center; justify-content: space-between; }
        .avatar-img { width: 40px; height: 40px; border-radius: 50%; background: #ccc; cursor: pointer; object-fit: cover; }
        #chat-area { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; }
        .msg { background: white; padding: 8px 12px; border-radius: 10px; margin-bottom: 8px; max-width: 70%; position: relative; box-shadow: 0 1px 1px rgba(0,0,0,0.1); }
        .my-msg { align-self: flex-end; background: #dcf8c6; }
        .delete-btn { color: red; cursor: pointer; font-size: 12px; margin-left: 10px; display: none; }
        .msg:hover .delete-btn { display: inline; }
        #input-area { background: #f0f0f0; padding: 10px; display: flex; gap: 10px; }
        input { flex: 1; padding: 10px; border-radius: 20px; border: 1px solid #ddd; outline: none; }
        .btn-live { background: #ff5252; color: white; padding: 8px 15px; border-radius: 5px; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div id="header">
        <img id="myAvatar" class="avatar-img" src="{{ user.avatar or '' }}" onclick="changeAvatar()">
        <span>{{ user.username }}</span>
        <a href="/live" class="btn-live">🔴 CANLI YAYIN</a>
        <a href="/logout" style="color:white; text-decoration:none;">Çıkış</a>
    </div>
    <div id="chat-area"></div>
    <div id="input-area">
        <input type="text" id="msgInput" placeholder="Mesaj yazın..." onkeypress="if(event.key==='Enter') send()">
        <button onclick="send()" style="border-radius:50%; width:40px; border:none; background:#075e54; color:white;">></button>
    </div>

    <script>
        const socket = io();
        const myName = "{{ user.username }}";
        socket.emit('join', {room: 'Genel'});

        function send() {
            const input = document.getElementById('msgInput');
            if(input.value) {
                socket.emit('message', {msg: input.value});
                input.value = '';
            }
        }

        socket.on('message', data => addMessage(data));
        socket.on('history', msgs => msgs.forEach(addMessage));
        socket.on('remove_message', data => document.getElementById('msg-'+data.id)?.remove());

        function addMessage(data) {
            const area = document.getElementById('chat-area');
            const div = document.createElement('div');
            div.id = 'msg-' + data.id;
            div.className = 'msg ' + (data.user === myName ? 'my-msg' : '');
            
            let deleteHtml = data.user === myName ? `<span class="delete-btn" onclick="deleteMsg(${data.id})">Sil</span>` : '';
            
            div.innerHTML = `<small><b>${data.user}</b></small><br>${data.msg} ${deleteHtml}`;
            area.appendChild(div);
            area.scrollTop = area.scrollHeight;
        }

        function deleteMsg(id) { socket.emit('delete_message', {id: id}); }

        function changeAvatar() {
            const url = prompt("Avatar resim URL'si girin:");
            if(url) {
                document.getElementById('myAvatar').src = url;
                socket.emit('update_avatar', {img: url});
            }
        }
    </script>
</body>
</html>
