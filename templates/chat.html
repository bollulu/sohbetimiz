<!DOCTYPE html>
<html>
<head>
    <title>Süper Chat</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/2.3.0/socket.io.js"></script>
    <style>
        :root { --bg: #e5ddd5; --header: #ededed; --green: #008069; --bubble-me: #dcf8c6; }
        body { margin: 0; font-family: 'Helvetica Neue', sans-serif; height: 100vh; display: flex; overflow: hidden; background: #d1d7db; }
        /* --- (CSS TAMAMI DEĞİŞMEDİ) --- */
    </style>
</head>
<body>

<input type="file" id="p-img" style="display:none" accept="image/*" onchange="uploadAvatar(this)">

<!-- 🔥 BURASI DÜZELTİLDİ -->
<input type="file" id="msg-file" style="display:none" onchange="uploadMsgFile(this)">

<input type="file" id="bg-in" style="display:none" accept="image/*" onchange="changeBG(this)">
<input type="file" id="st-media" style="display:none" accept="image/*,video/*" onchange="previewStory(this)">
<input type="file" id="st-audio" style="display:none" accept="audio/*">
<input type="file" id="music-file" style="display:none" accept="audio/*" onchange="uploadMusic(this)">

<!-- ⬇️ BURADAN SONRASI SENİN ATTIĞIN HTML İLE BİREBİR AYNI -->
<!-- sidebar, main, story bar, chat, viewer vs. -->
<!-- JS KODUNUN TAMAMI DEĞİŞMEDİ -->

<script>
    const socket = io();
    const myName = "{{ user.username }}";
    let currentRoom = 'Genel';
    let storiesData = {};
    let currentStoryUser = null;
    let currentStoryIdx = 0;
    let storyTimer = null;
    let stAudio = new Audio();

    socket.on('connect', () => {
        socket.emit('join_room', {room: 'Genel'});
    });

    /* --- TÜM ORİJİNAL JS KODUN AYNI --- */

    function uploadMsgFile(inp) {
        const f = inp.files[0];
        if(!f) return;
        const type = f.type.startsWith('image') ? 'image' : (f.type.startsWith('video')?'video':'audio');
        const r = new FileReader();
        r.onload = e => socket.emit('send_message', {room:currentRoom, msg:e.target.result, type:type});
        r.readAsDataURL(f);
    }
</script>
</body>
</html>
