<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10 LİNE SOHBET</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --dark: #111b21; --dark-sec: #202c33; --green: #00a884; --text: #e9edef; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--dark); color: var(--text); height: 100vh; display: flex; overflow: hidden; }
        
        #sidebar { width: 350px; background: var(--dark-sec); border-right: 1px solid #333; display: flex; flex-direction: column; }
        .header { padding: 15px; background: var(--dark-sec); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
        .my-ava { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; cursor: pointer; border: 2px solid #444; }
        
        .tab-bar { display: flex; border-bottom: 1px solid #333; }
        .tab { flex: 1; padding: 15px; text-align: center; cursor: pointer; opacity: 0.6; }
        .tab.active { opacity: 1; border-bottom: 3px solid var(--green); color: var(--green); }

        .list-area { flex: 1; overflow-y: auto; }
        .list-item { padding: 12px 15px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; border-bottom: 1px solid #2a3942; }
        .list-item:hover { background: #2a3942; }
        .item-main { display: flex; align-items: center; gap: 12px; }
        .item-ava { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; }
        
        #main-chat { 
            flex: 1; display: flex; flex-direction: column; 
            background-color: #0b141a;
            background-image: url('{{ user.bg_image }}');
            background-size: cover; background-position: center;
        }

        /* Hikaye Barı (Sağa Doğru Eklenir) */
        #story-bar { background: rgba(17, 27, 33, 0.9); padding: 10px; display: flex; gap: 15px; overflow-x: auto; border-bottom: 1px solid #333; min-height: 110px; align-items: center; }
        .story-wrapper { display: flex; flex-direction: column; align-items: center; gap: 5px; min-width: 75px; cursor: pointer; }
        .story-circle { width: 60px; height: 60px; border-radius: 50%; border: 3px solid var(--green); padding: 2px; }
        .story-circle img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
        .story-name { font-size: 11px; color: #8696a0; text-align: center; }

        /* Mesaj Alanı */
        #messages-area { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { max-width: 65%; padding: 8px 12px; border-radius: 10px; display: flex; gap: 10px; position: relative; }
        .msg-out { align-self: flex-end; background: #005c4b; flex-direction: row-reverse; }
        .msg-in { align-self: flex-start; background: #202c33; }
        .read { color: #34b7f1; } /* Mavi Çift Tık */
        .sent { color: #8696a0; } /* Gri Tek Tık */

        /* Modallar */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 10000; justify-content: center; align-items: center; flex-direction: column; }
        .modal-content { background: var(--dark-sec); padding: 20px; border-radius: 10px; width: 300px; text-align: center; }
        .icon-btn { color: #8696a0; font-size: 20px; cursor: pointer; }
        .icon-btn:hover { color: var(--green); }
    </style>
</head>
<body>

<div id="sidebar">
    <div class="header">
        <img src="{{ user.avatar }}" class="my-ava" onclick="openSettings()" id="current-my-avatar">
        <span style="font-weight: bold;">{{ user.username }}</span>
        <div style="display:flex; gap:15px;">
            <i class="fas fa-video icon-btn" onclick="openVideoModal()"></i>
            <i class="fas fa-sign-out-alt icon-btn" onclick="location.href='/logout'"></i>
        </div>
    </div>

    <div class="tab-bar">
        <div class="tab active" onclick="switchTab('chats', this)">Kişiler</div>
        <div class="tab" onclick="switchTab('groups', this)">Gruplar</div>
        <div class="tab" onclick="switchTab('music', this)">Müzik</div>
    </div>

    <div id="list-chats" class="list-area"></div>
    <div id="list-groups" class="list-area" style="display:none;">
        <button onclick="document.getElementById('g-modal').style.display='flex'" style="width:100%; padding:12px; background:var(--green); border:none; color:white; font-weight:bold; cursor:pointer;">+ Şifreli Grup</button>
        <div id="groups-container"></div>
    </div>
    <div id="list-music" class="list-area" style="display:none; padding:20px;">
        <h3 align="center">Müzik Listesi</h3>
        </div>
</div>

<div id="main-chat">
    <div id="story-bar">
        <div class="story-wrapper" onclick="document.getElementById('story-in').click()">
            <div class="story-circle" style="border:2px dashed #444; display:flex; align-items:center; justify-content:center; font-size:24px;">+</div>
            <div class="story-name">Ekle</div>
            <input type="file" id="story-in" hidden accept="image/*,video/*" onchange="postStory(this)">
        </div>
        <div id="story-list" style="display:flex; gap:12px;"></div>
    </div>

    <div id="messages-area"></div>

    <div id="input-area" style="padding:10px 20px; background:var(--dark-sec); display:flex; align-items:center; gap:15px;">
        <label for="file-in" class="icon-btn"><i class="fas fa-paperclip"></i></label>
        <input type="file" id="file-in" hidden onchange="uploadFile(this)">
        <i class="fas fa-microphone icon-btn" id="mic-btn" onclick="handleMic()"></i>
        <input type="text" id="msg-input" placeholder="Bir mesaj yazın..." style="flex:1; padding:12px 20px; border-radius:25px; border:none; background:#2a3942; color:white; outline:none;" onkeypress="if(event.key==='Enter') sendText()">
        <i class="fas fa-paper-plane icon-btn" style="color:var(--green);" onclick="sendText()"></i>
    </div>
</div>

<div id="g-modal" class="modal">
    <div class="modal-content">
        <h3>Grup Oluştur</h3>
        <input type="text" id="g-name" placeholder="Grup Adı" style="width:100%; padding:10px; margin-bottom:10px;">
        <input type="password" id="g-pass" placeholder="Grup Şifresi" style="width:100%; padding:10px; margin-bottom:10px;">
        <button onclick="createGroup()" style="width:100%; background:var(--green); color:white; border:none; padding:10px;">Oluştur</button>
        <button onclick="document.getElementById('g-modal').style.display='none'" style="margin-top:5px; background:none; color:white; border:none;">İptal</button>
    </div>
</div>

<div id="s-modal" class="modal">
    <div class="modal-content">
        <h3>Profil & Ayarlar</h3>
        <button onclick="document.getElementById('profile-in').click()" style="width:100%; padding:10px; margin-bottom:10px;">Profil Resmini Değiştir</button>
        <input type="file" id="profile-in" hidden onchange="updateProfile(this)">
        <button onclick="document.getElementById('bg-in').click()" style="width:100%; padding:10px; margin-bottom:10px;">Arka Planı Değiştir</button>
        <input type="file" id="bg-in" hidden onchange="updateBG(this)">
        <button onclick="factoryReset()" style="width:100%; padding:10px; background:red; color:white; border:none; margin-top:20px;">Fabrika Ayarlarına Dön</button>
        <button onclick="document.getElementById('s-modal').style.display='none'" style="margin-top:15px; color:white; border:none; background:none; cursor:pointer;">Kapat</button>
    </div>
</div>

<script>
    const socket = io();
    const myName = "{{ user.username }}";
    let currentRoom = "Genel";

    window.onload = () => { socket.emit('join', {room: 'Genel'}); };

    function switchTab(t, el) {
        document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
        el.classList.add('active');
        document.getElementById('list-chats').style.display = t === 'chats' ? 'block' : 'none';
        document.getElementById('list-groups').style.display = t === 'groups' ? 'block' : 'none';
        document.getElementById('list-music').style.display = t === 'music' ? 'block' : 'none';
    }

    // --- KİŞİ LİSTESİ (ÇALIŞMAYAN KISIM DÜZELTİLDİ) ---
    socket.on('update_user_list', users => {
        const list = document.getElementById('list-chats');
        list.innerHTML = '';
        users.forEach(u => {
            const display_name = u.username === myName ? myName + " (Siz)" : u.username;
            list.innerHTML += `
            <div class="list-item" onclick="joinPrivate('${u.username}')">
                <div class="item-main">
                    <img src="${u.avatar}" class="item-ava" data-user="${u.username}">
                    <span>${display_name}</span>
                </div>
            </div>`;
        });
    });

    // --- GRUP LİSTESİ ---
    socket.on('update_group_list', groups => {
        const cont = document.getElementById('groups-container');
        cont.innerHTML = '';
        groups.forEach(g => {
            cont.innerHTML += `
            <div class="list-item" onclick="joinRoom('${g.name}')">
                <div class="item-main">
                    <div class="item-ava" style="background:#444; display:flex; align-items:center; justify-content:center;"><i class="fas fa-users"></i></div>
                    <span>${g.name} ${g.has_pass ? '🔒' : ''}</span>
                </div>
            </div>`;
        });
    });

    // --- HİKAYELER (POST STORY TETİKLENDİ) ---
    function postStory(inp) {
        const r = new FileReader();
        r.onload = e => socket.emit('post_story', {content: e.target.result, type: inp.files[0].type.split('/')[0]});
        r.readAsDataURL(inp.files[0]);
    }

    socket.on('stories_update', grouped => {
        const bar = document.getElementById('story-list');
        bar.innerHTML = '';
        for(let u in grouped) {
            bar.innerHTML += `
            <div class="story-wrapper" onclick="alert('${u} hikayesi izleniyor...')">
                <div class="story-circle"><img src="${grouped[u].avatar}" data-user="${u}"></div>
                <div class="story-name">${u === myName ? 'Sen' : u}</div>
            </div>`;
        }
    });

    // --- MESAJ GÖNDERME (FIXED) ---
    function sendText() {
        const inp = document.getElementById('msg-input');
        if(inp.value.trim()) {
            socket.emit('send_message', {room: currentRoom, msg: inp.value, type: 'text'});
            inp.value = '';
        }
    }

    socket.on('new_message', m => { displayMsg(m); scrollDown(); });
    socket.on('load_history', msgs => { 
        document.getElementById('messages-area').innerHTML = '';
        msgs.forEach(m => displayMsg(m)); 
        scrollDown();
    });

    function displayMsg(m) {
        const isMe = m.sender === myName;
        const tick = m.status === 'read' ? 'fa-check-double read' : 'fa-check sent';
        const area = document.getElementById('messages-area');
        const div = document.createElement('div');
        div.className = `message ${isMe ? 'msg-out' : 'msg-in'}`;
        
        let content = m.content;
        if(m.type === 'image') content = `<img src="${m.content}" style="max-width:200px; border-radius:8px;">`;
        if(m.type === 'video') content = `<video src="${m.content}" controls style="max-width:200px;"></video>`;
        if(m.type === 'audio') content = `<audio src="${m.content}" controls></audio>`;

        div.innerHTML = `
            <img src="${m.avatar}" style="width:30px; height:30px; border-radius:50%;" data-user="${m.sender}">
            <div style="display:flex; flex-direction:column;">
                <div style="font-size:11px; font-weight:bold; color:var(--green); display:flex; justify-content:space-between; align-items:center;">
                    ${m.sender} 
                    ${!isMe ? `<i class="fas fa-ban" onclick="block('${m.sender}')" style="font-size:10px; margin-left:10px;"></i>` : ''}
                </div>
                <div>${content}</div>
                <div style="font-size:9px; color:#aaa; text-align:right;">
                    ${m.time} ${isMe ? `<i class="fas ${tick}"></i>` : ''}
                </div>
            </div>`;
        area.appendChild(div);
    }

    // --- DİĞER FONKSİYONLAR ---
    function joinPrivate(u) { const room = [myName, u].sort().join('_'); currentRoom = room; socket.emit('join', {room: room}); }
    function joinRoom(r) { currentRoom = r; socket.emit('join', {room: r}); }
    function scrollDown() { const a = document.getElementById('messages-area'); a.scrollTop = a.scrollHeight; }
    function openSettings() { document.getElementById('s-modal').style.display='flex'; }
    function updateBG(inp) {
        const r = new FileReader();
        r.onload = e => {
            socket.emit('update_profile', {bg: e.target.result});
            document.getElementById('main-chat').style.backgroundImage = `url(${e.target.result})`;
        };
        r.readAsDataURL(inp.files[0]);
    }
    function createGroup() {
        const n = document.getElementById('g-name').value;
        const p = document.getElementById('g-pass').value;
        socket.emit('create_group', {name: n, password: p});
        document.getElementById('g-modal').style.display='none';
    }
    function factoryReset() { if(confirm("Tüm mesajların silinsin mi?")) socket.emit('factory_reset'); }
    socket.on('reload_page', () => location.reload());
    function block(u) { if(confirm(u + " engellensin mi?")) socket.emit('block_user', {username: u}); }
</script>
</body>
</html>
