<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WhatsApp Ultra</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        :root { --main: #075e54; --light: #25D366; --bg: #e5ddd5; }
        body { margin:0; display:flex; height:100vh; font-family:sans-serif; overflow:hidden; }
        
        #side { width:300px; background:white; border-right:1px solid #ddd; display:flex; flex-direction:column; z-index: 2; }
        .side-header { background: var(--main); color:white; padding:15px; display:flex; justify-content:space-between; align-items:center; }
        
        #main { flex:1; display:flex; flex-direction:column; position:relative; background-color: var(--bg); background-size: cover; background-position: center; transition: 0.3s; }
        
        #story-area { height:110px; background:white; border-bottom:1px solid #ddd; display:flex; align-items:center; padding:0 15px; gap:15px; overflow-x:auto; white-space:nowrap; }
        .st-item { display:inline-block; text-align:center; cursor:pointer; position:relative; min-width: 65px; }
        .st-item img { width:60px; height:60px; border-radius:50%; border:3px solid var(--light); padding:2px; object-fit:cover; }
        .st-item span { display:block; font-size:12px; margin-top:2px; max-width:65px; overflow:hidden; text-overflow:ellipsis; }

        #story-viewer { display:none; position:fixed; inset:0; background:black; z-index:20000; flex-direction:column; align-items:center; justify-content:center; }
        #st-img { max-width:100%; max-height:80vh; border-radius:10px; }
        #st-progress { position:absolute; top:10px; left:10px; right:10px; height:4px; background:gray; border-radius:2px; display:flex; gap:5px; }
        .st-bar { height:100%; background:white; flex:1; opacity:0.3; transition:0.1s; }
        .st-bar.active { opacity:1; }
        /* Madde 3: Yükleme Barı Dolma Animasyonu */
        .st-fill { height: 100%; background: white; width: 0%; }
        
        #st-close { position:absolute; top:20px; right:20px; color:white; font-size:24px; cursor:pointer; font-weight:bold; z-index:20001; }
        #st-delete { position:absolute; top:20px; left:20px; color:red; font-size:24px; cursor:pointer; z-index:20001; display:none; }
        /* Madde 11: Hikaye Yazısı */
        #st-overlay-text { position: absolute; bottom: 100px; color: white; font-size: 20px; text-shadow: 2px 2px 4px #000; z-index: 20002; }

        /* Madde 9: Sağ/Sol Tıklama Alanları */
        .st-nav-zone { position: absolute; top: 0; bottom: 0; width: 30%; z-index: 20005; }

        #chat-box { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:15px; }
        .msg { display:flex; gap:10px; max-width:85%; position:relative; align-items: flex-end; }
        .msg.me { align-self:flex-end; flex-direction:row-reverse; }
        .bubble { background:white; padding:8px 12px; border-radius:12px; box-shadow:0 1px 1px rgba(0,0,0,0.1); position:relative; min-width: 80px; word-wrap: break-word; }
        .me .bubble { background:#dcf8c6; }
        
        footer { padding:10px; background:#f0f0f0; display:flex; gap:8px; align-items:center; }
        #mIn { flex:1; padding:12px; border-radius:20px; border:none; outline:none; }
        .icon-btn { border:none; background:none; font-size:22px; cursor:pointer; padding:5px; }

        .user-row { padding:10px; border-bottom:1px solid #f0f0f0; display:flex; align-items:center; gap:10px; cursor:pointer; }
        .user-row img { width:40px; height:40px; border-radius:50%; }
        .active-chat { background: #e9f5ff !important; border-left: 4px solid #34b7f1; }
    </style>
</head>
<body>

<div id="side">
    <div class="side-header">
        <b>Sohbetler</b>
        <button onclick="location.href='/logout'" style="background:transparent; border:none; color:white; font-size:18px; cursor:pointer;">🚪</button>
    </div>
    <div class="user-row active-chat" id="global-chat-selector" onclick="selectChat('global')">
        <div style="width:40px; height:40px; border-radius:50%; background:#eee; display:flex; align-items:center; justify-content:center;">🌍</div>
        <b>Global Sohbet</b>
    </div>
    <div id="online-list" style="flex:1; overflow-y:auto;"></div>
    
    <div style="padding:10px; border-top:1px solid #ddd; background:#f9f9f9; display:flex; flex-direction:column; gap:5px;">
        <button onclick="document.getElementById('profile-in').click()">👤 Profil Değiştir</button>
        <button onclick="document.getElementById('bg-in').click()">🖼️ Arka Plan</button>
        <button onclick="resetBg()">🔄 Arka Planı Sıfırla</button>
    </div>
</div>

<div id="main">
    <div id="story-area">
        <div class="st-item" onclick="addStoryModal()">
            <div style="width:60px;height:60px;border-radius:50%;background:#eee;display:flex;align-items:center;justify-content:center;font-size:30px;">+</div>
            <span>Ekle</span>
        </div>
        <div id="st-list" style="display:flex; gap:15px;"></div>
    </div>

    <div id="chat-box"></div>

    <footer>
        <button class="icon-btn" onclick="document.getElementById('file-in').click()">📎</button>
        <button class="icon-btn" id="mic-btn" onclick="toggleMic()">🎤</button>
        <input type="text" id="mIn" placeholder="Mesaj yaz..." onkeypress="if(event.key==='Enter') send()">
        <button class="icon-btn" onclick="send()">🚀</button>
    </footer>
</div>

<div id="story-viewer">
    <div id="st-progress"></div>
    <div id="st-close" onclick="closeStory()">✖</div>
    <div id="st-delete" onclick="deleteCurrentStory(event)">🗑️</div>
    
    <div class="st-nav-zone" style="left:0" onclick="prevStory(event)"></div>
    <div class="st-nav-zone" style="right:0" onclick="nextStory(event)"></div>
    
    <img id="st-img">
    <div id="st-overlay-text"></div>
</div>

<div id="cam-ui" style="display:none; position:fixed; inset:0; background:black; z-index:30000; flex-direction:column;">
    <video id="st-cam-preview" autoplay playsinline style="width:100%; flex:1; object-fit:cover;"></video>
    <div style="padding:20px; display:flex; gap:10px; background:#111;">
        <input type="text" id="st-txt-input" placeholder="Hikaye yazısı ekle..." style="flex:1; padding:10px; border-radius:10px; border:none;">
        <button onclick="captureStory()" style="width:60px; height:60px; border-radius:50%; background:white; border:none;">📸</button>
        <button onclick="closeCam()" style="color:white; background:none; border:none;">X</button>
    </div>
</div>

<input type="file" id="profile-in" hidden onchange="processImage(this, 'avatar')">
<input type="file" id="bg-in" hidden onchange="processImage(this, 'bg')">
<input type="file" id="file-in" hidden onchange="processFile(this)">
<input type="file" id="story-in" hidden onchange="processStoryFile(this)">

<script>
    const socket = io();
    const myUser = "{{ user.username }}";
    let currentRecipient = 'global'; // Madde 5
    let storyData = {};
    let activeStoryUser = null;
    let activeStoryIndex = 0;
    let storyTimer = null;
    let currentStream = null;

    // --- SOHBET SEÇİMİ (Madde 5) ---
    function selectChat(target) {
        currentRecipient = target;
        document.querySelectorAll('.user-row').forEach(el => el.classList.remove('active-chat'));
        if(target === 'global') document.getElementById('global-chat-selector').classList.add('active-chat');
        else document.getElementById(`user-${target}`).classList.add('active-chat');
        
        document.getElementById('chat-box').innerHTML = "";
        socket.emit('get_history', { recipient: currentRecipient }); // Backend'e haber ver
    }

    // --- Madde 1: Kullanıcı Engelleme ---
    function blockUser(username) {
        if(confirm(username + " engellensin mi?")) {
            socket.emit('block_user', { username: username });
        }
    }

    // --- Madde 4: Avatar Güncelleme ---
    socket.on('avatar_updated', data => {
        // Her yerdeki avatarları anında güncelle
        document.querySelectorAll(`img[data-user="${data.username}"]`).forEach(img => img.src = data.avatar);
        if(data.username === myUser) document.getElementById('my-ava-display').src = data.avatar;
    });

    socket.on('update_online', users => {
        let html = "";
        for(let u in users) {
            if (u !== myUser) {
                // Madde 1: Kullanıcıya basınca engelleme seçeneği (sağ tık veya uzun basış simülasyonu)
                html += `<div class="user-row" id="user-${u}" onclick="selectChat('${u}')" oncontextmenu="event.preventDefault(); blockUser('${u}')">
                    <img src="${users[u].avatar}" data-user="${u}">
                    <span>${u}</span>
                </div>`;
            }
        }
        document.getElementById('online-list').innerHTML = html;
    });

    // --- HİKAYE (Madde 2, 3, 8, 9, 10, 11) ---
    function addStoryModal() {
        if(confirm("Kamera kullanılsın mı?")) {
            openStoryCam();
        } else {
            document.getElementById('story-in').click();
        }
    }

    async function openStoryCam() {
        document.getElementById('cam-ui').style.display = 'flex';
        currentStream = await navigator.mediaDevices.getUserMedia({video: true});
        document.getElementById('st-cam-preview').srcObject = currentStream;
    }

    function captureStory() {
        const video = document.getElementById('st-cam-preview');
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        const data = canvas.toDataURL('image/jpeg');
        const text = document.getElementById('st-txt-input').value;
        socket.emit('add_story', {content: data, type: 'image', text: text});
        closeCam();
    }

    function closeCam() {
        if(currentStream) currentStream.getTracks().forEach(t => t.stop());
        document.getElementById('cam-ui').style.display = 'none';
    }

    function showStory() {
        const stories = storyData[activeStoryUser];
        if(!stories || activeStoryIndex >= stories.length) {
            // Madde 10: Diğer kullanıcının hikayesine geç
            const users = Object.keys(storyData);
            let nextUserIdx = users.indexOf(activeStoryUser) + 1;
            if(nextUserIdx < users.length) {
                openStoryViewer(users[nextUserIdx]);
            } else {
                closeStory();
            }
            return;
        }

        const s = stories[activeStoryIndex];
        document.getElementById('st-img').src = s.content;
        document.getElementById('st-overlay-text').innerText = s.text || "";
        
        // Madde 3: Progress Bar ve Hareket
        let bars = "";
        for(let i=0; i<stories.length; i++) {
            bars += `<div class="st-bar ${i<=activeStoryIndex ? 'active':''}"></div>`;
        }
        document.getElementById('st-progress').innerHTML = bars;

        clearTimeout(storyTimer);
        storyTimer = setTimeout(() => nextStory(), 5000);
    }

    // Madde 9: Tıklama ile yön
    function nextStory(e) {
        if(e) e.stopPropagation();
        activeStoryIndex++;
        showStory();
    }
    function prevStory(e) {
        if(e) e.stopPropagation();
        if(activeStoryIndex > 0) {
            activeStoryIndex--;
            showStory();
        }
    }

    // Madde 8: Yön tuşları
    window.addEventListener('keydown', (e) => {
        if(document.getElementById('story-viewer').style.display === 'flex') {
            if(e.key === "ArrowRight") nextStory();
            if(e.key === "ArrowLeft") prevStory();
        }
    });

    // --- MESAJLAŞMA ---
    function send() {
        const inp = document.getElementById('mIn');
        if(inp.value.trim()){
            socket.emit('send_msg', {
                content: inp.value, 
                type: 'text', 
                recipient: currentRecipient // Madde 5
            }); 
            inp.value = ''; 
        }
    }

    function renderMsg(d) {
        const isMe = d.sender === myUser;
        const html = `
            <div class="msg ${isMe ? 'me' : ''}">
                <img src="${d.avatar}" data-user="${d.sender}" style="width:30px;height:30px;border-radius:50%">
                <div class="bubble">
                    <small style="color:${isMe?'#075e54':'orange'};font-weight:bold;">${d.sender}</small><br>
                    ${d.content}
                </div>
            </div>`;
        document.getElementById('chat-box').insertAdjacentHTML('beforeend', html);
        document.getElementById('chat-box').scrollTop = document.getElementById('chat-box').scrollHeight;
    }

    socket.on('new_msg', d => renderMsg(d));
    socket.on('load_history', msgs => {
        document.getElementById('chat-box').innerHTML = "";
        msgs.forEach(m => renderMsg(m));
    });

    // Madde 6: Arka planı yenileyince silinmemesi (LocalStorage)
    function processImage(input, target) {
        const reader = new FileReader();
        reader.onload = e => {
            if(target === 'avatar') socket.emit('update_avatar', {avatar: e.target.result});
            if(target === 'bg') {
                document.getElementById('main').style.backgroundImage = `url(${e.target.result})`;
                localStorage.setItem('chat_bg', e.target.result);
            }
        }
        reader.readAsDataURL(input.files[0]);
    }

    window.onload = () => {
        const savedBg = localStorage.getItem('chat_bg');
        if(savedBg) document.getElementById('main').style.backgroundImage = `url(${savedBg})`;
    }
</script>
</body>
</html>
