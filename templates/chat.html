<!DOCTYPE html>
<html>
<head>
    <title>Sohbetimiz - Giriş</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { margin: 0; font-family: sans-serif; background: #075e54; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .card { background: white; padding: 30px; border-radius: 15px; width: 320px; text-align: center; }
        input, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 20px; border: 1px solid #ddd; box-sizing: border-box; }
        button { background: #25D366; color: white; font-weight: bold; cursor: pointer; border: none; }
        .hidden { display: none; }
        #avatar-prev { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; margin-bottom: 10px; border: 2px solid #25D366; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Sohbetimiz</h2>
        <div id="register-box">
            <img id="avatar-prev" src="https://cdn-icons-png.flaticon.com/512/149/149071.png">
            <form action="/register" method="post" id="reg-form">
                <input type="text" name="username" placeholder="Kullanıcı Adı" required>
                <input type="password" name="password" placeholder="Şifre" required>
                <input type="hidden" id="avatar_data" name="avatar_data">
                <button type="button" onclick="document.getElementById('ava-in').click()" style="background:#34b7f1">Fotoğraf Seç</button>
                <button type="submit">Kayıt Ol</button>
            </form>
        </div>
    </div>

    <input type="file" id="ava-in" style="display:none" accept="image/*" onchange="processImage(this)">

    <script>
        function processImage(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = function() {
                        // KÜÇÜLTME İŞLEMİ (CANVAS)
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        
                        // Fotoğrafı 200x200 kareye zorla (Boyutu çok düşürür)
                        canvas.width = 200;
                        canvas.height = 200;
                        ctx.drawImage(img, 0, 0, 200, 200);
                        
                        // %70 kalite ile JPEG formatına çevir
                        const compressedData = canvas.toDataURL('image/jpeg', 0.7);
                        
                        document.getElementById('avatar-prev').src = compressedData;
                        document.getElementById('avatar_data').value = compressedData;
                        console.log("Fotoğraf optimize edildi.");
                    };
                };
                reader.readAsDataURL(input.files[0]);
            }
        }
    </script>
</body>
</html>
