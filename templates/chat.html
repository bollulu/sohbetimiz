<!DOCTYPE html>
<html>
<head>
    <title>WhatsApp Ultra</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        :root { --wa-green: #075e54; --wa-light: #dcf8c6; --bg: #e5ddd5; }
        body { font-family: sans-serif; margin: 0; display: flex; height: 100vh; background: var(--bg); overflow: hidden; }
        #side-panel { width: 350px; background: white; border-right: 1px solid #ddd; display: flex; flex-direction: column; }
        #story-bar { display: flex; padding: 15px; gap: 15px; overflow-x: auto; background: white; border-bottom: 1px solid #eee; }
        .story-circle { width: 55px; height: 55px; border-radius: 50%; border: 3px solid #25D366; object-fit: cover; cursor: pointer; }
        #chat-area { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .msg-wrap { display: flex; align-items: flex-end; gap: 8px; max-width: 80%; }
        .sent-wrap { align-self: flex-end; flex-direction: row-reverse; }
        .msg { padding: 10px; border-radius: 10px; font-size: 14px; box-shadow: 0 1px 1px rgba(0,0,0,0.1); }
        .sent { background: var(--wa-light); } .received { background: white; }
        img.chat-img, video.chat-vid { max-width: 250px; border-radius: 10px; margin-top: 5px; }
        #story-modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:black; z-index:1000; flex-direction:column; align-items:center; justify-content:center; }
    </style>
</head>
<body>

<div id="side-panel">
    <div style="padding:15px; background:var(--wa-green); color:white; display:flex; justify-content:space-between; align-items:center;">
        <img src="{{ user.avatar }}" style="width:40px; height:40px; border-radius:50%; object-fit:cover;">
        <div style="display:flex; gap:15px;">
            <b onclick="document.getElementById('sIn').click()" style="font-size:24px; cursor:pointer;">+</b>
        </div>
        <input type="file" id="sIn" style="display:none" onchange="uploadFile(this, 'story')">
    </div>
    <div id="story-bar"></div>
    <div id="user-list" style="flex:1; overflow-y:auto; padding:10px;"></div>
</div>

<div style="flex:1; display:flex; flex-direction:column;">
    <div id="chat-area"></div>
    <div style="padding:15px; background:#f0f0f0; display:flex; gap:10px; align-items:center;">
        <b onclick="document.getElementById('fIn').click()" style="font-size:20px; cursor:pointer;">📁</b>
        <input type="file" id="fIn" style="display:none" onchange="uploadFile(this, 'chat')" accept="image/*,video/*">
        <input type="text" id="mIn" style="flex:1; padding:12px; border-radius:25px; border:none;" placeholder="Mesaj yaz..." onkeydown="if(event.key==='Enter') sendMsg()">
        <button onclick="sendMsg()" style="background:none; border:none; font-size:24px; color:var(--wa-green); cursor:pointer;">➤</button>
    </div>
</div>

<div id="story-modal" onclick="this.style.display='none'">
    <img id="story-img" style="max-width:90%; max-height:80%;">
</div>

<script>
    const socket = io();
    const myName = "{{ user.username }}";

    function uploadFile(input, mode) {
        if (!input.files[0]) return;
        const reader = new FileReader();
        const isVideo = input.files[0].type.startsWith('video');
        reader.onload = e => {
            if(mode === 'story') socket.emit('add_story', {image: e.target.result});
            else socket.emit('message', {msg: e.target.result, type: isVideo ? 'video' : 'image'});
        };
        reader.readAsDataURL(input.files[0]);
    }

    function sendMsg() {
        const i = document.getElementById('mIn');
        if(i.value.trim()) { socket.emit('message', {msg: i.value, type: 'text'}); i.value=''; }
    }

    function addMsg(d) {
        const area = document.getElementById('chat-area');
        const isMe = d.user === myName;
        const wrap = document.createElement('div');
        wrap.className = `msg-wrap ${isMe ? 'sent-wrap' : ''}`;
        
        let content = d.msg;
        if(d.type === 'image') content = `<img src="${d.msg}" class="chat-img">`;
        if(d.type === 'video') content = `<video src="${d.msg}" controls class="chat-vid"></video>`;

        wrap.innerHTML = `
            <img src="${d.avatar}" style="width:30px; height:30px; border-radius:50%; object-fit:cover;">
            <div class="msg ${isMe ? 'sent' : 'received'}">
                <div style="font-size:10px; font-weight:bold; color:var(--wa-green);">${isMe ? 'Siz' : d.user}</div>
                ${content}
                <div style="font-size:9px; color:#999; text-align:right; margin-top:4px;">${d.time}</div>
            </div>`;
        area.appendChild(wrap); area.scrollTop = area.scrollHeight;
    }

    socket.on('story_list', data => {
        const bar = document.getElementById('story-bar'); bar.innerHTML = '';
        for(let u in data) {
            const img = document.createElement('img');
            img.src = data[u].avatar; img.className = 'story-circle';
            img.onclick = () => {
                document.getElementById('story-img').src = data[u].stories[data[u].stories.length-1].content;
                document.getElementById('story-modal').style.display = 'flex';
            };
            bar.appendChild(img);
        }
    });

    socket.on('message', d => addMsg(d));
    socket.on('history', h => h.forEach(addMsg));
    socket.emit('join', {});
</script>
</body>
</html>
