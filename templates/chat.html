<!DOCTYPE html>
<html>
<head>
    <title>Sohbetimiz Pro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        :root { --wa-green: #075e54; --wa-light: #dcf8c6; --wa-bg: #e5ddd5; --blue-tick: #34b7f1; }
        body { font-family: 'Segoe UI', sans-serif; background: #ece5dd; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        #main-chat { flex: 1; display: flex; flex-direction: column; background: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); background-attachment: fixed; }
        #chat-area { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 5px; }

        /* Mesaj ve Avatar Kutusu */
        .message-wrapper { display: flex; align-items: flex-end; gap: 8px; margin-bottom: 4px; }
        .wrapper-sent { flex-direction: row-reverse; }
        
        .chat-avatar { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; }
        
        .msg { padding: 8px 12px; border-radius: 12px; max-width: 70%; font-size: 0.95em; box-shadow: 0 1px 2px rgba(0,0,0,0.1); position: relative; }
        .received { background: white; border-bottom-left-radius: 2px; }
        .sent { background: var(--wa-light); border-bottom-right-radius: 2px; }

        .msg-info { font-size: 0.7em; color: #888; display: flex; align-items: center; justify-content: flex-end; gap: 4px; margin-top: 3px; }
        .tick { font-size: 14px; color: #999; }
        .read-tick { color: var(--blue-tick); }

        #input-area { background: #f0f0f0; padding: 10px; display: flex; align-items: center; gap: 8px; }
        #msgInput { flex: 1; padding: 12px; border-radius: 25px; border: none; outline: none; }
        
        .mic-btn { font-size: 22px; cursor: pointer; border: none; background: none; }
        .recording { color: red; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>

    <div id="main-chat">
        <div id="chat-area"></div>
        <div id="input-area">
            <button id="micBtn" class="mic-btn" onmousedown="startRecording()" onmouseup="stopRecording()" ontouchstart="startRecording()" ontouchend="stopRecording()">🎤</button>
            <input type="text" id="msgInput" placeholder="Mesaj yazın..." onkeypress="if(event.key==='Enter') send()">
            <button onclick="send()" style="background:var(--wa-green); color:white; border:none; width:40px; height:40px; border-radius:50%; cursor:pointer;">➤</button>
        </div>
    </div>

    <script>
        const socket = io();
        const myName = "{{ user.username }}";
        let mediaRecorder, audioChunks = [];

        // --- MESAJ GÖNDERME ---
        function send() {
            const input = document.getElementById('msgInput');
            if(input.value.trim()) {
                socket.emit('message', {msg: input.value, type: 'text'});
                input.value = '';
            }
        }

        socket.on('message', data => {
            addMessage(data);
            // Eğer mesajı biz alıyorsak, "okundu" sinyali gönderelim
            if(data.user !== myName) {
                socket.emit('mark_read', {id: data.id});
            }
        });

        socket.on('message_read', data => {
            const tick = document.querySelector(`#msg-${data.id} .tick`);
            if(tick) {
                tick.innerHTML = "✓✓"; 
                tick.classList.add('read-tick');
            }
        });

        function addMessage(data) {
            const area = document.getElementById('chat-area');
            const isMe = data.user === myName;
            
            const wrapper = document.createElement('div');
            wrapper.className = `message-wrapper ${isMe ? 'wrapper-sent' : ''}`;
            
            let content = '';
            if(data.type === 'text') content = data.msg;
            else if(data.type === 'audio') content = `<audio src="${data.msg}" controls style="width:200px; height:30px;"></audio>`;

            wrapper.innerHTML = `
                <img src="${data.avatar || 'https://www.w3schools.com/howto/img_avatar.png'}" class="chat-avatar">
                <div class="msg ${isMe ? 'sent' : 'received'}" id="msg-${data.id}">
                    <b style="font-size:0.75em; color:var(--wa-green);">${data.user}</b><br>
                    ${content}
                    <div class="msg-info">
                        ${data.time}
                        ${isMe ? `<span class="tick">✓✓</span>` : ''}
                    </div>
                </div>
            `;
            area.appendChild(wrapper);
            area.scrollTop = area.scrollHeight;
        }

        // --- SES KAYDI (GÜÇLENDİRİLMİŞ) ---
        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                mediaRecorder.onstop = () => {
                    const blob = new Blob(audioChunks, { type: 'audio/webm' });
                    const reader = new FileReader();
                    reader.onload = e => socket.emit('message', {msg: e.target.result, type: 'audio'});
                    reader.readAsDataURL(blob);
                };
                mediaRecorder.start();
                document.getElementById('micBtn').classList.add('recording');
            } catch (err) { alert("Mikrofon izni gerekli!"); }
        }

        function stopRecording() {
            if(mediaRecorder && mediaRecorder.state !== "inactive") {
                mediaRecorder.stop();
                document.getElementById('micBtn').classList.remove('recording');
            }
        }

        socket.on('history', msgs => msgs.forEach(addMessage));
    </script>
</body>
</html>
