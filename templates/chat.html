<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WhatsApp Ultra</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>

<style>
/* 🔒 TASARIM DEĞİŞMEDİ */
:root{--main:#075e54;--light:#25D366;--bg:#e5ddd5}
body{margin:0;display:flex;height:100vh;font-family:sans-serif;overflow:hidden}
#side{width:300px;background:white;border-right:1px solid #ddd;display:flex;flex-direction:column}
#main{flex:1;display:flex;flex-direction:column;background:var(--bg)}
#chat-box{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:15px}
.msg{display:flex;gap:10px;max-width:85%}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.bubble{background:white;padding:8px 12px;border-radius:12px;max-width:100%}
.me .bubble{background:#dcf8c6}
footer{padding:10px;background:#f0f0f0;display:flex;gap:8px}
#file-in{display:none}
</style>
</head>

<body>

<div id="side"></div>

<div id="main">
<div id="chat-box"></div>

<footer>
<button onclick="document.getElementById('file-in').click()">📎</button>
<input id="mIn" placeholder="Mesaj yaz..." onkeydown="if(event.key==='Enter')send()">
<button onclick="send()">🚀</button>
</footer>
</div>

<input type="file" id="file-in" onchange="processFile(this)">

<script>
const socket = io();
const myUser = "{{ user.username }}";

function send(){
 const i=document.getElementById("mIn");
 if(i.value.trim()){
  socket.emit("send_msg",{content:i.value,type:"text"});
  i.value="";
 }
}

/* 🔥 TÜM DOSYA TÜRLERİ DESTEK */
function processFile(input){
 const file=input.files[0];
 if(!file)return;

 const reader=new FileReader();
 reader.onload=e=>{
  let type="file";

  if(file.type.startsWith("image/")) type="image";
  else if(file.type.startsWith("audio/")) type="audio";
  else if(file.type.startsWith("video/")) type="video";

  socket.emit("send_msg",{
   content:e.target.result,
   type:type,
   filename:file.name,
   mimetype:file.type
  });
 };
 reader.readAsDataURL(file);
}

/* 🔥 AKILLI MESAJ ÇİZİMİ */
socket.on("new_msg",d=>renderMsg(d));

function renderMsg(d){
 const isMe=d.sender===myUser;
 let content="";

 if(d.type==="image"){
  content=`<img src="${d.content}" style="max-width:220px;border-radius:8px">`;
 }
 else if(d.type==="audio"){
  content=`<audio controls src="${d.content}" style="width:220px"></audio>`;
 }
 else if(d.type==="video"){
  content=`<video controls src="${d.content}" style="max-width:220px;border-radius:8px"></video>`;
 }
 else if(d.type==="file"){
  content=`<a href="${d.content}" download="${d.filename}" style="color:#075e54;font-weight:bold">📁 ${d.filename||"Dosya indir"}</a>`;
 }
 else{
  content=d.content;
 }

 const html=`
 <div class="msg ${isMe?"me":""}">
  <div class="bubble">
   <b>${d.sender}</b><br>
   ${content}
  </div>
 </div>`;

 document.getElementById("chat-box").insertAdjacentHTML("beforeend",html);
 document.getElementById("chat-box").scrollTop=999999;
}
</script>

</body>
</html>
