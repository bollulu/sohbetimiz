<!DOCTYPE html>
<html>
<head>
    <title>Süper Chat</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        :root { --bg: #e5ddd5; --header: #ededed; --green: #008069; --bubble-me: #dcf8c6; }
        body { margin: 0; font-family: 'Helvetica Neue', sans-serif; height: 100vh; display: flex; overflow: hidden; background: #d1d7db; }
        
        /* Sol Menü */
        #sidebar { width: 350px; background: white; border-right: 1px solid #ddd; display: flex; flex-direction: column; }
        .header { background: var(--header); padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ddd; height: 60px; box-sizing: border-box; }
        .my-ava { width: 40px; height: 40px; border-radius: 50%; cursor: pointer; object-fit: cover; }
        
        .tab-bar { display: flex; background: white; border-bottom: 1px solid #eee; }
        .tab { flex: 1; padding: 15px; text-align: center; cursor: pointer; border-bottom: 3px solid transparent; font-weight: bold; color: gray; }
        .tab.active { border-bottom: 3px solid var(--green); color: var(--green); }
        
        #list-area { flex: 1; overflow-y: auto; }
        .list-item { display: flex; align-items: center; padding: 12px; cursor: pointer; border-bottom: 1px solid #f5f5f5; }
        .list-item:hover { background: #f0f0f0; }
        
        /* Ana Sohbet */
        #main { flex: 1; display: flex; flex-direction: column; position: relative; background: var(--bg); }
        .top-info { background: var(--header); padding: 10px; display: flex; align-items: center; justify-content: space-between; height: 60px; box-sizing: border-box; border-left: 1px solid #ddd; }
        
        /* HİKAYE BARI (ORTA ÜST) */
        #story-bar { background: white; padding: 10px; display: flex; gap: 15px; overflow-x: auto; border-bottom: 1px solid #ddd; height: 100px; box-sizing: border-box; }
        .st-circle { width: 60px; height: 60px; border-radius: 50%; border: 2px solid var(--green); padding: 2px; object-fit: cover; cursor: pointer; }
        
        #chat-area { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); }
        
        .msg { max-width: 65%; display: flex; align-items: flex-end; gap: 5px; }
        .msg.me { align-self: flex-end; flex-direction: row-reverse; }
        .bubble { background: white; padding: 8px 12px; border-radius: 8px; box-shadow: 0 1px 1px rgba(0,0,0,0.1); position: relative; min-width: 80px; }
        .me .bubble { background: var(--bubble-me); }
        .tick { float: right; margin-left: 5px; font-size: 11px; color: #999; margin-top: 5px; display: flex; gap: 2px; }
        .tick.read { color: #53bdeb; } /* Çift Mavi Tik */
        
        .footer { padding: 10px; background: #f0f0f0; display: flex; align-items: center; gap: 10px; }
        input[type=text] { flex: 1; padding: 10px; border-radius: 20px; border: none; outline: none; }
        
        /* HİKAYE VIEWER */
        #st-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; z-index: 10000; flex-direction: column; }
        #st-progress-container { display: flex; gap: 5px; padding: 10px; width: 95%; margin: 0 auto; z-index: 10001; }
        .progress-bar { height: 3px; background: rgba(255,255,255,0.3); flex: 1; border-radius: 2px; overflow: hidden; }
        .progress-fill { height: 100%; background: white; width: 0%; transition: width linear; }
        
        #st-header { display: flex; justify-content: space-between; align-items: center; padding: 0 15px; color: white; z-index: 10001; }
        #st-content-area { flex: 1; display: flex; justify-content: center; align-items: center; position: relative; }
        #st-media { max-width: 100%; max-height: 80vh; border-radius: 8px; }
        
        .tap-zone { position: absolute; top: 0; height: 100%; width: 30%; z-index: 9999; }
        #tap-left { left: 0; }
        #tap-right { right: 0; width: 70%; }

        #st-footer { padding: 15px; color: white; text-align: center; background: linear-gradient(to top, rgba(0,0,0,0.8), transparent); }

 	/* Müzik Animasyonu */
        .music-indicator { position: absolute; top: 20px; right: 20px; font-size: 24px; animation: spin 2s linear infinite; z-index: 10001; text-shadow: 0 0 5px black; display: none; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* HİKAYE EKLEME MODALI */
        #creator-modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index: 10002; justify-content: center; align-items: center; }
        .creator-box { background: white; padding: 20px; border-radius: 10px; width: 300px; text-align: center; display: flex; flex-direction: column; gap: 10px; }
        .c-btn { padding: 10px; border: 1px solid #ddd; border-radius: 5px; cursor: pointer; background: #f9f9f9; }
        .c-btn:hover { background: #eee; }
        .publish-btn { background: #25D366; color: white; border: none; font-weight: bold; }
                
        /* VİDEO ARAMA */
        #video-modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.9); z-index: 2000; flex-direction: column; align-items: center; justify-content: center; }
        video { border-radius: 10px; background: black; }
    </style>
</head>
<body>

<input type="file" id="p-img" style="display:none" accept="image/*" onchange="uploadAvatar(this)">
<input type="file" id="msg-file" style="display:none" onchange="sendFile(this)">
<input type="file" id="bg-in" style="display:none" accept="image/*" onchange="changeBG(this)">
<input type="file" id="st-media" style="display:none" accept="image/*,video/*" onchange="previewStory(this)">
<input type="file" id="st-audio" style="display:none" accept="audio/*">
<input type="file" id="music-file" style="display:none" accept="audio/*" onchange="uploadMusic(this)">

<div id="sidebar">
    <div class="header">
        <div style="display:flex; align-items:center; gap:10px;">
            <img src="{{ user.avatar }}" class="my-ava" onclick="document.getElementById('p-img').click()">
            <div><b>Siz</b> ({{ user.username }})</div>
        </div>
        <div style="cursor:pointer" onclick="location.href='/logout'">🚪</div>
    </div>
    
    <div class="tab-bar">
        <div class="tab active" onclick="switchTab('users')">Sohbet</div>
        <div class="tab" onclick="switchTab('groups')">Grup</div>
        <div class="tab" onclick="switchTab('music')">Müzik 🎵</div>
    </div>
    
    <div id="list-area">
        <div id="users-list"></div>
        <div id="groups-list" style="display:none">
            <button onclick="createGroupUI()" style="width:90%; margin:10px; padding:10px;">+ Grup Oluştur</button>
        </div>
        <div id="music-list-mini" style="display:none">
            <button onclick="document.getElementById('music-file').click()" style="width:90%; margin:10px; padding:10px;">+ Şarkı Ekle</button>
            <div id="music-cont"></div>
        </div>
    </div>
</div>

<div id="main">
    <div class="top-info">
        <div id="chat-title"><b>Genel Sohbet</b></div>
        <div style="display:flex; gap:15px; align-items:center;">
            <span id="clock" style="font-size:14px; font-weight:bold;">12:00</span>
            <button onclick="startVideoCall()">📹</button>
            <button onclick="document.getElementById('bg-in').click()">🖼️ Arka Plan</button>
            <button onclick="resetBG()">🔄 Sıfırla</button>
            <button onclick="blockUser()" style="color:red">🚫 Engelle</button>
        </div>
    </div>
    
    <div id="story-bar">
        <div style="text-align:center; cursor:pointer;" onclick="document.getElementById('st-media').click()">
            <div class="st-circle" style="border:2px dashed #999; display:flex; align-items:center; justify-content:center; font-size:24px;">+</div>
            <div style="font-size:11px;">Hikaye</div>
        </div>
        <div id="story-items" style="display:flex; gap:10px;"></div>
    </div>

    <div id="chat-area"></div>

    <div class="footer">
        <button onclick="document.getElementById('msg-file').click()">📎</button>
        <input type="text" id="mIn" placeholder="Mesaj yazın..." onkeydown="if(event.key==='Enter') send()">
        <button onclick="toggleMic()" id="mic-btn">🎤</button>
        <button onclick="send()">➤</button>
    </div>
</div>

<div id="st-viewer">
    <div class="st-progress" id="st-prog-cont"></div>
    <div style="position:absolute; top:20px; left:20px; color:white; z-index:1002; display:flex; align-items:center; gap:10px;">
        <img id="st-v-ava" style="width:30px; height:30px; border-radius:50%">
        <b id="st-v-name"></b>
        <span id="st-viewers" style="font-size:11px; opacity:0.8; margin-left:10px;"></span>
    </div>
    <button onclick="closeStory()" style="position:absolute; top:20px; right:20px; z-index:1002; background:none; border:none; color:white; font-size:24px;">✕</button>
    <button id="del-st-btn" onclick="deleteCurrentStory()" style="position:absolute; bottom:20px; right:20px; z-index:1002; background:red; color:white; border:none; padding:5px;">🗑️ Sil</button>

    <div id="st-content">
        <div class="tap-zone" style="left:0" onclick="prevStory()"></div>
        <div class="tap-zone" style="right:0" onclick="nextStory()"></div>
        <img id="st-img" style="max-width:100%; max-height:80vh; display:none;">
        <video id="st-vid" style="max-width:100%; max-height:80vh; display:none;" autoplay></video>
    </div>
</div>

<div id="video-modal">
    <div style="position:relative; width:80%; height:80%;">
        <video id="remoteVideo" autoplay playsinline style="width:100%; height:100%; object-fit:cover;"></video>
        <video id="localVideo" autoplay playsinline muted style="position:absolute; bottom:20px; right:20px; width:150px; border:2px solid white;"></video>
    </div>
    <div style="margin-top:20px; display:flex; gap:20px;">
        <button onclick="switchCamera()">📷 Kamera Değiştir</button>
        <button onclick="endCall()" style="background:red; color:white; padding:10px 20px; border:none; border-radius:5px;">Aramayı Bitir</button>
    </div>
</div>

<script>
    const socket = io();
    const myName = "{{ user.username }}";
    let currentRoom = 'Genel';
    let storiesData = {};
    let currentStoryUser = null;
    let currentStoryIdx = 0;
    let storyTimer = null;
    let stAudio = new Audio();
    let peerConnection;
    let localStream;

    // --- BAŞLANGIÇ ---
    setInterval(() => document.getElementById('clock').innerText = new Date().toLocaleTimeString().slice(0,5), 1000);
    if(localStorage.getItem('chat_bg')) document.getElementById('chat-area').style.backgroundImage = `url(${localStorage.getItem('chat_bg')})`;

    socket.on('connect', () => {
        socket.emit('join_room', {room: 'Genel'});
    });

    // --- SOHBET ---
    function switchTab(t) {
        document.querySelectorAll('.tab').forEach(e => e.classList.remove('active'));
        event.target.classList.add('active');
        document.getElementById('users-list').style.display = t==='users'?'block':'none';
        document.getElementById('groups-list').style.display = t==='groups'?'block':'none';
        document.getElementById('music-list-mini').style.display = t==='music'?'block':'none';
    }

    function send() {
        const i = document.getElementById('mIn');
        if(i.value.trim()) {
            socket.emit('send_message', {room:currentRoom, msg:i.value, type:'text'});
            i.value='';
        }
    }

    socket.on('message', d => appendMsg(d));
    socket.on('history', d => {
        document.getElementById('chat-area').innerHTML = '';
        d.forEach(m => appendMsg(m));
    });

    function appendMsg(d) {
        const box = document.getElementById('chat-area');
        const isMe = d.user === myName;
        const div = document.createElement('div');
        div.className = `msg ${isMe ? 'me' : ''}`;
        div.id = `msg-${d.id}`;
        
        let content = d.msg;
        if(d.type === 'image') content = `<img src="${d.msg}" style="max-width:200px; border-radius:5px;">`;
        if(d.type === 'audio') content = `<audio controls src="${d.msg}"></audio>`;
        if(d.type === 'video') content = `<video controls src="${d.msg}" style="max-width:200px; border-radius:5px;"></video>`;

        div.innerHTML = `
            ${!isMe ? `<img src="${d.ava}" class="my-ava" style="width:25px; height:25px;">` : ''}
            <div class="bubble">
                ${!isMe ? `<div style="font-size:10px; color:var(--green); font-weight:bold">${d.user}</div>` : ''}
                <div>${content}</div>
                <div class="tick ${d.status==='read'?'read':''}" id="tick-${d.id}">
                    ${d.time} ${isMe ? (d.status==='read' ? '✓✓' : '✓') : ''}
                </div>
                ${isMe ? `<div onclick="delMsg(${d.id})" style="font-size:10px; color:red; cursor:pointer; margin-top:2px;">Sil</div>` : ''}
            </div>
        `;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    socket.on('msg_status_update', d => {
        const t = document.getElementById(`tick-${d.id}`);
        if(t) { t.innerHTML = t.innerHTML.replace('✓', '✓✓'); t.classList.add('read'); }
    });

    socket.on('message_deleted', d => document.getElementById(`msg-${d.id}`)?.remove());

    function delMsg(id) {
        if(confirm('Mesaj silinsin mi?')) socket.emit('delete_message', {id:id});
    }

    function changeBG(inp) {
        const r = new FileReader(); r.onload=e=>{
            document.getElementById('chat-area').style.backgroundImage = `url(${e.target.result})`;
            localStorage.setItem('chat_bg', e.target.result);
        }; r.readAsDataURL(inp.files[0]);
    }
    function resetBG() {
        localStorage.removeItem('chat_bg');
        document.getElementById('chat-area').style.backgroundImage = "url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png')";
    }

    // --- HİKAYE ---
    function previewStory(inp) {
        const file = inp.files[0];
        if(!file) return;
        const type = file.type.includes('video') ? 'video' : 'image';
        
        // Müzik sor
        if(confirm("Müzik eklemek ister misiniz?")) {
            const au = document.getElementById('st-audio');
            au.onchange = () => {
                const r1 = new FileReader(); r1.onload = e1 => { // Medya
                    const r2 = new FileReader(); r2.onload = e2 => { // Ses
                        // Video süresi için metadata lazım, basitleştirmek için 30sn varsayıyoruz
                        socket.emit('add_story', {content:e1.target.result, music:e2.target.result, type:type});
                    }; r2.readAsDataURL(au.files[0]);
                }; r1.readAsDataURL(file);
            };
            au.click();
        } else {
            const r = new FileReader();
            r.onload = e => socket.emit('add_story', {content:e.target.result, music:null, type:type});
            r.readAsDataURL(file);
        }
    }

    socket.on('story_list', data => {
        storiesData = data;
        const bar = document.getElementById('story-items');
        bar.innerHTML = '';
        for(let u in data) {
            bar.innerHTML += `
            <div onclick="openStory('${u}')" style="text-align:center; cursor:pointer;">
                <img src="${data[u].avatar}" class="st-circle">
                <div style="font-size:11px; margin-top:2px;">${u===myName?'Siz':u}</div>
            </div>`;
        }
    });

    function openStory(u) {
        currentStoryUser = u; currentStoryIdx = 0;
        document.getElementById('st-viewer').style.display = 'flex';
        renderStory();
    }

    function renderStory() {
        clearTimeout(storyTimer); stAudio.pause();
        const items = storiesData[currentStoryUser].items;
        if(currentStoryIdx >= items.length) { closeStory(); return; }
        
        const s = items[currentStoryIdx];
        const duration = s.type === 'video' ? s.duration * 1000 : 5000; // Video ise süresi, resim ise 5sn (veya müzik süresi)
        
        // UI
        document.getElementById('st-v-ava').src = storiesData[currentStoryUser].avatar;
        document.getElementById('st-v-name').innerText = currentStoryUser;
        document.getElementById('del-st-btn').style.display = s.can_delete ? 'block' : 'none';
        document.getElementById('st-viewers').innerText = s.can_delete ? `👁️ ${s.viewers.length} kişi gördü` : '';
        
        // Medya
        const img = document.getElementById('st-img');
        const vid = document.getElementById('st-vid');
        
        if(s.type === 'video') {
            img.style.display = 'none'; vid.style.display = 'block'; vid.src = s.content;
            vid.onloadedmetadata = () => startBar(vid.duration*1000);
        } else {
            vid.style.display = 'none'; img.style.display = 'block'; img.src = s.content;
            if(s.music) {
                stAudio.src = s.music; stAudio.play();
                stAudio.onloadedmetadata = () => startBar(stAudio.duration*1000);
            } else {
                startBar(5000);
            }
        }
        
        if(currentStoryUser !== myName) socket.emit('view_story', {id:s.id});
    }

    function startBar(ms) {
        const cont = document.getElementById('st-prog-cont'); cont.innerHTML = '';
        storiesData[currentStoryUser].items.forEach((_, i) => {
            cont.innerHTML += `<div class="st-bar"><div class="st-fill" style="width:${i < currentStoryIdx ? '100%' : (i==currentStoryIdx ? '0%' : '0%')}" id="fill-${i}"></div></div>`;
        });
        
        setTimeout(() => {
            const f = document.getElementById(`fill-${currentStoryIdx}`);
            if(f) {
                f.style.transition = `width ${ms}ms linear`;
                f.style.width = '100%';
            }
        }, 50);
        storyTimer = setTimeout(nextStory, ms);
    }
    
    function nextStory() { currentStoryIdx++; renderStory(); }
    function prevStory() { if(currentStoryIdx>0) currentStoryIdx--; renderStory(); }
    function closeStory() { 
        document.getElementById('st-viewer').style.display='none'; 
        clearTimeout(storyTimer); stAudio.pause(); document.getElementById('st-vid').pause();
    }
    function deleteCurrentStory() {
        const id = storiesData[currentStoryUser].items[currentStoryIdx].id;
        socket.emit('delete_story', {id:id});
        closeStory();
    }

    // --- MÜZİK ---
    function uploadMusic(inp) {
        const r = new FileReader();
        r.onload = e => {
            const name = prompt("Şarkı Adı:");
            if(name) socket.emit('add_music', {name:name, src:e.target.result});
        };
        r.readAsDataURL(inp.files[0]);
    }
    socket.on('music_list', list => {
        const d = document.getElementById('music-cont'); d.innerHTML = '';
        list.forEach(m => {
            d.innerHTML += `
            <div style="background:#f9f9f9; padding:10px; margin:5px 0; border-radius:5px;">
                <b>${m.title}</b><br>
                <audio controls src="${m.src}" style="width:100%"></audio>
            </div>`;
        });
    });
    // Sekme açılınca yükle
    socket.emit('get_music');

    // --- PROFİL VE KULLANICILAR ---
    function uploadAvatar(inp) {
        const r = new FileReader();
        r.onload = e => socket.emit('update_profile', {avatar:e.target.result});
        r.readAsDataURL(inp.files[0]);
    }
    socket.on('update_user_list', list => {
        const d = document.getElementById('users-list'); d.innerHTML = '';
        list.forEach(u => {
            if(u.username !== myName) {
                d.innerHTML += `<div class="list-item" onclick="startChat('${u.username}')">
                    <img src="${u.avatar}" class="my-ava">
                    <div style="margin-left:10px">${u.username}</div>
                </div>`;
            }
        });
    });
    function startChat(u) {
        // Özel oda ID oluştur (alfabetik sıra ile)
        const roomID = [myName, u].sort().join('_');
        currentRoom = roomID;
        document.getElementById('chat-title').innerHTML = `<b>${u}</b> ile sohbet`;
        socket.emit('join_room', {room:roomID});
    }
    function blockUser() {
        if(currentRoom === 'Genel') return alert("Genel sohbette engelleyemezsin.");
        const other = currentRoom.replace(myName, '').replace('_','');
        socket.emit('block_user', {username:other});
    }

    // --- VİDEO KONUŞMA (Basit WebRTC) ---
    async function startVideoCall() {
        document.getElementById('video-modal').style.display = 'flex';
        localStream = await navigator.mediaDevices.getUserMedia({video:true, audio:true});
        document.getElementById('localVideo').srcObject = localStream;
        
        // Sinyal gönder (Burada gerçek PeerConnection kurulumu uzundur, sadece UI mantığı)
        socket.emit('call_signal', {room:currentRoom, type:'offer'});
    }
    async function switchCamera() {
        if(localStream) {
            localStream.getTracks().forEach(t => t.stop());
            // Mobilde 'user' veya 'environment'
            localStream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: { exact: "environment" } }, audio:true
            });
            document.getElementById('localVideo').srcObject = localStream;
        }
    }
    function endCall() {
        document.getElementById('video-modal').style.display = 'none';
        if(localStream) localStream.getTracks().forEach(t => t.stop());
    }

    // --- EKSTRALAR ---
    function uploadMsgFile(inp) {
        const f = inp.files[0];
        const type = f.type.startsWith('image') ? 'image' : (f.type.startsWith('video')?'video':'audio');
        const r = new FileReader();
        r.onload = e => socket.emit('send_message', {room:currentRoom, msg:e.target.result, type:type});
        r.readAsDataURL(f);
    }
    let mediaRec;
    async function toggleMic() {
        if(!mediaRec || mediaRec.state==='inactive') {
            const stream = await navigator.mediaDevices.getUserMedia({audio:true});
            mediaRec = new MediaRecorder(stream);
            let chunks = [];
            mediaRec.ondataavailable = e => chunks.push(e.data);
            mediaRec.onstop = () => {
                const b = new Blob(chunks);
                const r = new FileReader(); r.onload=e=>socket.emit('send_message',{room:currentRoom, msg:e.target.result, type:'audio'});
                r.readAsDataURL(b);
            };
            mediaRec.start();
            document.getElementById('mic-btn').style.color = 'red';
        } else {
            mediaRec.stop();
            document.getElementById('mic-btn').style.color = 'black';
        }
    }
</script>
</body>
</html>
