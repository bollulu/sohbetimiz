<!DOCTYPE html>
<html>
<head>
    <title>WhatsApp Ultra Final</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        :root { --wa-green: #075e54; --wa-blue: #34b7f1; --bg: #e5ddd5; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; height: 100vh; background: var(--bg); overflow: hidden; }
        
        /* Sol Panel & Üst Hikaye Barı */
        #side { width: 350px; background: white; border-right: 1px solid #ddd; display: flex; flex-direction: column; }
        #story-wrapper { padding: 10px; background: #f0f2f5; border-bottom: 1px solid #ddd; display: flex; gap: 12px; overflow-x: auto; }
        .st-box { position: relative; cursor: pointer; text-align: center; min-width: 60px; }
        .st-img { width: 55px; height: 55px; border-radius: 50%; border: 3px solid #25D366; object-fit: cover; }
        .add-st { position: absolute; bottom: 15px; right: 5px; background: #25D366; color: white; border-radius: 50%; width: 20px; height: 20px; font-weight: bold; border: 2px solid white; display: flex; align-items: center; justify-content: center; }

        /* Mesaj Alanı */
        #main { flex: 1; display: flex; flex-direction: column; }
        #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .msg-row { display: flex; align-items: flex-end; gap: 8px; max-width: 80%; }
        .me { align-self: flex-end; flex-direction: row-reverse; }
        .bubble { padding: 8px 12px; border-radius: 12px; font-size: 14px; position: relative; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .me .bubble { background: #dcf8c6; }
        .not-me .bubble { background: white; }
        .avatar-small { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; }
        
        /* Tikler */
        .tick { font-size: 11px; margin-left: 5px; color: #999; }
        .blue-tick { color: var(--wa-blue) !important; }

        /* Görüntülü Arama */
        #vid-overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:9999; flex-direction:column; align-items:center; justify-content:center; }
        #local-vid { width: 150px; position: absolute; bottom: 20px; right: 20px; border-radius: 10px; }
    </style>
</head>
<body>

<div id="side">
    <div style="padding:10px; background:var(--wa-green); color:white; display:flex; justify-content:space-between; align-items:center;">
        <img src="{{ user.avatar }}" onclick="changeAvatar()" style="width:40px; height:40px; border-radius:50%; cursor:pointer; object-fit:cover;">
        <div style="display:flex; gap:15px;">
            <span onclick="startCall()" style="cursor:pointer;">📞</span>
            <a href="{{ url_for('logout') }}" style="color:white; text-decoration:none;">🚪</a>
        </div>
    </div>

    <div id="story-wrapper">
        <div class="st-box" onclick="document.getElementById('sIn').click()">
            <img src="{{ user.avatar }}" class="st-img" style="border-color:#ccc">
            <div class="add-st">+</div>
            <div style="font-size:10px;">Siz</div>
        </div>
        <div id="other-st-list" style="display:flex; gap:12px;"></div>
    </div>

    <div id="online-list" style="flex:1; overflow-y:auto; padding:10px;"></div>
</div>

<div id="main">
    <div id="chat-box"></div>
    <div style="padding:15px; background:#f0f0f0; display:flex; gap:10px; align-items:center;">
        <button onclick="document.getElementById('fIn').click()">📁</button>
        <button id="mic" onmousedown="startRec()" onmouseup="stopRec()">🎤</button>
        <input type="text" id="mIn" style="flex:1; padding:10px; border-radius:20px; border:none;" placeholder="Mesaj yaz..." onkeydown="if(event.key==='Enter') sendMsg()">
        <button onclick="sendMsg()" style="color:var(--wa-green); background:none; border:none; font-size:20px;">➤</button>
    </div>
</div>

<div id="vid-overlay">
    <video id="remote-vid" autoplay playsinline style="width:80%; max-width:600px;"></video>
    <video id="local-vid" autoplay muted playsinline></video>
    <div style="margin-top:20px;">
        <button onclick="switchCam()">📷 Kamera Değiştir</button>
        <button onclick="endCall()" style="background:red; color:white;">Kapat</button>
    </div>
</div>

<input type="file" id="sIn" style="display:none" onchange="upFile(this, 'story')">
<input type="file" id="fIn" style="display:none" onchange="upFile(this, 'chat')">

<script>
    const socket = io();
    const myName = "{{ user.username }}";
    let mediaRec, chunks = [], currentCam = "user";

    // --- HİKAYE YÖNETİMİ ---
    socket.on('story_list', data => {
        const list = document.getElementById('other-st-list');
        list.innerHTML = '';
        for(let user in data) {
            if(user === myName) continue;
            const div = document.createElement('div');
            div.className = 'st-box';
            div.onclick = () => viewStories(data[user].items, user);
            div.innerHTML = `<img src="${data[user].avatar}" class="st-img"> <div style="font-size:10px;">${user}</div>`;
            list.appendChild(div);
        }
    });

    function viewStories(items, user) {
        let i = 0;
        const show = () => {
            const m = document.createElement('div');
            m.style = "position:fixed;top:0;left:0;width:100%;height:100%;background:black;z-index:10000;display:flex;flex-direction:column;align-items:center;justify-content:center;";
            m.innerHTML = `<img src="${items[i].content}" style="max-width:90%; max-height:80%;">
                           <div style="color:white; margin-top:15px;">${user} (${i+1}/${items.length})</div>
                           ${user===myName ? `<button onclick="socket.emit('delete_story',{id:${items[i].id}})">Sil</button>` : ''}`;
            m.onclick = () => { i++; if(i < items.length) { m.remove(); show(); } else m.remove(); };
            document.body.appendChild(m);
        };
        show();
    }

    // --- MESAJ & TİKLER ---
    function sendMsg() {
        const input = document.getElementById('mIn');
        if(input.value.trim()) { socket.emit('message', {msg: input.value, type:'text'}); input.value=''; }
    }

    socket.on('message', d => {
        const box = document.getElementById('chat-box');
        const isMe = d.user === myName;
        const row = document.createElement('div');
        row.className = `msg-row ${isMe ? 'me' : 'not-me'}`;
        
        let body = d.msg;
        if(d.type === 'image') body = `<img src="${d.msg}" style="max-width:200px; border-radius:10px;">`;
        if(d.type === 'audio') body = `<audio src="${d.msg}" controls></audio>`;

        row.innerHTML = `
            <img src="${d.avatar}" class="avatar-small">
            <div class="bubble">
                <div style="font-size:10px; font-weight:bold; color:var(--wa-green);">${isMe ? 'Siz' : d.user}</div>
                ${body}
                <div style="text-align:right;">
                    <span style="font-size:9px; color:#999;">${d.time}</span>
                    ${isMe ? `<span class="tick" id="t-${d.id}">✓</span>` : ''}
                </div>
            </div>`;
        box.appendChild(row);
        box.scrollTop = box.scrollHeight;
        if(!isMe) socket.emit('mark_read', {id: d.id});
    });

    socket.on('msg_read_update', d => {
        const t = document.getElementById(`t-${d.id}`);
        if(t) { t.innerText = '✓✓'; t.classList.add('blue-tick'); }
    });

    // --- SES KAYDI & KAMERA ---
    async function startRec() {
        const s = await navigator.mediaDevices.getUserMedia({audio:true});
        mediaRec = new MediaRecorder(s);
        mediaRec.ondataavailable = e => chunks.push(e.data);
        mediaRec.onstop = () => {
            const b = new Blob(chunks, {type:'audio/webm'});
            const r = new FileReader();
            r.onload = e => socket.emit('message', {msg: e.target.result, type:'audio'});
            r.readAsDataURL(b); chunks = [];
        };
        mediaRec.start();
    }
    function stopRec() { if(mediaRec) mediaRec.stop(); }

    async function startCall() {
        document.getElementById('vid-overlay').style.display='flex';
        const s = await navigator.mediaDevices.getUserMedia({video:{facingMode:currentCam}, audio:true});
        document.getElementById('local-vid').srcObject = s;
    }
    function switchCam() { currentCam = currentCam === "user" ? "environment" : "user"; startCall(); }
    function endCall() { document.getElementById('vid-overlay').style.display='none'; }

    function upFile(input, mode) {
        const r = new FileReader();
        r.onload = e => {
            if(mode==='story') socket.emit('add_story', {image: e.target.result});
            else socket.emit('message', {msg: e.target.result, type:'image'});
        };
        r.readAsDataURL(input.files[0]);
    }

    socket.on('update_user_list', users => {
        const list = document.getElementById('online-list');
        list.innerHTML = '<h4>Çevrimiçi</h4>';
        for(let u in users) list.innerHTML += `<div>● ${u === myName ? 'Siz' : u}</div>`;
    });

    socket.emit('join', {});
</script>
</body>
</html>
