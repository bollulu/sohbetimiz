<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Plus</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --dark: #111b21; --dark-sec: #202c33; --green: #00a884; --text: #e9edef; }
        body { margin: 0; font-family: sans-serif; background: var(--dark); color: var(--text); height: 100vh; display: flex; overflow: hidden; }
        
        #sidebar { width: 300px; background: var(--dark-sec); border-right: 1px solid #333; display: flex; flex-direction: column; }
        .header { padding: 10px; background: var(--dark-sec); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
        .user-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; cursor: pointer; }
        
        .list-area { flex: 1; overflow-y: auto; }
        .list-item { padding: 12px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; border-bottom: 1px solid #2a3942; }
        .list-item:hover { background: #2a3942; }
        .item-info { display: flex; align-items: center; gap: 10px; }
        .del-icon { color: #ea4335; padding: 5px; opacity: 0.6; }
        .del-icon:hover { opacity: 1; }

        #main-chat { flex: 1; display: flex; flex-direction: column; position: relative; }
        
        /* HİKAYE BARI GÜNCEL */
        #story-bar { background: #111b21; padding: 10px; display: flex; gap: 15px; overflow-x: auto; border-bottom: 1px solid #333; height: 100px; align-items: center; }
        .story-wrapper { display: flex; flex-direction: column; align-items: center; gap: 5px; min-width: 70px; cursor: pointer; }
        .story-circle { width: 55px; height: 55px; border-radius: 50%; border: 2px solid var(--green); padding: 2px; }
        .story-circle img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
        .story-name { font-size: 11px; color: #8696a0; text-align: center; max-width: 60px; overflow: hidden; }
        .story-add { width: 55px; height: 55px; border-radius: 50%; border: 2px dashed #555; display: flex; justify-content: center; align-items: center; font-size: 20px; }

        #messages-area { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #0b141a; }
        .message { max-width: 70%; padding: 8px; border-radius: 8px; position: relative; display: flex; gap: 8px; }
        .msg-in { align-self: flex-start; background: #202c33; }
        .msg-out { align-self: flex-end; background: #005c4b; flex-direction: row-reverse; }
        .msg-text { display: flex; flex-direction: column; }
        .msg-sender { font-size: 12px; font-weight: bold; color: #dcf8c6; margin-bottom: 3px; }
        .msg-del-btn { font-size: 12px; color: #ff5c5c; cursor: pointer; margin-left: 10px; visibility: hidden; }
        .message:hover .msg-del-btn { visibility: visible; }

        #input-area { padding: 10px; background: var(--dark-sec); display: flex; gap: 10px; }
        input[type="text"] { flex: 1; padding: 10px; border-radius: 20px; border: none; background: #2a3942; color: white; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: var(--dark-sec); padding: 20px; border-radius: 10px; width: 300px; text-align: center; }
    </style>
</head>
<body>

<div id="sidebar">
    <div class="header">
        <img src="{{ user.avatar }}" class="user-avatar" id="my-avatar-top" onclick="document.getElementById('prof-in').click()">
        <span id="my-username-display">{{ user.username }}</span>
        <button onclick="location.href='/logout'" style="background:none; border:none; color:white;"><i class="fas fa-sign-out-alt"></i></button>
        <input type="file" id="prof-in" hidden accept="image/*" onchange="updateAvatar(this)">
    </div>
    <div style="display:flex; background:#111b21;">
        <div style="flex:1; padding:10px; text-align:center; cursor:pointer;" onclick="showTab('chats')">Kişiler</div>
        <div style="flex:1; padding:10px; text-align:center; cursor:pointer;" onclick="showTab('groups')">Gruplar</div>
    </div>
    <div id="list-chats" class="list-area"></div>
    <div id="list-groups" class="list-area" style="display:none;">
        <button onclick="openGroupModal()" style="width:100%; padding:10px; background:var(--green); border:none; color:white;">Grup Kur</button>
        <div id="groups-container"></div>
    </div>
</div>

<div id="main-chat">
    <div id="story-bar">
        <div class="story-wrapper" onclick="openStoryModal()">
            <div class="story-add">+</div>
            <div class="story-name">Ekle</div>
        </div>
        <div id="story-list" style="display:flex; gap:10px;"></div>
    </div>

    <div id="messages-area"></div>

    <div id="input-area">
        <input type="text" id="msg-input" placeholder="Mesaj yazın..." onkeypress="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()" style="background:none; border:none; color:var(--green); font-size:20px;"><i class="fas fa-paper-plane"></i></button>
    </div>
</div>

<div id="group-modal" class="modal">
    <div class="modal-content">
        <h3>Grup Adı</h3>
        <input type="text" id="new-group-name" style="width:100%; padding:8px; margin-bottom:10px;">
        <button onclick="createGroup()" style="background:var(--green); color:white; padding:8px 20px; border:none;">Oluştur</button>
        <button onclick="closeModal('group-modal')" style="background:#555; color:white; padding:8px 20px; border:none;">İptal</button>
    </div>
</div>

<script>
    const socket = io();
    const myName = "{{ user.username }}";
    let currentRoom = "Genel";

    // --- BAŞLATMA ---
    window.onload = () => {
        socket.emit('join', {room: 'Genel'});
    };

    function showTab(tab) {
        document.getElementById('list-chats').style.display = tab === 'chats' ? 'block' : 'none';
        document.getElementById('list-groups').style.display = tab === 'groups' ? 'block' : 'none';
    }

    // --- AVATAR GÜNCELLEME (HER YERDE ANINDA) ---
    function updateAvatar(input) {
        if(!input.files[0]) return;
        const r = new FileReader();
        r.onload = e => {
            socket.emit('update_profile', {avatar: e.target.result});
            document.getElementById('my-avatar-top').src = e.target.result;
        };
        r.readAsDataURL(input.files[0]);
    }

    // Avatar değiştiğinde tüm sayfayı tarayıp güncelleyen mucize fonksiyon
    socket.on('user_info_updated', data => {
        // 1. Sidebar listesi
        document.querySelectorAll(`.item-info[data-user="${data.username}"] img`).forEach(img => img.src = data.avatar);
        // 2. Mesaj geçmişi
        document.querySelectorAll(`.msg-avatar[data-user="${data.username}"]`).forEach(img => img.src = data.avatar);
        // 3. Hikaye barı
        document.querySelectorAll(`.story-wrapper[data-user="${data.username}"] img`).forEach(img => img.src = data.avatar);
    });

    // --- KİŞİ LİSTESİ ---
    socket.on('update_user_list', users => {
        const list = document.getElementById('list-chats');
        list.innerHTML = '';
        users.forEach(u => {
            list.innerHTML += `
                <div class="list-item" onclick="startPrivate('${u.username}')">
                    <div class="item-info" data-user="${u.username}">
                        <img src="${u.avatar}" class="user-avatar">
                        <span>${u.username} ${u.is_me ? '(Siz)' : ''}</span>
                    </div>
                </div>`;
        });
    });

    // --- GRUP SİSTEMİ ---
    function openGroupModal() { document.getElementById('group-modal').style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    function createGroup() {
        const name = document.getElementById('new-group-name').value;
        if(name) { socket.emit('create_group', {name: name}); closeModal('group-modal'); }
    }
    socket.on('update_group_list', groups => {
        const container = document.getElementById('groups-container');
        container.innerHTML = '';
        groups.forEach(g => {
            const delBtn = g.admin === myName ? `<i class="fas fa-trash del-icon" onclick="deleteGroup(event, '${g.name}')"></i>` : '';
            container.innerHTML += `
                <div class="list-item" onclick="joinRoom('${g.name}')">
                    <div class="item-info">
                        <div class="user-avatar" style="background:#444; display:flex; justify-content:center; align-items:center;"><i class="fas fa-users"></i></div>
                        <span>${g.name}</span>
                    </div>
                    ${delBtn}
                </div>`;
        });
    });
    function deleteGroup(e, name) {
        e.stopPropagation();
        if(confirm(name + " grubunu silmek istediğine emin misin?")) socket.emit('delete_group', {name: name});
    }

    // --- SOHBET ---
    function joinRoom(room) {
        currentRoom = room;
        document.getElementById('messages-area').innerHTML = '';
        socket.emit('join', {room: room});
    }
    function startPrivate(user) {
        const room = [myName, user].sort().join('_');
        joinRoom(room);
    }
    function sendMessage() {
        const msg = document.getElementById('msg-input').value;
        if(msg) {
            socket.emit('send_message', {room: currentRoom, msg: msg, type: 'text'});
            document.getElementById('msg-input').value = '';
        }
    }
    socket.on('load_history', msgs => msgs.forEach(m => displayMsg(m)));
    socket.on('new_message', m => { displayMsg(m); scrollToBottom(); });

    function displayMsg(m) {
        const isMe = m.sender === myName;
        const area = document.getElementById('messages-area');
        const div = document.createElement('div');
        div.className = `message ${isMe ? 'msg-out' : 'msg-in'}`;
        div.id = `msg-${m.id}`;
        
        const delBtn = isMe ? `<span class="msg-del-btn" onclick="deleteMsg(${m.id})"><i class="fas fa-trash"></i></span>` : '';

        div.innerHTML = `
            <img src="${m.avatar}" class="user-avatar msg-avatar" data-user="${m.sender}">
            <div class="msg-text">
                <div class="msg-sender">${m.sender} ${delBtn}</div>
                <div>${m.content}</div>
                <div style="font-size:10px; color:#888; text-align:right;">${m.time}</div>
            </div>`;
        area.appendChild(div);
    }
    function deleteMsg(id) {
        if(confirm("Mesajı sil?")) socket.emit('delete_message', {id: id});
    }
    socket.on('message_deleted', data => {
        const el = document.getElementById(`msg-${data.id}`);
        if(el) el.remove();
    });
    function scrollToBottom() { const area = document.getElementById('messages-area'); area.scrollTop = area.scrollHeight; }

    // --- HİKAYELER (GÜNCELLENMİŞ) ---
    function openStoryModal() {
        const input = document.createElement('input');
        input.type = 'file'; input.accept = 'image/*';
        input.onchange = e => {
            const r = new FileReader();
            r.onload = ev => socket.emit('post_story', {content: ev.target.result, type: 'image'});
            r.readAsDataURL(e.target.files[0]);
        };
        input.click();
    }
    socket.on('stories_update', grouped => {
        const list = document.getElementById('story-list');
        list.innerHTML = '';
        for(let user in grouped) {
            const data = grouped[user];
            list.innerHTML += `
                <div class="story-wrapper" data-user="${user}" onclick="viewUserStories('${user}')">
                    <div class="story-circle">
                        <img src="${data.avatar}">
                    </div>
                    <div class="story-name">${user === myName ? 'Siz' : user}</div>
                </div>`;
        }
    });

    function viewUserStories(user) {
        alert(user + " kullanıcısının hikayeleri yakında tam ekran modunda açılacak!");
    }
</script>
</body>
</html>
