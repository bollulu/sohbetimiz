<!DOCTYPE html>
<html>
<head>
    <title>WhatsApp Ultra</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        :root { --green: #075e54; --light-green: #dcf8c6; --white: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; height: 100vh; background: #e5ddd5; }
        
        /* SOL PANEL */
        #side { width: 350px; background: white; border-right: 1px solid #ddd; display: flex; flex-direction: column; }
        .side-header { padding: 12px; background: #ededed; display: flex; justify-content: space-between; align-items: center; }
        .genel-btn { padding: 15px; background: #e7fce3; border-bottom: 1px solid #ddd; cursor: pointer; font-weight: bold; color: var(--green); display: flex; align-items: center; gap: 10px; }
        
        /* ÇEVRİMİÇİ LİSTESİ */
        .user-row { display: flex; align-items: center; gap: 12px; padding: 12px; border-bottom: 1px solid #f2f2f2; }
        .user-row img { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; border: 2px solid #25D366; }
        .user-row b { font-size: 15px; }

        /* ANA PANEL */
        #main { flex: 1; display: flex; flex-direction: column; }
        .chat-header { padding: 10px 20px; background: #ededed; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ddd; }

        #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .msg { display: flex; align-items: flex-end; gap: 8px; max-width: 75%; }
        .msg.me { align-self: flex-end; flex-direction: row-reverse; }
        .bubble { padding: 8px 12px; border-radius: 12px; font-size: 14px; box-shadow: 0 1px 1px rgba(0,0,0,0.1); }
        .me .bubble { background: var(--light-green); }
        .not-me .bubble { background: var(--white); }
        .msg-ava { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; }

        /* FOOTER GİRİŞ */
        .footer { padding: 15px; background: #f0f0f0; display: flex; gap: 12px; align-items: center; }
        input[type="text"] { flex: 1; padding: 12px; border-radius: 25px; border: none; outline: none; }

        /* GÖRÜNTÜLÜ KONUŞMA OVERLAY */
        #overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:black; z-index:9999; flex-direction:column; align-items:center; justify-content:center; }
        video { width: 80%; border-radius: 12px; }
    </style>
</head>
<body>

<div id="side">
    <div class="side-header">
        <img src="{{ user.avatar }}" style="width:40px; height:40px; border-radius:50%; object-fit:cover;">
        <a href="/logout" style="text-decoration:none; font-size: 22px;">🚪</a>
    </div>
    <div class="genel-btn">🌐 Genel Sohbet Odası</div>
    <div id="users-div" style="flex:1; overflow-y:auto;"></div>
</div>

<div id="main">
    <div class="chat-header">
        <div style="font-weight:bold; font-size:18px;">Genel Sohbet</div>
        <div style="font-size: 24px; cursor: pointer;" onclick="startCall()">📞</div>
    </div>

    <div id="chat-box"></div>

    <div class="footer">
        <span onclick="document.getElementById('fIn').click()" style="cursor:pointer; font-size:24px;">📎</span>
        <input type="text" id="mIn" placeholder="Mesaj yazın..." onkeydown="if(event.key==='Enter') send()">
        <button onclick="send()" style="border:none; background:none; font-size:24px; color:var(--green); cursor:pointer;">➤</button>
    </div>
</div>

<div id="overlay">
    <video id="v-remote" autoplay playsinline></video>
    <video id="v-local" autoplay muted playsinline style="width:150px; position:absolute; bottom:20px; right:20px; border:2px solid white;"></video>
    <button onclick="closeCall()" style="margin-top:20px; background:red; color:white; padding:10px 20px; border:none; border-radius:8px;">Kapat</button>
</div>

<input type="file" id="fIn" style="display:none" onchange="uploadFile(this)">

<script>
    const socket = io();
    const myName = "{{ user.username }}";

    // ONLİNE LİSTESİ GÜNCELLEME (AVATARLI)
    socket.on('update_user_list', users => {
        const div = document.getElementById('users-div'); div.innerHTML = '';
        for(let u in users) {
            const isMe = (u === myName);
            div.innerHTML += `
                <div class="user-row">
                    <img src="${users[u].avatar}">
                    <div>
                        <b>${isMe ? 'Siz' : u}</b><br>
                        <small style="color:#25D366">çevrimiçi</small>
                    </div>
                </div>`;
        }
    });

    function send() {
        const i = document.getElementById('mIn');
        if(i.value.trim()) { socket.emit('message', {msg: i.value}); i.value=''; }
    }

    socket.on('message', d => {
        const box = document.getElementById('chat-box');
        const isMe = d.user === myName;
        const row = document.createElement('div');
        row.className = `msg ${isMe ? 'me' : ''}`;
        
        let content = d.msg;
        if(d.type === 'image') content = `<img src="${d.msg}" style="max-width:250px; border-radius:8px;">`;

        row.innerHTML = `
            <img src="${d.avatar}" class="msg-ava">
            <div class="bubble">
                <div style="font-size:10px; font-weight:bold; color:var(--green);">${isMe ? 'Siz' : d.user}</div>
                ${content}
                <div style="text-align:right; font-size:10px; color:#999; margin-top:4px;">
                    ${d.time} ${isMe ? '<span style="color:#34b7f1">✓✓</span>' : ''}
                </div>
            </div>`;
        box.appendChild(row);
        box.scrollTop = box.scrollHeight;
    });

    function uploadFile(input) {
        if (input.files[0]) {
            const reader = new FileReader();
            reader.onload = e => socket.emit('message', {msg: e.target.result, type: 'image'});
            reader.readAsDataURL(input.files[0]);
        }
    }

    async function startCall() {
        document.getElementById('overlay').style.display = 'flex';
        const s = await navigator.mediaDevices.getUserMedia({video: true, audio: true});
        document.getElementById('v-local').srcObject = s;
    }

    function closeCall() {
        document.getElementById('overlay').style.display = 'none';
        const v = document.getElementById('v-local');
        if(v.srcObject) v.srcObject.getTracks().forEach(t => t.stop());
    }

    socket.emit('join', {});
</script>
</body>
</html>
