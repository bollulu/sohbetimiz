<!DOCTYPE html>
<html>
<head>
    <title>Sohbet</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>

<h3>Storyler</h3>
{% for s in stories %}
    <p>{{ s.user }}:
        <img src="/static/stories/{{ s.file }}" width="50">
    </p>
{% endfor %}

<a href="/add-story">+ Story Ekle</a>

<hr>

<div id="chat"></div>

<input id="msg">
<button onclick="send()">Gönder</button>

<script>
const socket = io();
socket.emit("join", {room:"genel"});

socket.on("message", data => {
    document.getElementById("chat").innerHTML +=
        "<p><b>"+data.user+":</b> "+data.msg+"</p>";
});

function send(){
    socket.emit("message", {
        room:"genel",
        msg:document.getElementById("msg").value
    });
    document.getElementById("msg").value="";
}
</script>

</body>
</html>
