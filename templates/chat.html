<!DOCTYPE html>
<html>
<head>
    <title>Süper Sohbet</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        :root { --main-bg: #e5ddd5; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* Sol Menü */
        #sidebar { width: 300px; border-right: 1px solid #ccc; display: flex; flex-direction: column; background: #eee; }
        .user-item { padding: 15px; border-bottom: 1px solid #ddd; cursor: pointer; display: flex; align-items: center; gap: 10px; }
        .user-item:hover { background: #dcf8c6; }
        .avatar-small { width: 35px; height: 35px; border-radius: 50%; object-fit: cover; }

        /* Sağ Sohbet Alanı */
        #chat-main { flex: 1; display: flex; flex-direction: column; position: relative; }
        #top-bar { padding: 10px; background: #ededed; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ccc; }
        
        /* Hikaye Barı */
        #story-bar { height: 90px; background: white; display: flex; align-items: center; padding: 5px; gap: 10px; overflow-x: auto; border-bottom: 1px solid #ddd; }
        .story-circle { width: 60px; height: 60px; border-radius: 50%; border: 2px solid #25d366; padding: 2px; cursor: pointer; }

        #messages { flex: 1; padding: 20px; overflow-y: auto; background-image: url(''); background-size: cover; background-position: center; display: flex; flex-direction: column; gap: 10px; }
        
        /* Mesaj Balonları */
        .msg-box { max-width: 60%; padding: 8px 12px; border-radius: 8px; position: relative; font-size: 14px; }
        .msg-sender { font-weight: bold; font-size: 12px; display: block; margin-bottom: 4px; }
        .msg-me { align-self: flex-end; background: #dcf8c6; }
        .msg-other { align-self: flex-start; background: white; border: 1px solid #ddd; }
        .tick { font-size: 10px; margin-left: 5px; color: #999; }
        .tick.blue { color: #34b7f1; }

        /* Alt Giriş Barı */
        #input-bar { padding: 10px; background: #f0f0f0; display: flex; align-items: center; gap: 10px; }
        #message-input { flex: 1; padding: 10px; border-radius: 20px; border: 1px solid #ddd; }
        
        /* Saat/Tarih */
        #datetime { font-weight: bold; color: #075e54; font-size: 13px; }

        /* Video/Arama */
        #video-container { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: black; z-index: 1000; }
        #localVideo { width: 200px; position: absolute; bottom: 20px; right: 20px; border: 2px solid white; }
        #remoteVideo { width: 100%; height: 100%; }
    </style>
</head>
<body>

<div id="sidebar">
    <div style="padding: 15px; background: #075e54; color: white;">
        <img src="{{ user.avatar }}" class="avatar-small"> <b>{{ user.username }} (Siz)</b>
        <button onclick="location.href='/logout'" style="float:right">Çıkış</button>
    </div>
    <div style="padding: 10px;">
        <button onclick="createGroup()" style="width:100%;">+ Yeni Grup Oluştur</button>
    </div>
    <div id="user-list">
        <div class="user-item" onclick="joinRoom('Genel')"><b>🌍 Genel Sohbet</b></div>
        </div>
</div>

<div id="chat-main">
    <div id="top-bar">
        <span id="current-room-name">Genel Sohbet</span>
        <div style="display: flex; gap: 10px; align-items: center;">
            <button onclick="startCall()">📹 Görüntülü Ara</button>
            <button onclick="document.getElementById('bg-input').click()">🖼️ Arka Plan</button>
            <div id="datetime"></div>
        </div>
    </div>

    <div id="story-bar">
        <div style="text-align:center;" onclick="addStory()">
            <div class="story-circle" style="border: 2px dashed #ccc; display: flex; align-items: center; justify-content: center;">+</div>
            <span style="font-size:10px;">Ekle</span>
        </div>
        <div id="stories-content" style="display:flex; gap:10px;"></div>
    </div>

    <div id="messages"></div>

    <div id="input-bar">
        <input type="file" id="file-input" style="display:none;" onchange="uploadFile(this)">
        <button onclick="document.getElementById('file-input').click()">📎</button>
        <input type="text" id="message-input" placeholder="Bir mesaj yazın...">
        <button id="mic-btn" onmousedown="startRecording()" onmouseup="stopRecording()">🎤</button>
        <button onclick="sendMessage()">Gönder</button>
    </div>
</div>

<input type="file" id="bg-input" style="display:none;" onchange="changeBG(this)">

<script>
    const socket = io();
    let currentRoom = 'Genel';
    const myName = "{{ user.username }}";

    // Saat & Tarih
    setInterval(() => {
        const now = new Date();
        document.getElementById('datetime').innerHTML = now.toLocaleDateString() + " " + now.toLocaleTimeString();
    }, 1000);

    // Oda Katılımı
    function joinRoom(room) {
        currentRoom = room;
        document.getElementById('current-room-name').innerText = room;
        document.getElementById('messages').innerHTML = '';
        socket.emit('join', {room: room});
    }
    joinRoom('Genel');

    // Mesaj Gönderme
    function sendMessage() {
        const input = document.getElementById('message-input');
        if(input.value.trim() !== "") {
            socket.emit('message', {room: currentRoom, content: input.value, type: 'text'});
            input.value = "";
        }
    }

    socket.on('message', data => {
        appendMessage(data);
        if(data.sender !== myName) socket.emit('mark_read', {id: data.id});
    });

    socket.on('load_history', history => {
        history.forEach(m => appendMessage(m));
    });

    function appendMessage(data) {
        const container = document.getElementById('messages');
        const isMe = data.sender === myName;
        const div = document.createElement('div');
        div.className = `msg-box ${isMe ? 'msg-me' : 'msg-other'}`;
        div.id = `msg-${data.id}`;

        let contentHtml = data.content;
        if(data.type === 'image') contentHtml = `<img src="${data.content}" style="max-width:200px; border-radius:5px;">`;
        if(data.type === 'audio') contentHtml = `<audio controls src="${data.content}"></audio>`;
        if(data.type === 'video') contentHtml = `<video src="${data.content}" controls style="max-width:200px;"></video>`;

        div.innerHTML = `
            <div style="display:flex; gap:5px; align-items:center;">
                <img src="${data.avatar}" class="avatar-small" style="width:20px; height:20px;">
                <span class="msg-sender">${data.sender}</span>
            </div>
            ${contentHtml}
            <span style="font-size:10px; display:block; text-align:right; margin-top:5px;">
                ${data.time} 
                <span class="tick ${data.status === 'read' ? 'blue' : ''}" id="tick-${data.id}">${isMe ? (data.status === 'read' ? '✓✓' : '✓') : ''}</span>
            </span>
            ${isMe ? `<span onclick="deleteMsg(${data.id})" style="color:red; cursor:pointer; font-size:10px;">Sil</span>` : ''}
        `;
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
    }

    // Arka Plan Değiştirme
    function changeBG(input) {
        if (input.files && input.files[0]) {
            var reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('messages').style.backgroundImage = `url(${e.target.result})`;
            }
            reader.readAsDataURL(input.files[0]);
        }
    }

    // --- SES KAYDI (Düzeltilmiş Versiyon) ---
    let mediaRecorder;
    let audioChunks = [];

    async function startRecording() {
        audioChunks = [];
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        
        mediaRecorder.ondataavailable = event => {
            if (event.data.size > 0) audioChunks.push(event.data);
        };

        mediaRecorder.onstop = () => {
            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
            const reader = new FileReader();
            reader.readAsDataURL(audioBlob);
            reader.onloadend = () => {
                socket.emit('message', { room: currentRoom, content: reader.result, type: 'audio' });
            };
        };

        mediaRecorder.start();
        document.getElementById('mic-btn').innerText = "🔴";
    }

    function stopRecording() {
        if(mediaRecorder && mediaRecorder.state !== "inactive") {
            mediaRecorder.stop();
            document.getElementById('mic-btn').innerText = "🎤";
        }
    }

    // Grup Oluşturma (Prototip)
    function createGroup() {
        const gName = prompt("Grup adını girin:");
        if(gName) joinRoom(gName);
    }

    // Mesaj Silme
    function deleteMsg(id) {
        if(confirm("Bu mesajı silmek istiyor musunuz?")) socket.emit('delete_msg', {id: id});
    }

    socket.on('msg_deleted', id => {
        const el = document.getElementById(`msg-${id}`);
        if(el) el.remove();
    });

    socket.on('status_updated', data => {
        const tick = document.getElementById(`tick-${data.id}`);
        if(tick) {
            tick.innerHTML = "✓✓";
            tick.classList.add('blue');
        }
    });

</script>
</body>
</html>
