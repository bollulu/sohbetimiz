<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Süper Chat</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>

    <style>
        :root {
            --green: #008069;
            --bg: #e5ddd5;
            --bubble-me: #dcf8c6;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            font-family: Arial, Helvetica, sans-serif;
            background: #d1d7db;
        }

        /* SOL PANEL */
        #sidebar {
            width: 320px;
            background: white;
            border-right: 1px solid #ddd;
            display: flex;
            flex-direction: column;
        }

        .header {
            height: 60px;
            background: #ededed;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
        }

        .my-ava {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }

        /* ORTA PANEL */
        #main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg);
        }

        .top-info {
            height: 60px;
            background: #ededed;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
        }

        /* STORY BAR */
        #story-bar {
            background: white;
            padding: 10px;
            display: flex;
            gap: 15px;
            overflow-x: auto;
            border-bottom: 1px solid #ddd;
        }

        .st-circle {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 2px solid var(--green);
            object-fit: cover;
            cursor: pointer;
        }

        #chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .msg {
            max-width: 65%;
        }

        .msg.me {
            align-self: flex-end;
        }

        .bubble {
            background: white;
            padding: 8px 12px;
            border-radius: 8px;
        }

        .me .bubble {
            background: var(--bubble-me);
        }

        .footer {
            background: #f0f0f0;
            padding: 10px;
            display: flex;
            gap: 10px;
        }

        input[type=text] {
            flex: 1;
            border-radius: 20px;
            border: none;
            padding: 10px;
        }

        /* STORY VIEWER */
        #st-viewer {
            display: none;
            position: fixed;
            inset: 0;
            background: black;
            z-index: 9999;
            flex-direction: column;
        }

        #st-prog {
            display: flex;
            gap: 5px;
            padding: 10px;
        }

        .st-bar {
            flex: 1;
            height: 3px;
            background: #444;
        }

        .st-fill {
            height: 100%;
            width: 0%;
            background: white;
        }
    </style>
</head>

<body>

<!-- DOSYA INPUTLARI -->
<input type="file" id="st-media" hidden accept="image/*,video/*">
<input type="file" id="st-audio" hidden accept="audio/*">

<!-- SOL PANEL -->
<div id="sidebar">
    <div class="header">
        <div style="display:flex;align-items:center;gap:10px;">
            <img src="{{ user.avatar }}" class="my-ava">
            <b>{{ user.username }}</b>
        </div>
        <a href="/logout">🚪</a>
    </div>
</div>

<!-- ORTA PANEL -->
<div id="main">

    <div class="top-info">
        <b>Genel Sohbet</b>
        <span id="clock"></span>
    </div>

    <!-- STORY BAR -->
    <div id="story-bar">
        <div style="text-align:center;" onclick="document.getElementById('st-media').click()">
            <div class="st-circle" style="border:dashed 2px #aaa;display:flex;align-items:center;justify-content:center;">+</div>
            <div style="font-size:11px;">Hikaye</div>
        </div>
        <div id="story-items" style="display:flex;gap:10px;"></div>
    </div>

    <!-- CHAT -->
    <div id="chat-area"></div>

    <div class="footer">
        <input id="mIn" type="text" placeholder="Mesaj yaz..."
               onkeydown="if(event.key==='Enter')send()">
        <button onclick="send()">➤</button>
    </div>
</div>

<!-- STORY VIEWER -->
<div id="st-viewer">
    <div id="st-prog"></div>
    <div style="color:white;padding:10px;">
        <b id="st-user"></b>
        <span id="st-views" style="opacity:.7;font-size:12px"></span>
    </div>

    <div style="flex:1;display:flex;align-items:center;justify-content:center;">
        <img id="st-img" style="max-width:100%;max-height:80vh;display:none">
        <video id="st-vid" style="max-width:100%;max-height:80vh;display:none" autoplay></video>
    </div>

    <button onclick="closeStory()" style="color:white;">Kapat</button>
</div>

<script>
const socket = io();
const myName = "{{ user.username }}";

setInterval(() => {
    document.getElementById('clock').innerText =
        new Date().toLocaleTimeString().slice(0,5);
}, 1000);

/* STORY */
let stories = {};
let curUser = null;
let curIndex = 0;
let timer = null;
let audio = new Audio();

document.getElementById('st-media').onchange = function () {
    const file = this.files[0];
    if (!file) return;
    const type = file.type.includes('video') ? 'video' : 'image';

    if (confirm("Müzik eklensin mi?")) {
        const au = document.getElementById('st-audio');
        au.onchange = () => {
            const r1 = new FileReader();
            const r2 = new FileReader();
            r1.onload = e1 => {
                r2.onload = e2 => {
                    socket.emit('add_story', {
                        content: e1.target.result,
                        music: e2.target.result,
                        type: type
                    });
                };
                r2.readAsDataURL(au.files[0]);
            };
            r1.readAsDataURL(file);
        };
        au.click();
    } else {
        const r = new FileReader();
        r.onload = e => socket.emit('add_story', {
            content: e.target.result,
            music: null,
            type: type
        });
        r.readAsDataURL(file);
    }
};

socket.on('story_list', data => {
    stories = data;
    const bar = document.getElementById('story-items');
    bar.innerHTML = '';
    for (let u in data) {
        bar.innerHTML += `
            <div onclick="openStory('${u}')" style="text-align:center;">
                <img src="${data[u].avatar}" class="st-circle">
                <div style="font-size:11px">${u}</div>
            </div>`;
    }
});

function openStory(u) {
    curUser = u;
    curIndex = 0;
    document.getElementById('st-viewer').style.display = 'flex';
    playStory();
}

function playStory() {
    clearTimeout(timer);
    audio.pause();

    const s = stories[curUser].items[curIndex];
    if (!s) return closeStory();

    document.getElementById('st-user').innerText = curUser;
    document.getElementById('st-views').innerText =
        s.can_delete ? `👁 ${s.viewers.length}` : '';

    const img = document.getElementById('st-img');
    const vid = document.getElementById('st-vid');
    img.style.display = 'none';
    vid.style.display = 'none';

    let dur = 5000;

    if (s.type === 'video') {
        vid.src = s.content;
        vid.style.display = 'block';
        vid.onloadedmetadata = () => startTimer(vid.duration * 1000);
    } else {
        img.src = s.content;
        img.style.display = 'block';
        if (s.music) {
            audio.src = s.music;
            audio.play();
            audio.onloadedmetadata = () => startTimer(audio.duration * 1000);
        } else {
            startTimer(dur);
        }
    }
    socket.emit('view_story', {id: s.id});
}

function startTimer(ms) {
    timer = setTimeout(() => {
        curIndex++;
        playStory();
    }, ms);
}

function closeStory() {
    clearTimeout(timer);
    audio.pause();
    document.getElementById('st-viewer').style.display = 'none';
}
</script>

</body>
</html>
