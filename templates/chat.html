<!DOCTYPE html>
<html>
<head>
    <title>WhatsApp Ultra</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        :root { --green: #075e54; --light-green: #dcf8c6; --blue: #34b7f1; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; height: 100vh; background: #e5ddd5; overflow: hidden; }
        
        /* SOL PANEL: Sadece Kişiler ve Profil */
        #side { width: 300px; background: white; border-right: 1px solid #ddd; display: flex; flex-direction: column; }
        .side-header { padding: 10px; background: #ededed; display: flex; justify-content: space-between; align-items: center; }
        
        /* ORTA PANEL: Hikayeler ve Mesajlar */
        #main { flex: 1; display: flex; flex-direction: column; position: relative; }
        
        /* İSTEDİĞİN YER: Orta barın üstündeki hikaye şeridi */
        #story-top-bar { 
            height: 90px; background: white; border-bottom: 1px solid #ddd; 
            display: flex; align-items: center; gap: 15px; padding: 0 15px; overflow-x: auto;
        }
        .st-container { text-align: center; min-width: 65px; cursor: pointer; position: relative; }
        .st-img { width: 50px; height: 50px; border-radius: 50%; border: 3px solid #25D366; object-fit: cover; }
        .add-icon { position: absolute; bottom: 20px; right: 8px; background: #25D366; color: white; border-radius: 50%; width: 18px; height: 18px; font-size: 14px; border: 2px solid white; display: flex; align-items: center; justify-content: center; }

        /* Mesaj Kutuları */
        #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .msg { display: flex; align-items: flex-end; gap: 8px; max-width: 70%; }
        .msg.me { align-self: flex-end; flex-direction: row-reverse; }
        .bubble { padding: 8px 12px; border-radius: 12px; font-size: 14px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); position: relative; }
        .me .bubble { background: var(--light-green); }
        .not-me .bubble { background: white; }
        .avatar-chat { width: 25px; height: 25px; border-radius: 50%; object-fit: cover; }
        .tick { font-size: 11px; margin-left: 5px; color: var(--blue); font-weight: bold; }

        #overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:9999; flex-direction:column; align-items:center; justify-content:center; }
    </style>
</head>
<body>

<div id="side">
    <div class="side-header">
        <img src="{{ user.avatar }}" id="my-avatar" onclick="document.getElementById('pIn').click()" style="width:40px; height:40px; border-radius:50%; cursor:pointer; object-fit:cover;">
        <div style="display:flex; gap:10px;">
            <span onclick="startVideo()" style="cursor:pointer; font-size:20px;">📞</span>
            <a href="{{ url_for('logout') }}" style="text-decoration:none;">🚪</a>
        </div>
    </div>
    <div id="online-list" style="padding:10px;">
        <h4 style="margin:5px 0;">Çevrimiçi</h4>
        <div id="users-div"></div>
    </div>
</div>

<div id="main">
    <div id="story-top-bar">
        <div class="st-container" onclick="document.getElementById('sIn').click()">
            <img src="{{ user.avatar }}" class="st-img" style="border-color:#ccc">
            <div class="add-icon">+</div>
            <div style="font-size:11px;">Siz</div>
        </div>
        <div id="others-st" style="display:flex; gap:15px;"></div>
    </div>

    <div id="chat-box"></div>

    <div style="padding:15px; background:#f0f0f0; display:flex; gap:12px; align-items:center;">
        <span onclick="document.getElementById('fIn').click()" style="cursor:pointer;">📎</span>
        <span id="mic" onmousedown="startAudio()" onmouseup="stopAudio()" style="cursor:pointer;">🎤</span>
        <input type="text" id="mIn" style="flex:1; padding:10px; border-radius:20px; border:none;" placeholder="Mesaj yaz..." onkeydown="if(event.key==='Enter') sendText()">
        <button onclick="sendText()" style="border:none; background:none; color:var(--green); font-size:20px;">➤</button>
    </div>
</div>

<input type="file" id="pIn" style="display:none" onchange="uploadFile(this, 'profile')">
<input type="file" id="sIn" style="display:none" onchange="uploadFile(this, 'story')">
<input type="file" id="fIn" style="display:none" onchange="uploadFile(this, 'chat')">

<div id="overlay">
    <div id="story-content" style="text-align:center;"></div>
    <video id="v-remote" autoplay playsinline style="width:80%; max-width:500px; display:none;"></video>
    <video id="v-local" autoplay muted playsinline style="width:120px; border:2px solid white; display:none; margin-top:10px;"></video>
    <button onclick="closeOverlay()" style="margin-top:20px; padding:10px 20px; background:red; color:white; border:none; border-radius:5px;">Kapat</button>
</div>

<script>
    const socket = io();
    const myName = "{{ user.username }}";
    let mediaRec, chunks = [];

    // PROFIL GÜNCELLEME (Hemen çalışması için düzeltildi)
    function uploadFile(input, mode) {
        if (!input.files[0]) return;
        const reader = new FileReader();
        reader.onload = e => {
            const data = e.target.result;
            if(mode === 'profile') {
                socket.emit('update_profile', {avatar: data});
                document.getElementById('my-avatar').src = data;
                // Hikaye barındaki resmi de güncelle
                document.querySelector('.st-container img').src = data;
            } else if(mode === 'story') {
                socket.emit('add_story', {image: data});
            } else {
                socket.emit('message', {msg: data, type: 'image'});
            }
        };
        reader.readAsDataURL(input.files[0]);
    }

    // HİKAYE LİSTESİ VE ÇOKLU GEÇİŞ
    socket.on('story_list', data => {
        const div = document.getElementById('others-st');
        div.innerHTML = '';
        for(let user in data) {
            if(user === myName) continue;
            const st = document.createElement('div');
            st.className = 'st-container';
            st.onclick = () => viewStories(data[user].items, user);
            st.innerHTML = `<img src="${data[user].avatar}" class="st-img"> <div style="font-size:11px;">${user}</div>`;
            div.appendChild(st);
        }
    });

    function viewStories(items, user) {
        let i = 0;
        const overlay = document.getElementById('overlay');
        const content = document.getElementById('story-content');
        overlay.style.display = 'flex';
        const show = () => {
            content.innerHTML = `<img src="${items[i].content}" style="max-width:90%; max-height:80vh;">
                                 <p style="color:white;">${user} (${i+1}/${items.length})</p>
                                 ${user === myName ? `<button onclick="socket.emit('delete_story',{id:${items[i].id}}); closeOverlay();">SİL</button>` : ''}`;
        };
        show();
        content.onclick = () => { i++; if(i < items.length) show(); else closeOverlay(); };
    }

    // MESAJLAŞMA VE SİLME
    function sendText() {
        const i = document.getElementById('mIn');
        if(i.value.trim()) { socket.emit('message', {msg: i.value, type: 'text'}); i.value=''; }
    }

    socket.on('message', d => {
        const box = document.getElementById('chat-box');
        const isMe = d.user === myName;
        const row = document.createElement('div');
        row.className = `msg ${isMe ? 'me' : ''}`;
        row.id = `msg-${d.id}`;
        row.innerHTML = `
            <img src="${d.avatar}" class="avatar-chat">
            <div class="bubble">
                <div style="font-size:10px; font-weight:bold; color:var(--green);">${isMe ? 'Siz' : d.user}</div>
                ${d.type==='image' ? `<img src="${d.msg}" style="max-width:200px;">` : d.msg}
                <div style="text-align:right;">
                    <span style="font-size:9px; color:#999;">${d.time}</span>
                    ${isMe ? `<span class="tick">✓✓</span>` : ''}
                    ${isMe ? `<span onclick="socket.emit('delete_message',{id:${d.id}})" style="cursor:pointer; color:red; font-size:10px; margin-left:5px;">SİL</span>` : ''}
                </div>
            </div>`;
        box.appendChild(row);
        box.scrollTop = box.scrollHeight;
    });

    socket.on('msg_deleted', d => document.getElementById(`msg-${d.id}`)?.remove());
    socket.on('update_user_list', u => {
        const d = document.getElementById('users-div'); d.innerHTML = '';
        for(let name in u) d.innerHTML += `<div style="padding:5px;">● ${name===myName ? '<b>Siz</b>' : name}</div>`;
    });

    function closeOverlay() { document.getElementById('overlay').style.display = 'none'; }
    socket.emit('join', {});
</script>
</body>
</html>
