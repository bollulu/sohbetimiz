<!DOCTYPE html>
<html>
<head>
    <title>Sohbetimiz</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        body { margin: 0; font-family: sans-serif; display: flex; height: 100vh; background: #e5ddd5; }
        #sidebar { width: 350px; background: white; border-right: 1px solid #ddd; display: flex; flex-direction: column; }
        #main { flex: 1; display: flex; flex-direction: column; }
        .header { background: #ededed; padding: 10px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #ddd; }
        .ava { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; }
        #story-bar { height: 100px; background: white; display: flex; align-items: center; padding: 0 10px; gap: 10px; overflow-x: auto; border-bottom: 1px solid #eee; }
        .st-circle { min-width: 60px; height: 60px; border-radius: 50%; border: 3px solid #25d366; cursor: pointer; }
        #messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 8px 12px; border-radius: 10px; background: white; max-width: 70%; align-self: flex-start; }
        .me { align-self: flex-end; background: #dcf8c6; }
        .input-area { background: #f0f0f0; padding: 10px; display: flex; gap: 10px; align-items: center; }
        input[type="text"] { flex: 1; padding: 10px; border-radius: 20px; border: none; }
        #video-modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:black; z-index:999; }
    </style>
</head>
<body>

<div id="sidebar">
    <div class="header">
        <img src="{{ user.avatar }}" class="ava">
        <b>{{ user.username }}</b>
    </div>
    <div id="story-bar">
        <button onclick="document.getElementById('st-in').click()" style="width:60px; height:60px; border-radius:50%;">+</button>
        <div id="stories-area" style="display:flex; gap:10px;"></div>
    </div>
    <div id="user-list" style="flex:1; overflow-y:auto;"></div>
</div>

<div id="main">
    <div class="header" id="chat-header" style="display:none;">
        <img src="" id="target-ava" class="ava">
        <b id="target-name">...</b>
        <button onclick="startCall()">📹</button>
    </div>
    <div id="messages"></div>
    <div class="input-area">
        <button onclick="document.getElementById('file-in').click()">📎</button>
        <button id="mic-btn" onmousedown="startMic()" onmouseup="stopMic()">🎤</button>
        <input type="text" id="msg-in" placeholder="Mesaj yaz..." onkeypress="if(event.key==='Enter') send()">
        <button onclick="send()">Gönder</button>
    </div>
</div>

<div id="video-modal">
    <video id="local" autoplay muted style="position:absolute; right:20px; top:20px; width:150px; border:2px solid white;"></video>
    <video id="remote" autoplay style="width:100%; height:100%;"></video>
    <button onclick="location.reload()" style="position:absolute; bottom:20px; left:50%; background:red; color:white;">Kapat</button>
</div>

<input type="file" id="st-in" style="display:none" onchange="upStory(this)">
<input type="file" id="file-in" style="display:none" onchange="upFile(this)">

<script>
    const socket = io();
    const me = "{{ user.username }}";
    let currentRoom = "";

    // Mesaj Gönder
    function send() {
        const m = document.getElementById('msg-in').value;
        if(m) { socket.emit('send_message', {room: currentRoom, msg: m, type: 'text'}); document.getElementById('msg-in').value = ""; }
    }

    socket.on('new_message', d => {
        if(d.room === currentRoom) {
            const area = document.getElementById('messages');
            let content = d.type === 'text' ? d.content : (d.type === 'image' ? `<img src="${d.content}" width="200">` : `<audio src="${d.content}" controls></audio>`);
            area.innerHTML += `<div class="msg ${d.sender === me ? 'me' : ''}"><b>${d.sender}:</b><br>${content}</div>`;
            area.scrollTop = area.scrollHeight;
        }
    });

    // Sesli Mesaj
    let rec;
    async function startMic() {
        const s = await navigator.mediaDevices.getUserMedia({audio:true});
        rec = new MediaRecorder(s);
        let chunks = [];
        rec.ondataavailable = e => chunks.push(e.data);
        rec.onstop = () => {
            const b = new Blob(chunks);
            const r = new FileReader(); r.onload=e=>socket.emit('send_message',{room:currentRoom, msg:e.target.result, type:'audio'});
            r.readAsDataURL(b);
        };
        rec.start();
        document.getElementById('mic-btn').style.color = 'red';
    }
    function stopMic() { if(rec) { rec.stop(); document.getElementById('mic-btn').style.color = 'black'; } }

    // Hikaye Yükle
    function upStory(i) {
        const f = i.files[0];
        const r = new FileReader();
        r.onload = e => socket.emit('post_story', {content: e.target.result, type: f.type.split('/')[0]});
        r.readAsDataURL(f);
    }

    // Video Arama (Basit Aç-Kapat)
    async function startCall() {
        document.getElementById('video-modal').style.display = 'block';
        const s = await navigator.mediaDevices.getUserMedia({video:true, audio:true});
        document.getElementById('local').srcObject = s;
    }

    // Dosya Yükle
    function upFile(i) {
        const f = i.files[0];
        const r = new FileReader();
        r.onload = e => socket.emit('send_message', {room: currentRoom, msg: e.target.result, type: f.type.split('/')[0]});
        r.readAsDataURL(f);
    }

    // Oda Katılım (Sadece örnek veri ile kullanıcı listesi oluşturulmalıdır)
    socket.emit('join', {room: 'genel'}); // Örnek olarak genel oda
    currentRoom = 'genel';
</script>
</body>
</html>
