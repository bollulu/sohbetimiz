<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Sohbet</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>

<style>
body{margin:0;font-family:Arial;background:#e5ddd5;height:100vh;display:flex}
#groups{width:220px;background:white;border-right:1px solid #ccc}
#groups h3{margin:10px}
.group{padding:10px;cursor:pointer}
.group:hover{background:#f0f0f0}
#main{flex:1;display:flex;flex-direction:column}
#top{background:#075e54;color:white;padding:10px;display:flex;align-items:center;gap:10px}
#chat{flex:1;overflow:auto;padding:10px}
.msg{background:white;padding:6px 10px;margin:5px;border-radius:8px;max-width:70%;position:relative}
.me{background:#dcf8c6;margin-left:auto}
.del{position:absolute;right:5px;top:2px;cursor:pointer;font-size:12px;color:red}
#bar{display:flex;padding:10px;background:#f0f0f0}
#bar input{flex:1;padding:10px;border-radius:20px;border:none}
</style>
</head>

<body>

<div id="groups">
<h3>Gruplar</h3>
{% for g in groups %}
<div class="group" onclick="switchRoom('{{ g }}')">{{ g }}</div>
{% endfor %}
<button onclick="newGroup()" style="margin:10px">+ Grup</button>
</div>

<div id="main">
<div id="top">
<img src="{{ user.avatar }}" width="35" style="border-radius:50%">
<b id="roomName">genel</b>
</div>

<div id="chat"></div>

<div id="bar">
<input id="msg" placeholder="Mesaj yaz" onkeydown="if(event.key==='Enter')sendMsg()">
<button onclick="sendMsg()">➤</button>
</div>
</div>

<script>
const socket = io();
let room="genel";
const myName="{{ user.username }}";

socket.emit("join_room",{room});

function switchRoom(r){
    room=r;
    roomName.innerText=r;
    chat.innerHTML="";
    socket.emit("join_room",{room});
}

function sendMsg(){
    if(msg.value){
        socket.emit("send_msg",{room,msg:msg.value});
        msg.value="";
    }
}

socket.on("history",msgs=>msgs.forEach(add));
socket.on("new_msg",add);
socket.on("msg_deleted",d=>{
    const el=document.getElementById("m"+d.id);
    if(el) el.remove();
});

function add(d){
    const m=document.createElement("div");
    m.className="msg "+(d.user===myName?"me":"");
    m.id="m"+d.id;
    m.innerHTML=d.user+": "+d.msg;
    if(d.user===myName){
        const x=document.createElement("span");
        x.innerText="🗑";
        x.className="del";
        x.onclick=()=>socket.emit("delete_msg",{id:d.id});
        m.appendChild(x);
    }
    chat.appendChild(m);
    chat.scrollTop=99999;
}

function newGroup(){
    const n=prompt("Grup adı");
    if(n) socket.emit("create_group",{name:n});
}

socket.on("groups",list=>{
    location.reload();
});
</script>

</body>
</html>
