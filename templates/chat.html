<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Chat Pro v6</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        :root { --main: #075e54; --me: #dcf8c6; }
        body { font-family: sans-serif; margin: 0; display: flex; height: 100vh; background: #e5ddd5; }
        .sidebar { width: 280px; background: #fff; border-right: 1px solid #ddd; display: flex; flex-direction: column; }
        .chat-area { flex: 1; display: flex; flex-direction: column; }
        #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; }
        .msg-row { display: flex; gap: 10px; margin-bottom: 12px; max-width: 85%; }
        .msg-row.me { align-self: flex-end; flex-direction: row-reverse; }
        .msg-bubble { padding: 8px 12px; border-radius: 10px; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,0.1); position: relative; min-width: 60px; }
        .me .msg-bubble { background: var(--me); }
        .avatar { width: 35px; height: 35px; border-radius: 50%; object-fit: cover; background: #ccc; }
        .room-btn { width: 100%; padding: 12px; border: none; background: #f8f8f8; cursor: pointer; border-bottom: 1px solid #eee; text-align: left; }
        .room-btn.active { background: var(--main); color: white; }
        .del-btn { color: red; font-size: 10px; cursor: pointer; float: right; margin-top: 5px; font-weight: bold; }
        .user-item { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .online-dot { width: 8px; height: 8px; background: #2ecc71; border-radius: 50%; }
    </style>
</head>
<body>
    <audio id="notifSound" src="https://assets.mixkit.co/active_storage/sfx/2358/2358-preview.mp3"></audio>

    <div class="sidebar">
        <div style="padding:20px; background: var(--main); color:white; text-align:center;">
            <img src="{{ user.avatar or 'https://cdn-icons-png.flaticon.com/512/149/149071.png' }}" id="myAvDisplay" class="avatar" style="width:60px; height:60px; cursor:pointer;" onclick="$('#avInput').click()">
            <div style="margin-top:5px;">@{{ user.username }}</div>
            <input type="file" id="avInput" style="display:none" accept="image/*">
        </div>
        <div style="background:#eee; padding:8px; font-size:11px;">GRUPLAR</div>
        <button class="room-btn active" onclick="changeRoom('Genel')">📢 Genel Sohbet</button>
        <button class="room-btn" onclick="changeRoom('Yazılım')">💻 Yazılım Grubu</button>
        <button class="room-btn" onclick="changeRoom('Özel-1', '1234')">🔒 Özel Oda (1234)</button>
        
        <div style="background:#eee; padding:8px; font-size:11px; margin-top:10px;">ODADAKİLER</div>
        <div id="user-list" style="padding:10px; flex:1; overflow-y:auto;"></div>
        
        <a href="/logout" style="padding:15px; color:red; text-decoration:none; border-top:1px solid #eee; text-align:center;">Çıkış Yap</a>
    </div>

    <div class="chat-area">
        <div id="room-title" style="padding:15px; background:#fff; font-weight:bold; border-bottom:1px solid #ddd;">Oda: Genel</div>
        <div id="chat-box"></div>
        <div style="padding:15px; background:#f0f2f5; display:flex; gap:10px;">
            <input type="text" id="msgIn" style="flex:1; padding:12px; border-radius:20px; border:1px solid #ddd;" placeholder="Mesaj yazın...">
            <button onclick="send()" style="padding:10px 20px; border-radius:20px; border:none; background:var(--main); color:white; cursor:pointer;">Gönder</button>
        </div>
    </div>

    <script>
        var socket = io();
        var myUser = "{{ user.username }}";
        var currentRoom = "Genel";
        var defAv = 'https://cdn-icons-png.flaticon.com/512/149/149071.png';

        function changeRoom(name, pass = '') {
            if(name == currentRoom) return;
            currentRoom = name;
            $('#room-title').text("Oda: " + name);
            $('.room-btn').removeClass('active');
            $(event.target).addClass('active');
            $('#chat-box').empty();
            socket.emit('join', {room: name, password: pass});
        }

        socket.emit('join', {room: 'Genel'});

        function send() {
            let m = $('#msgIn').val();
            if(m.trim()) { socket.emit('message', {msg: m}); $('#msgIn').val(''); }
        }

        function delM(id) { if(confirm("Mesaj silinsin mi?")) socket.emit('delete_message', {id: id}); }

        function addMessage(d, isHistory = false) {
            let isMe = d.user == myUser;
            if(!isMe && !isHistory) {
                document.getElementById('notifSound').play().catch(()=>{});
            }
            
            let html = `
            <div class="msg-row ${isMe?'me':''}" id="m-${d.id}">
                <img src="${d.avatar || defAv}" class="avatar">
                <div class="msg-bubble">
                    <small style="color:var(--main)"><b>${d.user}</b></small>
                    <div style="margin: 3px 0;">${d.msg}</div>
                    <small style="color:gray; font-size:9px;">${d.time}</small>
                    ${isMe ? `<span class="del-btn" onclick="delM('${d.id}')">Sil</span>` : ''}
                </div>
            </div>`;
            $('#chat-box').append(html);
            $('#chat-box').scrollTop($('#chat-box')[0].scrollHeight);
        }

        socket.on('message', d => addMessage(d));
        socket.on('history', data => data.forEach(d => addMessage(d, true)));
        socket.on('remove_message', d => $(`#m-${d.id}`).fadeOut(200, function(){ $(this).remove(); }));
        
        socket.on('user_list', list => {
            let html = '';
            list.forEach(u => {
                html += `<div class="user-item">
                    <div class="online-dot"></div>
                    <img src="${u.avatar || defAv}" class="avatar" style="width:20px; height:20px;">
                    <span style="font-size:13px;">${u.name}</span>
                </div>`;
            });
            $('#user-list').html(html);
        });

        $('#avInput').change(function(e) {
            let r = new FileReader();
            r.onload = ev => { 
                socket.emit('update_avatar', {img: ev.target.result});
                $('#myAvDisplay').attr('src', ev.target.result);
            };
            r.readAsDataURL(e.target.files[0]);
        });

        socket.on('error', d => { alert(d.msg); location.reload(); });
        $('#msgIn').keypress(e => { if(e.which==13) send(); });
    </script>
</body>
</html>
