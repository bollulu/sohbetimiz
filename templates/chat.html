<!DOCTYPE html>
<html>
<head>
    <title>Sohbetimiz</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        :root { --main: #075e54; --light: #25d366; --bg: #e5ddd5; }
        body { margin: 0; font-family: sans-serif; display: flex; height: 100vh; background: #f0f2f5; }
        #sidebar { width: 350px; background: #fff; border-right: 1px solid #ddd; display: flex; flex-direction: column; }
        #chat-area { flex: 1; display: flex; flex-direction: column; background: var(--bg); position: relative; }
        
        /* Story Bar */
        #story-bar { height: 100px; background: white; border-bottom: 1px solid #ddd; display: flex; align-items: center; padding: 0 15px; gap: 15px; overflow-x: auto; }
        .story-circle { width: 60px; height: 60px; border-radius: 50%; border: 3px solid var(--light); padding: 2px; cursor: pointer; object-fit: cover; }
        .add-story { border: 2px dashed #ccc; display: flex; align-items: center; justify-content: center; font-size: 24px; color: #aaa; }

        /* Mesajlar */
        #messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .bubble { max-width: 60%; padding: 8px 12px; border-radius: 8px; font-size: 14px; position: relative; }
        .me { align-self: flex-end; background: #dcf8c6; }
        .other { align-self: flex-start; background: #fff; }

        /* Story Player */
        #story-modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:9999; flex-direction:column; align-items:center; justify-content:center; }
        .st-frame { width: 90%; max-width: 400px; height: 80vh; background: #000; position: relative; border-radius: 10px; overflow: hidden; }
        .viewer-list { position: absolute; bottom: 0; width: 100%; background: rgba(0,0,0,0.7); color: white; padding: 10px; font-size: 12px; }
    </style>
</head>
<body>

<div id="sidebar">
    <div style="padding:15px; background:#ededed; display:flex; justify-content:space-between; align-items:center;">
        <img src="{{ user.avatar }}" style="width:40px; height:40px; border-radius:50%; cursor:pointer;" onclick="document.getElementById('ava-in').click()">
        <b>{{ user.username }}</b>
        <a href="/logout">Çıkış</a>
    </div>
    <div style="overflow-y:auto; flex:1;">
        <div style="padding:10px; background:#f0f2f5; font-size:12px; font-weight:bold;">KİŞİLER</div>
        {% for u in all_users if u.username != user.username %}
        <div style="padding:10px; display:flex; align-items:center; gap:10px; cursor:pointer;" onclick="setPrivate('{{u.username}}')">
            <img src="{{u.avatar}}" style="width:40px; height:40px; border-radius:50%">
            <span>{{u.username}}</span>
        </div>
        {% endfor %}
    </div>
</div>

<div id="chat-area">
    <div id="story-bar">
        <div class="story-circle add-story" onclick="document.getElementById('st-in').click()">+</div>
        {% for owner, items in stories.items() %}
        <div onclick='openStories({{ items | tojson }}, "{{ owner }}")'>
            <img src="{{ items[0].avatar }}" class="story-circle">
            <center><small>{{ owner }}</small></center>
        </div>
        {% endfor %}
    </div>
    <div id="messages"></div>
    <div style="padding:15px; background:#f0f0f0; display:flex; gap:10px;">
        <input type="text" id="m-in" style="flex:1; padding:10px; border-radius:20px; border:none;" placeholder="Mesaj yazın..." onkeypress="if(event.key==='Enter') send()">
        <button onclick="send()" style="background:var(--main); color:white; border:none; padding:10px 20px; border-radius:20px;">Gönder</button>
    </div>
</div>

<div id="story-modal">
    <button onclick="closeStory()" style="position:absolute; top:20px; right:20px; color:white; font-size:30px; background:none; border:none;">✕</button>
    <div class="st-frame">
        <div id="st-media-box" style="height:100%;" onclick="nextStory()"></div>
        <div id="st-viewers" class="viewer-list"></div>
    </div>
    <div id="st-music" style="color:var(--light); margin-top:10px;"></div>
    <button id="st-del" style="display:none; color:red; margin-top:10px;" onclick="delStory()">Bu Hikayeyi Sil</button>
</div>

<input type="file" id="st-in" style="display:none" onchange="uploadStory(this)">
<input type="file" id="ava-in" style="display:none" onchange="updateAva(this)">



<script>
    const socket = io();
    const me = "{{ user.username }}";
    let currentRoom = 'Genel';
    let activeStories = [];
    let storyIdx = 0;

    function setPrivate(other) {
        currentRoom = [me, other].sort().join('_');
        document.getElementById('messages').innerHTML = '';
        socket.emit('join', {room: currentRoom});
    }

    function send() {
        const i = document.getElementById('m-in');
        if(i.value) {
            socket.emit('message', {room: currentRoom, content: i.value, type: 'text'});
            i.value = '';
        }
    }

    socket.on('message', data => { if(data.room === currentRoom) append(data); });
    socket.on('load_history', h => h.forEach(append));
    socket.on('refresh_all', () => location.reload());

    function append(d) {
        const box = document.getElementById('messages');
        const div = document.createElement('div');
        div.className = `bubble ${d.sender === me ? 'me' : 'other'}`;
        div.innerHTML = `<b>${d.sender}</b><br>${d.content}<br><small style="font-size:9px">${d.time}</small>`;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    // STORY LOGIC
    function uploadStory(input) {
        const r = new FileReader();
        r.onload = e => {
            const music = prompt("Müzik adı (İstemiyorsanız boş bırakın):");
            const type = input.files[0].type.startsWith('video') ? 'video' : 'image';
            socket.emit('post_story', {content: e.target.result, type: type, music: music});
        };
        r.readAsDataURL(input.files[0]);
    }

    function openStories(list, owner) {
        activeStories = list; storyIdx = 0;
        document.getElementById('story-modal').style.display = 'flex';
        showStory();
    }

    function showStory() {
        const s = activeStories[storyIdx];
        const box = document.getElementById('st-media-box');
        const vBox = document.getElementById('st-viewers');
        
        box.innerHTML = s.type === 'image' ? `<img src="${s.content}" style="width:100%; height:100%; object-fit:contain">` : `<video src="${s.content}" autoplay style="width:100%; height:100%;"></video>`;
        document.getElementById('st-music').innerText = s.music ? "🎵 Müzik: " + s.music : "";
        document.getElementById('st-del').style.display = (activeStories[0].username === me || s.username === me) ? "block" : "none";
        
        // İzleyenleri Göster
        vBox.innerHTML = "👁️ İzleyenler: " + (s.viewers.length > 0 ? s.viewers.join(', ') : "Henüz kimse görmedi");
        
        // İzledi olarak işaretle
        socket.emit('mark_story_watched', {story_id: s.id});
    }

    function nextStory() {
        storyIdx++;
        if(storyIdx < activeStories.length) showStory();
        else closeStory();
    }

    function closeStory() { document.getElementById('story-modal').style.display = 'none'; }
    function delStory() { socket.emit('delete_story', {id: activeStories[storyIdx].id}); }
    function updateAva(i) {
        const r = new FileReader();
        r.onload = e => socket.emit('update_avatar', {avatar: e.target.result});
        r.readAsDataURL(i.files[0]);
    }
</script>
</body>
</html>
