<!DOCTYPE html>
<html>
<head>
    <title>Ultra Sohbet 2026</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        :root { --wa-green: #075e54; --wa-light: #dcf8c6; --bg: #e5ddd5; --tick-blue: #34b7f1; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; height: 100vh; background: var(--bg); overflow: hidden; }
        
        #side-panel { width: 320px; background: white; border-right: 1px solid #ddd; display: flex; flex-direction: column; }
        
        /* HİKAYE BARI TASARIMI */
        #story-bar { display: flex; padding: 15px 10px; gap: 15px; overflow-x: auto; background: white; border-bottom: 1px solid #eee; align-items: center; }
        .story-container { display: flex; flex-direction: column; align-items: center; min-width: 65px; position: relative; cursor: pointer; }
        .story-circle { width: 56px; height: 56px; border-radius: 50%; border: 3px solid #25D366; object-fit: cover; padding: 2px; }
        .story-name { font-size: 11px; margin-top: 5px; color: #555; max-width: 65px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        
        /* EKLE (+) BUTONU */
        .add-story-btn { position: absolute; bottom: 18px; right: 5px; width: 20px; height: 20px; background: #25D366; border-radius: 50%; border: 2px solid white; color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; }

        #main-chat { flex: 1; display: flex; flex-direction: column; }
        #chat-area { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg-wrap { display: flex; align-items: flex-end; gap: 8px; max-width: 80%; }
        .sent-wrap { align-self: flex-end; flex-direction: row-reverse; }
        .avatar-chat { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
        .msg { padding: 8px 12px; border-radius: 12px; font-size: 14px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .sent { background: var(--wa-light); }
        .received { background: white; }
        .tick { font-size: 12px; margin-left: 4px; color: #999; }
        .read { color: var(--tick-blue) !important; }

        /* HİKAYE MODAL */
        #story-modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:#000; z-index:10000; flex-direction:column; align-items:center; justify-content:center; }
        #story-content-box { position: relative; width: 100%; max-width: 450px; height: 80%; display: flex; align-items: center; justify-content: center; }
        #story-img { max-width: 100%; max-height: 100%; border-radius: 8px; }
        .viewer-list { position: absolute; bottom: -60px; color: white; font-size: 13px; text-align: center; width: 100%; }
        .close-story { position: absolute; top: 20px; right: 20px; color: white; font-size: 30px; cursor: pointer; }
    </style>
</head>
<body>

<div id="side-panel">
    <div style="padding:15px; background:var(--wa-green); color:white; display:flex; justify-content:space-between; align-items:center;">
        <b>Sohbetler</b>
        <img src="{{ user.avatar }}" id="top-avatar" style="width:35px; height:35px; border-radius:50%; cursor:pointer;" onclick="document.getElementById('pIn').click()">
        <input type="file" id="pIn" style="display:none" onchange="changeProfile(this)" accept="image/*">
    </div>

    <div id="story-bar">
        <div class="story-container" onclick="document.getElementById('storyIn').click()">
            <img src="{{ user.avatar }}" class="story-circle" style="border-color: #ccc;">
            <div class="add-story-btn">+</div>
            <span class="story-name">Siz</span>
            <input type="file" id="storyIn" style="display:none" onchange="addStory(this)" accept="image/*">
        </div>
        <div id="other-stories" style="display:flex; gap:15px;"></div>
    </div>

    <div id="user-list" style="overflow-y:auto; flex:1;"></div>
</div>

<div id="main-chat">
    <div id="chat-area"></div>
    <div style="background:#f0f0f0; padding:12px; display:flex; align-items:center; gap:10px;">
        <button onclick="document.getElementById('fIn').click()" style="border:none; background:none; font-size:22px; cursor:pointer;">📁</button>
        <input type="file" id="fIn" style="display:none" onchange="upMedia(this)" accept="image/*">
        <input type="text" id="mIn" style="flex:1; padding:12px; border-radius:25px; border:none;" placeholder="Mesaj yaz..." onkeydown="if(event.key==='Enter') sendMsg()">
        <button onclick="sendMsg()" style="border:none; background:none; font-size:26px; cursor:pointer; color:var(--wa-green);">➤</button>
    </div>
</div>

<div id="story-modal">
    <span class="close-story" onclick="closeStory()">&times;</span>
    <div id="story-content-box">
        <img id="story-img" src="">
        <div class="viewer-list">
            <b id="owner-label"></b><br>
            👀 <span id="viewer-names">Kimse yok</span>
        </div>
    </div>
</div>

<script>
    const socket = io();
    const myName = "{{ user.username }}";
    let currentRoom = "Genel";

    // --- HİKAYE SİSTEMİ ---
    function addStory(input) {
        if(input.files[0]) {
            const r = new FileReader();
            r.onload = e => socket.emit('add_story', {image: e.target.result});
            r.readAsDataURL(input.files[0]);
        }
    }

    function showStory(stories, owner) {
        const s = stories[stories.length - 1]; // Son hikayeyi göster
        document.getElementById('story-img').src = s.content;
        document.getElementById('owner-label').innerText = (owner === myName ? "Siz" : owner) + " adlı kişinin hikayesi";
        
        const views = s.views.map(v => v === myName ? "Siz" : v);
        document.getElementById('viewer-names').innerHTML = views.length > 0 ? views.join(', ') : "Henüz kimse görmedi";
        
        document.getElementById('story-modal').style.display = 'flex';
        if(owner !== myName) socket.emit('view_story', {story_id: s.id});
    }

    function closeStory() {
        document.getElementById('story-modal').style.display = 'none';
    }

    socket.on('story_list', data => {
        const otherStories = document.getElementById('other-stories');
        otherStories.innerHTML = '';
        for(let user in data) {
            if(user === myName) continue; // Kendi hikayeni sadece "+" kısmından gör
            const container = document.createElement('div');
            container.className = 'story-container';
            container.onclick = () => showStory(data[user].stories, user);
            container.innerHTML = `
                <img src="${data[user].avatar}" class="story-circle">
                <span class="story-name">${user}</span>
            `;
            otherStories.appendChild(container);
        }
    });

    // --- MESAJLAŞMA ---
    function sendMsg() {
        const i = document.getElementById('mIn');
        if(i.value.trim()) { socket.emit('message', {msg: i.value, type:'text', room:currentRoom}); i.value=''; }
    }

    function addMsg(d) {
        const area = document.getElementById('chat-area');
        const isMe = d.user === myName;
        const displayName = isMe ? "Siz" : d.user;
        const wrap = document.createElement('div');
        wrap.className = `msg-wrap ${isMe ? 'sent-wrap' : ''}`;
        
        let content = d.msg;
        if(d.type === 'image') content = `<img src="${d.msg}" style="max-width:230px; border-radius:10px;">`;

        wrap.innerHTML = `
            <img src="${d.avatar}" class="avatar-chat">
            <div class="msg ${isMe ? 'sent' : 'received'}">
                <div style="font-size:11px; font-weight:bold; color:var(--wa-green); margin-bottom:3px;">${displayName}</div>
                ${content}
                <div style="text-align:right; font-size:9px; color:#999; margin-top:4px;">${d.time} ${isMe ? `<span class="tick ${d.is_read ? 'read' : ''}">${d.is_read ? '✓✓' : '✓'}</span>` : ''}</div>
            </div>`;
        area.appendChild(wrap); area.scrollTop = area.scrollHeight;
    }

    function upMedia(input) {
        const r = new FileReader();
        r.onload = e => socket.emit('message', {msg: e.target.result, type: 'image', room: currentRoom});
        r.readAsDataURL(input.files[0]);
    }

    socket.on('message', d => addMsg(d));
    socket.on('history', h => { document.getElementById('chat-area').innerHTML=''; h.forEach(addMsg); });
    socket.on('user_list', users => {
        const list = document.getElementById('user-list'); list.innerHTML = '';
        for(let u in users) {
            list.innerHTML += `<div style="padding:12px; border-bottom:1px solid #eee; display:flex; align-items:center; gap:10px;">
                <img src="${users[u]}" style="width:40px; height:40px; border-radius:50%;">
                <b>${u === myName ? u + ' (Siz)' : u}</b>
            </div>`;
        }
    });

    socket.emit('join', {room: 'Genel'});
</script>
</body>
</html>
