<!DOCTYPE html>
<html>
<head>
    <title>Sohbetimiz - Chat</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        #header { background: #075e54; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        #chat-area { flex: 1; overflow-y: auto; padding: 20px; }
        .msg { background: white; padding: 10px; border-radius: 8px; margin-bottom: 10px; max-width: 80%; position: relative; }
        .msg b { color: #128c7e; display: block; font-size: 0.8em; }
        .msg span { font-size: 0.7em; color: gray; float: right; margin-top: 5px; }
        #input-area { background: white; padding: 15px; display: flex; gap: 10px; }
        input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 20px; outline: none; }
        button { padding: 10px 20px; border-radius: 20px; border: none; background: #075e54; color: white; cursor: pointer; }
        .live-btn { background: #d32f2f; text-decoration: none; padding: 8px 15px; border-radius: 5px; color: white; font-size: 0.9em; }
    </style>
</head>
<body>
    <div id="header">
        <span>Sohbet: <b>{{ user.username }}</b></span>
        <a href="/live" class="live-btn">🔴 Canlı Yayına Geç</a>
        <a href="/logout" style="color: white;">Çıkış</a>
    </div>
    <div id="chat-area"></div>
    <div id="input-area">
        <input type="text" id="msgInput" placeholder="Mesaj yazın...">
        <button onclick="send()">Gönder</button>
    </div>

    <script>
        const socket = io();
        socket.emit('join', {room: 'Genel'});

        function send() {
            const input = document.getElementById('msgInput');
            if(input.value) {
                socket.emit('message', {msg: input.value});
                input.value = '';
            }
        }

        socket.on('message', data => {
            addMessage(data);
        });

        socket.on('history', msgs => {
            msgs.forEach(addMessage);
        });

        function addMessage(data) {
            const area = document.getElementById('chat-area');
            const div = document.createElement('div');
            div.className = 'msg';
            div.innerHTML = `<b>${data.user}</b>${data.msg}<span>${data.time}</span>`;
            area.appendChild(div);
            area.scrollTop = area.scrollHeight;
        }
    </script>
</body>
</html>
