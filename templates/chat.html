<!DOCTYPE html>
<html>
<head>
    <title>Sohbetimiz</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        :root { --green: #075e54; --light: #25d366; }
        body { margin: 0; font-family: sans-serif; display: flex; height: 100vh; background: #e5ddd5; }
        #sidebar { width: 320px; background: white; border-right: 1px solid #ddd; display: flex; flex-direction: column; }
        #main { flex: 1; display: flex; flex-direction: column; }
        .header { background: #ededed; padding: 10px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #ddd; height: 50px; }
        .ava { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
        #story-bar { height: 90px; background: white; display: flex; align-items: center; padding: 0 10px; gap: 10px; overflow-x: auto; border-bottom: 1px solid #eee; }
        .st-thumb { width: 55px; height: 55px; border-radius: 50%; border: 3px solid var(--light); cursor: pointer; }
        #messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 8px 12px; border-radius: 10px; background: white; max-width: 80%; box-shadow: 0 1px 1px #ccc; }
        .me { align-self: flex-end; background: #dcf8c6; }
        .input-bar { background: #f0f0f0; padding: 10px; display: flex; gap: 10px; }
        #video-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:black; z-index:100; }
    </style>
</head>
<body>

<div id="sidebar">
    <div class="header">
        <img src="{{ user.avatar }}" class="ava">
        <b>{{ user.username }}</b>
    </div>
    <div id="story-bar">
        <button onclick="document.getElementById('st-in').click()" style="min-width:55px; height:55px; border-radius:50%; border:none; background:#eee; font-size:24px;">+</button>
        <div id="stories-area" style="display:flex; gap:8px;"></div>
    </div>
    <div id="user-list">
        <div onclick="joinRoom('Genel')" style="padding:15px; border-bottom:1px solid #eee; cursor:pointer;">🌍 Genel Sohbet Grubu</div>
    </div>
</div>

<div id="main">
    <div class="header">
        <b id="room-name">Lütfen Oda Seçin</b>
        <button onclick="startVideo()" style="margin-left:auto; background:none; border:none; font-size:20px; cursor:pointer;">📹</button>
    </div>
    <div id="messages"></div>
    <div class="input-bar">
        <button onclick="document.getElementById('file-in').click()">📎</button>
        <button id="mic-btn" onmousedown="startRec()" onmouseup="stopRec()">🎤</button>
        <input type="text" id="msg-in" style="flex:1; padding:8px; border-radius:20px; border:1px solid #ddd;">
        <button onclick="send()" style="border:none; background:var(--green); color:white; padding:8px 15px; border-radius:20px;">Gönder</button>
    </div>
</div>

<div id="video-overlay">
    <video id="local" autoplay muted style="width:200px; position:absolute; top:20px; right:20px; border:2px solid white;"></video>
    <video id="remote" autoplay style="width:100%; height:100%;"></video>
    <button onclick="location.reload()" style="position:absolute; bottom:30px; left:50%; transform:translateX(-50%); background:red; color:white; padding:15px 30px; border-radius:30px; border:none;">Kapat</button>
</div>

<input type="file" id="st-in" style="display:none" onchange="postStory(this)">
<input type="file" id="file-in" style="display:none" onchange="postFile(this)">

<script>
    const socket = io();
    const me = "{{ user.username }}";
    let currentRoom = "Genel";

    // Odaya Katıl
    socket.emit('join', {room: 'Genel'});
    socket.emit('get_stories');

    function send() {
        const m = document.getElementById('msg-in').value;
        if(m) { socket.emit('send_message', {room: currentRoom, msg: m, type: 'text'}); document.getElementById('msg-in').value = ""; }
    }

    socket.on('new_message', d => {
        const area = document.getElementById('messages');
        let html = `<b>${d.sender}:</b><br>`;
        if(d.type === 'text') html += d.content;
        else if(d.type === 'image') html += `<img src="${d.content}" style="max-width:200px; border-radius:10px;">`;
        else if(d.type === 'audio') html += `<audio src="${d.content}" controls></audio>`;
        
        const div = document.createElement('div');
        div.className = 'msg ' + (d.sender === me ? 'me' : '');
        div.innerHTML = html;
        area.appendChild(div);
        area.scrollTop = area.scrollHeight;
    });

    socket.on('load_history', msgs => {
        document.getElementById('messages').innerHTML = "";
        msgs.forEach(m => socket.emit('new_message_ui', m)); // Basitleştirilmiş yükleme
    });

    // Sesli Mesaj
    let rec;
    async function startRec() {
        const stream = await navigator.mediaDevices.getUserMedia({audio:true});
        rec = new MediaRecorder(stream);
        let chunks = [];
        rec.ondataavailable = e => chunks.push(e.data);
        rec.onstop = () => {
            const blob = new Blob(chunks);
            const r = new FileReader();
            r.onload = e => socket.emit('send_message', {room: currentRoom, msg: e.target.result, type: 'audio'});
            r.readAsDataURL(blob);
        };
        rec.start();
        document.getElementById('mic-btn').style.color = 'red';
    }
    function stopRec() { if(rec) { rec.stop(); document.getElementById('mic-btn').style.color = 'black'; } }

    // Dosya & Hikaye
    function postFile(i) {
        const f = i.files[0];
        const r = new FileReader();
        r.onload = e => socket.emit('send_message', {room: currentRoom, msg: e.target.result, type: f.type.split('/')[0]});
        r.readAsDataURL(f);
    }

    function postStory(i) {
        const f = i.files[0];
        const r = new FileReader();
        r.onload = e => socket.emit('post_story', {content: e.target.result, type: f.type.split('/')[0]});
        r.readAsDataURL(f);
    }

    socket.on('stories_update', grouped => {
        const area = document.getElementById('stories-area');
        area.innerHTML = "";
        for(let user in grouped) {
            area.innerHTML += `<img src="${grouped[user].avatar}" class="st-thumb" onclick='alert("Hikaye İzleme Modu Aktif")'>`;
        }
    });

    async function startVideo() {
        document.getElementById('video-overlay').style.display = 'block';
        const stream = await navigator.mediaDevices.getUserMedia({video:true, audio:true});
        document.getElementById('local').srcObject = stream;
    }
</script>
</body>
</html>
