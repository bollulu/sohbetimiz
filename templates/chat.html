<!DOCTYPE html>
<html>
<head>
    <title>Sohbet Ultra 2026</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        :root { --wa-green: #075e54; --wa-light: #dcf8c6; --bg: #e5ddd5; --tick-blue: #34b7f1; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; height: 100vh; background: var(--bg); overflow: hidden; }
        
        #side-panel { width: 320px; background: white; border-right: 1px solid #ddd; display: flex; flex-direction: column; }
        
        /* Story Section */
        #story-bar { display: flex; padding: 15px 10px; gap: 15px; overflow-x: auto; background: white; border-bottom: 1px solid #eee; align-items: center; }
        .story-container { display: flex; flex-direction: column; align-items: center; min-width: 65px; position: relative; cursor: pointer; }
        .story-circle { width: 56px; height: 56px; border-radius: 50%; border: 3px solid #25D366; object-fit: cover; padding: 2px; }
        .add-btn { position: absolute; bottom: 18px; right: 5px; width: 20px; height: 20px; background: #25D366; border-radius: 50%; border: 2px solid white; color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; }
        .story-name { font-size: 11px; margin-top: 5px; color: #555; }

        /* Chat Area */
        #main-chat { flex: 1; display: flex; flex-direction: column; }
        #chat-area { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg-wrap { display: flex; align-items: flex-end; gap: 8px; max-width: 80%; }
        .sent-wrap { align-self: flex-end; flex-direction: row-reverse; }
        .avatar-chat { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
        .msg { padding: 8px 12px; border-radius: 12px; font-size: 14px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .sent { background: var(--wa-light); }
        .received { background: white; }

        /* Story Modal */
        #story-modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:10000; flex-direction:column; align-items:center; justify-content:center; }
        #story-img { max-width: 90%; max-height: 75%; border-radius: 8px; }
        .viewer-info { color: white; margin-top: 15px; text-align: center; font-size: 14px; }
    </style>
</head>
<body>

<div id="side-panel">
    <div style="padding:15px; background:var(--wa-green); color:white; display:flex; justify-content:space-between; align-items:center;">
        <b>Sohbetler</b>
        <img src="{{ user.avatar }}" id="top-avatar" style="width:35px; height:35px; border-radius:50%; cursor:pointer;" onclick="document.getElementById('pIn').click()">
        <input type="file" id="pIn" style="display:none" onchange="uploadProfile(this)">
    </div>

    <div id="story-bar">
        <div class="story-container" onclick="document.getElementById('sIn').click()">
            <img src="{{ user.avatar }}" id="my-s-avatar" class="story-circle" style="border-color:#ccc">
            <div class="add-btn">+</div>
            <span class="story-name">Siz</span>
            <input type="file" id="sIn" style="display:none" onchange="uploadStory(this)">
        </div>
        <div id="other-stories" style="display:flex; gap:15px;"></div>
    </div>

    <div id="user-list" style="flex:1; overflow-y:auto;"></div>
</div>

<div id="main-chat">
    <div id="chat-area"></div>
    <div style="background:#f0f0f0; padding:12px; display:flex; align-items:center; gap:10px;">
        <button onclick="document.getElementById('fIn').click()" style="border:none; background:none; font-size:22px; cursor:pointer;">📁</button>
        <input type="file" id="fIn" style="display:none" onchange="upMedia(this)">
        <input type="text" id="mIn" style="flex:1; padding:12px; border-radius:25px; border:none;" placeholder="Mesaj yaz..." onkeydown="if(event.key==='Enter') sendMsg()">
        <button onclick="sendMsg()" style="border:none; background:none; font-size:26px; cursor:pointer; color:var(--wa-green);">➤</button>
    </div>
</div>

<div id="story-modal" onclick="this.style.display='none'">
    <img id="story-img" src="">
    <div class="viewer-info" onclick="event.stopPropagation()">
        <b id="st-owner"></b><br><br>
        👀 İzleyenler: <span id="st-views">Kimse yok</span>
    </div>
</div>

<script>
    const socket = io();
    const myName = "{{ user.username }}";

    // 1. PROFİL GÜNCELLEME
    function uploadProfile(input) {
        if(input.files[0]) {
            const r = new FileReader();
            r.onload = e => {
                const b64 = e.target.result;
                document.getElementById('top-avatar').src = b64;
                document.getElementById('my-s-avatar').src = b64;
                socket.emit('update_profile_pic', {avatar: b64});
            };
            r.readAsDataURL(input.files[0]);
        }
    }

    // 2. HİKAYE EKLEME
    function uploadStory(input) {
        if(input.files[0]) {
            const r = new FileReader();
            r.onload = e => socket.emit('add_story', {image: e.target.result});
            r.readAsDataURL(input.files[0]);
            alert("Hikaye paylaşılıyor...");
        }
    }

    function showStory(stories, owner) {
        const s = stories[stories.length - 1];
        document.getElementById('story-img').src = s.content;
        document.getElementById('st-owner').innerText = (owner === myName ? "Siz" : owner);
        const processed = s.views.map(v => v === myName ? "Siz" : v);
        document.getElementById('st-views').innerText = processed.length > 0 ? processed.join(', ') : "Henüz kimse yok";
        document.getElementById('story-modal').style.display = 'flex';
        if(owner !== myName) socket.emit('view_story', {story_id: s.id});
    }

    socket.on('story_list', data => {
        const area = document.getElementById('other-stories');
        area.innerHTML = '';
        for(let u in data) {
            if(u === myName) {
                document.getElementById('my-s-avatar').src = data[u].avatar; // Kendi resmini güncelle
                continue;
            }
            const div = document.createElement('div');
            div.className = 'story-container';
            div.onclick = () => showStory(data[u].stories, u);
            div.innerHTML = `<img src="${data[u].avatar}" class="story-circle"><span class="story-name">${u}</span>`;
            area.appendChild(div);
        }
    });

    // 3. MESAJLAŞMA
    function sendMsg() {
        const i = document.getElementById('mIn');
        if(i.value.trim()) { socket.emit('message', {msg: i.value, type:'text'}); i.value=''; }
    }

    function addMsg(d) {
        const area = document.getElementById('chat-area');
        const isMe = d.user === myName;
        const wrap = document.createElement('div');
        wrap.className = `msg-wrap ${isMe ? 'sent-wrap' : ''}`;
        
        let content = (d.type === 'image') ? `<img src="${d.msg}" style="max-width:230px; border-radius:10px;">` : d.msg;
        const dispName = isMe ? "Siz" : d.user;

        wrap.innerHTML = `
            <img src="${d.avatar}" class="avatar-chat">
            <div class="msg ${isMe ? 'sent' : 'received'}">
                <div style="font-size:11px; font-weight:bold; color:var(--wa-green); margin-bottom:3px;">${dispName}</div>
                ${content}
                <div style="text-align:right; font-size:9px; color:#999; margin-top:4px;">${d.time}</div>
            </div>`;
        area.appendChild(wrap); area.scrollTop = area.scrollHeight;
    }

    function upMedia(input) {
        const r = new FileReader();
        r.onload = e => socket.emit('message', {msg: e.target.result, type: 'image'});
        r.readAsDataURL(input.files[0]);
    }

    socket.on('message', d => addMsg(d));
    socket.on('history', h => { document.getElementById('chat-area').innerHTML=''; h.forEach(addMsg); });
    socket.on('profile_updated', d => { if(d.username === myName) document.getElementById('top-avatar').src = d.avatar; });

    socket.emit('join', {});
</script>
</body>
</html>
