<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta charset="UTF-8">
    <title>WhatsApp Ultra</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>

    <style>
        :root { --main: #075e54; --light: #25D366; --bg: #e5ddd5; }
        body { margin:0; display:flex; height:100vh; font-family:sans-serif; overflow:hidden; }

        #side { width:300px; background:white; border-right:1px solid #ddd; display:flex; flex-direction:column; z-index:2; }
        .side-header { background: var(--main); color:white; padding:15px; display:flex; justify-content:space-between; align-items:center; }

        #main {
            flex:1;
            display:flex;
            flex-direction:column;
            position:relative;
            background-color: var(--bg);
            background-size: cover;
            background-position: center;
            transition: 0.3s;
        }

        #story-area {
            height:110px;
            background:white;
            border-bottom:1px solid #ddd;
            display:flex;
            align-items:center;
            padding:0 15px;
            gap:15px;
            overflow-x:auto;
            white-space:nowrap;
        }

        .st-item { display:inline-block; text-align:center; cursor:pointer; min-width:65px; }
        .st-item img { width:60px; height:60px; border-radius:50%; border:3px solid var(--light); padding:2px; object-fit:cover; }
        .st-item span { display:block; font-size:12px; margin-top:2px; max-width:65px; overflow:hidden; text-overflow:ellipsis; }

        #chat-box { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:15px; }
        .msg { display:flex; gap:10px; max-width:85%; }
        .msg.me { align-self:flex-end; flex-direction:row-reverse; }
        .bubble { background:white; padding:8px 12px; border-radius:12px; min-width:80px; word-break:break-word; }
        .me .bubble { background:#dcf8c6; }

        footer { padding:10px; background:#f0f0f0; display:flex; gap:8px; align-items:center; }
        #mIn { flex:1; padding:12px; border-radius:20px; border:none; outline:none; }

        .icon-btn { border:none; background:none; font-size:22px; cursor:pointer; }

        .user-row { padding:10px; border-bottom:1px solid #f0f0f0; display:flex; align-items:center; gap:10px; }
        .user-row img { width:40px; height:40px; border-radius:50%; }
    </style>
</head>

<body>

<div id="side">
    <div class="side-header">
        <b>Aktif Üyeler</b>
        <button onclick="location.href='/logout'" style="background:none;border:none;color:white;font-size:18px;">🚪</button>
    </div>

    <div class="user-row" style="background:#e9ffe9;">
        <img src="{{ user.avatar }}" id="my-ava-display">
        <b>Siz ({{ user.username }})</b>
    </div>

    <div id="online-list" style="flex:1; overflow-y:auto;"></div>

    <div style="padding:10px; border-top:1px solid #ddd;">
        <button onclick="document.getElementById('bg-in').click()">🖼️ Arka Plan</button>
        <button onclick="resetBg()">🔄 Arka Planı Sıfırla</button>
    </div>
</div>

<div id="main">
    <div id="story-area">
        <div id="st-list" style="display:flex; gap:15px;"></div>
    </div>

    <div id="chat-box"></div>

    <footer>
        <input type="text" id="mIn" placeholder="Mesaj yaz..." onkeypress="if(event.key==='Enter') send()">
        <button class="icon-btn" onclick="send()">🚀</button>
    </footer>
</div>

<input type="file" id="bg-in" hidden onchange="processBg(this)">

<script>
    const socket = io();
    const myUser = "{{ user.username }}";

    // 🔒 ARKA PLAN KALICILIĞI (2. MADDE)

    const savedBg = localStorage.getItem("chat_bg");
    if (savedBg) {
        document.getElementById("main").style.backgroundImage = `url(${savedBg})`;
    }

    function processBg(input) {
        const file = input.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = e => {
            document.getElementById("main").style.backgroundImage = `url(${e.target.result})`;
            localStorage.setItem("chat_bg", e.target.result);
        };
        reader.readAsDataURL(file);
    }

    function resetBg() {
        document.getElementById("main").style.backgroundImage = "none";
        localStorage.removeItem("chat_bg");
    }

    // ---- MEVCUT CHAT ----
    function send() {
        const inp = document.getElementById("mIn");
        if (inp.value.trim()) {
            socket.emit("send_msg", { content: inp.value, type: "text" });
            inp.value = "";
        }
    }

    socket.on("new_msg", d => {
        const box = document.getElementById("chat-box");
        const html = `
            <div class="msg ${d.sender === myUser ? "me" : ""}">
                <img src="${d.avatar}" style="width:30px;height:30px;border-radius:50%">
                <div class="bubble">
                    <b>${d.sender}</b><br>${d.content}
                </div>
            </div>`;
        box.insertAdjacentHTML("beforeend", html);
        box.scrollTop = box.scrollHeight;
    });
</script>

</body>
</html>
