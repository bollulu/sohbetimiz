<!DOCTYPE html>
<html>
<head>
    <title>SOHBETİMİZ</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        :root { --wp-green: #25D366; --wp-dark: #075e54; }
        body { margin:0; display:flex; height:100vh; font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow:hidden; }
        
        /* Sol Panel: Çevrimiçi Listesi */
        #side { width:300px; background:white; border-right:1px solid #ddd; display:flex; flex-direction:column; }
        .side-header { padding:12px; background:#ededed; display:flex; justify-content:space-between; align-items:center; }
        .online-item { padding:12px; display:flex; align-items:center; gap:10px; border-bottom:1px solid #f9f9f9; }
        .online-item img { width:40px; height:40px; border-radius:50%; object-fit:cover; }
        .you-tag { color: var(--wp-green); font-weight:bold; font-size:11px; }

        /* Orta Panel: Sohbet */
        #main { flex:1; display:flex; flex-direction:column; position:relative; background:#e5ddd5; }
        #chat-bg { position:absolute; top:0; left:0; width:100%; height:100%; z-index:1; background-size:cover; background-position:center; pointer-events:none; }
        #chat-box { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:10px; z-index:2; }
        
        /* Mesaj Balonları */
        .msg { display:flex; align-items:flex-end; gap:8px; max-width:70%; position:relative; }
        .msg.me { align-self:flex-end; flex-direction:row-reverse; }
        .bubble { background:white; padding:8px 12px; border-radius:12px; position:relative; box-shadow:0 1px 1px rgba(0,0,0,0.1); word-wrap:break-word; }
        .me .bubble { background:#dcf8c6; }
        .u-name { font-size:11px; font-weight:bold; color:var(--wp-dark); display:block; margin-bottom:2px; }
        .del-btn { cursor:pointer; font-size:16px; color:gray; margin-left:8px; opacity:0; transition:0.2s; }
        .msg:hover .del-btn { opacity:1; }

        /* Sağ Panel: Hikayeler */
        #story-panel { width:100px; background:#fff; border-left:1px solid #ddd; display:flex; flex-direction:column; align-items:center; padding-top:15px; overflow-y:auto; }
        .st-container { text-align:center; margin-bottom:20px; cursor:pointer; }
        .st-ring { width:60px; height:60px; border-radius:50%; border:3px solid var(--wp-green); padding:2px; object-fit:cover; transition: 0.3s; }
        .st-ring:hover { transform: scale(1.1); }
        .add-st { width:55px; height:55px; border-radius:50%; background:#eee; display:flex; align-items:center; justify-content:center; font-size:30px; cursor:pointer; margin-bottom:10px; }

        /* Hikaye Viewer */
        #st-view { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:1000; flex-direction:column; align-items:center; justify-content:center; }
        #st-content { max-width:90%; max-height:80vh; border-radius:10px; }
        .st-header { color:white; display:flex; align-items:center; gap:10px; margin-bottom:15px; width:300px; }
        .st-header img { width:40px; height:40px; border-radius:50%; }
        
        .footer { padding:10px; background:#f0f0f0; display:flex; gap:10px; z-index:10; }
        #mIn { flex:1; border-radius:20px; border:none; padding:12px; outline:none; font-size:15px; }
    </style>
</head>
<body>

<div id="st-view">
    <div class="st-header">
        <img id="st-user-ava" src="">
        <span id="st-user-name" style="font-weight:bold"></span>
        <button onclick="closeSt()" style="margin-left:auto; background:none; border:none; color:white; font-size:20px; cursor:pointer">×</button>
    </div>
    <div id="st-media-box"></div>
</div>

<div id="side">
    <div class="side-header">
        <img src="{{ user.avatar }}" id="my-ava" onclick="document.getElementById('p-file').click()" style="width:40px;height:40px;border-radius:50%;cursor:pointer;object-fit:cover">
        <div>
            <button title="Arka Plan Seç" onclick="document.getElementById('bg-file').click()">🎨</button>
            <button title="Arka Planı Sıfırla" onclick="resetBg()">🔄</button>
            <button title="Çıkış Yap" onclick="location.href='/logout'">🚪</button>
        </div>
    </div>
    <div id="online-list" style="overflow-y:auto; flex:1"></div>
</div>

<div id="main">
    <div id="chat-bg" style="background-image: url('{{ user.bg_img }}')"></div>
    <div id="chat-box">
        {% for m in initial_msgs %}
        <div class="msg {{ 'me' if m.username == user.username else '' }}" id="m-{{m.id}}">
            <img src="{{ m.user_avatar }}" class="user-ava-img-{{m.username}}" style="width:30px;height:30px;border-radius:50%;object-fit:cover">
            <div class="bubble">
                <span class="u-name">{{ m.username }}</span>
                {{ m.content }}
                {% if m.username == user.username %}<span class="del-btn" onclick="delMsg({{m.id}})">🗑️</span>{% endif %}
            </div>
        </div>
        {% endfor %}
    </div>
    <div class="footer">
        <input type="text" id="mIn" placeholder="Mesaj yazın..." onkeypress="if(event.key==='Enter') send()">
        <button onclick="send()" style="border:none; background:none; font-size:24px; cursor:pointer">🚀</button>
    </div>
</div>

<div id="story-panel">
    <div class="add-st" onclick="document.getElementById('st-file').click()">+</div>
    <div style="font-size:10px; margin-bottom:20px; color:gray">DURUM</div>
    <div id="st-list"></div>
</div>

<input type="file" id="p-file" style="display:none" onchange="upPro(this)">
<input type="file" id="bg-file" style="display:none" onchange="upBg(this)">
<input type="file" id="st-file" style="display:none" accept="image/*,video/*" onchange="upSt(this)">

<script>
    const socket = io();
    const myName = "{{ user.username }}";
    const box = document.getElementById('chat-box');
    box.scrollTop = box.scrollHeight;

    // MESAJLAŞMA
    function send() {
        const i = document.getElementById('mIn');
        if(i.value.trim()) { socket.emit('message', {content: i.value}); i.value=''; }
    }
    socket.on('new_message', d => {
        const isMe = d.user === myName;
        box.insertAdjacentHTML('beforeend', `
            <div class="msg ${isMe?'me':''}" id="m-${d.id}">
                <img src="${d.avatar}" class="user-ava-img-${d.user}" style="width:30px;height:30px;border-radius:50%;object-fit:cover">
                <div class="bubble"><span class="u-name">${d.user}</span>${d.content}${isMe?`<span class="del-btn" onclick="delMsg(${d.id})">🗑️</span>`:''}</div>
            </div>
        `);
        box.scrollTop = box.scrollHeight;
    });

    function delMsg(id) { if(confirm("Mesajı silmek istiyor musunuz?")) socket.emit('delete_msg', {id: id}); }
    socket.on('msg_deleted', d => { document.getElementById('m-'+d.id)?.remove(); });

    // ÇEVRİMİÇİ LİSTESİ
    socket.on('user_status', users => {
        const list = document.getElementById('online-list');
        list.innerHTML = "";
        for(let u in users) {
            list.innerHTML += `<div class="online-item">
                <img src="${users[u].avatar}" class="user-ava-img-${u}">
                <span>${u} ${u===myName?'<span class="you-tag">(Siz)</span>':''}</span>
            </div>`;
        }
    });

    // PROFİL VE ARKA PLAN
    function upPro(i) {
        const r = new FileReader();
        r.onload = e => {
            socket.emit('update_profile', {avatar: e.target.result});
            document.getElementById('my-ava').src = e.target.result;
        };
        r.readAsDataURL(i.files[0]);
    }
    socket.on('profile_updated', d => {
        document.querySelectorAll('.user-ava-img-'+d.user).forEach(img => img.src = d.avatar);
    });

    function upBg(i) {
        const r = new FileReader();
        r.onload = e => {
            document.getElementById('chat-bg').style.backgroundImage = `url(${e.target.result})`;
            socket.emit('update_bg', {bg: e.target.result});
        };
        r.readAsDataURL(i.files[0]);
    }
    function resetBg() {
        document.getElementById('chat-bg').style.backgroundImage = 'none';
        socket.emit('update_bg', {bg: ""});
    }

    // HİKAYE MANTIĞI
    let storyData = {};
    socket.on('all_stories', d => {
        storyData = d;
        const list = document.getElementById('st-list');
        list.innerHTML = "";
        for(let u in d) {
            list.innerHTML += `<div class="st-container" onclick="openSt('${u}')">
                <img src="${d[u].avatar}" class="st-ring user-ava-img-${u}">
                <div style="font-size:10px">${u}</div>
            </div>`;
        }
    });

    let stTimer;
    function openSt(u) {
        let items = storyData[u].items;
        let idx = 0;
        document.getElementById('st-view').style.display = 'flex';
        
        function show() {
            if(idx >= items.length) { closeSt(); return; }
            document.getElementById('st-user-ava').src = storyData[u].avatar;
            document.getElementById('st-user-name').innerText = u;
            const media = document.getElementById('st-media-box');
            const item = items[idx];
            media.innerHTML = item.type === 'video' ? `<video src="${item.content}" id="st-content" autoplay></video>` : `<img src="${item.content}" id="st-content">`;
            idx++;
            stTimer = setTimeout(show, 4000);
        }
        show();
    }
    function closeSt() { clearTimeout(stTimer); document.getElementById('st-view').style.display='none'; }

    function upSt(i) {
        const f = i.files[0];
        const r = new FileReader();
        r.onload = e => socket.emit('add_story', {content: e.target.result, type: f.type.split('/')[0]});
        r.readAsDataURL(f);
    }
</script>
</body>
</html>
