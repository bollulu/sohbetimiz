<!DOCTYPE html>
<html>
<head>
    <title>SOHBETİMİZ</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        body { 
            font-family: sans-serif; margin: 0; display: flex; height: 100vh;
            background-size: cover !important; 
            background-position: center !important; 
            background-repeat: no-repeat !important;
        }
        #side { width: 300px; background: white; border-right: 1px solid #ddd; display: flex; flex-direction: column; }
        #main { flex: 1; display: flex; flex-direction: column; background: rgba(0,0,0,0.05); }
        
        /* Hikaye Barı Tasarımı */
        #story-bar { height: 100px; background: white; border-bottom: 1px solid #ddd; display: flex; align-items: center; padding: 0 10px; gap: 10px; overflow-x: auto; }
        .st-item { text-align: center; min-width: 70px; cursor: pointer; }
        .st-ava { width: 55px; height: 55px; border-radius: 50%; border: 2px solid #25D366; object-fit: cover; padding: 2px; }
        
        /* Hikaye İzleyici Resim Düzeltme */
        #story-viewer { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; z-index: 2000; justify-content: center; align-items: center; }
        #st-media-content img, #st-media-content video { 
            max-width: 100vw; max-height: 100vh; object-fit: contain; 
        }

        #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 8px; }
        .msg { display: flex; gap: 8px; max-width: 75%; transition: 0.2s; }
        .msg.me { align-self: flex-end; flex-direction: row-reverse; }
        .bubble { padding: 8px 12px; border-radius: 12px; background: white; font-size: 14px; position: relative; }
        .me .bubble { background: #e7ffdb; }
        .m-ava { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; }
        
        .footer { padding: 10px; background: #f0f0f0; display: flex; gap: 10px; align-items: center; }
        #mIn { flex: 1; padding: 10px; border-radius: 20px; border: none; outline: none; }
        .btn { cursor: pointer; font-size: 18px; border: none; background: none; opacity: 0.7; }
        .btn:hover { opacity: 1; }
    </style>
</head>
<body id="body" style="background-image: url('{{ user.bg_img if user.bg_img else 'https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png' }}')">

<div id="story-viewer" onclick="closeSt()">
    <div id="st-media-content"></div>
    <audio id="st-audio" autoplay></audio>
</div>

<div id="side">
    <div style="padding:10px; background:#ededed; display:flex; justify-content:space-between;">
        <img src="{{ user.avatar }}" onclick="document.getElementById('p-file').click()" style="width:40px; height:40px; border-radius:50%; object-fit:cover; cursor:pointer">
        <div>
            <button class="btn" onclick="location.href='/live'">📹</button>
            <button class="btn" onclick="document.getElementById('bg-file').click()">🎨</button>
            <button class="btn" onclick="resetBg()" title="Arka Planı Sıfırla">🔄</button>
            <button class="btn" onclick="location.href='/logout'">🚪</button>
        </div>
    </div>
    <div style="padding:15px; font-weight:bold; color:#075e54;">Sohbetler</div>
</div>

<div id="main">
    <div id="story-bar">
        <div class="st-item" onclick="document.getElementById('st-file').click()">
            <div class="st-ava" style="background:#eee; display:flex; align-items:center; justify-content:center; font-size:20px;">+</div>
            <div style="font-size:10px">Durumum</div>
        </div>
        <div id="st-list" style="display:flex; gap:10px"></div>
    </div>
    <div id="chat-box">
        {% for m in initial_msgs %}
        <div class="msg {{ 'me' if m.username == user.username else '' }}">
            <img src="{{ m.user_avatar }}" class="m-ava">
            <div class="bubble">
                {% if m.msg_type == 'file' %}<a href="{{ m.content }}" download="{{ m.file_name }}">📂 {{ m.file_name }}</a>{% else %}{{ m.content }}{% endif %}
            </div>
        </div>
        {% endfor %}
    </div>
    <div class="footer">
        <button class="btn" onclick="document.getElementById('f-file').click()">📎</button>
        <input type="text" id="mIn" placeholder="Mesaj yaz..." onkeypress="if(event.key==='Enter') send()">
        <button class="btn" onclick="send()">🚀</button>
    </div>
</div>

<input type="file" id="bg-file" style="display:none" onchange="upBg(this)">
<input type="file" id="f-file" style="display:none" onchange="upFile(this)">
<input type="file" id="st-file" style="display:none" accept="image/*,video/*" onchange="upSt(this)">
<input type="file" id="st-music" style="display:none" accept="audio/*" onchange="upMusic(this)">

<script>
    const socket = io();
    const box = document.getElementById('chat-box');
    box.scrollTop = box.scrollHeight;
    let tempSt = { content: "", type: "" };

    function send() {
        const i = document.getElementById('mIn');
        if(i.value.trim()) { 
            socket.emit('message', {content: i.value, type: 'text'}); 
            i.value = ''; 
        }
    }

    socket.on('new_message', d => {
        const isMe = d.user === "{{ user.username }}";
        const content = d.type === 'file' ? `<a href="${d.content}" download="${d.file_name}">📂 ${d.file_name}</a>` : d.content;
        box.insertAdjacentHTML('beforeend', `
            <div class="msg ${isMe?'me':''}">
                <img src="${d.avatar}" class="m-ava">
                <div class="bubble">${content}</div>
            </div>
        `);
        box.scrollTop = box.scrollHeight;
    });

    socket.on('receive_stories', grouped => {
        const list = document.getElementById('st-list');
        list.innerHTML = "";
        for(let u in grouped) {
            list.innerHTML += `
                <div class="st-item" onclick='viewSt(${JSON.stringify(grouped[u])})'>
                    <img src="${grouped[u].avatar}" class="st-ava">
                    <div style="font-size:10px">${u}</div>
                </div>`;
        }
    });

    function viewSt(data) {
        const v = document.getElementById('story-viewer');
        const content = document.getElementById('st-media-content');
        const audio = document.getElementById('st-audio');
        v.style.display = 'flex';
        content.innerHTML = data.media_type === 'video' ? `<video src="${data.content}" autoplay></video>` : `<img src="${data.content}">`;
        if(data.music) { audio.src = data.music; audio.play(); }
        setTimeout(closeSt, 5000);
    }

    function closeSt() { document.getElementById('story-viewer').style.display = 'none'; document.getElementById('st-audio').pause(); }

    function resetBg() {
        const def = 'https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png';
        document.getElementById('body').style.backgroundImage = `url(${def})`;
        socket.emit('update_bg', {bg: ""});
    }

    function upBg(i) {
        const r = new FileReader();
        r.onload = e => {
            document.getElementById('body').style.backgroundImage = `url(${e.target.result})`;
            socket.emit('update_bg', {bg: e.target.result});
        };
        r.readAsDataURL(i.files[0]);
    }

    function upSt(i) {
        const file = i.files[0];
        const r = new FileReader();
        r.onload = e => {
            tempSt.content = e.target.result;
            tempSt.type = file.type.startsWith('video') ? 'video' : 'image';
            if(confirm("Müzik eklensin mi?")) document.getElementById('st-music').click();
            else socket.emit('add_story', {content: tempSt.content, media_type: tempSt.type});
        };
        r.readAsDataURL(file);
    }

    function upMusic(i) {
        const r = new FileReader();
        r.onload = e => socket.emit('add_story', {content: tempSt.content, media_type: tempSt.type, music: e.target.result});
        r.readAsDataURL(i.files[0]);
    }

    function upFile(i) {
        const file = i.files[0];
        const r = new FileReader();
        r.onload = e => socket.emit('message', {content: e.target.result, type: 'file', file_name: file.name});
        r.readAsDataURL(file);
    }
</script>
</body>
</html>
