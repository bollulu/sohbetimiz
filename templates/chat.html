<!DOCTYPE html>
<html>
<head>
    <title>WhatsApp Ultra Chat</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        body { margin:0; font-family:sans-serif; display:flex; height:100vh; background:#ddd; }
        #side { width:300px; background:white; border-right:1px solid #ccc; display:flex; flex-direction:column; }
        #main { flex:1; display:flex; flex-direction:column; background-size:cover; }
        #chat-box { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:10px; }
        .msg { max-width:70%; padding:10px; border-radius:10px; position:relative; background:white; }
        .msg.me { align-self:flex-end; background:#dcf8c6; }
        .tık { font-size:10px; color:gray; margin-left:5px; }
        .tık.read { color:#34B7F1; }
        footer { padding:10px; background:#eee; display:flex; gap:10px; }
        input { flex:1; padding:10px; border-radius:20px; border:1px solid #ccc; }
    </style>
</head>
<body>

<div id="side">
    <div style="padding:20px; background:#075e54; color:white;">
        <img src="{{ user.avatar }}" style="width:40px; height:40px; border-radius:50%;">
        <b>{{ user.username }}</b>
    </div>
    <div id="online-list" style="flex:1;"></div>
    <button onclick="location.href='/logout'">Çıkış Yap</button>
</div>

<div id="main" style="background-image: url('{{ user.bg_image }}');">
    <div id="chat-box"></div>
    <footer>
        <button onclick="document.getElementById('f-in').click()">📎</button>
        <button id="mic-btn" onclick="toggleMic()">🎤</button>
        <input type="text" id="mIn" placeholder="Mesaj yazın...">
        <button onclick="send()">Gönder</button>
    </footer>
</div>

<input type="file" id="f-in" hidden onchange="uploadFile(this)">

<script>
    const socket = io();
    const myUser = "{{ user.username }}";

    function send() {
        const i = document.getElementById('mIn');
        if(i.value) { socket.emit('send_msg', {content:i.value, type:'text'}); i.value=''; }
    }

    socket.on('new_msg', d => render(d));
    socket.on('load_history', data => data.forEach(m => render(m)));

    function render(d) {
        const isMe = d.sender === myUser;
        const html = `<div class="msg ${isMe?'me':''}" id="msg-${d.id}">
            <b>${d.sender}:</b> <br> ${d.content}
            <div style="text-align:right; font-size:9px;">
                ${d.time} ${isMe ? `<span class="tık ${d.is_read?'read':''}">✔✔</span>` : ''}
                ${isMe ? `<span style="color:red; cursor:pointer;" onclick="del(${d.id})"> Sil</span>` : ''}
            </div>
        </div>`;
        document.getElementById('chat-box').innerHTML += html;
    }

    function del(id) { socket.emit('delete_msg', {id: id}); }
    socket.on('msg_deleted', d => document.getElementById('msg-'+d.id).remove());

    function uploadFile(input) {
        const file = input.files[0];
        const reader = new FileReader();
        reader.onload = e => socket.emit('send_msg', {content: e.target.result, type: file.type.startsWith('image')?'image':'file'});
        reader.readAsDataURL(file);
    }

    // Bas-Konuş Altyapısı
    let rec;
    async function toggleMic() {
        if(!rec) {
            const s = await navigator.mediaDevices.getUserMedia({audio:true});
            rec = new MediaRecorder(s);
            let chunks = [];
            rec.ondataavailable = e => chunks.push(e.data);
            rec.onstop = () => {
                const blob = new Blob(chunks, {type:'audio/ogg'});
                const r = new FileReader();
                r.onload = e => socket.emit('send_msg', {content:e.target.result, type:'audio'});
                r.readAsDataURL(blob);
            };
            rec.start(); document.getElementById('mic-btn').innerText = "🛑";
        } else {
            rec.stop(); rec = null; document.getElementById('mic-btn').innerText = "🎤";
        }
    }
</script>
</body>
</html>
