<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Chat 2026</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        :root { --whatsapp-green: #075e54; --light-green: #dcf8c6; --bg-gray: #e5ddd5; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; display: flex; height: 100vh; background: var(--bg-gray); }
        .sidebar { width: 300px; background: #fff; border-right: 1px solid #ddd; display: flex; flex-direction: column; }
        .user-header { padding: 20px; background: var(--whatsapp-green); color: white; text-align: center; }
        .chat-area { flex: 1; display: flex; flex-direction: column; }
        #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; }
        .msg-row { display: flex; gap: 10px; margin-bottom: 15px; max-width: 80%; }
        .msg-row.me { align-self: flex-end; flex-direction: row-reverse; }
        .msg-content { padding: 8px 12px; border-radius: 10px; background: white; box-shadow: 0 1px 2px rgba(0,0,0,0.1); position: relative; }
        .me .msg-content { background: var(--light-green); }
        .avatar { width: 35px; height: 35px; border-radius: 50%; object-fit: cover; }
        .input-bar { padding: 15px; background: #f0f2f5; display: flex; gap: 10px; align-items: center; }
        input[type="text"] { flex: 1; padding: 12px; border-radius: 25px; border: 1px solid #ddd; outline: none; }
        .del-btn { color: #e74c3c; cursor: pointer; font-size: 11px; margin-left: 8px; }
        #user-list { flex: 1; overflow-y: auto; padding: 10px; }
        .online-user { display: flex; align-items: center; gap: 10px; padding: 10px; border-bottom: 1px solid #eee; }
        .online-dot { width: 10px; height: 10px; background: #2ecc71; border-radius: 50%; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="user-header">
            <img src="{{ user.avatar or 'https://cdn-icons-png.flaticon.com/512/149/149071.png' }}" id="myAv" class="avatar" style="width:60px; height:60px; cursor:pointer;" onclick="$('#avInput').click()">
            <h3>@{{ user.username }}</h3>
            <input type="file" id="avInput" style="display:none" accept="image/*">
        </div>
        <div id="user-list">
            <h4 style="padding:10px;">Çevrimiçi Olanlar</h4>
        </div>
        <a href="/logout" style="padding:15px; text-align:center; color:red; text-decoration:none; font-weight:bold; border-top:1px solid #eee;">Çıkış Yap</a>
    </div>

    <div class="chat-area">
        <div id="chat-box">
            {% for m in history %}
            <div class="msg-row {% if m.username == user.username %}me{% endif %}" id="m-{{m.id}}">
                <img src="{{ m.avatar }}" class="avatar">
                <div class="msg-content">
                    <small><b>{{ m.username }}</b></small>
                    <div>{% if m.type == 'image' %}<img src="{{ m.content }}" style="max-width:250px; border-radius:5px;">{% else %}{{ m.content }}{% endif %}</div>
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:4px;">
                        <small style="color:gray; font-size:10px;">{{ m.timestamp }}</small>
                        {% if m.username == user.username %}
                        <span class="del-btn" onclick="delM('{{m.id}}')">Sil</span>
                        {% endif %}
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
        <div class="input-bar">
            <button onclick="$('#imgInput').click()" style="border:none; background:none; font-size:20px; cursor:pointer;">📷</button>
            <input type="file" id="imgInput" style="display:none" accept="image/*">
            <input type="text" id="msgIn" placeholder="Bir mesaj yazın...">
            <button onclick="send()" style="border:none; background:var(--whatsapp-green); color:white; padding:10px 20px; border-radius:20px; cursor:pointer;">Gönder</button>
        </div>
    </div>

    <script>
        var socket = io();
        var myUser = "{{ user.username }}";

        function scroll() { $('#chat-box').scrollTop($('#chat-box')[0].scrollHeight); }
        scroll();

        function send() {
            let val = $('#msgIn').val();
            if(val.trim()) { socket.emit('message', {msg: val, type: 'text'}); $('#msgIn').val(''); }
        }

        $('#msgIn').keypress(e => { if(e.which == 13) send(); });

        function delM(id) { if(confirm("Mesaj silinsin mi?")) socket.emit('delete_message', {id: id}); }

        socket.on('message', d => {
            let isMe = d.user == myUser;
            let html = `
            <div class="msg-row ${isMe?'me':''}" id="m-${d.id}">
                <img src="${d.avatar}" class="avatar">
                <div class="msg-content">
                    <small><b>${d.user}</b></small>
                    <div>${d.type=='image'?`<img src="${d.msg}" style="max-width:250px; border-radius:5px;">`:d.msg}</div>
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:4px;">
                        <small style="color:gray; font-size:10px;">${d.time}</small>
                        ${isMe?`<span class="del-btn" onclick="delM('${d.id}')">Sil</span>`:''}
                    </div>
                </div>
            </div>`;
            $('#chat-box').append(html);
            scroll();
        });

        socket.on('remove_message', d => { $(`#m-${d.id}`).fadeOut(300); });

        socket.on('user_list', list => {
            let html = '<h4 style="padding:10px;">Çevrimiçi Olanlar</h4>';
            list.forEach(u => {
                html += `<div class="online-user">
                    <img src="${u.avatar}" class="avatar" style="width:25px; height:25px;">
                    <span style="flex:1;">${u.name}</span>
                    <div class="online-dot"></div>
                </div>`;
            });
            $('#user-list').html(html);
        });

        $('#imgInput').change(function(e) {
            let r = new FileReader();
            r.onload = ev => { socket.emit('message', {msg: ev.target.result, type: 'image'}); };
            r.readAsDataURL(e.target.files[0]);
        });

        $('#avInput').change(function(e) {
            let r = new FileReader();
            r.onload = ev => { 
                socket.emit('update_avatar', {img: ev.target.result});
                $('#myAv').attr('src', ev.target.result);
            };
            r.readAsDataURL(e.target.files[0]);
        });
    </script>
</body>
</html>
