<!DOCTYPE html>
<html>
<head>
    <title>Süper Uygulama</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        #side { width: 320px; border-right: 1px solid #ddd; display: flex; flex-direction: column; background: #f0f2f5; }
        #main { flex: 1; display: flex; flex-direction: column; background: #e5ddd5; }
        
        .header { background: #ededed; padding: 10px 15px; display: flex; align-items: center; justify-content: space-between; }
        .user-item { padding: 12px; border-bottom: 1px solid #eee; cursor: pointer; display: flex; align-items: center; gap: 10px; background: white; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
        
        #story-bar { height: 100px; background: white; border-bottom: 1px solid #ddd; display: flex; align-items: center; padding: 0 10px; gap: 10px; overflow-x: auto; }
        .story-node { width: 60px; height: 60px; border-radius: 50%; border: 3px solid #25d366; cursor: pointer; flex-shrink: 0; }

        #messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background-size: cover; background-position: center; }
        .bubble { max-width: 70%; padding: 8px 12px; border-radius: 8px; font-size: 14px; position: relative; }
        .bubble-me { align-self: flex-end; background: #dcf8c6; }
        .bubble-other { align-self: flex-start; background: white; }
        
        #input-bar { padding: 10px; background: #f0f0f0; display: flex; align-items: center; gap: 10px; }
        #msg-in { flex: 1; padding: 10px; border-radius: 20px; border: 1px solid #ddd; outline: none; }
        .tick { font-size: 10px; margin-left: 5px; color: #999; }
        .tick-blue { color: #34b7f1; }
        #clock { font-weight: bold; color: #075e54; }
    </style>
</head>
<body>

<div id="side">
    <div class="header">
        <img src="{{ user.avatar }}" id="my-ava" class="avatar" onclick="document.getElementById('up-ava').click()">
        <input type="file" id="up-ava" style="display:none" onchange="syncProfile(this)">
        <b>{{ user.username }}</b>
        <button onclick="location.href='/logout'">Çıkış</button>
    </div>
    <button onclick="createGroup()" style="margin:10px; background:#25d366; color:white; border:none; padding:8px; border-radius:5px; cursor:pointer;">+ Grup Oluştur</button>
    <div style="overflow-y:auto">
        <div class="user-item" onclick="setRoom('Genel')">🌍 <b>Genel Sohbet</b></div>
        <div class="user-item" onclick="setRoom('Siz')"><img src="{{user.avatar}}" class="avatar"> <b>Siz (Mesaj Kendime)</b></div>
        {% for u in all_users if u.username != user.username %}
        <div class="user-item" onclick="setPrivate('{{ u.username }}')">
            <img src="{{ u.avatar }}" class="avatar u-ava-{{u.username}}">
            <span class="u-name-{{u.username}}">{{ u.username }}</span>
        </div>
        {% endfor %}
    </div>
</div>

<div id="main">
    <div class="header">
        <span id="room-title">Genel Sohbet</span>
        <div style="display:flex; gap:10px; align-items:center;">
            <button onclick="document.getElementById('bg-in').click()">🖼️</button>
            <button onclick="startCall()">📹</button>
            <div id="clock"></div>
        </div>
    </div>
    
    <div id="story-bar">
        <div style="text-align:center" onclick="document.getElementById('st-in').click()">
            <div class="story-node" style="border: 2px dashed #ccc; display:flex; align-items:center; justify-content:center">+</div>
            <small>Ekle</small>
        </div>
        <div id="stories-list" style="display:flex; gap:10px;"></div>
    </div>

    <div id="messages"></div>

    <div id="input-bar">
        <input type="file" id="media-in" style="display:none" onchange="sendMedia(this)">
        <button onclick="document.getElementById('media-in').click()">📎</button>
        <input type="text" id="msg-in" placeholder="Mesaj yazın..." onkeypress="if(event.key==='Enter') send()">
        <button id="mic" onmousedown="startRec()" onmouseup="stopRec()">🎤</button>
        <button onclick="send()" style="border:none; background:none; font-size:20px; cursor:pointer">➤</button>
    </div>
</div>

<input type="file" id="bg-in" style="display:none" onchange="changeBg(this)">
<input type="file" id="st-in" style="display:none" onchange="postStory(this)">

<script>
    const socket = io();
    let room = 'Genel';
    const me = "{{ user.username }}";

    // Saat
    setInterval(() => {
        document.getElementById('clock').innerText = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
    }, 1000);

    function setRoom(r) {
        room = r; document.getElementById('room-title').innerText = r;
        document.getElementById('messages').innerHTML = '';
        socket.emit('join', {room: r});
    }
    setRoom('Genel');

    function setPrivate(other) {
        const r = [me, other].sort().join('_');
        setRoom(r);
        document.getElementById('room-title').innerText = other;
    }

    function send() {
        const inp = document.getElementById('msg-in');
        if(inp.value.trim()) {
            socket.emit('message', {room: room, content: inp.value, type: 'text'});
            inp.value = '';
        }
    }

    socket.on('message', data => {
        append(data);
        if(data.sender !== me) socket.emit('mark_read', {id: data.id});
    });

    socket.on('load_history', h => h.forEach(append));

    function append(data) {
        const box = document.getElementById('messages');
        const isMe = data.sender === me;
        const div = document.createElement('div');
        div.className = `bubble ${isMe ? 'bubble-me' : 'bubble-other'}`;
        div.id = `m-${data.id}`;

        let html = data.content;
        if(data.type==='image') html = `<img src="${data.content}" style="max-width:200px; border-radius:5px">`;
        if(data.type==='audio') html = `<audio src="${data.content}" controls style="width:200px"></audio>`;
        if(data.type==='video') html = `<video src="${data.content}" controls style="max-width:200px"></video>`;

        div.innerHTML = `<small><b>${data.sender}</b></small><br>${html}
            <div style="text-align:right; font-size:10px; color:#888">
                ${data.time} <span id="t-${data.id}" class="tick ${data.status==='read'?'tick-blue':''}">${isMe?(data.status==='read'?'✓✓':'✓'):''}</span>
                ${isMe?`<span style="color:red; cursor:pointer" onclick="del(${data.id})"> Sil</span>`:''}
            </div>`;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    // SES KAYDI DÜZELTMESİ (0 Saniye Sorunu Çözüldü)
    let rec; let chunks = [];
    async function startRec() {
        chunks = [];
        const s = await navigator.mediaDevices.getUserMedia({audio: true});
        rec = new MediaRecorder(s);
        rec.ondataavailable = e => chunks.push(e.data);
        rec.onstop = () => {
            const blob = new Blob(chunks, {type: 'audio/webm'});
            const reader = new FileReader();
            reader.readAsDataURL(blob);
            reader.onloadend = () => socket.emit('message', {room: room, content: reader.result, type: 'audio'});
        };
        rec.start();
        document.getElementById('mic').style.color = 'red';
    }
    function stopRec() { if(rec) { rec.stop(); document.getElementById('mic').style.color = 'black'; } }

    function del(id) { if(confirm("Silinsin mi?")) socket.emit('delete_msg', {id: id}); }
    socket.on('msg_deleted', id => document.getElementById(`m-${id}`)?.remove());
    socket.on('status_updated', d => { const t = document.getElementById(`t-${d.id}`); if(t){ t.innerText="✓✓"; t.classList.add('tick-blue'); } });

    function changeBg(i) {
        const r = new FileReader();
        r.onload = e => document.getElementById('messages').style.backgroundImage = `url(${e.target.result})`;
        r.readAsDataURL(i.files[0]);
    }

    function syncProfile(i) {
        const r = new FileReader();
        r.onload = e => {
            document.getElementById('my-ava').src = e.target.result;
            socket.emit('update_profile', {new_avatar: e.target.result});
        };
        r.readAsDataURL(i.files[0]);
    }

    socket.on('profile_synced', d => {
        document.querySelectorAll('.u-ava-'+d.username).forEach(img => img.src = d.new_avatar);
    });

    function createGroup() {
        const n = prompt("Grup İsmi:");
        if(n) setRoom("Grup_"+n);
    }
</script>
</body>
</html>
