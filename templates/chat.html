<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sohbet</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>

<style>
body { margin:0; font-family:Segoe UI; background:#e5ddd5; display:flex; height:100vh; }
#side { width:260px; background:#fff; border-right:1px solid #ddd; }
#main { flex:1; display:flex; flex-direction:column; }

#story-bar {
    display:flex;
    gap:15px;
    padding:12px;
    background:#fff;
    border-bottom:1px solid #ddd;
    overflow-x:auto;
}

.story {
    text-align:center;
    cursor:pointer;
    min-width:70px;
}
.story img {
    width:60px;
    height:60px;
    border-radius:50%;
    border:3px solid #25D366;
    object-fit:cover;
}

#chat-box {
    flex:1;
    padding:15px;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:8px;
}

.msg { max-width:70%; display:flex; gap:6px; }
.me { align-self:flex-end; flex-direction:row-reverse; }

.bubble {
    background:#fff;
    padding:10px;
    border-radius:10px;
}
.me .bubble { background:#dcf8c6; }

.footer {
    padding:10px;
    background:#f0f0f0;
    display:flex;
    gap:10px;
}
input { flex:1; padding:10px; border-radius:20px; border:none; }
</style>
</head>

<body>

<div id="side"></div>

<div id="main">

    <!-- 🔥 STORY ORTA PANEL ÜSTÜ -->
    <div id="story-bar">
        <div class="story" onclick="addStory()">
            <img src="{{ user.avatar }}">
            <div>Ekle</div>
        </div>
        <div id="stories"></div>
    </div>

    <div id="chat-box"></div>

    <div class="footer">
        <input id="msg" placeholder="Mesaj yaz… İstanbul, ŞĞÜİÖÇ">
        <button onclick="send()">➤</button>
    </div>
</div>

<input type="file" id="storyInput" accept="image/*" hidden>

<script>
const socket = io();
const myName = "{{ user.username }}";

socket.emit("join",{});

function send(){
    const i=document.getElementById("msg");
    if(i.value.trim()){
        socket.emit("message",{msg:i.value,type:"text"});
        i.value="";
    }
}

socket.on("history",list=>list.forEach(renderMsg));
socket.on("message",renderMsg);

function renderMsg(d){
    if(document.getElementById("m"+d.id)) return;
    const div=document.createElement("div");
    div.className="msg "+(d.user===myName?"me":"");
    div.id="m"+d.id;
    div.innerHTML=`
        <div class="bubble">
            <b>${d.user}</b><br>${d.msg}
            <div style="font-size:10px;text-align:right">${d.time}</div>
        </div>`;
    document.getElementById("chat-box").appendChild(div);
}

socket.on("story_list",data=>{
    const box=document.getElementById("stories");
    box.innerHTML="";
    for(let u in data){
        const s=document.createElement("div");
        s.className="story";
        s.onclick=()=>openStory(data[u].items[0].id);
        s.innerHTML=`<img src="${data[u].avatar}"><div>${u}</div>`;
        box.appendChild(s);
    }
});

function addStory(){
    document.getElementById("storyInput").click();
}

document.getElementById("storyInput").onchange=function(){
    const f=this.files[0];
    if(!f) return;
    const r=new FileReader();
    r.onload=e=>{
        socket.emit("add_story",{content:e.target.result,type:"image"});
    };
    r.readAsDataURL(f);
};

function openStory(id){
    socket.emit("view_story",{id:id});
    alert("Hikâye açıldı");
}
</script>

</body>
</html>
