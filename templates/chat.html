<!DOCTYPE html>
<html>
<head>
    <title>Sohbetimiz</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        body { font-family: sans-serif; margin: 0; display: flex; height: 100vh; background: #e5ddd5; }
        #sidebar { width: 300px; background: #fff; border-right: 1px solid #ddd; display: flex; flex-direction: column; }
        #main { flex: 1; display: flex; flex-direction: column; position: relative; }
        
        /* Story Bar */
        #story-bar { height: 100px; background: #f0f2f5; display: flex; align-items: center; padding: 0 10px; gap: 15px; overflow-x: auto; border-bottom: 1px solid #ddd; }
        .story-circle { width: 60px; height: 60px; border-radius: 50%; border: 3px solid #25D366; padding: 2px; cursor: pointer; object-fit: cover; }
        
        /* Modal */
        #story-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; justify-content: center; align-items: center; flex-direction: column; }
        .st-content { max-width: 400px; max-height: 80vh; border-radius: 10px; }
        .viewer-list { color: white; margin-top: 15px; font-size: 14px; background: rgba(255,255,255,0.1); padding: 10px; border-radius: 5px; width: 300px; }
        
        #messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 8px 12px; border-radius: 8px; max-width: 70%; font-size: 14px; }
        .me { align-self: flex-end; background: #dcf8c6; }
        .ot { align-self: flex-start; background: #fff; }
    </style>
</head>
<body>

<div id="sidebar">
    <div style="padding: 15px; background: #ededed; font-weight: bold;">Sohbetimiz</div>
    <div style="flex: 1; overflow-y: auto;">
        {% for u in all_users if u.username != user.username %}
        <div style="padding: 10px; border-bottom: 1px solid #eee; cursor: pointer;" onclick="joinRoom('{{u.username}}')">
            {{ u.username }}
        </div>
        {% endfor %}
    </div>
</div>

<div id="main">
    <div id="story-bar">
        <div onclick="document.getElementById('st-in').click()" style="text-align: center; cursor: pointer;">
            <div class="story-circle" style="border: 3px dashed #ccc; display: flex; align-items: center; justify-content: center;">+</div>
            <small>Ekle</small>
        </div>
        <div id="stories-area" style="display: flex; gap: 15px;"></div>
    </div>
    
    <div id="messages"></div>
    
    <div style="padding: 15px; background: #f0f2f5; display: flex; gap: 10px;">
        <input type="text" id="msg-in" style="flex: 1; padding: 10px; border-radius: 20px; border: 1px solid #ccc;">
        <button onclick="send()" style="background: #25D366; color: white; border: none; padding: 10px 20px; border-radius: 20px;">Gönder</button>
    </div>
</div>

<div id="story-modal">
    <div id="st-media-container" style="position: relative;"></div>
    <div id="viewers-area" class="viewer-list"></div>
    <button onclick="closeStory()" style="margin-top: 20px; color: white; background: none; border: 1px solid white; padding: 5px 20px; border-radius: 20px;">Kapat</button>
</div>

<input type="file" id="st-in" style="display: none;" accept="image/*,video/*" onchange="uploadStory(this)">
<input type="file" id="music-in" style="display: none;" accept="audio/*">

<script>
    const socket = io();
    const me = "{{ user.username }}";
    let currentRoom = "";
    let activeStorySet = [];
    let currentStoryIdx = 0;

    socket.emit('get_stories');

    function joinRoom(other) {
        currentRoom = [me, other].sort().join('_');
        document.getElementById('messages').innerHTML = "";
        socket.emit('join', {room: currentRoom});
    }

    function send() {
        const val = document.getElementById('msg-in').value;
        if(val) {
            socket.emit('send_message', {room: currentRoom, msg: val, sender: me});
            document.getElementById('msg-in').value = "";
        }
    }

    socket.on('new_message', d => {
        if(d.room === currentRoom) appendMsg(d);
    });

    socket.on('load_history', msgs => msgs.forEach(appendMsg));

    function appendMsg(d) {
        const div = document.createElement('div');
        div.className = `msg ${d.sender === me ? 'me' : 'ot'}`;
        div.innerText = d.content;
        document.getElementById('messages').appendChild(div);
    }

    // STORY FUNCTIONS
    function uploadStory(input) {
        const file = input.files[0];
        const reader = new FileReader();
        reader.onload = e => {
            const hasMusic = confirm("Müzik eklemek ister misiniz?");
            if(hasMusic) {
                const mIn = document.getElementById('music-in');
                mIn.onchange = me => {
                    const mReader = new FileReader();
                    mReader.onload = ev => {
                        socket.emit('post_story', {
                            content: e.target.result, 
                            type: file.type.split('/')[0], 
                            audio: ev.target.result
                        });
                    }
                    mReader.readAsDataURL(me.target.files[0]);
                };
                mIn.click();
            } else {
                socket.emit('post_story', {content: e.target.result, type: file.type.split('/')[0]});
            }
        };
        reader.readAsDataURL(file);
    }

    socket.on('stories_list', data => {
        const area = document.getElementById('stories-area');
        area.innerHTML = "";
        for(let user in data) {
            const div = document.createElement('div');
            div.innerHTML = `<img src="${data[user].avatar}" class="story-circle">`;
            div.onclick = () => openStory(data[user].items);
            area.appendChild(div);
        }
    });

    function openStory(items) {
        activeStorySet = items;
        currentStoryIdx = 0;
        document.getElementById('story-modal').style.display = 'flex';
        renderStoryItem();
    }

    function renderStoryItem() {
        const item = activeStorySet[currentStoryIdx];
        const container = document.getElementById('st-media-container');
        const vArea = document.getElementById('viewers-area');
        
        // Media Render
        if(item.type === 'image') {
            container.innerHTML = `<img src="${item.content}" class="st-content">`;
        } else {
            container.innerHTML = `<video src="${item.content}" autoplay class="st-content"></video>`;
        }

        // Audio Render
        if(item.audio) {
            const au = new Audio(item.audio);
            au.play();
            document.getElementById('story-modal').onclick = () => au.pause(); 
        }

        // Viewers list (Sadece hikaye sahibi görebilir)
        if(item.owner === me) {
            vArea.innerHTML = "👁️ İzleyenler: " + (item.viewers.join(', ') || "Henüz kimse görmedi.");
            const delBtn = document.createElement('button');
            delBtn.innerText = "Sil";
            delBtn.onclick = () => socket.emit('delete_story', {id: item.id});
            vArea.appendChild(delBtn);
        } else {
            vArea.innerHTML = "";
            socket.emit('view_story', {story_id: item.id});
        }
    }

    function closeStory() {
        document.getElementById('story-modal').style.display = 'none';
        document.getElementById('st-media-container').innerHTML = "";
    }
</script>
</body>
</html>
