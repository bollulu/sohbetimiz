<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Global Chat 2026 Ultimate</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        :root { --main: #075e54; --me: #dcf8c6; --sidebar-bg: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* Sidebar */
        .sidebar { width: 300px; background: var(--sidebar-bg); border-right: 1px solid #ddd; display: flex; flex-direction: column; }
        .profile-section { padding: 20px; background: var(--main); color: white; text-align: center; }
        .room-btn { width: 100%; padding: 15px; border: none; background: #fff; cursor: pointer; border-bottom: 1px solid #eee; text-align: left; font-size: 14px; transition: 0.3s; }
        .room-btn:hover { background: #f5f5f5; }
        .room-btn.active { background: #e9edef; border-left: 5px solid var(--main); font-weight: bold; }
        
        /* Chat Area */
        .chat-area { flex: 1; display: flex; flex-direction: column; background: #efe7dd; }
        #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; background-size: cover; background-position: center; }
        
        /* Messages */
        .msg-row { display: flex; gap: 10px; margin-bottom: 10px; max-width: 80%; }
        .msg-row.me { align-self: flex-end; flex-direction: row-reverse; }
        .msg-bubble { padding: 8px 12px; border-radius: 10px; background: #fff; box-shadow: 0 1px 1px rgba(0,0,0,0.1); position: relative; }
        .me .msg-bubble { background: var(--me); }
        .avatar { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; background: #ccc; }
        
        /* Media */
        .media-msg { max-width: 100%; border-radius: 8px; margin-top: 5px; cursor: pointer; }
        
        /* Input Bar */
        .input-bar { padding: 10px 20px; background: #f0f2f5; display: flex; align-items: center; gap: 10px; }
        #msgIn { flex: 1; padding: 12px; border-radius: 20px; border: none; outline: none; }
        .action-btn { background: none; border: none; font-size: 22px; cursor: pointer; color: #54656f; }
        .send-btn { background: var(--main); color: white; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; }
        
        .del-btn { color: #ea0038; font-size: 11px; cursor: pointer; float: right; margin-top: 5px; font-weight: bold; }
        .user-tag { color: var(--main); font-size: 12px; font-weight: bold; display: block; margin-bottom: 2px; }
    </style>
</head>
<body>
    <audio id="notifSound" src="https://assets.mixkit.co/active_storage/sfx/2358/2358-preview.mp3"></audio>

    <div class="sidebar">
        <div class="profile-section">
            <img src="{{ user.avatar or 'https://cdn-icons-png.flaticon.com/512/149/149071.png' }}" id="myAv" class="avatar" style="width:70px; height:70px; cursor:pointer;" onclick="$('#avInput').click()">
            <h3 style="margin:10px 0 0 0;">@{{ user.username }}</h3>
            <input type="file" id="avInput" style="display:none" accept="image/*">
        </div>
        
        <div style="background:#f0f2f5; padding:10px; font-size:12px; font-weight:bold; color:#666;">SOHBET ODALARI</div>
        <div style="flex: 1; overflow-y: auto;">
            <button class="room-btn active" onclick="changeRoom('Genel')">📢 Genel Sohbet</button>
            <button class="room-btn" onclick="changeRoom('Yazılım')">💻 Yazılım Geliştirme</button>
            <button class="room-btn" onclick="changeRoom('Özel Oda', '1234')">🔒 Özel Grup (Şifreli)</button>
            
            <div style="background:#f0f2f5; padding:10px; font-size:12px; font-weight:bold; color:#666; margin-top:10px;">ODADAKİLER</div>
            <div id="user-list" style="padding:10px;"></div>
        </div>

        <div style="padding:10px; border-top:1px solid #eee; display:flex; flex-direction:column; gap:5px;">
            <button onclick="$('#bgInput').click()" style="padding:8px; background:#3498db; color:white; border:none; border-radius:5px; cursor:pointer; font-size:12px;">🖼️ Duvar Kağıdı Değiştir</button>
            <input type="file" id="bgInput" style="display:none" accept="image/*">
            <a href="/logout" style="text-align:center; padding:10px; color:#d9534f; text-decoration:none; font-weight:bold; font-size:14px;">Oturumu Kapat</a>
        </div>
    </div>

    <div class="chat-area">
        <div style="padding:15px; background:#fff; border-bottom:1px solid #ddd; display:flex; justify-content:space-between;">
            <span id="active-room-name" style="font-weight:bold;">Oda: Genel</span>
        </div>
        
        <div id="chat-box"></div>
        
        <div class="input-bar">
            <button class="action-btn" onclick="$('#fileIn').click()">📎</button>
            <input type="file" id="fileIn" style="display:none" accept="image/*,video/*">
            <input type="text" id="msgIn" placeholder="Bir mesaj yazın...">
            <button class="send-btn" onclick="send()">Gönder</button>
        </div>
    </div>

    <script>
        var socket = io();
        var myUser = "{{ user.username }}";
        var currentRoom = "Genel";
        var defAv = 'https://cdn-icons-png.flaticon.com/512/149/149071.png';

        // Sayfa yüklendiğinde duvar kağıdını kontrol et
        $(document).ready(function() {
            let savedBg = localStorage.getItem('chat_bg_v8');
            if(savedBg) $('#chat-box').css('background-image', `url(${savedBg})`);
        });

        function changeRoom(name, pass = '') {
            if(name == currentRoom) return;
            currentRoom = name;
            $('#active-room-name').text("Oda: " + name);
            $('.room-btn').removeClass('active');
            $(event.target).closest('.room-btn').addClass('active');
            $('#chat-box').empty();
            socket.emit('join', {room: name, password: pass});
        }

        socket.emit('join', {room: 'Genel'});

        function send() {
            let val = $('#msgIn').val();
            if(val.trim()) { socket.emit('message', {msg: val, type: 'text'}); $('#msgIn').val(''); }
        }

        function addMessage(d, isHistory = false) {
            let isMe = d.user == myUser;
            if(!isMe && !isHistory) document.getElementById('notifSound').play().catch(()=>{});

            let content = d.msg;
            if(d.type == 'image') content = `<img src="${d.msg}" class="media-msg" onclick="window.open(this.src)">`;
            else if(d.type == 'video') content = `<video src="${d.msg}" class="media-msg" controls></video>`;

            let html = `
            <div class="msg-row ${isMe?'me':''}" id="m-${d.id}">
                <img src="${d.avatar || defAv}" class="avatar">
                <div class="msg-bubble">
                    <span class="user-tag">${d.user}</span>
                    <div>${content}</div>
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:5px;">
                        <small style="color:#8696a0; font-size:10px;">${d.time}</small>
                        ${isMe ? `<span class="del-btn" onclick="socket.emit('delete_message',{id:'${d.id}'})">Sil</span>` : ''}
                    </div>
                </div>
            </div>`;
            
            $('#chat-box').append(html);
            $('#chat-box').scrollTop($('#chat-box')[0].scrollHeight);
        }

        socket.on('message', d => addMessage(d));
        socket.on('history', data => data.forEach(d => addMessage(d, true)));
        socket.on('remove_message', d => $(`#m-${d.id}`).fadeOut(300, function(){ $(this).remove(); }));
        
        socket.on('user_list', list => {
            let html = '';
            list.forEach(u => {
                html += `<div style="display:flex; align-items:center; gap:8px; margin-bottom:8px;">
                    <div style="width:8px; height:8px; background:#2ecc71; border-radius:50%;"></div>
                    <img src="${u.avatar || defAv}" style="width:24px; height:24px; border-radius:50%;">
                    <span style="font-size:13px;">${u.name}</span>
                </div>`;
            });
            $('#user-list').html(html);
        });

        // Dosya ve Avatar İşlemleri
        $('#fileIn').change(function(e) {
            let file = e.target.files[0];
            let type = file.type.startsWith('image') ? 'image' : 'video';
            let reader = new FileReader();
            reader.onload = ev => socket.emit('message', {msg: ev.target.result, type: type});
            reader.readAsDataURL(file);
        });

        $('#avInput').change(function(e) {
            let reader = new FileReader();
            reader.onload = ev => {
                socket.emit('update_avatar', {img: ev.target.result});
                $('#myAv').attr('src', ev.target.result);
            };
            reader.readAsDataURL(e.target.files[0]);
        });

        $('#bgInput').change(function(e) {
            let reader = new FileReader();
            reader.onload = ev => {
                $('#chat-box').css('background-image', `url(${ev.target.result})`);
                localStorage.setItem('chat_bg_v8', ev.target.result);
            };
            reader.readAsDataURL(e.target.files[0]);
        });

        socket.on('error', d => { alert(d.msg); location.reload(); });
        $('#msgIn').keypress(e => { if(e.which==13) send(); });
    </script>
</body>
</html>
