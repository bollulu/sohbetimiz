<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Chat Groups</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        :root { --whatsapp-green: #075e54; --light-green: #dcf8c6; --bg-gray: #e5ddd5; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; height: 100vh; background: var(--bg-gray); }
        .sidebar { width: 280px; background: #fff; border-right: 1px solid #ddd; display: flex; flex-direction: column; }
        .rooms { padding: 10px; background: #eee; }
        .room-btn { width: 100%; padding: 10px; margin-bottom: 5px; border: none; background: #fff; cursor: pointer; border-radius: 5px; text-align: left; }
        .room-btn.active { background: var(--whatsapp-green); color: white; }
        .chat-area { flex: 1; display: flex; flex-direction: column; }
        #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; }
        .msg-row { display: flex; gap: 10px; margin-bottom: 15px; max-width: 80%; }
        .msg-row.me { align-self: flex-end; flex-direction: row-reverse; }
        .msg-content { padding: 8px 12px; border-radius: 10px; background: white; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .me .msg-content { background: var(--light-green); }
        .avatar { width: 35px; height: 35px; border-radius: 50%; object-fit: cover; }
        .input-bar { padding: 15px; background: #f0f2f5; display: flex; gap: 10px; }
        input[type="text"] { flex: 1; padding: 12px; border-radius: 25px; border: 1px solid #ddd; outline: none; }
        .online-dot { width: 10px; height: 10px; background: #2ecc71; border-radius: 50%; }
    </style>
</head>
<body>
    <audio id="notifSound" src="https://assets.mixkit.co/active_storage/sfx/2358/2358-preview.mp3"></audio>

    <div class="sidebar">
        <div style="padding:20px; background: var(--whatsapp-green); color:white;">
            <img src="{{ user.avatar or 'https://cdn-icons-png.flaticon.com/512/149/149071.png' }}" class="avatar" style="width:50px; height:50px;">
            <h4>@{{ user.username }}</h4>
        </div>
        <div class="rooms">
            <p><b>Sohbet Grupları</b></p>
            <button class="room-btn active" onclick="changeRoom('Genel')">📢 Genel Sohbet</button>
            <button class="room-btn" onclick="changeRoom('Yazılım')">💻 Yazılım Grubu</button>
            <button class="room-btn" onclick="changeRoom('Özel Oda', '1234')">🔒 Özel Oda (Şifreli)</button>
        </div>
        <div id="user-list" style="flex:1; padding:10px; overflow-y:auto;">
            <p><small>Odadakiler</small></p>
        </div>
        <a href="/logout" style="padding:15px; color:red; text-decoration:none; border-top:1px solid #eee;">Çıkış Yap</a>
    </div>

    <div class="chat-area">
        <div id="chat-header" style="padding:15px; background:#fff; border-bottom:1px solid #ddd; font-weight:bold;">Oda: Genel</div>
        <div id="chat-box"></div>
        <div class="input-bar">
            <input type="text" id="msgIn" placeholder="Mesaj yazın...">
            <button onclick="send()" style="border:none; background:var(--whatsapp-green); color:white; padding:10px 20px; border-radius:20px; cursor:pointer;">Gönder</button>
        </div>
    </div>

    <script>
        var socket = io();
        var currentRoom = "Genel";
        var myUser = "{{ user.username }}";

        function changeRoom(name, pass = '') {
            currentRoom = name;
            $('#chat-header').text("Oda: " + name);
            $('.room-btn').removeClass('active');
            $(event.target).addClass('active');
            $('#chat-box').empty();
            socket.emit('join', {room: name, password: pass});
        }

        // İlk girişte genel odaya katıl
        socket.emit('join', {room: 'Genel'});

        function send() {
            let val = $('#msgIn').val();
            if(val.trim()) { socket.emit('message', {msg: val}); $('#msgIn').val(''); }
        }

        socket.on('message', d => {
            let isMe = d.user == myUser;
            // Bildirim sesi çal (Eğer mesaj benden gelmediyse)
            if(!isMe) document.getElementById('notifSound').play();

            let html = `
            <div class="msg-row ${isMe?'me':''}">
                <img src="${d.avatar || 'https://cdn-icons-png.flaticon.com/512/149/149071.png'}" class="avatar">
                <div class="msg-content">
                    <small><b>${d.user}</b></small>
                    <div>${d.msg}</div>
                    <small style="color:gray; font-size:10px;">${d.time}</small>
                </div>
            </div>`;
            $('#chat-box').append(html);
            $('#chat-box').scrollTop($('#chat-box')[0].scrollHeight);
        });

        socket.on('history', data => {
            data.forEach(d => {
                let isMe = d.user == myUser;
                let html = `<div class="msg-row ${isMe?'me':''}">
                    <img src="${d.avatar || 'https://cdn-icons-png.flaticon.com/512/149/149071.png'}" class="avatar">
                    <div class="msg-content"><small><b>${d.user}</b></small><div>${d.msg}</div><small style="color:gray; font-size:10px;">${d.time}</small></div>
                </div>`;
                $('#chat-box').append(html);
            });
        });

        socket.on('user_list', list => {
            let html = '<p><small>Odadakiler</small></p>';
            list.forEach(u => {
                html += `<div style="display:flex; align-items:center; gap:10px; margin-bottom:5px;">
                    <div class="online-dot"></div><span>${u.name}</span>
                </div>`;
            });
            $('#user-list').html(html);
        });

        socket.on('error', d => { alert(d.msg); window.location.reload(); });
        
        $('#msgIn').keypress(e => { if(e.which == 13) send(); });
    </script>
</body>
</html>
