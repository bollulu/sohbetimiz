<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Sohbet</title>
<link rel="stylesheet" href="/static/css/style.css">
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

<script>
const myUsername = "{{ current_user.username }}";
const currentRoom = "{{ current_room }}";
</script>
</head>
<body>

<div class="sidebar">
<h3>Odalar</h3>
{% for r in rooms %}
<a href="/room/{{ r.name }}">{{ r.name }}</a><br>
{% endfor %}
</div>

<div class="main">
<div class="header">{{ currentRoom }} <a href="/logout">Çıkış</a></div>

<div id="chat" class="chat">
{% for m in messages %}
<div class="message {{ 'me' if m.username==current_user.username else 'other' }}">
<b>{{ m.username }}</b><br>{{ m.text }}
</div>
{% endfor %}
</div>

<div class="input">
<input id="msg">
<button onclick="sendMessage()">Gönder</button>
</div>
</div>

<script src="/static/js/chat.js"></script>
</body>
</html>
