<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Sohbetimizt</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        :root { --wp-green: #25D366; --wp-dark: #075e54; --wp-light: #dcf8c6; }
        body { margin:0; display:flex; height:100vh; font-family:'Segoe UI', Tahoma, sans-serif; background:#f0f2f5; overflow:hidden; }
        
        /* Sol Panel */
        #side { width:350px; background:white; border-right:1px solid #ddd; display:flex; flex-direction:column; }
        .side-header { padding:15px; background:#ededed; display:flex; justify-content:space-between; align-items:center; }
        #online-list { flex:1; overflow-y:auto; }
        .user-row { padding:12px; display:flex; align-items:center; gap:10px; border-bottom:1px solid #f2f2f2; }
        .user-row img { width:40px; height:40px; border-radius:50%; object-fit:cover; }

        /* Ana Panel */
        #main { flex:1; display:flex; flex-direction:column; position:relative; background:#e5ddd5; }
        
        /* HİKAYE BARI (Orta Üst) */
        #story-bar { height:110px; background:white; border-bottom:1px solid #ddd; display:flex; align-items:center; padding:0 15px; gap:15px; overflow-x:auto; z-index:100; }
        .story-node { text-align:center; min-width:75px; cursor:pointer; }
        .st-ring { width:60px; height:60px; border-radius:50%; border:3px solid var(--wp-green); padding:2px; object-fit:cover; transition:0.2s; }
        .st-ring:hover { transform: scale(1.05); }
        .add-btn { width:60px; height:60px; border-radius:50%; background:#eee; display:flex; align-items:center; justify-content:center; font-size:30px; border:2px dashed #ccc; }

        /* Mesajlaşma Alanı */
        #chat-box { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:8px; z-index:10; }
        .msg { display:flex; align-items:flex-end; gap:8px; max-width:70%; }
        .msg.me { align-self:flex-end; flex-direction:row-reverse; }
        .bubble { background:white; padding:10px; border-radius:10px; box-shadow:0 1px 2px rgba(0,0,0,0.1); position:relative; }
        .me .bubble { background: var(--wp-light); }
        .u-name { font-size:12px; font-weight:bold; color: var(--wp-dark); display:block; margin-bottom:3px; }

        /* Hikaye İzleyici (Viewer) */
        #st-viewer { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.95); z-index:2000; flex-direction:column; align-items:center; justify-content:center; }
        .st-frame { width:100%; max-width:400px; height:80vh; position:relative; display:flex; align-items:center; justify-content:center; }
        .st-frame img, .st-frame video { max-width:100%; max-height:100%; border-radius:15px; box-shadow:0 0 20px rgba(0,0,0,0.5); }
        .st-nav { position:absolute; top:0; bottom:0; width:40%; z-index:2010; cursor:pointer; }
        .st-left { left:0; } .st-right { right:0; }
        
        /* Kamera Katmanı */
        .cam-layer { display:none; position:fixed; inset:0; background:black; z-index:3000; flex-direction:column; align-items:center; justify-content:center; }
        video#cam-feed { width:90%; max-width:500px; border-radius:10px; transform: scaleX(-1); }

        .footer { padding:10px; background:#f0f0f0; display:flex; gap:10px; z-index:100; }
        #mIn { flex:1; border-radius:20px; border:none; padding:12px; outline:none; font-size:15px; }
    </style>
</head>
<body>

<div id="st-viewer">
    <div style="position:absolute; top:20px; left:20px; color:white; display:flex; align-items:center; gap:12px; z-index:2020;">
        <img id="st-cur-ava" style="width:45px;height:45px;border-radius:50%;border:2px solid white">
        <div>
            <b id="st-cur-name" style="display:block">İsim</b>
            <small id="st-time">şimdi</small>
        </div>
        <button id="st-del-btn" onclick="deleteThisStory()" style="background:rgba(255,0,0,0.7); color:white; border:none; padding:8px 15px; border-radius:20px; cursor:pointer; margin-left:20px; display:none;">Sil</button>
    </div>
    <div class="st-frame">
        <div class="st-nav st-left" onclick="prevStory()"></div>
        <div class="st-nav st-right" onclick="nextStory()"></div>
        <div id="st-content" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center"></div>
    </div>
    <audio id="st-audio" loop></audio>
    <button onclick="closeSt()" style="position:absolute; top:20px; right:20px; background:none; border:none; color:white; font-size:40px; cursor:pointer;">&times;</button>
</div>

<div id="cam-layer" class="cam-layer">
    <video id="cam-feed" autoplay></video>
    <div style="margin-top:20px; display:flex; gap:15px;">
        <button onclick="snapPhoto()" style="padding:15px 30px; border-radius:50px; border:none; background:white; font-weight:bold; cursor:pointer;">📸 ÇEK</button>
        <button onclick="closeCam()" style="padding:15px 30px; border-radius:50px; border:none; background:red; color:white; font-weight:bold; cursor:pointer;">İPTAL</button>
    </div>
</div>

<div id="side">
    <div class="side-header">
        <img src="{{ user.avatar }}" style="width:40px;height:40px;border-radius:50%">
        <b>{{ user.username }}</b>
        <button onclick="location.href='/logout'">🚪</button>
    </div>
    <div id="online-list"></div>
</div>

<div id="main">
    <div id="story-bar">
        <div class="story-node" onclick="showAddOptions()">
            <div class="add-btn">+</div>
            <small>Hikayem</small>
        </div>
        <div id="st-list" style="display:flex; gap:15px"></div>
    </div>

    <div id="chat-box">
        {% for m in initial_msgs %}
        <div class="msg {{ 'me' if m.username == user.username else '' }}">
            <img src="{{ m.user_avatar }}" style="width:30px;height:30px;border-radius:50%">
            <div class="bubble">
                <span class="u-name">{{ m.username }}</span>
                {{ m.content }}
            </div>
        </div>
        {% endfor %}
    </div>

    <div class="footer">
        <input type="text" id="mIn" placeholder="Mesaj yazın..." onkeypress="if(event.key==='Enter') send()">
        <button onclick="send()" style="background:none; border:none; font-size:25px; cursor:pointer;">🚀</button>
    </div>
</div>

<input type="file" id="st-file" style="display:none" onchange="uploadMedia(this)">
<input type="file" id="st-music" style="display:none" accept="audio/*">

<script>
    const socket = io();
    const myName = "{{ user.username }}";
    let storyData = {};
    let currentStoryUser = "";
    let storyIdx = 0;
    let autoNext;

    // MESAJLAŞMA
    function send() {
        const i = document.getElementById('mIn');
        if(i.value.trim()){ socket.emit('message', {content: i.value}); i.value=''; }
    }
    socket.on('new_message', d => {
        const isMe = d.user === myName;
        document.getElementById('chat-box').insertAdjacentHTML('beforeend', `
            <div class="msg ${isMe?'me':''}">
                <img src="${d.avatar}" style="width:30px;height:30px;border-radius:50%">
                <div class="bubble"><span class="u-name">${d.user}</span>${d.content}</div>
            </div>
        `);
        document.getElementById('chat-box').scrollTop = document.getElementById('chat-box').scrollHeight;
    });

    // ÇEVRİMİÇİ LİSTESİ
    socket.on('user_status', users => {
        let html = "";
        for(let u in users) html += `<div class="user-row"><img src="${users[u].avatar}"> <span>${u} ${u===myName?'(Siz)':''}</span></div>`;
        document.getElementById('online-list').innerHTML = html;
    });

    // HİKAYE EKLEME
    function showAddOptions() {
        if(confirm("Kamera ile çekmek için TAMAM, Dosya seçmek için İPTAL.")) openCam();
        else document.getElementById('st-file').click();
    }

    async function openCam() {
        document.getElementById('cam-layer').style.display = 'flex';
        const stream = await navigator.mediaDevices.getUserMedia({video:true});
        document.getElementById('cam-feed').srcObject = stream;
    }
    function closeCam() {
        document.getElementById('cam-feed').srcObject?.getTracks().forEach(t=>t.stop());
        document.getElementById('cam-layer').style.display = 'none';
    }
    function snapPhoto() {
        const v = document.getElementById('cam-feed');
        const c = document.createElement('canvas');
        c.width=v.videoWidth; c.height=v.videoHeight;
        c.getContext('2d').drawImage(v,0,0);
        checkMusicAndEmit(c.toDataURL('image/jpeg'), 'image');
        closeCam();
    }

    function uploadMedia(input) {
        const file = input.files[0];
        const r = new FileReader();
        r.onload = e => checkMusicAndEmit(e.target.result, file.type.split('/')[0]);
        r.readAsDataURL(file);
    }

    function checkMusicAndEmit(content, type) {
        if(confirm("Hikayeye müzik eklemek ister misiniz?")) {
            const mInput = document.getElementById('st-music');
            mInput.onchange = (me) => {
                const mr = new FileReader();
                mr.onload = (re) => socket.emit('add_story', {content, type, music: re.target.result});
                mr.readAsDataURL(me.target.files[0]);
            };
            mInput.click();
        } else {
            socket.emit('add_story', {content, type});
        }
    }

    // HİKAYE İZLEME
    socket.on('all_stories', d => {
        storyData = d;
        let html = "";
        for(let u in d) {
            html += `<div class="story-node" onclick="openStory('${u}')">
                <img src="${d[u].avatar}" class="st-ring">
                <br><small>${u}</small>
            </div>`;
        }
        document.getElementById('st-list').innerHTML = html;
    });

    function openStory(user) {
        currentStoryUser = user;
        storyIdx = 0;
        document.getElementById('st-viewer').style.display = 'flex';
        renderStory();
    }

    function renderStory() {
        clearTimeout(autoNext);
        const item = storyData[currentStoryUser].items[storyIdx];
        const display = document.getElementById('st-content');
        const audio = document.getElementById('st-audio');

        document.getElementById('st-cur-ava').src = storyData[currentStoryUser].avatar;
        document.getElementById('st-cur-name').innerText = currentStoryUser;
        document.getElementById('st-del-btn').style.display = currentStoryUser === myName ? 'block' : 'none';

        if(item.type === 'video') {
            display.innerHTML = `<video src="${item.content}" autoplay id="st-vid" style="width:100%"></video>`;
            document.getElementById('st-vid').onended = nextStory;
        } else {
            display.innerHTML = `<img src="${item.content}">`;
            autoNext = setTimeout(nextStory, 5000);
        }

        if(item.music) { audio.src = item.music; audio.play(); } else { audio.pause(); }
    }

    function nextStory() {
        if(storyIdx < storyData[currentStoryUser].items.length - 1) {
            storyIdx++; renderStory();
        } else { closeSt(); }
    }
    function prevStory() {
        if(storyIdx > 0) { storyIdx--; renderStory(); }
    }
    function closeSt() {
        document.getElementById('st-viewer').style.display = 'none';
        document.getElementById('st-audio').pause();
        clearTimeout(autoNext);
    }
    function deleteThisStory() {
        const id = storyData[currentStoryUser].items[storyIdx].id;
        if(confirm("Bu hikayeyi silmek istediğine emin misin?")) {
            socket.emit('delete_story', {id: id});
            closeSt();
        }
    }

    // Klavye Kontrolü
    document.addEventListener('keydown', e => {
        if(document.getElementById('st-viewer').style.display === 'flex') {
            if(e.key === "ArrowRight") nextStory();
            if(e.key === "ArrowLeft") prevStory();
            if(e.key === "Escape") closeSt();
        }
    });
</script>
</body>
</html>
