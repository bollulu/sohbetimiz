<!DOCTYPE html>
<html>
<head>
    <title>Sohbet Ultra 2026</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        :root { --wa-green: #075e54; --wa-light: #dcf8c6; --bg: #e5ddd5; --tick-blue: #34b7f1; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; height: 100vh; background: var(--bg); overflow: hidden; }
        
        #side-panel { width: 300px; background: white; border-right: 1px solid #ddd; display: flex; flex-direction: column; }
        .user-row { padding: 12px; border-bottom: 1px solid #eee; display: flex; align-items: center; gap: 10px; }
        
        #main-chat { flex: 1; display: flex; flex-direction: column; position: relative; }
        #chat-area { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 8px; }

        .msg-wrap { display: flex; align-items: flex-end; gap: 6px; max-width: 85%; margin-bottom: 4px; }
        .sent-wrap { align-self: flex-end; flex-direction: row-reverse; }
        .avatar-chat { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; }
        .msg { padding: 8px 12px; border-radius: 15px; font-size: 14px; box-shadow: 0 1px 1px rgba(0,0,0,0.1); position: relative; }
        .sent { background: var(--wa-light); border-bottom-right-radius: 2px; }
        .received { background: white; border-bottom-left-radius: 2px; }

        .tick { font-size: 12px; margin-left: 4px; color: #999; }
        .read { color: var(--tick-blue) !important; }

        /* Video/Ses Tasarımı */
        #video-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; flex-direction: column; }
        #local-video { position: absolute; bottom: 20px; right: 20px; width: 100px; height: 140px; border: 2px solid white; border-radius: 8px; object-fit: cover; transform: scaleX(-1); }
        .v-controls { height: 80px; display: flex; justify-content: center; align-items: center; gap: 30px; background: #111; }
        .recording { color: #ff3b30; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        audio { height: 35px; width: 200px; }
    </style>
</head>
<body>

<div id="side-panel">
    <div style="padding:15px; background:var(--wa-green); color:white; display:flex; justify-content:space-between; align-items:center;">
        <b>Sohbetler</b>
        <img src="{{ user.avatar }}" id="my-top-avatar" style="width:35px; height:35px; border-radius:50%; cursor:pointer;" onclick="document.getElementById('pIn').click()">
        <input type="file" id="pIn" style="display:none" onchange="changeProfile(this)">
    </div>
    <div id="user-list"></div>
</div>

<div id="main-chat">
    <div id="chat-area" onscroll="markRead()"></div>
    <div style="background:#f0f0f0; padding:10px; display:flex; align-items:center; gap:10px;">
        <button onclick="document.getElementById('fIn').click()" style="border:none; background:none; font-size:20px; cursor:pointer;">📁</button>
        <input type="file" id="fIn" style="display:none" onchange="upMedia(this)">
        <input type="text" id="mIn" style="flex:1; padding:10px; border-radius:20px; border:none;" placeholder="Mesaj yaz..." onkeydown="if(event.key==='Enter') sendMsg()">
        <button id="mic-btn" onclick="toggleMic()" style="border:none; background:none; font-size:20px; cursor:pointer;">🎤</button>
        <button onclick="sendMsg()" style="border:none; background:none; font-size:20px; cursor:pointer; color:var(--wa-green);">➤</button>
    </div>
</div>

<div id="video-overlay">
    <div style="flex:1; position:relative;">
        <video id="remote-video" style="width:100%; height:100%; object-fit:cover;" autoplay playsinline></video>
        <video id="local-video" autoplay playsinline muted></video>
    </div>
    <div class="v-controls">
        <button onclick="location.reload()" style="padding:15px 30px; border-radius:30px; background:#ff3b30; color:white; border:none; cursor:pointer;">Aramayı Kapat</button>
    </div>
</div>

<script>
    const socket = io();
    const myName = "{{ user.username }}";
    let currentRoom = "Genel", mediaRecorder, audioChunks = [], localStream, peerConnection, targetUser = "";

    // 1. MESAJ GÖNDERME
    function sendMsg() {
        const input = document.getElementById('mIn');
        const text = input.value.trim();
        if(text) {
            socket.emit('message', {msg: text, type: 'text', room: currentRoom});
            input.value = '';
        }
    }

    // 2. MESAJLARI GÖRÜNTÜLEME
    function addMsg(d) {
        const area = document.getElementById('chat-area');
        const isMe = d.user === myName;
        const wrap = document.createElement('div');
        wrap.className = `msg-wrap ${isMe ? 'sent-wrap' : ''}`;
        
        let content = d.msg;
        if(d.type === 'audio') content = `<audio controls src="${d.msg}"></audio>`;
        else if(d.type === 'image') content = `<img src="${d.msg}" style="max-width:200px; border-radius:8px;">`;

        let ticks = isMe ? `<span class="tick ${d.is_read ? 'read' : ''}">${d.is_read ? '✓✓' : '✓'}</span>` : "";

        wrap.innerHTML = `
            <img src="${d.avatar}" class="avatar-chat">
            <div class="msg ${isMe ? 'sent' : 'received'}">
                ${content}
                <div style="text-align:right; font-size:9px; color:#999; margin-top:2px;">${d.time} ${ticks}</div>
            </div>`;
        area.appendChild(wrap);
        area.scrollTop = area.scrollHeight;
        if(!isMe && document.hasFocus()) markRead();
    }

    // 3. OKUNDU BİLGİSİ
    function markRead() { socket.emit('mark_as_read', {room: currentRoom}); }
    window.onfocus = markRead;
    socket.on('messages_read_update', d => {
        if(d.room === currentRoom) {
            document.querySelectorAll('.sent .tick').forEach(t => { t.innerHTML = '✓✓'; t.classList.add('read'); });
        }
    });

    // 4. MEDYA VE PROFİL (Eksik olanlar eklendi)
    function upMedia(input) {
        if(input.files[0]) {
            const reader = new FileReader();
            reader.onload = e => socket.emit('message', {msg: e.target.result, type: 'image', room: currentRoom});
            reader.readAsDataURL(input.files[0]);
        }
    }
    function changeProfile(input) {
        if(input.files[0]) {
            const reader = new FileReader();
            reader.onload = e => socket.emit('update_profile_pic', {avatar: e.target.result});
            reader.readAsDataURL(input.files[0]);
        }
    }

    // 5. SES KAYDI
    async function toggleMic() {
        const btn = document.getElementById('mic-btn');
        if (!mediaRecorder || mediaRecorder.state === "inactive") {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];
            mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
            mediaRecorder.onstop = () => {
                const blob = new Blob(audioChunks, { type: 'audio/webm' });
                const reader = new FileReader();
                reader.onloadend = () => socket.emit('message', { msg: reader.result, type: 'audio', room: currentRoom });
                reader.readAsDataURL(blob);
                stream.getTracks().forEach(t => t.stop());
            };
            mediaRecorder.start();
            btn.classList.add('recording');
        } else { mediaRecorder.stop(); btn.classList.remove('recording'); }
    }

    // 6. GÖRÜNTÜLÜ ARAMA (Sinyalleşme)
    async function startCall(to) {
        targetUser = to; document.getElementById('video-overlay').style.display = 'flex';
        localStream = await navigator.mediaDevices.getUserMedia({video:true, audio:true});
        document.getElementById('local-video').srcObject = localStream;
        peerConnection = new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});
        localStream.getTracks().forEach(t => peerConnection.addTrack(t, localStream));
        peerConnection.onicecandidate = e => e.candidate && socket.emit('ice-candidate', {candidate:e.candidate, to:targetUser});
        peerConnection.ontrack = e => document.getElementById('remote-video').srcObject = e.streams[0];
        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);
        socket.emit('call-user', {offer:offer, to:targetUser});
    }

    // SOKET DİNLEYİCİLER
    socket.on('message', d => addMsg(d));
    socket.on('history', h => { document.getElementById('chat-area').innerHTML=''; h.forEach(addMsg); markRead(); });
    socket.on('user_list', users => {
        const list = document.getElementById('user-list'); list.innerHTML = '';
        for(let u in users) {
            list.innerHTML += `<div class="user-row"><img src="${users[u]}" style="width:30px; height:30px; border-radius:50%;"><span>${u}</span> ${u!==myName ? `<button onclick="startCall('${u}')">📞</button>` : ''}</div>`;
        }
    });
    socket.on('call-made', async d => {
        if(confirm(d.from + " arıyor...")) {
            targetUser = d.from; document.getElementById('video-overlay').style.display = 'flex';
            localStream = await navigator.mediaDevices.getUserMedia({video:true, audio:true});
            document.getElementById('local-video').srcObject = localStream;
            peerConnection = new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});
            localStream.getTracks().forEach(t => peerConnection.addTrack(t, localStream));
            peerConnection.ontrack = e => document.getElementById('remote-video').srcObject = e.streams[0];
            await peerConnection.setRemoteDescription(new RTCSessionDescription(d.offer));
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);
            socket.emit('make-answer', {answer:answer, to:targetUser});
        }
    });
    socket.on('answer-made', async d => await peerConnection.setRemoteDescription(new RTCSessionDescription(d.answer)));
    socket.on('ice-candidate', async d => { try { await peerConnection.addIceCandidate(new RTCIceCandidate(d.candidate)); } catch(e){} });

    socket.emit('join', {room: 'Genel'});
</script>
</body>
</html>
