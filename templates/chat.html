<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Süper Chat</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>

<style>
:root{
    --bg:#e5ddd5;--header:#ededed;--green:#008069;
    --me:#dcf8c6;--white:#fff;
}
body{
    margin:0;font-family:Helvetica,Arial,sans-serif;
    height:100vh;display:flex;background:#d1d7db;overflow:hidden
}

/* SIDEBAR */
#sidebar{width:330px;background:white;border-right:1px solid #ddd;display:flex;flex-direction:column}
.header{
    height:60px;background:var(--header);display:flex;
    justify-content:space-between;align-items:center;
    padding:10px 15px;box-sizing:border-box
}
.my-ava{width:40px;height:40px;border-radius:50%;object-fit:cover;cursor:pointer}
#users{flex:1;overflow-y:auto}
.user{
    display:flex;align-items:center;gap:10px;
    padding:10px;border-bottom:1px solid #eee
}

/* MAIN */
#main{flex:1;display:flex;flex-direction:column;background:var(--bg)}
.top{
    height:60px;background:var(--header);
    display:flex;align-items:center;
    justify-content:space-between;padding:10px 15px
}

/* STORY BAR */
#story-bar{
    height:100px;background:white;
    border-bottom:1px solid #ddd;
    display:flex;align-items:center;
    gap:15px;padding:10px;overflow-x:auto
}
.story-item{text-align:center;cursor:pointer}
.story-item img{
    width:60px;height:60px;border-radius:50%;
    border:3px solid var(--green);object-fit:cover
}

/* CHAT */
#chat{
    flex:1;padding:20px;
    overflow-y:auto;display:flex;
    flex-direction:column;gap:10px;
    background-image:url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png')
}
.msg{display:flex;gap:6px;max-width:70%}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.bubble{
    background:white;padding:8px 12px;
    border-radius:8px;box-shadow:0 1px 1px rgba(0,0,0,.1)
}
.me .bubble{background:var(--me)}
.time{font-size:10px;color:#777;text-align:right}

/* FOOTER */
.footer{
    height:60px;background:#f0f0f0;
    display:flex;align-items:center;gap:10px;
    padding:10px
}
.footer input{
    flex:1;border:none;border-radius:20px;
    padding:10px;outline:none
}
