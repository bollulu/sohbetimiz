<!DOCTYPE html>
<html>
<head>
    <title>SOHBETİMİZ</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        :root { --wp-green: #25D366; --wp-dark: #075e54; }
        body { margin:0; display:flex; height:100vh; font-family:sans-serif; background-color: #f0f2f5; }
        
        /* Sol Panel */
        #side { width:350px; background:white; border-right:1px solid #ddd; display:flex; flex-direction:column; }
        .user-item { padding:12px; display:flex; align-items:center; gap:12px; border-bottom:1px solid #f2f2f2; }
        .user-item img { width:45px; height:45px; border-radius:50%; object-fit:cover; }
        .you-tag { background:#e7ffdb; color:#075e54; font-size:10px; padding:2px 6px; border-radius:10px; }

        /* Ana Alan */
        #main { flex:1; display:flex; flex-direction:column; position:relative; overflow:hidden; }
        #chat-bg { position:absolute; top:0; left:0; width:100%; height:100%; z-index:1; background-size:cover; background-position:center; opacity:0.8; pointer-events:none; }
        
        /* Hikaye Barı */
        #story-bar { height:100px; background:white; z-index:10; display:flex; align-items:center; padding:0 15px; gap:15px; border-bottom:1px solid #ddd; overflow-x:auto; }
        .st-ring { width:60px; height:60px; border-radius:50%; border:3px solid var(--wp-green); padding:2px; cursor:pointer; }
        
        /* Mesajlar */
        #chat-box { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:10px; z-index:5; }
        .msg { display:flex; align-items:flex-end; gap:8px; max-width:70%; position:relative; }
        .msg.me { align-self:flex-end; flex-direction:row-reverse; }
        .bubble { background:white; padding:8px 12px; border-radius:12px; position:relative; box-shadow:0 1px 1px rgba(0,0,0,0.1); }
        .me .bubble { background:#dcf8c6; }
        .del-btn { display:none; position:absolute; top:-10px; right:-10px; cursor:pointer; background:red; color:white; border-radius:50%; width:18px; height:18px; font-size:12px; text-align:center; }
        .msg:hover .del-btn { display:block; }
        .u-name { font-size:11px; font-weight:bold; display:block; margin-bottom:2px; color:var(--wp-dark); }

        /* Hikaye Viewer */
        #st-view { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:black; z-index:1000; flex-direction:column; align-items:center; justify-content:center; }
        #st-media { max-width:90%; max-height:80%; border-radius:10px; }
        #st-meta { color:white; margin-bottom:15px; display:flex; align-items:center; gap:10px; }
        
        .footer { padding:10px; background:#f0f0f0; display:flex; gap:10px; z-index:10; }
        input { flex:1; border-radius:20px; border:none; padding:10px; outline:none; }
    </style>
</head>
<body>

<div id="st-view">
    <div id="st-meta"><img id="st-user-ava" style="width:40px;height:40px;border-radius:50%"><span id="st-user-name"></span></div>
    <div id="st-media-box"></div>
    <div style="color:white; margin-top:20px; cursor:pointer" onclick="closeSt()">Kapat</div>
</div>

<div id="side">
    <div style="padding:15px; background:#ededed; display:flex; justify-content:space-between; align-items:center;">
        <img src="{{ user.avatar }}" id="my-ava" onclick="document.getElementById('p-file').click()" style="width:40px;height:40px;border-radius:50%;cursor:pointer;object-fit:cover">
        <div>
            <button onclick="document.getElementById('bg-file').click()">🎨</button>
            <button onclick="resetBg()">🔄</button>
            <button onclick="location.href='/logout'">🚪</button>
        </div>
    </div>
    <div id="online-list"></div>
</div>

<div id="main">
    <div id="chat-bg" style="background-image: url('{{ user.bg_img }}')"></div>
    <div id="story-bar">
        <div style="text-align:center" onclick="document.getElementById('st-file').click()">
            <div style="width:60px;height:60px;border-radius:50%;background:#eee;display:flex;align-items:center;justify-content:center;font-size:30px;cursor:pointer">+</div>
            <small>Ekle</small>
        </div>
        <div id="st-list" style="display:flex; gap:15px"></div>
    </div>
    <div id="chat-box">
        {% for m in initial_msgs %}
        <div class="msg {{ 'me' if m.username == user.username else '' }}" id="m-{{m.id}}">
            <img src="{{ m.user_avatar }}" class="user-ava-img-{{m.username}}" style="width:30px;height:30px;border-radius:50%;object-fit:cover">
            <div class="bubble">
                <span class="u-name">{{ m.username }}</span>
                {{ m.content }}
                {% if m.username == user.username %}<div class="del-btn" onclick="delMsg({{m.id}})">×</div>{% endif %}
            </div>
        </div>
        {% endfor %}
    </div>
    <div class="footer">
        <input type="text" id="mIn" placeholder="Mesaj..." onkeypress="if(event.key==='Enter') send()">
        <button onclick="send()">🚀</button>
    </div>
</div>

<input type="file" id="p-file" style="display:none" onchange="upPro(this)">
<input type="file" id="bg-file" style="display:none" onchange="upBg(this)">
<input type="file" id="st-file" style="display:none" accept="image/*,video/*" onchange="upSt(this)">

<script>
    const socket = io();
    const myName = "{{ user.username }}";
    const box = document.getElementById('chat-box');
    box.scrollTop = box.scrollHeight;

    function send() {
        const i = document.getElementById('mIn');
        if(i.value.trim()) { socket.emit('message', {content: i.value}); i.value=''; }
    }

    socket.on('new_message', d => {
        const isMe = d.user === myName;
        box.insertAdjacentHTML('beforeend', `
            <div class="msg ${isMe?'me':''}" id="m-${d.id}">
                <img src="${d.avatar}" class="user-ava-img-${d.user}" style="width:30px;height:30px;border-radius:50%;object-fit:cover">
                <div class="bubble"><span class="u-name">${d.user}</span>${d.content}${isMe?`<div class="del-btn" onclick="delMsg(${d.id})">×</div>`:''}</div>
            </div>
        `);
        box.scrollTop = box.scrollHeight;
    });

    function delMsg(id) { socket.emit('delete_msg', {id: id}); }
    socket.on('msg_deleted', d => { document.getElementById('m-'+d.id)?.remove(); });

    socket.on('user_status', users => {
        const list = document.getElementById('online-list');
        list.innerHTML = "";
        for(let u in users) {
            list.innerHTML += `<div class="user-item">
                <img src="${users[u].avatar}" class="user-ava-img-${u}">
                <span>${u} ${u===myName?'<span class="you-tag">Siz</span>':''}</span>
            </div>`;
        }
    });

    function upPro(i) {
        const r = new FileReader();
        r.onload = e => {
            socket.emit('update_profile', {avatar: e.target.result});
            document.getElementById('my-ava').src = e.target.result;
        };
        r.readAsDataURL(i.files[0]);
    }

    socket.on('profile_updated', d => {
        document.querySelectorAll('.user-ava-img-'+d.user).forEach(img => img.src = d.avatar);
    });

    function upBg(i) {
        const r = new FileReader();
        r.onload = e => {
            document.getElementById('chat-bg').style.backgroundImage = `url(${e.target.result})`;
            socket.emit('update_bg', {bg: e.target.result});
        };
        r.readAsDataURL(i.files[0]);
    }
    function resetBg() {
        document.getElementById('chat-bg').style.backgroundImage = 'none';
        socket.emit('update_bg', {bg: ""});
    }

    // --- HİKAYE SİSTEMİ ---
    let storyData = {};
    socket.on('all_stories', d => {
        storyData = d;
        const list = document.getElementById('st-list');
        list.innerHTML = "";
        for(let u in d) {
            list.innerHTML += `<div class="st-item" onclick="openSt('${u}')">
                <img src="${d[u].avatar}" class="st-ring">
                <br><small>${u}</small>
            </div>`;
        }
    });

    let currentStIdx = 0;
    let currentStUser = "";
    function openSt(u) {
        currentStUser = u;
        currentStIdx = 0;
        document.getElementById('st-view').style.display = 'flex';
        showStItem();
    }

    function showStItem() {
        const items = storyData[currentStUser].items;
        const item = items[currentStIdx];
        const box = document.getElementById('st-media-box');
        document.getElementById('st-user-ava').src = storyData[currentStUser].avatar;
        document.getElementById('st-user-name').innerText = currentStUser;
        
        box.innerHTML = item.type === 'video' ? `<video src="${item.content}" id="st-media" autoplay></video>` : `<img src="${item.content}" id="st-media">`;
        
        setTimeout(() => {
            if(currentStIdx < items.length - 1) { currentStIdx++; showStItem(); }
            else { closeSt(); }
        }, 4000);
    }
    function closeSt() { document.getElementById('st-view').style.display='none'; }

    function upSt(i) {
        const f = i.files[0];
        const r = new FileReader();
        r.onload = e => socket.emit('add_story', {content: e.target.result, type: f.type.split('/')[0]});
        r.readAsDataURL(f);
    }
</script>
</body>
</html>
