<style>
    /* Madde 9: Hikaye navigasyon alanları */
    .st-nav-left, .st-nav-right { position: absolute; top:0; bottom:0; width: 30%; z-index: 20002; }
    .st-nav-left { left: 0; }
    .st-nav-right { right: 0; }
    
    /* Madde 11: Hikaye yazı alanı */
    #st-text-overlay { position: absolute; bottom: 20%; color: white; font-size: 20px; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); text-align: center; width: 80%; pointer-events: none; z-index: 20003; }

    /* Kamera önizleme */
    #story-cam-preview { display:none; position:fixed; inset:0; background:black; z-index:30000; flex-direction:column; align-items:center; }
    #story-cam-preview video { width:100%; max-height:70vh; }

    .active-dm { background: #dcf8c6 !important; }
</style>

<div id="story-cam-preview">
    <video id="st-vid-feed" autoplay playsinline></video>
    <input type="text" id="st-text-input" placeholder="Hikayene bir yazı ekle..." style="width:80%; padding:10px; margin:10px; border-radius:20px;">
    <div style="display:flex; gap:10px;">
        <button onclick="captureStory()" style="padding:15px; background:red; color:white; border-radius:50%; border:none;">📸 ÇEK</button>
        <button onclick="closeStoryCam()" style="padding:15px; background:gray; color:white; border-radius:50%; border:none;">✖</button>
    </div>
</div>

<div id="story-viewer">
    <div class="st-nav-left" onclick="prevStory()"></div>
    <div class="st-nav-right" onclick="nextStory()"></div>
    <div id="st-progress"></div>
    <div id="st-close" onclick="closeStory()">✖</div>
    <div id="st-delete" onclick="deleteCurrentStory(event)">🗑️</div>
    <img id="st-img">
    <div id="st-text-overlay"></div>
</div>

<script>
    let currentRecipient = 'global';
    let userAvatars = {}; // Madde 4: Anlık avatar takibi
    let myBlocks = []; // Madde 1: Engellenenler

    // Madde 6: Arka planı LocalStorage'dan yükle
    window.onload = () => {
        const savedBg = localStorage.getItem('chat-bg');
        if(savedBg) document.getElementById('main').style.backgroundImage = `url(${savedBg})`;
    };

    // Madde 5: DM Seçeneği ve Kullanıcı Engelleme (Madde 1)
    socket.on('update_online', users => {
        let html = `<div class="user-row ${currentRecipient==='global'?'active-dm':''}" onclick="setRecipient('global')">🌍 Global Chat</div>`;
        for(let u in users) {
            userAvatars[u] = users[u].avatar; 
            if (u !== myUser) {
                html += `<div class="user-row ${currentRecipient===u?'active-dm':''}" onclick="setRecipient('${u}')">
                    <img src="${users[u].avatar}" id="ava-${u}">
                    <span>${u}</span>
                    <button onclick="blockUser(event, '${u}')" style="font-size:10px; margin-left:auto;">🚫 Engelle</button>
                </div>`;
            }
        }
        document.getElementById('online-list').innerHTML = html;
    });

    function setRecipient(user) {
        currentRecipient = user;
        document.getElementById('mIn').placeholder = user === 'global' ? "Global'e yaz..." : `${user} kullanıcısına DM...`;
        // Mesajları filtrele veya yeniden yükle...
        socket.emit('connect'); // Basitçe geçmişi tekrar çekmek için
    }

    function blockUser(e, user) {
        e.stopPropagation();
        if(confirm(`${user} engellensin mi?`)) socket.emit('block_user', {username: user});
    }

    socket.on('user_blocked_status', d => { myBlocks = d.blocked; alert("Engellendi!"); });

    // Madde 4: Avatar anında her yerde güncellensin
    socket.on('avatar_changed_globally', d => {
        userAvatars[d.username] = d.avatar;
        document.querySelectorAll(`img[id^="ava-${d.username}"]`).forEach(img => img.src = d.avatar);
        // Sohbet içindeki eski mesajların avatarlarını da seçicilerle güncelleyebilirsin
    });

    // Madde 2: Hikaye Kamerası
    async function openCamForStory() {
        document.getElementById('story-cam-preview').style.display = 'flex';
        const stream = await navigator.mediaDevices.getUserMedia({video: true});
        document.getElementById('st-vid-feed').srcObject = stream;
    }

    function captureStory() {
        const video = document.getElementById('st-vid-feed');
        const text = document.getElementById('st-text-input').value;
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        const data = canvas.toDataURL('image/jpeg');
        socket.emit('add_story', {content: data, text: text, type: 'image'});
        closeStoryCam();
    }

    function closeStoryCam() {
        const v = document.getElementById('st-vid-feed');
        if(v.srcObject) v.srcObject.getTracks().forEach(t => t.stop());
        document.getElementById('story-cam-preview').style.display = 'none';
    }

    // Madde 8, 9, 10: Hikaye Navigasyonu
    function showStory() {
        const users = Object.keys(storyData);
        const currentStories = storyData[activeStoryUser];
        
        if(activeStoryIndex >= currentStories.length) {
            // Madde 10: Sonraki kullanıcıya geç
            let nextUserIdx = users.indexOf(activeStoryUser) + 1;
            if(nextUserIdx < users.length) {
                openStoryViewer(users[nextUserIdx]);
                return;
            } else { closeStory(); return; }
        }

        if(activeStoryIndex < 0) {
            // Önceki kullanıcıya geç
            let prevUserIdx = users.indexOf(activeStoryUser) - 1;
            if(prevUserIdx >= 0) {
                activeStoryUser = users[prevUserIdx];
                activeStoryIndex = storyData[activeStoryUser].length - 1;
                showStory(); return;
            } else { activeStoryIndex = 0; }
        }

        const s = currentStories[activeStoryIndex];
        document.getElementById('st-img').src = s.content;
        document.getElementById('st-text-overlay').innerText = s.text || "";
        
        // Madde 3: Progress bar güncelleme (CSS transition ile yapılabilir)
        updateProgressBars(currentStories.length);

        clearTimeout(storyTimer);
        storyTimer = setTimeout(() => nextStory(), 5000);
    }

    function nextStory() { activeStoryIndex++; showStory(); }
    function prevStory() { activeStoryIndex--; showStory(); }

    // Klavye yön tuşları (Madde 8)
    window.addEventListener('keydown', e => {
        if(document.getElementById('story-viewer').style.display === 'flex') {
            if(e.key === "ArrowRight") nextStory();
            if(e.key === "ArrowLeft") prevStory();
        }
    });

    // Madde 7: Tüm dosya türlerini destekle (Dosya uzantısını koruyarak)
    function processFile(input) {
        const file = input.files[0];
        const reader = new FileReader();
        reader.onload = e => {
            const type = file.type.startsWith('image/') ? 'image' : (file.type.startsWith('audio/') ? 'audio' : 'file');
            socket.emit('send_msg', {content: e.target.result, type: type, recipient: currentRecipient});
        };
        reader.readAsDataURL(file);
    }

    // Madde 6: Arka plan kaydetme
    function processImage(input, target) {
        const reader = new FileReader();
        reader.onload = e => {
            if(target === 'bg') {
                document.getElementById('main').style.backgroundImage = `url(${e.target.result})`;
                localStorage.setItem('chat-bg', e.target.result);
            }
        }
        reader.readAsDataURL(input.files[0]);
    }
</script>
