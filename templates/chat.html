<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WhatsApp Ultra</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        :root { --main: #075e54; --light: #25D366; --bg: #e5ddd5; }
        /* Mobil Fix: dynamic viewport height */
        body { margin:0; display:flex; height:100dvh; font-family:sans-serif; overflow:hidden; }
        
        #side { width:80px; background:white; border-right:1px solid #ddd; display:flex; flex-direction:column; align-items:center; padding-top:10px; flex-shrink:0; }
        .user-ava { width:50px; height:50px; border-radius:50%; margin-bottom:15px; cursor:pointer; border:2px solid transparent; object-fit: cover; }
        .user-ava.active { border-color: var(--light); }

        #main { flex:1; display:flex; flex-direction:column; position:relative; background-color: var(--bg); background-size: cover; background-position: center; }
        
        #story-area { height:90px; background:white; border-bottom:1px solid #ddd; display:flex; align-items:center; padding:0 10px; gap:10px; overflow-x:auto; flex-shrink:0; }
        .st-ring { min-width:60px; height:60px; border-radius:50%; border:3px solid var(--light); padding:2px; cursor:pointer; }
        .st-ring img { width:100%; height:100%; border-radius:50%; object-fit:cover; }

        #msg-area { flex:1; overflow-y:auto; padding:15px; display:flex; flex-direction:column; gap:10px; }
        .m { max-width:80%; padding:10px; border-radius:10px; font-size:14px; position:relative; box-shadow: 0 1px 1px rgba(0,0,0,0.1); }
        .sent { align-self:flex-end; background:#dcf8c6; }
        .recv { align-self:flex-start; background:white; }

        /* Giriş Alanı - Mobilde kaybolmaması için flex-shrink:0 */
        #input-panel { background:#f0f0f0; padding:10px; display:flex; align-items:center; gap:8px; flex-shrink:0; }
        #input-panel input { flex:1; padding:12px; border-radius:20px; border:none; outline:none; }
        
        /* Hikaye Viewer & Navigasyon */
        #st-viewer { display:none; position:fixed; inset:0; background:black; z-index:10000; justify-content:center; align-items:center; }
        .st-nav { position:absolute; top:0; bottom:0; width:40%; z-index:10001; }
        #st-progress { position:absolute; top:10px; left:5%; width:90%; display:flex; gap:5px; }
        .st-bar { height:3px; background:rgba(255,255,255,0.3); flex:1; }
        .st-fill { height:100%; background:white; width:0%; }

        #cam-mode { display:none; position:fixed; inset:0; background:black; z-index:10005; flex-direction:column; }
        video { width:100%; flex:1; object-fit:cover; }
        
        .hidden { display:none; }
    </style>
</head>
<body>

<div id="side">
    <div class="user-ava active" onclick="setDM('global')" id="target-global" style="background:var(--main); color:white; display:flex; align-items:center; justify-content:center;">🌍</div>
    <div id="online-list"></div>
</div>

<div id="main">
    <div id="story-area">
        <div onclick="openStoryCam()" style="min-width:60px; height:60px; border-radius:50%; background:#eee; display:flex; align-items:center; justify-content:center; cursor:pointer;">📸</div>
        <div id="stories-container" style="display:flex; gap:10px;"></div>
    </div>
    
    <div id="msg-area"></div>

    <div id="input-panel">
        <button onclick="document.getElementById('file-in').click()">📎</button>
        <input type="file" id="file-in" class="hidden" onchange="uploadFile(this)">
        <input type="text" id="mIn" placeholder="Mesaj yazın..." onkeypress="if(event.key==='Enter') send()">
        <button onclick="send()" style="background:var(--main); color:white; border:none; padding:10px; border-radius:50%;">➤</button>
    </div>
</div>

<div id="st-viewer">
    <div id="st-progress"></div>
    <div class="st-nav" style="left:0;" onclick="prevStory()"></div>
    <div class="st-nav" style="right:0;" onclick="nextStory()"></div>
    <div id="st-close" onclick="closeStory()" style="position:absolute; top:30px; right:20px; color:white; font-size:30px; z-index:10006;">✕</div>
    <img id="st-img" style="max-width:100%; max-height:100dvh;">
    <div id="st-text" style="position:absolute; bottom:20%; color:white; font-size:20px; text-align:center; width:80%; text-shadow: 2px 2px 4px #000;"></div>
</div>

<div id="cam-mode">
    <video id="v-feed" autoplay playsinline></video>
    <div style="padding:20px; display:flex; flex-direction:column; gap:10px; background:#000;">
        <input type="text" id="st-txt-in" placeholder="Hikayeye yazı ekle..." style="padding:10px; border-radius:10px; border:none;">
        <div style="display:flex; justify-content:space-around; align-items:center;">
            <button onclick="closeStoryCam()" style="color:white; background:none; border:none; font-size:24px;">✕</button>
            <button onclick="takeStoryPhoto()" style="width:70px; height:70px; border-radius:50%; background:white; border:5px solid #888;"></button>
            <button onclick="switchCamera()" style="color:white; background:none; border:none; font-size:24px;">🔄</button>
        </div>
    </div>
</div>

<script>
    const socket = io();
    const myUser = "{{ user.username }}";
    let currentRecipient = 'global';
    let storyData = {};
    let activeStoryUser = "";
    let activeStoryIdx = 0;
    let storyTimer;

    // Madde 6: Arka plan yükleme
    if(localStorage.getItem('chat-bg')) {
        document.getElementById('main').style.backgroundImage = `url(${localStorage.getItem('chat-bg')})`;
    }

    // Madde 5 & 1: DM ve Engelleme
    socket.on('update_online', users => {
        const list = document.getElementById('online-list');
        list.innerHTML = '';
        for(let u in users) {
            if(u === myUser) continue;
            const img = document.createElement('img');
            img.src = users[u].avatar;
            img.className = 'user-ava';
            img.id = 'ava-' + u;
            img.onclick = () => {
                // Madde 1: Kullanıcıya basınca engelleme seçeneği de çıksın (DM içinde)
                if(confirm(u + " engellensin mi?")) socket.emit('block_user', {username: u});
                setDM(u);
            };
            list.appendChild(img);
        }
    });

    function setDM(u) {
        currentRecipient = u;
        document.querySelectorAll('.user-ava').forEach(a => a.classList.remove('active'));
        if(u === 'global') document.getElementById('target-global').classList.add('active');
        else document.getElementById('ava-' + u).classList.add('active');
        socket.emit('connect'); // Geçmişi tazele
    }

    function send() {
        const i = document.getElementById('mIn');
        if(!i.value) return;
        socket.emit('send_msg', {content: i.value, type:'text', recipient: currentRecipient});
        i.value = '';
    }

    // Madde 7: Tüm dosya türleri (Ses, Görüntü, Video)
    function uploadFile(input) {
        const file = input.files[0];
        const reader = new FileReader();
        reader.onload = e => {
            let type = 'file';
            if(file.type.startsWith('image')) type = 'image';
            else if(file.type.startsWith('audio')) type = 'audio';
            else if(file.type.startsWith('video')) type = 'video';
            socket.emit('send_msg', {content: e.target.result, type: type, recipient: currentRecipient});
        };
        reader.readAsDataURL(file);
    }

    socket.on('load_history', msgs => {
        const area = document.getElementById('msg-area');
        area.innerHTML = '';
        msgs.forEach(m => {
            const d = document.createElement('div');
            d.className = `m ${m.sender === myUser ? 'sent' : 'recv'}`;
            if(m.type === 'text') d.innerHTML = `<b>${m.sender}:</b><br>${m.content}`;
            else if(m.type === 'image') d.innerHTML = `<img src="${m.content}" style="max-width:200px; border-radius:5px;">`;
            else if(m.type === 'audio') d.innerHTML = `<audio controls src="${m.content}"></audio>`;
            else if(m.type === 'video') d.innerHTML = `<video controls src="${m.content}" style="max-width:200px;"></video>`;
            else d.innerHTML = `<a href="${m.content}" download>📄 Dosya İndir</a>`;
            area.appendChild(d);
        });
        area.scrollTop = area.scrollHeight;
    });

    socket.on('new_msg', m => {
        if((m.recipient === 'global' && currentRecipient === 'global') || 
           (m.recipient === myUser && currentRecipient === m.sender) || 
           (m.sender === myUser && currentRecipient === m.recipient)) {
            socket.emit('connect'); // Basitçe listeyi yenile
        }
    });

    // Madde 4: Avatar güncellenince her yer güncellensin
    socket.on('avatar_changed_globally', d => {
        const img = document.getElementById('ava-' + d.username);
        if(img) img.src = d.avatar;
    });

    // --- HİKAYE SİSTEMİ (Madde 2, 3, 8, 9, 10, 11) ---
    socket.on('all_stories', data => {
        storyData = data;
        const cont = document.getElementById('stories-container');
        cont.innerHTML = '';
        for(let u in data) {
            const div = document.createElement('div');
            div.className = 'st-ring';
            div.onclick = () => openStoryViewer(u);
            div.innerHTML = `<img src="${data[u][0].avatar}">`;
            cont.appendChild(div);
        }
    });

    function openStoryViewer(u) {
        activeStoryUser = u; activeStoryIdx = 0;
        document.getElementById('st-viewer').style.display = 'flex';
        showStory();
    }

    function showStory() {
        const stories = storyData[activeStoryUser];
        const s = stories[activeStoryIdx];
        document.getElementById('st-img').src = s.content;
        document.getElementById('st-text').innerText = s.text || "";
        
        // Madde 3: Progress Bar
        const prog = document.getElementById('st-progress');
        prog.innerHTML = '';
        stories.forEach((_, i) => {
            const b = document.createElement('div'); b.className = 'st-bar';
            const f = document.createElement('div'); f.className = 'st-fill';
            if(i < activeStoryIdx) f.style.width = '100%';
            if(i === activeStoryIdx) {
                setTimeout(() => { f.style.transition = 'width 5s linear'; f.style.width = '100%'; }, 50);
            }
            b.appendChild(f); prog.appendChild(b);
        });

        clearTimeout(storyTimer);
        storyTimer = setTimeout(() => nextStory(), 5000);
    }

    function nextStory() {
        const stories = storyData[activeStoryUser];
        if(activeStoryIdx < stories.length - 1) {
            activeStoryIdx++; showStory();
        } else {
            // Madde 10: Diğer kullanıcıya geç
            const users = Object.keys(storyData);
            let idx = users.indexOf(activeStoryUser);
            if(idx < users.length - 1) openStoryViewer(users[idx+1]);
            else closeStory();
        }
    }

    function prevStory() {
        if(activeStoryIdx > 0) { activeStoryIdx--; showStory(); }
    }

    function closeStory() {
        document.getElementById('st-viewer').style.display = 'none';
        clearTimeout(storyTimer);
    }

    // Madde 8: Klavye ok tuşları
    window.onkeydown = e => {
        if(document.getElementById('st-viewer').style.display === 'flex') {
            if(e.key === "ArrowRight") nextStory();
            if(e.key === "ArrowLeft") prevStory();
        }
    };

    // Madde 2 & 11: Kamera ve Yazı
    let currentStream;
    let useFront = true;
    async function openStoryCam() {
        document.getElementById('cam-mode').style.display = 'flex';
        currentStream = await navigator.mediaDevices.getUserMedia({video: {facingMode: useFront ? "user" : "environment"}});
        document.getElementById('v-feed').srcObject = currentStream;
    }

    function switchCamera() {
        useFront = !useFront;
        openStoryCam();
    }

    function takeStoryPhoto() {
        const v = document.getElementById('v-feed');
        const canvas = document.createElement('canvas');
        canvas.width = v.videoWidth; canvas.height = v.videoHeight;
        canvas.getContext('2d').drawImage(v, 0, 0);
        const data = canvas.toDataURL('image/jpeg', 0.7);
        const txt = document.getElementById('st-txt-in').value;
        socket.emit('add_story', {content: data, text: txt, type: 'image'});
        closeStoryCam();
    }

    function closeStoryCam() {
        if(currentStream) currentStream.getTracks().forEach(t => t.stop());
        document.getElementById('cam-mode').style.display = 'none';
    }

    function changeBg(e) {
        // Madde 6 için arka plan değiştirme (Header'a eklenebilir)
    }
</script>
</body>
</html>
