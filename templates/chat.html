<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Sohbet</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>

<style>
body { margin:0; font-family:Segoe UI; background:#e5ddd5; display:flex; height:100vh; }

#side { width:280px; background:#fff; border-right:1px solid #ddd; }

#main { flex:1; display:flex; flex-direction:column; }

#story-bar {
    display:flex;
    gap:15px;
    padding:12px;
    background:#fff;
    border-bottom:1px solid #ddd;
    overflow-x:auto;
}

.st { text-align:center; cursor:pointer; min-width:70px; }
.st img {
    width:60px;
    height:60px;
    border-radius:50%;
    border:3px solid #25D366;
    object-fit:cover;
}

#chat-box {
    flex:1;
    padding:20px;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:10px;
}

.msg { max-width:75%; display:flex; gap:8px; }
.me { align-self:flex-end; flex-direction:row-reverse; }

.bubble {
    background:#fff;
    padding:10px;
    border-radius:10px;
}

.me .bubble { background:#dcf8c6; }

.footer {
    padding:10px;
    background:#f0f0f0;
    display:flex;
    gap:10px;
}

input { flex:1; padding:10px; border-radius:20px; border:none; }
</style>
</head>

<body>

<div id="side"></div>

<div id="main">

    <!-- ✅ STORY BAR ARTIK BURADA -->
    <div id="story-bar">
        <div class="st" onclick="openCreator()">
            <img src="{{ user.avatar }}">
            <div>Ekle</div>
        </div>
        <div id="story-list"></div>
    </div>

    <div id="chat-box"></div>

    <div class="footer">
        <input id="m" placeholder="Mesaj..." onkeydown="if(event.key==='Enter')send()">
        <button onclick="send()">➤</button>
    </div>
</div>

<script>
const socket = io();
const myName = "{{ user.username }}";

socket.emit("join", {});

function send(){
    let i=document.getElementById("m");
    if(i.value.trim()){
        socket.emit("message",{msg:i.value,type:"text"});
        i.value="";
    }
}

socket.on("message",d=>{
    if(document.getElementById("m"+d.id)) return;
    let div=document.createElement("div");
    div.className="msg "+(d.user===myName?"me":"");
    div.id="m"+d.id;
    div.innerHTML=`
        <div class="bubble">
            <b>${d.user}</b><br>${d.msg}
        </div>`;
    document.getElementById("chat-box").appendChild(div);
});

socket.on("story_list",data=>{
    let bar=document.getElementById("story-list");
    bar.innerHTML="";
    for(let u in data){
        let s=document.createElement("div");
        s.className="st";
        s.onclick=()=>alert("Hikaye Aç: "+u);
        s.innerHTML=`<img src="${data[u].avatar}"><div>${u}</div>`;
        bar.appendChild(s);
    }
});

function openCreator(){
    alert("Hikaye ekleme modali burada açılır");
}
</script>

</body>
</html>
