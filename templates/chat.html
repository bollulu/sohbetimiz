<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Sohbet</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

    <script>
        const myUsername = "{{ current_user.username }}";
    </script>
</head>
<body>

<div class="header">
    {{ current_user.username }}
    <a href="/logout" style="color:white; float:right;">Çıkış</a>
</div>

<div class="story-bar">
    <a href="/add-story">+ Story</a>
    {% for s in stories %}
        <img src="/static/stories/{{ s.file }}" width="40">
    {% endfor %}
</div>

<div id="chat" class="chat-container">
    {% for m in messages %}
        <div class="message {{ 'me' if m.username == current_user.username else 'other' }}">
            <b>{{ m.username }}</b><br>
            {{ m.text }}
            {% if m.username == current_user.username %}
                <small>{{ '✔✔' if m.read else '✔' }}</small>
            {% endif %}
        </div>
    {% endfor %}
</div>

<div class="input-area">
    <input id="msg" placeholder="Mesaj yaz...">
    <button onclick="sendMessage()">➤</button>
</div>

<script src="/static/js/chat.js"></script>
</body>
</html>
