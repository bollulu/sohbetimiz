<!DOCTYPE html>
<html>
<head>
    <title>Sohbet Pro 2026</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        :root { --wa-green: #075e54; --wa-light: #dcf8c6; --bg: #e5ddd5; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; height: 100vh; background: var(--bg); overflow: hidden; }
        
        #side-panel { width: 300px; background: white; border-right: 1px solid #ddd; display: flex; flex-direction: column; z-index: 100; }
        .user-row { padding: 12px; border-bottom: 1px solid #eee; cursor: pointer; display: flex; align-items: center; gap: 10px; }
        .online-dot { width: 10px; height: 10px; background: #4CAF50; border-radius: 50%; margin-left: auto; }
        .me-tag { font-size: 10px; background: #e1f5fe; padding: 2px 5px; border-radius: 4px; color: #0288d1; font-weight: bold; }

        /* Profil Resmi Değiştirme Efekti */
        .my-avatar-container { position: relative; cursor: pointer; width: 40px; height: 40px; }
        .my-avatar-container:hover::after { content: "✎"; position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.4); border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .my-avatar-img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: white; }

        #main-chat { flex: 1; display: flex; flex-direction: column; position: relative; }
        #story-bar { display: flex; gap: 15px; padding: 10px; background: white; border-bottom: 1px solid #ddd; overflow-x: auto; min-height: 95px; }
        .story-circle { width: 55px; height: 55px; border-radius: 50%; border: 3px solid #25D366; padding: 2px; object-fit: cover; }
        
        #chat-area { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; }
        .msg-wrap { display: flex; align-items: flex-start; gap: 8px; max-width: 85%; }
        .sent-wrap { align-self: flex-end; flex-direction: row-reverse; }
        .msg { padding: 10px 14px; border-radius: 12px; font-size: 14px; box-shadow: 0 1px 1px rgba(0,0,0,0.1); position: relative; }
        .sent { background: var(--wa-light); border-top-right-radius: 2px; }
        .received { background: white; border-top-left-radius: 2px; }

        #input-area { background: #f0f0f0; padding: 10px; display: flex; align-items: center; gap: 10px; }
        input[type="text"] { flex: 1; padding: 12px; border-radius: 25px; border: none; outline: none; }
        #story-viewer { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:black; z-index:2000; flex-direction:column; align-items:center; justify-content:center; }
    </style>
</head>
<body>

<div id="side-panel">
    <div style="padding:15px; background:var(--wa-green); color:white; display:flex; justify-content:space-between; align-items:center;">
        <b>Sohbetler</b>
        <div class="my-avatar-container" onclick="document.getElementById('profileIn').click()" title="Profil Resmini Değiştir">
            <img src="{{ user.avatar }}" id="my-top-avatar" class="my-avatar-img">
            <input type="file" id="profileIn" style="display:none" onchange="changeProfilePic(this)">
        </div>
    </div>
    <div class="user-row" onclick="joinRoom('Genel')">🌍 <b>Genel Sohbet</b></div>
    <div id="user-list"></div>
</div>

<div id="main-chat">
    <div id="story-bar">
        <div class="story-item" style="display:flex; flex-direction:column; align-items:center; cursor:pointer;" onclick="document.getElementById('stIn').click()">
            <div style="width:55px; height:55px; border:2px dashed #999; border-radius:50%; line-height:55px; text-align:center; font-size:24px; color:#999;">+</div>
            <span style="font-size:11px">Ekle</span>
            <input type="file" id="stIn" style="display:none" onchange="upStory(this)">
        </div>
        <div id="stories-cont" style="display:flex; gap:12px;"></div>
    </div>

    <div id="chat-area"></div>

    <div id="input-area">
        <button onclick="document.getElementById('fIn').click()" style="font-size:20px; border:none; background:none; cursor:pointer;">📁</button>
        <input type="file" id="fIn" style="display:none" onchange="upMedia(this)">
        <input type="text" id="msgInput" placeholder="Mesaj yazın..." onkeydown="if(event.key==='Enter') send()">
        <button onclick="send()" style="font-size:20px; border:none; background:none; cursor:pointer;">➤</button>
    </div>
</div>

<div id="story-viewer">
    <div style="position: absolute; top: 20px; left: 20px; display: flex; align-items: center; gap: 10px; color: white;">
        <img id="story-owner-av" src="" style="width:40px; height:40px; border-radius:50%; object-fit:cover;">
        <b id="story-owner-name"></b>
    </div>
    <span onclick="closeStoryViewer()" style="position:absolute; top:20px; right:30px; color:white; font-size:40px; cursor:pointer;">&times;</span>
    <img id="story-img" src="" style="max-height:80%; max-width:95%; border-radius:10px;" onclick="nextStory()">
</div>

<script>
    const socket = io();
    const myName = "{{ user.username }}";
    let currentRoom = 'Genel', currentStorySet = [], currentStoryIndex = 0;

    socket.emit('join', {room: 'Genel'});

    // RESİM SIKIŞTIRMA VE GÖNDERME (Genel Fonksiyon)
    function compressAndProcess(file, maxSize, quality, callback) {
        const reader = new FileReader();
        reader.onload = (e) => {
            if(!file.type.startsWith('image')) { callback(e.target.result); return; }
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                let w = img.width, h = img.height;
                if (w > h && w > maxSize) { h *= maxSize / w; w = maxSize; }
                else if (h > maxSize) { w *= maxSize / h; h = maxSize; }
                canvas.width = w; canvas.height = h;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, w, h);
                callback(canvas.toDataURL('image/jpeg', quality));
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    // Profil Resmini Değiştirme
    function changeProfilePic(input) {
        if (input.files && input.files[0]) {
            compressAndProcess(input.files[0], 400, 0.6, (data) => {
                socket.emit('update_profile_pic', { avatar: data });
                document.getElementById('my-top-avatar').src = data;
                alert("Profil resminiz güncellendi!");
            });
        }
    }

    // Mesaj/Medya/Story Gönderimleri (Sıkıştırmalı)
    function send() {
        const i = document.getElementById('msgInput');
        if(i.value.trim()) { socket.emit('message', {msg: i.value, type:'text', room: currentRoom}); i.value=''; }
    }

    function upMedia(i) {
        if (i.files[0]) compressAndProcess(i.files[0], 800, 0.5, (data) => {
            const type = i.files[0].type.startsWith('image') ? 'image' : 'video';
            socket.emit('message', {msg: data, type: type, room: currentRoom});
        });
    }

    function upStory(i) {
        if (i.files[0]) compressAndProcess(i.files[0], 1000, 0.5, (data) => {
            socket.emit('upload_story', { img: data });
            i.value = '';
        });
    }

    // Socket Olayları
    socket.on('user_list', users => {
        const list = document.getElementById('user-list'); list.innerHTML = '';
        if(users[myName]) {
            list.innerHTML += `<div class="user-row">
                <img src="${users[myName]}" style="width:35px; height:35px; border-radius:50%; object-fit:cover;">
                <span><b>${myName}</b> <span class="me-tag">Siz</span></span><div class="online-dot"></div>
            </div>`;
        }
        for(let u in users) if(u !== myName) {
            list.innerHTML += `<div class="user-row" onclick="joinRoom('${u}')">
                <img src="${users[u]}" style="width:35px; height:35px; border-radius:50%; object-fit:cover;">
                <span>${u}</span><div class="online-dot"></div>
            </div>`;
        }
    });

    socket.on('message', d => {
        const area = document.getElementById('chat-area');
        const isMe = d.user === myName;
        const wrap = document.createElement('div');
        wrap.className = `msg-wrap ${isMe ? 'sent-wrap' : ''}`;
        let content = d.msg;
        if(d.type === 'image') content = `<img src="${d.msg}" style="max-width:200px; border-radius:8px;">`;
        if(d.type === 'video') content = `<video src="${d.msg}" style="max-width:200px; border-radius:8px;" controls></video>`;

        wrap.innerHTML = `
            <div class="avatar-container">
                <img src="${d.avatar}" class="avatar-chat">
                <div class="avatar-name">${isMe ? 'Siz' : d.user}</div>
            </div>
            <div class="msg ${isMe ? 'sent' : 'received'}">${content}<br><small style="font-size:9px; color:#999;">${d.time}</small></div>`;
        area.appendChild(wrap); area.scrollTop = area.scrollHeight;
    });

    socket.on('story_list', grouped => {
        const cont = document.getElementById('stories-cont'); cont.innerHTML = '';
        for(let u in grouped) {
            const item = document.createElement('div');
            item.className = 'story-item';
            item.onclick = () => { 
                currentStorySet = JSON.parse(JSON.stringify(grouped[u].stories));
                currentStoryIndex = 0; showStoryViewer(u, grouped[u].avatar); 
            };
            item.innerHTML = `<img src="${grouped[u].avatar}" class="story-circle"><span style="font-size:11px">${u === myName ? 'Siz' : u}</span>`;
            cont.appendChild(item);
        }
    });

    function showStoryViewer(name, av) {
        const s = currentStorySet[currentStoryIndex];
        document.getElementById('story-img').src = s.content;
        document.getElementById('story-owner-name').innerText = name;
        document.getElementById('story-owner-av').src = av;
        document.getElementById('story-viewer').style.display = 'flex';
    }

    function nextStory() {
        currentStoryIndex++;
        if(currentStoryIndex < currentStorySet.length) showStoryViewer(document.getElementById('story-owner-name').innerText, document.getElementById('story-owner-av').src);
        else closeStoryViewer();
    }

    function closeStoryViewer() { document.getElementById('story-viewer').style.display = 'none'; }
    
    function joinRoom(t) {
        currentRoom = t === 'Genel' ? 'Genel' : [myName, t].sort().join('-');
        document.getElementById('chat-area').innerHTML = '';
        socket.emit('join', {room: currentRoom});
    }

    socket.on('history', h => h.forEach(msg => socket.emit('message_history_trigger', msg))); // Bu kısmı basitleştirmek için history doğrudan basılabilir
</script>
</body>
</html>
