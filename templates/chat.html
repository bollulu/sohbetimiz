<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Chat Plus 2026</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        :root { --bg: #e5ddd5; --sidebar: white; --header: #075e54; --msg-me: #dcf8c6; --text: #111b21; }
        .dark { --bg: #0b141a; --sidebar: #111b21; --header: #202c33; --msg-me: #005c4b; --text: #e9edef; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; display: flex; height: 100vh; color: var(--text); transition: 0.3s; }
        .sidebar { width: 300px; background: var(--sidebar); border-right: 1px solid #ddd; display: flex; flex-direction: column; }
        .p-area { padding: 25px; background: var(--header); color: white; text-align: center; }
        .p-img { width: 75px; height: 75px; border-radius: 50%; border: 3px solid white; cursor: pointer; object-fit: cover; }
        .chat-area { flex: 1; display: flex; flex-direction: column; }
        #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .msg-row { display: flex; align-items: flex-end; gap: 10px; max-width: 80%; }
        .my-row { align-self: flex-end; flex-direction: row-reverse; }
        .msg-avatar { width: 35px; height: 35px; border-radius: 50%; object-fit: cover; border: 1px solid #ccc; flex-shrink: 0; }
        .bubble { padding: 10px 15px; border-radius: 12px; background: white; color: black; box-shadow: 0 1px 2px rgba(0,0,0,0.1); position: relative; }
        .my-row .bubble { background: var(--msg-me); }
        .bubble img { max-width: 100%; border-radius: 8px; display: block; margin-top: 5px; }
        .del-btn { color: #ff3b30; font-size: 11px; cursor: pointer; margin-top: 5px; font-weight: bold; display: block; }
        .input-bar { padding: 15px; background: #f0f2f5; display: flex; gap: 10px; align-items: center; }
        #msgIn { flex: 1; padding: 12px; border-radius: 25px; border: none; outline: none; }
    </style>
</head>
<body>

<audio id="notif" src="https://assets.mixkit.co/active_storage/sfx/2354/2354-preview.mp3"></audio>

<div class="sidebar">
    <div class="p-area">
        <img src="{{ user.avatar or 'https://cdn-icons-png.flaticon.com/512/149/149071.png' }}" class="p-img" id="avDisp" onclick="$('#avIn').click()">
        <h3 style="margin:10px 0">@{{ user.username }}</h3>
        <input type="file" id="avIn" style="display:none" accept="image/*">
        <button onclick="$('body').toggleClass('dark')" style="background:none; border:1px solid white; color:white; border-radius:15px; cursor:pointer; padding:5px 10px">🌙 Gece Modu</button>
    </div>
    <div style="padding:15px; font-weight:bold; border-bottom:1px solid #eee">Aktif Kullanıcılar</div>
    <ul id="user-list" style="list-style:none; padding:10px; margin:0"></ul>
    <a href="/logout" style="margin-top:auto; padding:20px; color:red; text-decoration:none; font-weight:bold">Çıkış Yap</a>
</div>

<div class="chat-area">
    <div id="chat-box">
        {% for m in history %}
        <div class="msg-row {% if m.username == user.username %}my-row{% endif %}" id="msg-{{ m.id }}">
            <img src="{{ m.avatar or 'https://cdn-icons-png.flaticon.com/512/149/149071.png' }}" class="msg-avatar">
            <div class="bubble">
                <small style="color:#075e54; font-weight:bold">{{ m.username }}</small>
                <div>{% if m.type == 'image' %}<img src="{{ m.content }}">{% else %}{{ m.content }}{% endif %}</div>
                <div style="font-size:10px; color:gray; text-align:right">{{ m.timestamp }}</div>
                {% if m.username == user.username %}
                    <span class="del-btn" onclick="deleteMsg('{{ m.id }}')">Sil</span>
                {% endif %}
            </div>
        </div>
        {% endfor %}
    </div>

    <div class="input-bar">
        <button onclick="$('#imgIn').click()" style="border:none; background:none; font-size:24px; cursor:pointer">📷</button>
        <input type="file" id="imgIn" style="display:none" accept="image/*">
        <input type="text" id="msgIn" placeholder="Mesajınızı yazın..." autocomplete="off">
        <button id="sendBtn" style="background:#075e54; color:white; border:none; padding:12px 25px; border-radius:25px; cursor:pointer; font-weight:bold">GÖNDER</button>
    </div>
</div>

<script>
    var socket = io();
    var myName = "{{ user.username }}";
    var defAv = 'https://cdn-icons-png.flaticon.com/512/149/149071.png';

    function scroll() { $('#chat-box').scrollTop($('#chat-box')[0].scrollHeight); }
    scroll();

    function sendMessage() {
        var m = $('#msgIn').val();
        if(m.trim()) { socket.emit('message', {msg: m, type: 'text'}); $('#msgIn').val(''); }
    }

    $('#sendBtn').click(sendMessage);
    $('#msgIn').on('keypress', function(e) { if(e.which === 13) sendMessage(); });

    $('#avIn').change(function(e) {
        var reader = new FileReader();
        reader.onload = function(evt) {
            socket.emit('update_avatar', {img: evt.target.result});
            $('#avDisp').attr('src', evt.target.result);
        };
        reader.readAsDataURL(e.target.files[0]);
    });

    $('#imgIn').change(function(e) {
        var reader = new FileReader();
        reader.onload = function(evt) { socket.emit('message', {msg: evt.target.result, type: 'image'}); };
        reader.readAsDataURL(e.target.files[0]);
    });

    function deleteMsg(id) { if(confirm("Mesajı silmek istiyor musun?")) socket.emit('delete_message', {id: id}); }

    socket.on('remove_message', function(data) { $(`#msg-${data.id}`).fadeOut(300); });

    socket.on('message', function(data) {
        if(data.user !== myName) document.getElementById('notif').play();
        var isMe = data.user === myName;
        var av = data.avatar || defAv;
        var html = `
            <div class="msg-row ${isMe ? 'my-row' : ''}" id="msg-${data.id}">
                <img src="${av}" class="msg-avatar">
                <div class="bubble">
                    <small style="color:#075e54; font-weight:bold">${data.user}</small>
                    <div>${data.type === 'image' ? `<img src="${data.msg}">` : data.msg}</div>
                    <div style="font-size:10px; color:gray; text-align:right">${data.time}</div>
                    ${isMe ? `<span class="del-btn" onclick="deleteMsg('${data.id}')">Sil</span>` : ''}
                </div>
            </div>`;
        $('#chat-box').append(html);
        scroll();
    });

    socket.on('user_list', function(users) {
        $('#user-list').empty();
        users.forEach(u => {
            var av = u.avatar || defAv;
            $('#user-list').append(`<li style="display:flex; align-items:center; gap:10px; margin-bottom:10px">
                <img src="${av}" style="width:30px; height:30px; border-radius:50%; object-fit:cover">
                <span>${u.name}</span></li>`);
        });
    });
</script>
</body>
</html>
