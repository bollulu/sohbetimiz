<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sohbetimiz</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --main: #075e54; --bg: #e5ddd5; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Header */
        header { background: var(--main); color: white; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; }
        .time-box { font-size: 13px; text-align: right; }

        /* Stories */
        .story-bar { background: #f0f0f0; padding: 10px; display: flex; gap: 12px; border-bottom: 1px solid #ddd; overflow-x: auto; height: 90px; align-items: center; }
        .story { width: 60px; height: 60px; border-radius: 50%; border: 3px solid #25d366; cursor: pointer; position: relative; flex-shrink: 0; }
        .story img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }

        /* Main Body */
        .container { display: flex; flex: 1; overflow: hidden; }
        .sidebar { width: 300px; background: white; border-right: 1px solid #ddd; overflow-y: auto; }
        .chat-view { flex: 1; background: var(--bg); display: flex; flex-direction: column; }
        
        /* Sidebar List */
        .u-item { padding: 15px; border-bottom: 1px solid #eee; display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .u-item:hover { background: #f9f9f9; }
        .u-avatar { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; }

        /* Messages */
        .msgs { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 65%; padding: 8px 12px; border-radius: 10px; position: relative; font-size: 14px; }
        .msg-me { align-self: flex-end; background: #dcf8c6; }
        .msg-other { align-self: flex-start; background: white; }
        .msg-info { font-size: 10px; color: #888; text-align: right; margin-top: 4px; }
        .msg-avatar { width: 20px; height: 20px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }

        /* Input Bar */
        .input-bar { background: #f0f0f0; padding: 10px; display: flex; gap: 10px; align-items: center; }
        .input-bar input { flex: 1; padding: 12px; border: none; border-radius: 20px; outline: none; }
        .icon-btn { cursor: pointer; color: #555; font-size: 18px; }

        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; }
        .modal-body { background: white; padding: 20px; border-radius: 10px; width: 300px; }
    </style>
</head>
<body>

    <header>
        <div>
            <img src="/static/uploads/{{current_user.avatar}}" style="width:35px; height:35px; border-radius:50%; vertical-align:middle; cursor:pointer;" onclick="showProfile()">
            <span style="font-weight:bold; margin-left:10px;">Sohbetimiz</span>
        </div>
        <div class="time-box">
            <div id="dateNow"></div>
            <div id="timeNow" style="font-weight:bold;"></div>
        </div>
    </header>

    <div class="story-bar">
        <div class="story" style="border: 2px dashed #999; display: flex; align-items: center; justify-content: center;" onclick="document.getElementById('storyInput').click()">
            <i class="fa fa-plus"></i>
        </div>
        {% for s in stories %}
        <div class="story" onclick="viewStory('{{s.media}}', '{{s.m_type}}')">
            <img src="/static/uploads/{{s.media if s.m_type == 'image' else 'video_thumb.png'}}">
        </div>
        {% endfor %}
    </div>

    <div class="container">
        <div class="sidebar">
            <div class="u-item" onclick="joinRoom('general', 'Genel Sohbet')">
                <i class="fa fa-users" style="font-size: 24px;"></i>
                <span>Genel Sohbet</span>
            </div>
            <div style="padding: 10px; background: #eee; font-size: 12px; font-weight: bold;">KİŞİLER</div>
            {% for u in users %}
            <div class="u-item" onclick="joinRoom('p_{{ [current_user.id, u.id]|sort|join("_") }}', '{{u.username}}')">
                <img src="/static/uploads/{{u.avatar}}" class="u-avatar">
                <span>{{u.username}} {% if u.id == current_user.id %}(Siz){% endif %}</span>
                {% if u.id != current_user.id %}
                <i class="fa fa-video" style="margin-left: auto; color: var(--main);" onclick="callUser('{{u.id}}')"></i>
                {% endif %}
            </div>
            {% endfor %}
            <div style="padding: 10px; background: #eee; font-size: 12px; font-weight: bold; display: flex; justify-content: space-between;">
                GRUPLAR <i class="fa fa-plus-circle" onclick="createGroup()" style="cursor:pointer;"></i>
            </div>
            </div>

        <div class="chat-view">
            <div id="chatName" style="padding: 10px; background: white; font-weight: bold; border-bottom: 1px solid #ddd;">Bir sohbet seçin</div>
            <div class="msgs" id="msgBox"></div>
            <div class="input-bar">
                <i class="fa fa-paperclip icon-btn" onclick="document.getElementById('fileInput').click()"></i>
                <i class="fa fa-microphone icon-btn" id="micBtn"></i>
                <input type="text" id="mInput" placeholder="Mesaj yazın...">
                <i class="fa fa-paper-plane icon-btn" style="color:var(--main);" onclick="sendText()"></i>
            </div>
        </div>
    </div>

    <input type="file" id="fileInput" class="hidden" onchange="uploadMedia(this)">
    <input type="file" id="storyInput" class="hidden" onchange="uploadStory(this)">

    <div id="storyModal" class="modal" onclick="this.style.display='none'">
        <div id="storyContent" style="max-width: 90%; max-height: 90%;"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script>
        const socket = io();
        let curRoom = '';
        const myName = "{{current_user.username}}";

        // Saat & Tarih
        setInterval(() => {
            const n = new Date();
            document.getElementById('dateNow').innerText = n.toLocaleDateString();
            document.getElementById('timeNow').innerText = n.toLocaleTimeString();
        }, 1000);

        function joinRoom(room, name) {
            curRoom = room;
            document.getElementById('chatName').innerText = name;
            document.getElementById('msgBox').innerHTML = '';
            socket.emit('join', {room: room});
        }

        function sendText() {
            const val = document.getElementById('mInput').value;
            if(val && curRoom) {
                socket.emit('send_msg', {room: curRoom, text: val, type: 'text'});
                document.getElementById('mInput').value = '';
            }
        }

        socket.on('load_history', (data) => data.forEach(addMsg));
        socket.on('receive_msg', addMsg);

        function addMsg(m) {
            const box = document.getElementById('msgBox');
            const div = document.createElement('div');
            div.className = `msg ${m.sender === myName ? 'msg-me' : 'msg-other'}`;
            div.id = `m-${m.id}`;
            
            let html = `<div style="font-weight:bold; font-size:11px; color:#e542a3;">
                ${m.sender !== myName ? `<img src="/static/uploads/${m.avatar}" class="msg-avatar">` : ''}${m.sender}</div>`;
            
            if(m.type === 'text') html += `<div>${m.text}</div>`;
            else if(m.type === 'image') html += `<img src="/static/uploads/${m.text}" style="max-width:200px; border-radius:5px;">`;
            
            html += `<div class="msg-info">${m.time} ${m.sender === myName ? (m.read ? '✓✓' : '✓') : ''} 
                    ${m.sender === myName ? `<i class="fa fa-trash" onclick="delMsg(${m.id})" style="cursor:pointer; margin-left:5px;"></i>` : ''}</div>`;
            
            div.innerHTML = html;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        function delMsg(id) {
            if(confirm('Mesaj silinsin mi?')) socket.emit('delete_msg', {id: id});
        }

        socket.on('msg_deleted', (d) => { document.getElementById(`m-${d.id}`).remove(); });

        function viewStory(media, type) {
            const m = document.getElementById('storyModal');
            const c = document.getElementById('storyContent');
            m.style.display = 'flex';
            c.innerHTML = type === 'image' ? `<img src="/static/uploads/${media}" style="width:100%;">` : 
                          `<video src="/static/uploads/${media}" controls autoplay style="width:100%;"></video>`;
        }
        
        // Video Arama (Simülasyon - WebRTC için ekstra sunucu gerekir)
        function callUser(id) {
            alert("Görüntülü arama başlatılıyor... (Cihaz kamerası aktif ediliyor)");
            navigator.mediaDevices.getUserMedia({video: true, audio: true}).then(stream => {
                // Burada stream socket üzerinden karşıya iletilir
            });
        }
    </script>
</body>
</html>
