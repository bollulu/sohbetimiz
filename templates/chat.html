<!DOCTYPE html>
<html>
<head>
    <title>Sohbetimiz</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        :root { --wp-green: #25D366; --wp-dark: #075e54; }
        body { margin:0; display:flex; height:100vh; font-family:sans-serif; background:#f0f2f5; overflow:hidden; }
        #side { width:300px; background:white; border-right:1px solid #ddd; display:flex; flex-direction:column; }
        #main { flex:1; display:flex; flex-direction:column; position:relative; background:#e5ddd5; }
        
        /* Hikaye Barı (Orta Üst) */
        #story-bar { height:110px; background:white; z-index:10; display:flex; align-items:center; padding:0 15px; gap:15px; border-bottom:1px solid #ddd; overflow-x:auto; }
        .st-ring { width:60px; height:60px; border-radius:50%; border:3px solid var(--wp-green); padding:2px; cursor:pointer; object-fit:cover; }
        .add-st { width:60px; height:60px; border-radius:50%; background:#eee; display:flex; align-items:center; justify-content:center; font-size:30px; cursor:pointer; border:2px dashed #ccc; }

        /* Mesajlar */
        #chat-box { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:10px; z-index:2; position:relative; }
        .msg { display:flex; align-items:flex-end; gap:8px; max-width:70%; }
        .msg.me { align-self:flex-end; flex-direction:row-reverse; }
        .bubble { background:white; padding:10px; border-radius:12px; box-shadow:0 1px 1px rgba(0,0,0,0.1); position:relative; }
        .me .bubble { background:#dcf8c6; }
        .u-name { font-size:11px; font-weight:bold; color:var(--wp-dark); display:block; }
        
        /* Hikaye İzleyici */
        #st-view { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:black; z-index:2000; flex-direction:column; align-items:center; justify-content:center; }
        #st-view video, #st-view img { max-width:95%; max-height:80vh; border-radius:10px; }
        
        .footer { padding:10px; background:#f0f0f0; display:flex; gap:10px; }
        #mIn { flex:1; border-radius:20px; border:none; padding:12px; outline:none; }
        
        /* Kamera Katmanı */
        #cam-layer { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:3000; flex-direction:column; align-items:center; justify-content:center; }
        video#cam-feed { width:80%; max-width:500px; border-radius:15px; }
    </style>
</head>
<body>

<div id="st-view">
    <div style="color:white; position:absolute; top:20px; left:20px; display:flex; align-items:center; gap:10px;">
        <img id="st-user-ava" style="width:40px;height:40px;border-radius:50%">
        <span id="st-user-name"></span>
        <button id="st-del-btn" style="background:red; color:white; border:none; padding:5px; cursor:pointer; display:none;">Sil</button>
    </div>
    <div id="st-media"></div>
    <button onclick="closeSt()" style="position:absolute; top:20px; right:20px; color:white; background:none; border:none; font-size:30px; cursor:pointer;">×</button>
</div>

<div id="cam-layer">
    <video id="cam-feed" autoplay></video>
    <div style="margin-top:20px; display:flex; gap:10px;">
        <button onclick="capturePhoto()" style="padding:10px 20px; background:white; border-radius:50px; border:none; cursor:pointer;">📸 Fotoğraf</button>
        <button onclick="closeCam()" style="padding:10px 20px; background:red; color:white; border-radius:50px; border:none; cursor:pointer;">İptal</button>
    </div>
</div>

<div id="side">
    <div style="padding:15px; background:#ededed; font-weight:bold;">Kullanıcılar</div>
    <div id="online-list"></div>
</div>

<div id="main">
    <div id="story-bar">
        <div style="text-align:center" onclick="chooseStorySource()">
            <div class="add-st">+</div>
            <small>Durumum</small>
        </div>
        <div id="st-list" style="display:flex; gap:15px"></div>
    </div>
    <div id="chat-box"></div>
    <div class="footer">
        <input type="text" id="mIn" placeholder="Mesaj yazın..." onkeypress="if(event.key==='Enter') send()">
        <button onclick="send()">🚀</button>
    </div>
</div>

<input type="file" id="st-file" style="display:none" onchange="upFileStory(this)">
<input type="file" id="st-music" style="display:none" accept="audio/*">

<script>
    const socket = io();
    const myName = "{{ user.username }}";
    let storyData = {};

    function send() {
        const i = document.getElementById('mIn');
        if(i.value.trim()) { socket.emit('message', {content: i.value}); i.value=''; }
    }

    socket.on('new_message', d => {
        const isMe = d.user === myName;
        document.getElementById('chat-box').insertAdjacentHTML('beforeend', `
            <div class="msg ${isMe?'me':''}">
                <img src="${d.avatar}" style="width:30px;height:30px;border-radius:50%">
                <div class="bubble"><span class="u-name">${d.user}</span>${d.content}</div>
            </div>
        `);
        document.getElementById('chat-box').scrollTop = document.getElementById('chat-box').scrollHeight;
    });

    socket.on('user_status', users => {
        let h = "";
        for(let u in users) h += `<div style="padding:10px; border-bottom:1px solid #eee;">${u} ${u===myName?'(Siz)':''}</div>`;
        document.getElementById('online-list').innerHTML = h;
    });

    // HİKAYE FONKSİYONLARI
    function chooseStorySource() {
        if(confirm("Kamerayı kullanmak için TAMAM, dosyadan seçmek için İPTAL deyin.")) openCam();
        else document.getElementById('st-file').click();
    }

    function upFileStory(i) {
        const file = i.files[0];
        const r = new FileReader();
        r.onload = e => {
            let music = "";
            if(confirm("Müzik eklemek ister misiniz?")) {
                document.getElementById('st-music').onchange = (me) => {
                    const mr = new FileReader();
                    mr.onload = (re) => socket.emit('add_story', {content: e.target.result, type: file.type.split('/')[0], music: re.target.result});
                    mr.readAsDataURL(me.target.files[0]);
                };
                document.getElementById('st-music').click();
            } else {
                socket.emit('add_story', {content: e.target.result, type: file.type.split('/')[0]});
            }
        };
        r.readAsDataURL(file);
    }

    async function openCam() {
        document.getElementById('cam-layer').style.display='flex';
        const s = await navigator.mediaDevices.getUserMedia({video:true});
        document.getElementById('cam-feed').srcObject = s;
    }
    function closeCam() {
        document.getElementById('cam-feed').srcObject.getTracks().forEach(t=>t.stop());
        document.getElementById('cam-layer').style.display='none';
    }
    function capturePhoto() {
        const v = document.getElementById('cam-feed');
        const c = document.createElement('canvas');
        c.width=v.videoWidth; c.height=v.videoHeight;
        c.getContext('2d').drawImage(v, 0, 0);
        socket.emit('add_story', {content: c.toDataURL('image/jpeg'), type: 'image'});
        closeCam();
    }

    socket.on('all_stories', d => {
        storyData = d;
        let h = "";
        for(let u in d) h += `<div onclick="openSt('${u}')"><img src="${d[u].avatar}" class="st-ring"><br><small>${u}</small></div>`;
        document.getElementById('st-list').innerHTML = h;
    });

    let stIdx = 0; let curU = "";
    function openSt(u) {
        curU = u; stIdx = 0;
        document.getElementById('st-view').style.display='flex';
        showSt();
    }
    function showSt() {
        const item = storyData[curU].items[stIdx];
        document.getElementById('st-user-ava').src = storyData[curU].avatar;
        document.getElementById('st-user-name').innerText = curU;
        document.getElementById('st-del-btn').style.display = curU === myName ? 'block' : 'none';
        document.getElementById('st-del-btn').onclick = () => { socket.emit('delete_story', {id: item.id}); closeSt(); };
        
        const m = document.getElementById('st-media');
        m.innerHTML = item.type === 'video' ? `<video src="${item.content}" autoplay></video>` : `<img src="${item.content}">`;
        if(item.music) { let a = new Audio(item.music); a.play(); setTimeout(()=>a.pause(), 5000); }
        
        setTimeout(() => { if(stIdx < storyData[curU].items.length-1) { stIdx++; showSt(); } else { closeSt(); } }, 5000);
    }
    function closeSt() { document.getElementById('st-view').style.display='none'; }
</script>
</body>
</html>
