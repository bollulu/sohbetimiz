<!DOCTYPE html>
<html>
<head>
    <title>WhatsApp Pro Music</title>
    <style>
        :root { --whatsapp-bg: #e5ddd5; --wa-green: #25D366; --my-bubble: #dcf8c6; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* Sol Menü: Çevrimiçi Listesi */
        #sidebar { width: 350px; background: #fff; border-right: 1px solid #ddd; display: flex; flex-direction: column; }
        .sidebar-header { padding: 10px 15px; background: #ededed; display: flex; align-items: center; gap: 15px; }
        .user-row { padding: 12px; display: flex; align-items: center; border-bottom: 1px solid #f2f2f2; transition: 0.3s; cursor: pointer; }
        .user-row:hover { background: #f9f9f9; }
        .avatar-main { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; }

        /* Orta Panel */
        #main-chat { flex: 1; display: flex; flex-direction: column; background: var(--whatsapp-bg); position: relative; }
        
        /* HİKAYE BARI (Orta Panel Üstü) */
        #story-panel { height: 110px; background: #fff; border-bottom: 1px solid #ddd; display: flex; align-items: center; padding: 0 15px; gap: 15px; overflow-x: auto; white-space: nowrap; }
        .st-item { display: inline-flex; flex-direction: column; align-items: center; min-width: 75px; cursor: pointer; }
        .st-ring { width: 60px; height: 60px; border-radius: 50%; border: 3px solid var(--wa-green); padding: 2px; object-fit: cover; }
        .st-name { font-size: 12px; margin-top: 5px; color: #333; }

        /* Mesaj Alanı */
        #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .msg-box { display: flex; gap: 10px; max-width: 70%; position: relative; }
        .msg-box.me { align-self: flex-end; flex-direction: row-reverse; }
        .bubble { padding: 8px 12px; border-radius: 10px; background: #fff; box-shadow: 0 1px 1px #0002; position: relative; }
        .me .bubble { background: var(--my-bubble); }
        
        /* Tık İşaretleri */
        .status-tick { font-size: 14px; margin-left: 5px; color: #999; }
        .status-tick.read { color: #34b7f1; }

        /* Silme Butonu */
        .del-btn { color: red; cursor: pointer; font-size: 12px; margin-top: 5px; display: none; }
        .msg-box:hover .del-btn { display: block; }

        /* Alt Footer */
        .footer { background: #f0f0f0; padding: 10px 15px; display: flex; align-items: center; gap: 10px; }
        #mIn { flex: 1; border-radius: 20px; border: none; padding: 10px 15px; outline: none; }

        /* Müzikli Hikaye Viewer */
        #story-viewer { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; }
        #story-img { max-width: 100%; max-height: 80vh; margin: auto; }
        .progress-cont { position: absolute; top: 10px; left: 5%; width: 90%; height: 3px; display: flex; gap: 5px; }
        .prog { flex: 1; background: #555; height: 100%; }
        .prog-fill { background: #fff; width: 0%; height: 100%; transition: width linear; }
    </style>
</head>
<body>

<div id="sidebar">
    <div class="sidebar-header">
        <img src="{{ user.avatar }}" class="avatar-main" id="my-header-ava" onclick="document.getElementById('ava-input').click()" style="cursor:pointer">
        <div style="font-weight: bold;">Siz ({{ user.username }})</div>
    </div>
    <div id="online-list"></div>
</div>

<div id="main-chat">
    <div id="story-panel">
        <div class="st-item" onclick="openStoryCreator()">
            <div style="width:60px; height:60px; border-radius:50%; border:2px dashed #999; display:flex; align-items:center; justify-content:center; font-size:24px; color:#999">+</div>
            <div class="st-name">Ekle</div>
        </div>
        <div id="story-list-container" style="display:flex; gap:15px;"></div>
    </div>

    <div id="messages"></div>

    <div class="footer">
        <span onclick="document.getElementById('msg-file').click()" style="cursor:pointer; font-size:20px;">📎</span>
        <input type="text" id="mIn" placeholder="Mesaj yazın..." onkeydown="if(event.key==='Enter') sendMsg()">
        <button onclick="sendMsg()" style="background:var(--wa-green); color:white; border:none; border-radius:50%; width:40px; height:40px; cursor:pointer">➤</button>
    </div>
</div>

<input type="file" id="ava-input" style="display:none" onchange="updateAva(this)">
<input type="file" id="msg-file" style="display:none" onchange="uploadMsgFile(this)">
<input type="file" id="story-img-in" style="display:none" accept="image/*" onchange="storyImgPicked(this)">
<input type="file" id="story-audio-in" style="display:none" accept="audio/*">

<div id="story-viewer">
    <div class="progress-cont" id="prog-cont"></div>
    <div style="position:absolute; top:30px; left:20px; color:white; display:flex; align-items:center; gap:10px;">
        <img id="st-v-ava" style="width:40px; height:40px; border-radius:50%">
        <span id="st-v-name"></span>
    </div>
    <div style="width:100%; height:100%; display:flex; align-items:center; justify-content:center;">
        <img id="st-v-img">
    </div>
    <div id="music-tag" style="position:absolute; bottom:50px; left:50%; transform:translateX(-50%); color:white; background:rgba(0,0,0,0.5); padding:5px 15px; border-radius:20px; display:none">🎵 Müzik Çalıyor</div>
    <button onclick="closeStory()" style="position:absolute; top:20px; right:20px; color:white; background:none; border:none; font-size:24px; cursor:pointer">✕</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
<script>
    const socket = io();
    const myName = "{{ user.username }}";
    let userAvatars = {};
    let activeStories = {};
    let storyAudio = new Audio();

    // --- PROFİL VE LİSTE GÜNCELLEME ---
    socket.on('update_user_list', data => {
        userAvatars = data;
        const list = document.getElementById('online-list');
        list.innerHTML = '';
        for(let u in data) {
            const isMe = (u === myName);
            list.innerHTML += `
                <div class="user-row">
                    <img src="${data[u]}" class="avatar-main">
                    <div style="margin-left:15px">
                        <div style="font-weight:bold">${isMe ? 'Siz' : u}</div>
                        <div style="font-size:12px; color:gray">çevrimiçi</div>
                    </div>
                </div>
            `;
            if(isMe) document.getElementById('my-header-ava').src = data[u];
        }
        // Avatar değişince mesajları da anında güncelle
        refreshMessageAvatars();
    });

    function refreshMessageAvatars() {
        document.querySelectorAll('.msg-ava').forEach(img => {
            const user = img.getAttribute('data-user');
            if(userAvatars[user]) img.src = userAvatars[user];
        });
    }

    // --- MESAJLAŞMA ---
    function sendMsg() {
        const inp = document.getElementById('mIn');
        if(inp.value.trim()) {
            socket.emit('message', {msg: inp.value, type: 'text'});
            inp.value = '';
        }
    }

    socket.on('message', d => {
        const box = document.getElementById('messages');
        const isMe = d.user === myName;
        const div = document.createElement('div');
        div.className = `msg-box ${isMe ? 'me' : ''}`;
        div.id = `msg-${d.id}`;
        
        div.innerHTML = `
            <img src="${userAvatars[d.user]}" class="msg-ava avatar-main" data-user="${d.user}" style="width:35px; height:35px">
            <div class="bubble">
                <div style="font-size:11px; font-weight:bold; color:var(--wa-green)">${isMe ? 'Siz' : d.user}</div>
                <div>${d.msg}</div>
                <div style="text-align:right; font-size:10px; color:#999; margin-top:5px">
                    ${d.time} <span class="status-tick" id="tick-${d.id}">${isMe ? '✓' : ''}</span>
                </div>
                ${isMe ? `<div class="del-btn" onclick="deleteMsg(${d.id})">Sil</div>` : ''}
            </div>
        `;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    });

    socket.on('msg_status_update', d => {
        const tick = document.getElementById(`tick-${d.id}`);
        if(tick) {
            tick.innerHTML = '✓✓';
            tick.classList.add('read');
        }
    });

    // --- HİKAYE SİSTEMİ ---
    function openStoryCreator() {
        if(confirm("Hikaye için bir görsel seçmek ister misiniz?")) {
            document.getElementById('story-img-in').click();
        }
    }

    function storyImgPicked(input) {
        const reader = new FileReader();
        reader.onload = e => {
            const imgData = e.target.result;
            if(confirm("Bu hikayeye müzik eklemek ister misiniz?")) {
                const audIn = document.getElementById('story-audio-in');
                audIn.onchange = () => {
                    const r2 = new FileReader();
                    r2.onload = e2 => {
                        socket.emit('add_story', {content: imgData, music: e2.target.result, type: 'image'});
                    }
                    r2.readAsDataURL(audIn.files[0]);
                };
                audIn.click();
            } else {
                socket.emit('add_story', {content: imgData, music: null, type: 'image'});
            }
        };
        reader.readAsDataURL(input.files[0]);
    }

    socket.on('story_list', data => {
        activeStories = data;
        const cont = document.getElementById('story-list-container');
        cont.innerHTML = '';
        for(let user in data) {
            cont.innerHTML += `
                <div class="st-item" onclick="viewUserStories('${user}')">
                    <img src="${userAvatars[user]}" class="st-ring">
                    <div class="st-name">${user === myName ? 'Siz' : user}</div>
                </div>
            `;
        }
    });

    let currentStoryIdx = 0;
    let storyUser = "";
    function viewUserStories(user) {
        storyUser = user;
        currentStoryIdx = 0;
        document.getElementById('story-viewer').style.display = 'block';
        showStory();
    }

    function showStory() {
        const stories = activeStories[storyUser];
        const s = stories[currentStoryIdx];
        document.getElementById('st-v-ava').src = userAvatars[storyUser];
        document.getElementById('st-v-name').innerText = storyUser;
        document.getElementById('st-v-img').src = s.content;
        
        // Müzik varsa oynat
        storyAudio.pause();
        if(s.audio) {
            storyAudio.src = s.audio;
            storyAudio.play();
            document.getElementById('music-tag').style.display = 'block';
        } else {
            document.getElementById('music-tag').style.display = 'none';
        }

        // İlerleme çubuğu (5 saniye)
        const progCont = document.getElementById('prog-cont');
        progCont.innerHTML = '';
        stories.forEach((_, i) => {
            const p = document.createElement('div');
            p.className = 'prog';
            const f = document.createElement('div');
            f.className = 'prog-fill';
            if(i < currentStoryIdx) f.style.width = '100%';
            if(i === currentStoryIdx) setTimeout(() => f.style.width = '100%', 100);
            p.appendChild(f);
            progCont.appendChild(p);
        });

        setTimeout(() => {
            if(currentStoryIdx < stories.length - 1) {
                currentStoryIdx++;
                showStory();
            } else {
                closeStory();
            }
        }, 5000);
    }

    function closeStory() {
        document.getElementById('story-viewer').style.display = 'none';
        storyAudio.pause();
    }

    function updateAva(input) {
        const r = new FileReader();
        r.onload = e => socket.emit('update_profile', {avatar: e.target.result});
        r.readAsDataURL(input.files[0]);
    }

    socket.emit('join', {});
</script>
</body>
</html>
