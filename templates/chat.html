<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Sohbet Odası</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        :root { --main: #075e54; --bg: #e5ddd5; }
        body { font-family: sans-serif; margin: 0; display: flex; height: 100vh; background: var(--bg); }
        .sidebar { width: 260px; background: #fff; border-right: 1px solid #ddd; display: flex; flex-direction: column; }
        .chat-area { flex: 1; display: flex; flex-direction: column; }
        #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 8px 12px; border-radius: 8px; max-width: 70%; position: relative; background: #fff; box-shadow: 0 1px 1px rgba(0,0,0,0.1); }
        .my-msg { align-self: flex-end; background: #dcf8c6; }
        .msg img { max-width: 100%; border-radius: 5px; }
        .avatar-img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
        .input-bar { padding: 15px; background: #f0f2f5; display: flex; gap: 10px; }
        input[type="text"] { flex: 1; padding: 10px; border-radius: 20px; border: 1px solid #ddd; outline: none; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div style="padding:20px; background:var(--main); color:white; text-align:center;">
            <img src="{{ user.avatar or 'https://cdn-icons-png.flaticon.com/512/149/149071.png' }}" id="avDisp" class="avatar-img" onclick="$('#avIn').click()" style="cursor:pointer">
            <p>@{{ user.username }}</p>
            <input type="file" id="avIn" style="display:none" accept="image/*">
        </div>
        <div id="user-list" style="padding:10px;"></div>
        <a href="/logout" style="margin-top:auto; padding:15px; color:red; text-decoration:none;">Çıkış Yap</a>
    </div>

    <div class="chat-area">
        <div id="chat-box">
            {% for m in history %}
            <div class="msg {% if m.username == user.username %}my-msg{% endif %}" id="m-{{m.id}}">
                <small><b>{{ m.username }}</b></small>
                <div>{% if m.type == 'image' %}<img src="{{ m.content }}">{% else %}{{ m.content }}{% endif %}</div>
                <small style="color:gray; font-size:10px;">{{ m.timestamp }}</small>
                {% if m.username == user.username %}<span style="cursor:pointer; color:red; font-size:10px;" onclick="delM('{{m.id}}')"> Sil</span>{% endif %}
            </div>
            {% endfor %}
        </div>
        <div class="input-bar">
            <button onclick="$('#imgIn').click()">📷</button>
            <input type="file" id="imgIn" style="display:none" accept="image/*">
            <input type="text" id="msgIn" placeholder="Mesaj yazın...">
            <button onclick="send()">Gönder</button>
        </div>
    </div>

    <script>
        var socket = io();
        function scroll() { $('#chat-box').scrollTop($('#chat-box')[0].scrollHeight); }
        scroll();

        function send() {
            let m = $('#msgIn').val();
            if(m.trim()) { socket.emit('message', {msg: m, type: 'text'}); $('#msgIn').val(''); }
        }

        $('#msgIn').keypress(e => { if(e.which==13) send(); });

        $('#imgIn').change(function(e) {
            let r = new FileReader();
            r.onload = function(ev) { socket.emit('message', {msg: ev.target.result, type: 'image'}); };
            r.readAsDataURL(e.target.files[0]);
        });

        $('#avIn').change(function(e) {
            let r = new FileReader();
            r.onload = function(ev) { 
                socket.emit('update_avatar', {img: ev.target.result}); 
                $('#avDisp').attr('src', ev.target.result);
            };
            r.readAsDataURL(e.target.files[0]);
        });

        function delM(id) { socket.emit('delete_message', {id: id}); }

        socket.on('message', d => {
            let isMe = d.user == "{{ user.username }}";
            let html = `<div class="msg ${isMe?'my-msg':''}" id="m-${d.id}">
                <small><b>${d.user}</b></small>
                <div>${d.type=='image'?`<img src="${d.msg}">`:d.msg}</div>
                <small style="color:gray; font-size:10px;">${d.time}</small>
                ${isMe?`<span style="cursor:pointer; color:red; font-size:10px;" onclick="delM('${d.id}')"> Sil</span>`:''}
            </div>`;
            $('#chat-box').append(html); scroll();
        });

        socket.on('remove_message', d => { $(`#m-${d.id}`).remove(); });
        
        socket.on('user_list', list => {
            $('#user-list').html(list.map(u => `<div>🟢 ${u.name}</div>`).join(''));
        });
    </script>
</body>
</html>
