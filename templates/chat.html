<!DOCTYPE html>
<html>
<head>
    <title>Chat</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: Arial; margin: 0; }
        #chat { height: 80vh; overflow-y: auto; padding: 10px; background: #eee; }
        .me { text-align: right; }
        .msg { margin: 5px 0; }
    </style>
</head>
<body>

<h3>Hoş geldin {{ user.username }} <a href="/logout">Çıkış</a></h3>

<div id="chat"></div>

<input id="msg" placeholder="Mesaj..." onkeydown="if(event.key==='Enter')send()">
<button onclick="send()">Gönder</button>

<script>
const socket = io();
const myName = "{{ user.username }}";

socket.on("history", msgs => {
    document.getElementById("chat").innerHTML = "";
    msgs.forEach(addMsg);
});

socket.on("message", addMsg);

socket.on("message_deleted", d => {
    const el = document.getElementById("m"+d.id);
    if(el) el.remove();
});

function addMsg(m) {
    const d = document.createElement("div");
    d.className = "msg " + (m.user === myName ? "me" : "");
    d.id = "m"+m.id;
    d.innerHTML = `<b>${m.user}</b>: ${m.msg} <small>${m.time}</small>
    ${m.user===myName?`<button onclick="del(${m.id})">Sil</button>`:""}`;
    document.getElementById("chat").appendChild(d);
}

function send() {
    const i = document.getElementById("msg");
    if(i.value.trim()) {
        socket.emit("send_message", {msg:i.value});
        i.value="";
    }
}

function del(id){
    socket.emit("delete_message",{id:id});
}
</script>

</body>
</html>
