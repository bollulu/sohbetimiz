<!DOCTYPE html>
<html>
<head>
    <title>WhatsApp Ultra</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        :root { --wa-green: #075e54; --wa-light: #dcf8c6; --bg: #e5ddd5; }
        body { font-family: sans-serif; margin: 0; display: flex; height: 100vh; background: var(--bg); overflow: hidden; }
        
        #side-panel { width: 350px; background: white; border-right: 1px solid #ddd; display: flex; flex-direction: column; }
        #story-bar { display: flex; padding: 15px; gap: 15px; overflow-x: auto; background: white; border-bottom: 1px solid #eee; }
        
        .story-container { display: flex; flex-direction: column; align-items: center; min-width: 65px; cursor: pointer; position: relative; }
        .story-circle { width: 55px; height: 55px; border-radius: 50%; border: 3px solid #25D366; object-fit: cover; }
        .story-name { font-size: 11px; margin-top: 5px; color: #555; }
        
        #chat-area { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .msg-wrap { display: flex; align-items: flex-end; gap: 8px; max-width: 80%; position: relative; }
        .sent-wrap { align-self: flex-end; flex-direction: row-reverse; }
        .msg { padding: 10px; border-radius: 10px; font-size: 14px; box-shadow: 0 1px 1px rgba(0,0,0,0.1); cursor: pointer; }
        .sent { background: var(--wa-light); }
        .received { background: white; }
        
        .delete-btn { font-size: 10px; color: red; display: none; margin-top: 5px; cursor: pointer; }
        .sent:hover .delete-btn { display: block; }

        #story-modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:black; z-index:1000; flex-direction:column; align-items:center; justify-content:center; }
        .del-story-ui { position: absolute; top: 20px; left: 20px; color: white; background: red; padding: 5px 15px; border-radius: 20px; cursor: pointer; }
    </style>
</head>
<body>

<div id="side-panel">
    <div style="padding:15px; background:var(--wa-green); color:white; display:flex; justify-content:space-between; align-items:center;">
        <img src="{{ user.avatar }}" style="width:40px; height:40px; border-radius:50%;">
        <div style="display:flex; gap:15px; align-items:center;">
            <b onclick="document.getElementById('sIn').click()" style="font-size:24px; cursor:pointer;">+</b>
            <a href="{{ url_for('logout') }}" style="color:white; text-decoration:none; font-size:13px;">Çıkış</a>
        </div>
        <input type="file" id="sIn" style="display:none" onchange="addStory(this)">
    </div>

    <div id="story-bar">
        <div id="st-list" style="display:flex; gap:15px;"></div>
    </div>

    <div id="user-list" style="flex:1; overflow-y:auto; padding:10px;">
        <h4 style="color:#666; margin-bottom:10px;">Çevrimiçi Kişiler</h4>
        <div id="online-users-box"></div>
    </div>
</div>

<div style="flex:1; display:flex; flex-direction:column;">
    <div id="chat-area"></div>
    <div style="padding:15px; background:#f0f0f0; display:flex; gap:10px;">
        <input type="text" id="mIn" style="flex:1; padding:12px; border-radius:25px; border:none;" placeholder="Mesaj yazın..." onkeydown="if(event.key==='Enter') sendMsg()">
        <button onclick="sendMsg()" style="background:none; border:none; font-size:24px; color:var(--wa-green); cursor:pointer;">➤</button>
    </div>
</div>

<div id="story-modal" onclick="this.style.display='none'">
    <div id="del-st-btn" class="del-story-ui" onclick="deleteStory(event)">Sil</div>
    <img id="story-img" style="max-width:90%; max-height:80%;">
    <div id="st-views" style="color:white; margin-top:15px;"></div>
</div>

<script>
    const socket = io();
    const myName = "{{ user.username }}";
    let activeStoryId = null;

    // --- HİKAYE İŞLEMLERİ ---
    function addStory(input) {
        const reader = new FileReader();
        reader.onload = e => socket.emit('add_story', {image: e.target.result});
        reader.readAsDataURL(input.files[0]);
    }

    function deleteStory(e) {
        e.stopPropagation();
        if(confirm("Bu hikayeyi silmek istiyor musunuz?")) {
            socket.emit('delete_story', {id: activeStoryId});
            document.getElementById('story-modal').style.display = 'none';
        }
    }

    socket.on('story_list', data => {
        const box = document.getElementById('st-list');
        box.innerHTML = '';
        for(let user in data) {
            const container = document.createElement('div');
            container.className = 'story-container';
            container.onclick = () => {
                const s = data[user].stories[data[user].stories.length-1];
                activeStoryId = s.id;
                document.getElementById('story-img').src = s.content;
                document.getElementById('del-st-btn').style.display = (user === myName) ? 'block' : 'none';
                document.getElementById('st-views').innerText = "İzleyenler: " + s.views.join(', ');
                document.getElementById('story-modal').style.display = 'flex';
                if(user !== myName) socket.emit('view_story', {story_id: s.id});
            };
            container.innerHTML = `<img src="${data[user].avatar}" class="story-circle"><span class="story-name">${user === myName ? 'Siz' : user}</span>`;
            box.appendChild(container);
        }
    });

    // --- MESAJ İŞLEMLERİ ---
    function sendMsg() {
        const i = document.getElementById('mIn');
        if(i.value.trim()) { socket.emit('message', {msg: i.value}); i.value=''; }
    }

    function addMsg(d) {
        const area = document.getElementById('chat-area');
        const isMe = d.user === myName;
        const div = document.createElement('div');
        div.className = `msg-wrap ${isMe ? 'sent-wrap' : ''}`;
        div.id = `msg-${d.id}`;
        div.innerHTML = `
            <img src="${d.avatar}" style="width:30px; height:30px; border-radius:50%;">
            <div class="msg ${isMe ? 'sent' : 'received'}">
                <div style="font-size:10px; font-weight:bold; color:var(--wa-green);">${isMe ? 'Siz' : d.user}</div>
                ${d.msg}
                <div style="font-size:9px; color:#999; text-align:right;">${d.time}</div>
                ${isMe ? `<div class="delete-btn" onclick="socket.emit('delete_msg', {id:${d.id}})">Sil</div>` : ''}
            </div>`;
        area.appendChild(div);
        area.scrollTop = area.scrollHeight;
    }

    socket.on('msg_deleted', d => {
        const el = document.getElementById(`msg-${d.id}`);
        if(el) el.remove();
    });

    // --- KULLANICI LİSTESİ ---
    socket.on('update_user_list', users => {
        const box = document.getElementById('online-users-box');
        box.innerHTML = '';
        for(let u in users) {
            box.innerHTML += `<div style="display:flex; align-items:center; gap:10px; padding:10px;">
                <img src="${users[u]}" style="width:35px; height:35px; border-radius:50%;">
                <span>${u === myName ? 'Siz' : u}</span>
            </div>`;
        }
    });

    socket.on('message', d => addMsg(d));
    socket.on('history', h => h.forEach(addMsg));
    socket.emit('join', {});
</script>
</body>
</html>
