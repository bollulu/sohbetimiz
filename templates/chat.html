<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>10 LİNE SOHBETİMİZ</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        :root { --main: #075e54; --light: #25D366; --bg: #e5ddd5; --my-msg: #dcf8c6; }
        
        /* Mobil Fix: 100vh yerine 100dvh kullanarak klavye sorununu çözeriz */
        body { margin: 0; font-family: sans-serif; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
        
        header { background: var(--main); color: white; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        
        #app-container { display: flex; flex: 1; overflow: hidden; position: relative; }
        
        #side-panel { width: 70px; background: #fff; border-right: 1px solid #ddd; display: flex; flex-direction: column; align-items: center; padding-top: 10px; overflow-y: auto; flex-shrink: 0; }
        .user-avatar { width: 45px; height: 45px; border-radius: 50%; margin-bottom: 12px; cursor: pointer; border: 2px solid transparent; object-fit: cover; }
        .user-avatar.active { border-color: var(--light); }
        
        #chat-window { flex: 1; display: flex; flex-direction: column; background: var(--bg); background-size: cover; background-position: center; position: relative; overflow: hidden; }
        
        #story-bar { height: 85px; background: rgba(255,255,255,0.9); display: flex; align-items: center; padding: 0 10px; gap: 12px; overflow-x: auto; border-bottom: 1px solid #ddd; flex-shrink: 0; }
        .story-circle { min-width: 58px; height: 58px; border-radius: 50%; border: 3px solid var(--light); padding: 2px; cursor: pointer; }
        .story-circle img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }

        #msg-list { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; }
        .msg { max-width: 85%; padding: 10px 14px; border-radius: 12px; position: relative; word-wrap: break-word; font-size: 15px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .msg.sent { align-self: flex-end; background: var(--my-msg); border-bottom-right-radius: 2px; }
        .msg.received { align-self: flex-start; background: white; border-bottom-left-radius: 2px; }
        .msg small { font-size: 10px; color: #777; display: block; text-align: right; margin-top: 5px; }

        /* Müzik ve Video Oynatıcı Stilleri */
        audio { height: 35px; margin-top: 5px; border-radius: 20px; }
        video { border-radius: 10px; margin-top: 5px; background: #000; }

        /* Mesaj Giriş Alanı - Flex-shrink:0 olması mobilde kaybolmasını engeller */
        #input-area { background: #f0f0f0; padding: 10px 15px; display: flex; align-items: center; gap: 10px; flex-shrink: 0; border-top: 1px solid #ddd; }
        #input-area input[type="text"] { flex: 1; padding: 12px 18px; border-radius: 25px; border: 1px solid #ccc; outline: none; font-size: 16px; }
        #input-area button { background: var(--main); color: white; border: none; padding: 10px; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        /* Hikaye Modalı */
        #story-viewer { display: none; position: fixed; inset: 0; background: black; z-index: 9999; justify-content: center; align-items: center; }
        #st-img { max-width: 100%; max-height: 100dvh; object-fit: contain; }
        #st-progress-container { position: absolute; top: 12px; width: 95%; display: flex; gap: 4px; padding: 0 10px; box-sizing: border-box; }
        .st-bar { height: 3px; background: rgba(255,255,255,0.3); flex: 1; border-radius: 2px; overflow: hidden; }
        .st-fill { height: 100%; background: white; width: 0%; }
        .st-nav { position: absolute; top: 0; bottom: 0; width: 45%; z-index: 10001; }

        #cam-overlay { display: none; position: fixed; inset: 0; background: #000; z-index: 10002; flex-direction: column; }
        #cam-video { width: 100%; flex: 1; object-fit: cover; }

        .hidden { display: none; }
    </style>
</head>
<body>

<header>
    <div style="font-weight: bold; font-size: 18px;">Ultra Chat</div>
    <div style="display: flex; gap: 15px; font-size: 20px;">
        <span onclick="openCamForStory()" style="cursor:pointer;">📸</span>
        <span onclick="document.getElementById('bg-up').click()" style="cursor:pointer;">🖼️</span>
        <input type="file" id="bg-up" class="hidden" accept="image/*" onchange="changeBg(this)">
        <a href="/logout" style="text-decoration: none; color: white;">🚪</a>
    </div>
</header>

<div id="app-container">
    <div id="side-panel">
        <div class="user-avatar active" onclick="setDM('global')" id="target-global" style="background:#075e54; color:white; display:flex; align-items:center; justify-content:center; font-size:20px;">🌍</div>
        <div id="online-users-list"></div>
    </div>

    <div id="chat-window">
        <div id="story-bar"></div>
        <div id="msg-list"></div>
        <div id="input-area">
            <button onclick="document.getElementById('file-up').click()">📎</button>
            <input type="file" id="file-up" class="hidden" onchange="sendFile(this)">
            <input type="text" id="mIn" placeholder="Mesaj yaz..." autocomplete="off">
            <button onclick="sendMsg()">➤</button>
        </div>
    </div>
</div>

<div id="story-viewer">
    <div id="st-progress-container"></div>
    <div class="st-nav" style="left:0;" onclick="prevStory()"></div>
    <div class="st-nav" style="right:0;" onclick="nextStory()"></div>
    <div id="st-close" onclick="closeStory()" style="position:absolute; top:35px; right:20px; color:white; font-size:35px; z-index:10005; cursor:pointer;">✕</div>
    <img id="st-img">
    <div id="st-text-overlay" style="position: absolute; bottom: 20%; color: white; width: 85%; text-align: center; text-shadow: 2px 2px 8px #000; font-size: 20px;"></div>
</div>

<div id="cam-overlay">
    <video id="cam-video" autoplay playsinline></video>
    <div style="padding: 25px; background: rgba(0,0,0,0.8); display: flex; flex-direction: column; gap: 15px;">
        <input type="text" id="st-comment" placeholder="Yazı ekle..." style="padding:12px; border-radius:25px; border:none; width:100%; box-sizing:border-box;">
        <div style="display: flex; justify-content: space-around; align-items:center;">
            <button onclick="closeCam()" style="color:white; background:none; border:none; font-size:28px;">✕</button>
            <button onclick="capturePhoto()" style="width:70px; height:70px; border-radius:50%; background:white; border:6px solid #555;"></button>
            <div style="width:28px;"></div>
        </div>
    </div>
</div>

<script>
    const socket = io();
    const myUser = "{{ user.username }}";
    let currentRecipient = 'global';
    let storyData = {};
    let activeStoryUser = "";
    let activeStoryIndex = 0;
    let storyTimer;

    // Arka Plan Hafızası
    if(localStorage.getItem('chat-bg')) {
        document.getElementById('chat-window').style.backgroundImage = `url(${localStorage.getItem('chat-bg')})`;
    }

    function sendMsg() {
        const inp = document.getElementById('mIn');
        if(!inp.value.trim()) return;
        socket.emit('send_msg', {content: inp.value, type: 'text', recipient: currentRecipient});
        inp.value = '';
    }

    // --- TÜM MEDYA TÜRLERİNİ DESTEKLEYEN FONKSİYON ---
    function sendFile(input) {
        const file = input.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = e => {
            let type = 'file';
            if(file.type.startsWith('image/')) type = 'image';
            else if(file.type.startsWith('audio/')) type = 'audio';
            else if(file.type.startsWith('video/')) type = 'video';
            
            socket.emit('send_msg', {content: e.target.result, type: type, recipient: currentRecipient});
        };
        reader.readAsDataURL(file);
    }

    socket.on('update_online', users => {
        const list = document.getElementById('online-users-list');
        list.innerHTML = '';
        for(let u in users) {
            if(u === myUser) continue;
            const img = document.createElement('img');
            img.src = users[u].avatar || 'https://via.placeholder.com/50';
            img.className = 'user-avatar';
            img.id = 'target-' + u;
            img.onclick = () => setDM(u);
            list.appendChild(img);
        }
    });

    socket.on('load_history', msgs => {
        document.getElementById('msg-list').innerHTML = '';
        msgs.forEach(m => displayMsg(m));
        scrollBottom();
    });

    socket.on('new_msg', m => {
        if((m.recipient === 'global' && currentRecipient === 'global') || 
           (m.recipient === myUser && currentRecipient === m.sender) || 
           (m.sender === myUser && currentRecipient === m.recipient)) {
            displayMsg(m);
            scrollBottom();
        }
    });

    // --- MEDYAYI TÜRÜNE GÖRE GÖSTERME ---
    function displayMsg(m) {
        const list = document.getElementById('msg-list');
        const div = document.createElement('div');
        div.className = `msg ${m.sender === myUser ? 'sent' : 'received'}`;
        
        let html = `<b>${m.sender}:</b><br>`;
        if(m.type === 'text') html += m.content;
        else if(m.type === 'image') html += `<img src="${m.content}" style="width:100%; border-radius:8px; margin-top:5px;" onclick="window.open(this.src)">`;
        else if(m.type === 'audio') html += `<audio controls style="width:100%;"><source src="${m.content}"></audio>`;
        else if(m.type === 'video') html += `<video controls style="width:100%;"><source src="${m.content}"></video>`;
        else html += `📄 <a href="${m.content}" download="dosya">Dosyayı İndir</a>`;
        
        div.innerHTML = html + `<small>${m.time}</small>`;
        list.appendChild(div);
    }

    function scrollBottom() {
        const list = document.getElementById('msg-list');
        list.scrollTop = list.scrollHeight;
    }

    function setDM(user) {
        currentRecipient = user;
        document.querySelectorAll('.user-avatar').forEach(a => a.classList.remove('active'));
        if(user !== 'global') document.getElementById('target-' + user).classList.add('active');
        else document.getElementById('target-global').classList.add('active');
        socket.emit('connect'); 
    }

    // --- HİKAYE SİSTEMİ (OK TUŞLARI DAHİL) ---
    socket.on('all_stories', data => {
        storyData = data;
        const bar = document.getElementById('story-bar');
        bar.innerHTML = '';
        for(let user in data) {
            const div = document.createElement('div');
            div.className = 'story-circle';
            div.onclick = () => openStory(user);
            div.innerHTML = `<img src="${data[user][0].avatar}">`;
            bar.appendChild(div);
        }
    });

    function openStory(user) {
        activeStoryUser = user; activeStoryIndex = 0;
        document.getElementById('story-viewer').style.display = 'flex';
        renderStory();
    }

    function renderStory() {
        const stories = storyData[activeStoryUser];
        const s = stories[activeStoryIndex];
        document.getElementById('st-img').src = s.content;
        document.getElementById('st-text-overlay').innerText = s.text || "";
        
        const prog = document.getElementById('st-progress-container');
        prog.innerHTML = '';
        stories.forEach((_, i) => {
            const b = document.createElement('div'); b.className = 'st-bar';
            const f = document.createElement('div'); f.className = 'st-fill';
            if(i < activeStoryIndex) f.style.width = '100%';
            if(i === activeStoryIndex) {
                setTimeout(() => { f.style.transition = 'width 5s linear'; f.style.width = '100%'; }, 50);
            }
            b.appendChild(f); prog.appendChild(b);
        });

        clearTimeout(storyTimer);
        storyTimer = setTimeout(() => nextStory(), 5000);
    }

    function nextStory() {
        const stories = storyData[activeStoryUser];
        if(activeStoryIndex < stories.length - 1) {
            activeStoryIndex++; renderStory();
        } else {
            const users = Object.keys(storyData);
            let idx = users.indexOf(activeStoryUser);
            if(idx < users.length - 1) openStory(users[idx+1]);
            else closeStory();
        }
    }

    function prevStory() {
        if(activeStoryIndex > 0) { activeStoryIndex--; renderStory(); }
    }

    function closeStory() {
        document.getElementById('story-viewer').style.display = 'none';
        clearTimeout(storyTimer);
    }

    // Klavye Desteği
    window.onkeydown = e => {
        if(document.getElementById('story-viewer').style.display === 'flex') {
            if(e.key === "ArrowRight") nextStory();
            if(e.key === "ArrowLeft") prevStory();
        }
    };

    // --- KAMERA ---
    async function openCamForStory() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: 'user'}});
            document.getElementById('cam-video').srcObject = stream;
            document.getElementById('cam-overlay').style.display = 'flex';
        } catch(e) { alert("Kamera açılamadı!"); }
    }

    function capturePhoto() {
        const vid = document.getElementById('cam-video');
        const canvas = document.createElement('canvas');
        canvas.width = vid.videoWidth; canvas.height = vid.videoHeight;
        canvas.getContext('2d').drawImage(vid, 0, 0);
        const data = canvas.toDataURL('image/jpeg', 0.8);
        socket.emit('add_story', {content: data, text: document.getElementById('st-comment').value, type: 'image'});
        closeCam();
    }

    function closeCam() {
        const vid = document.getElementById('cam-video');
        if(vid.srcObject) vid.srcObject.getTracks().forEach(t => t.stop());
        document.getElementById('cam-overlay').style.display = 'none';
    }

    function changeBg(input) {
        const reader = new FileReader();
        reader.onload = e => {
            document.getElementById('chat-window').style.backgroundImage = `url(${e.target.result})`;
            localStorage.setItem('chat-bg', e.target.result);
        };
        reader.readAsDataURL(input.files[0]);
    }
</script>
</body>
</html>
