<!DOCTYPE html>
<html>
<head>
    <title>Sohbet Pro + Stories</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        :root { --wa-green: #075e54; --wa-light: #dcf8c6; --wa-bg: #e5ddd5; --blue-tick: #34b7f1; }
        body { font-family: 'Segoe UI', sans-serif; background: #ece5dd; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        #side-panel { width: 300px; background: white; border-right: 1px solid #ddd; display: flex; flex-direction: column; }
        #main-chat { flex: 1; display: flex; flex-direction: column; background: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); }

        /* Story Bar */
        #story-bar { display: flex; gap: 15px; padding: 10px; background: white; overflow-x: auto; border-bottom: 1px solid #ddd; min-height: 80px; align-items: center; }
        .story-item { display: flex; flex-direction: column; align-items: center; min-width: 65px; cursor: pointer; }
        .story-circle { width: 50px; height: 50px; border-radius: 50%; border: 3px solid #25D366; padding: 2px; object-fit: cover; }
        .add-story { border: 2px dashed #999; display: flex; align-items: center; justify-content: center; font-size: 24px; color: #999; background: #f9f9f9; }

        /* Mesajlar */
        #chat-area { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 8px; }
        .message-wrapper { display: flex; align-items: flex-end; gap: 8px; }
        .wrapper-sent { flex-direction: row-reverse; }
        .chat-avatar { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; }
        
        .msg { padding: 8px 12px; border-radius: 12px; max-width: 70%; font-size: 0.95em; box-shadow: 0 1px 2px rgba(0,0,0,0.1); position: relative; }
        .received { background: white; border-bottom-left-radius: 2px; }
        .sent { background: var(--wa-light); border-bottom-right-radius: 2px; }
        
        .msg-info { font-size: 0.7em; color: #888; display: flex; align-items: center; justify-content: flex-end; gap: 3px; margin-top: 3px; }
        .tick { font-size: 14px; color: #999; }
        .read-tick { color: var(--blue-tick); }

        /* Input Alanı */
        #input-area { background: #f0f0f0; padding: 10px; display: flex; align-items: center; gap: 10px; }
        #msgInput { flex: 1; padding: 12px; border-radius: 25px; border: none; outline: none; }
        .mic-btn { font-size: 24px; cursor: pointer; border: none; background: none; }
        .recording { color: red; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0; } }

        /* Hikaye Görüntüleyici Modal */
        #story-modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:black; z-index:1000; align-items:center; justify-content:center; }
        #story-modal img { max-width:100%; max-height:100%; }
        #story-modal .close { position:absolute; top:20px; right:20px; color:white; font-size:30px; cursor:pointer; }

        @media (max-width: 700px) { #side-panel { display: none; } }
    </style>
</head>
<body>

    <div id="side-panel">
        <div style="padding:15px; background:#f0f0f0; font-weight:bold; color:var(--wa-green);">Çevrimiçi Kişiler</div>
        <div id="user-list" style="overflow-y:auto;"></div>
    </div>

    <div id="main-chat">
        <div id="story-bar">
            <div class="story-item" onclick="document.getElementById('storyInput').click()">
                <div class="story-circle add-story">+</div>
                <span style="font-size: 10px;">Ekle</span>
                <input type="file" id="storyInput" style="display:none" accept="image/*" onchange="uploadStory(this)">
            </div>
            <div id="other-stories" style="display: flex; gap: 15px;"></div>
        </div>

        <div id="chat-area"></div>

        <div id="input-area">
            <button id="micBtn" class="mic-btn" onmousedown="startRec()" onmouseup="stopRec()" ontouchstart="startRec()" ontouchend="stopRec()">🎤</button>
            <input type="text" id="msgInput" placeholder="Mesaj yazın..." onkeypress="if(event.key==='Enter') send()">
            <button onclick="send()" style="background:var(--wa-green); color:white; border:none; width:45px; height:45px; border-radius:50%; cursor:pointer; font-size:20px;">➤</button>
        </div>
    </div>

    <div id="story-modal">
        <span class="close" onclick="document.getElementById('story-modal').style.display='none'">&times;</span>
        <img id="story-img" src="">
    </div>

    <script>
        const socket = io();
        const myName = "{{ user.username }}";
        let mediaRecorder, chunks = [];

        socket.emit('join', {room: 'Genel'});

        // --- HİKAYE İŞLEMLERİ ---
        function uploadStory(input) {
            const reader = new FileReader();
            reader.onload = e => socket.emit('upload_story', {img: e.target.result});
            reader.readAsDataURL(input.files[0]);
        }

        socket.on('story_list', stories => stories.forEach(addStoryToBar));
        socket.on('new_story', addStoryToBar);

        function addStoryToBar(data) {
            const bar = document.getElementById('other-stories');
            const div = document.createElement('div');
            div.className = 'story-item';
            div.onclick = () => {
                document.getElementById('story-img').src = data.img;
                document.getElementById('story-modal').style.display = 'flex';
                setTimeout(() => document.getElementById('story-modal').style.display = 'none', 5000);
            };
            div.innerHTML = `<img src="${data.avatar}" class="story-circle"><span style="font-size:10px;">${data.username}</span>`;
            bar.prepend(div);
        }

        // --- MESAJ İŞLEMLERİ ---
        function send() {
            const input = document.getElementById('msgInput');
            if(input.value.trim()) { socket.emit('message', {msg: input.value, type: 'text'}); input.value = ''; }
        }

        socket.on('message', data => {
            addMessage(data);
            if(data.user !== myName) socket.emit('mark_read', {id: data.id});
        });

        socket.on('history', msgs => msgs.forEach(addMessage));
        socket.on('message_read', data => {
            const tick = document.querySelector(`#msg-${data.id} .tick`);
            if(tick) { tick.innerHTML = "✓✓"; tick.classList.add('read-tick'); }
        });

        function addMessage(data) {
            const area = document.getElementById('chat-area');
            const isMe = data.user === myName;
            const wrap = document.createElement('div');
            wrap.className = `message-wrapper ${isMe ? 'wrapper-sent' : ''}`;
            
            let content = data.type === 'audio' ? `<audio src="${data.msg}" controls style="width:200px; height:35px;"></audio>` : data.msg;
            let tickClass = data.status === 'read' ? 'tick read-tick' : 'tick';
            let ticks = data.status === 'read' ? '✓✓' : '✓✓';

            wrap.innerHTML = `
                <img src="${data.avatar}" class="chat-avatar">
                <div class="msg ${isMe ? 'sent' : 'received'}" id="msg-${data.id}">
                    <b style="font-size:0.7em; color:var(--wa-green);">${data.user}</b><br>${content}
                    <div class="msg-info">${data.time} ${isMe ? `<span class="${tickClass}">${ticks}</span>`:''}</div>
                </div>`;
            area.appendChild(wrap);
            area.scrollTop = area.scrollHeight;
        }

        // --- SES KAYDI ---
        async function startRec() {
            const stream = await navigator.mediaDevices.getUserMedia({audio:true});
            mediaRecorder = new MediaRecorder(stream);
            chunks = [];
            mediaRecorder.ondataavailable = e => chunks.push(e.data);
            mediaRecorder.onstop = () => {
                const blob = new Blob(chunks, {type: 'audio/webm'});
                const reader = new FileReader();
                reader.onload = e => socket.emit('message', {msg: e.target.result, type: 'audio'});
                reader.readAsDataURL(blob);
            };
            mediaRecorder.start();
            document.getElementById('micBtn').classList.add('recording');
        }
        function stopRec() {
            if(mediaRecorder) { mediaRecorder.stop(); document.getElementById('micBtn').classList.remove('recording'); }
        }

        socket.on('user_list', users => {
            const list = document.getElementById('user-list'); list.innerHTML = '';
            for (let u in users) list.innerHTML += `<div style="padding:10px; display:flex; align-items:center; gap:10px;"><img src="${users[u]}" style="width:35px; height:35px; border-radius:50%; object-fit:cover;"><span>${u}</span></div>`;
        });
    </script>
</body>
</html>
