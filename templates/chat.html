<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Global Chat Ultimate v9</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        :root { --main: #075e54; --me: #dcf8c6; }
        * { box-sizing: border-box; }
        body { font-family: sans-serif; margin: 0; display: flex; height: 100vh; background: #e5ddd5; overflow: hidden; }
        
        /* Sidebar */
        .sidebar { width: 280px; background: #fff; border-right: 1px solid #ddd; display: flex; flex-direction: column; transition: 0.3s; }
        .room-btn { width: 100%; padding: 15px; border: none; background: #fff; cursor: pointer; border-bottom: 1px solid #eee; text-align: left; }
        .room-btn.active { background: #e9edef; border-left: 5px solid var(--main); font-weight: bold; }
        
        /* Chat */
        .chat-area { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        #chat-box { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; background-size: cover; background-position: center; }
        
        .msg-row { display: flex; gap: 8px; margin-bottom: 10px; max-width: 90%; }
        .msg-row.me { align-self: flex-end; flex-direction: row-reverse; }
        .msg-bubble { padding: 8px 12px; border-radius: 10px; background: #fff; box-shadow: 0 1px 1px rgba(0,0,0,0.1); }
        .me .msg-bubble { background: var(--me); }
        .avatar { width: 35px; height: 35px; border-radius: 50%; object-fit: cover; }
        
        /* Input Bar (Mobil Uyumlu) */
        .input-bar { padding: 10px; background: #f0f2f5; display: flex; align-items: center; gap: 8px; }
        #msgIn { flex: 1; padding: 12px; border-radius: 25px; border: 1px solid #ddd; outline: none; font-size: 16px; }
        .btn-round { background: var(--main); color: white; border: none; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        
        /* Mobile Toggle */
        .menu-toggle { display: none; padding: 10px; background: var(--main); color: white; cursor: pointer; }

        @media (max-width: 768px) {
            .sidebar { position: absolute; left: -280px; z-index: 10; height: 100%; }
            .sidebar.open { left: 0; }
            .menu-toggle { display: block; }
        }
        
        .del-btn { color: red; font-size: 10px; cursor: pointer; float: right; margin: 5px 0 0 10px; font-weight: bold; }
        .media-msg { max-width: 250px; border-radius: 8px; margin-top: 5px; display: block; }
    </style>
</head>
<body>
    <audio id="notifSound" src="https://assets.mixkit.co/active_storage/sfx/2358/2358-preview.mp3"></audio>

    <div class="sidebar" id="sidebar">
        <div style="padding:20px; background: var(--main); color:white; text-align:center;">
            <img src="{{ user.avatar or 'https://cdn-icons-png.flaticon.com/512/149/149071.png' }}" id="myAv" class="avatar" style="width:60px; height:60px; cursor:pointer;" onclick="$('#avInput').click()">
            <div style="margin-top:5px;">@{{ user.username }}</div>
            <input type="file" id="avInput" style="display:none" accept="image/*">
        </div>
        <div style="overflow-y:auto; flex:1;">
            <button class="room-btn active" onclick="changeRoom('Genel')">📢 Genel Sohbet</button>
            <button class="room-btn" onclick="changeRoom('Yazılım')">💻 Yazılım Grubu</button>
            <button class="room-btn" onclick="changeRoom('Özel Oda', true)">🔒 Özel Oda (Şifreli)</button>
            <div id="user-list" style="padding:15px; font-size:13px;"></div>
        </div>
        <div style="padding:10px; display:flex; flex-direction:column; gap:5px; border-top:1px solid #eee;">
            <button onclick="$('#bgInput').click()" style="padding:8px; background:#3498db; color:white; border:none; border-radius:5px; font-size:12px;">🖼️ Duvar Kağıdı</button>
            <input type="file" id="bgInput" style="display:none" accept="image/*">
            <a href="/logout" style="text-align:center; padding:10px; color:red; text-decoration:none; font-size:14px;">Çıkış Yap</a>
        </div>
    </div>

    <div class="chat-area">
        <div class="menu-toggle" onclick="$('#sidebar').toggleClass('open')">☰ Menü / Odalar</div>
        <div id="room-title" style="padding:15px; background:#fff; font-weight:bold; border-bottom:1px solid #ddd;">Oda: Genel</div>
        <div id="chat-box"></div>
        <div class="input-bar">
            <button class="btn-round" style="background:#8696a0;" onclick="$('#fileIn').click()">📎</button>
            <input type="file" id="fileIn" style="display:none" accept="image/*,video/*">
            <input type="text" id="msgIn" placeholder="Mesaj..." inputmode="text" autocomplete="off">
            <button class="btn-round" onclick="send()">➔</button>
        </div>
    </div>

    <script>
        var socket = io({ transports: ['websocket', 'polling'], reconnection: true });
        var myUser = "{{ user.username }}";
        var currentRoom = "Genel";

        $(document).ready(function() {
            let savedBg = localStorage.getItem('chat_bg_v9');
            if(savedBg) $('#chat-box').css('background-image', `url(${savedBg})`);
        });

        function changeRoom(name, isPrivate = false) {
            if(name == currentRoom) return;
            let pass = '';
            if(isPrivate) {
                pass = prompt("Bu oda şifrelidir. Şifreyi giriniz:");
                if(!pass) return;
            }
            currentRoom = name;
            $('#room-title').text("Oda: " + name);
            $('.room-btn').removeClass('active');
            $(event.target).addClass('active');
            $('#chat-box').empty();
            $('#sidebar').removeClass('open'); // Mobilde menüyü kapat
            socket.emit('join', {room: name, password: pass});
        }

        socket.emit('join', {room: 'Genel'});

        function send() {
            let input = $('#msgIn');
            let val = input.val();
            if(val.trim()) { 
                socket.emit('message', {msg: val, type: 'text'}); 
                input.val(''); 
                input.focus();
            }
        }

        function addMessage(d, isHistory = false) {
            let isMe = d.user == myUser;
            if(!isMe && !isHistory) document.getElementById('notifSound').play().catch(()=>{});
            
            let content = d.msg;
            if(d.type == 'image') content = `<img src="${d.msg}" class="media-msg" onclick="window.open(this.src)">`;
            else if(d.type == 'video') content = `<video src="${d.msg}" class="media-msg" controls></video>`;

            let html = `
            <div class="msg-row ${isMe?'me':''}" id="m-${d.id}">
                <img src="${d.avatar || 'https://cdn-icons-png.flaticon.com/512/149/149071.png'}" class="avatar">
                <div class="msg-bubble">
                    <small style="color:var(--main); font-weight:bold;">${d.user}</small>
                    <div style="margin-top:3px;">${content}</div>
                    <small style="color:gray; font-size:9px;">${d.time}</small>
                    ${isMe ? `<span class="del-btn" onclick="socket.emit('delete_message',{id:'${d.id}'})">SİL</span>` : ''}
                </div>
            </div>`;
            $('#chat-box').append(html);
            $('#chat-box').scrollTop($('#chat-box')[0].scrollHeight);
        }

        socket.on('message', d => addMessage(d));
        socket.on('history', data => data.forEach(d => addMessage(d, true)));
        socket.on('remove_message', d => $(`#m-${d.id}`).remove());
        
        socket.on('user_list', list => {
            let html = '<b>Çevrimiçi:</b><br>';
            list.forEach(u => { html += `<div style="font-size:12px;">🟢 ${u.name}</div>`; });
            $('#user-list').html(html);
        });

        $('#fileIn').change(function(e) {
            let file = e.target.files[0];
            if(file.size > 5000000) { alert("Dosya çok büyük (Maks 5MB)"); return; }
            let type = file.type.startsWith('image') ? 'image' : 'video';
            let reader = new FileReader();
            reader.onload = ev => socket.emit('message', {msg: ev.target.result, type: type});
            reader.readAsDataURL(file);
        });

        $('#avInput').change(function(e) {
            let reader = new FileReader();
            reader.onload = ev => {
                socket.emit('update_avatar', {img: ev.target.result});
                $('#myAv').attr('src', ev.target.result);
            };
            reader.readAsDataURL(e.target.files[0]);
        });

        $('#bgInput').change(function(e) {
            let reader = new FileReader();
            reader.onload = ev => {
                $('#chat-box').css('background-image', `url(${ev.target.result})`);
                localStorage.setItem('chat_bg_v9', ev.target.result);
            };
            reader.readAsDataURL(e.target.files[0]);
        });

        socket.on('error', d => { alert(d.msg); location.reload(); });
        $('#msgIn').on('keydown', e => { if(e.which==13) send(); });
    </script>
</body>
</html>
