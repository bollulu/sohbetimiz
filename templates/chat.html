<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Süper Chat</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {margin:0; background-color:#ece5dd;}
        .chat-container {display:flex; height:100vh;}
        .sidebar {width:30%; background:white; border-right:1px solid #ddd; overflow-y:auto;}
        .story-bar {display:flex; gap:10px; padding:10px; overflow-x:auto; border-bottom:1px solid #ddd;}
        .story-item {text-align:center;}
        .story-item img {width:60px; height:60px; border-radius:50%; border:2px solid #25d366; cursor:pointer;}
        .chat-box {flex:1; display:flex; flex-direction:column;}
        .messages {flex:1; padding:15px; overflow-y:auto; background:url('https://i.imgur.com/vA3l6sd.png');}
        .input-bar {display:flex; padding:10px; background:white;}
        .input-bar input {flex:1; margin-right:5px;}
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="sidebar">
            <div class="story-bar" id="storyBar"></div>
            <div id="userList" class="p-2"></div>
        </div>
        <div class="chat-box">
            <div class="messages" id="messages"></div>
            <div class="input-bar">
                <input id="msgInput" class="form-control" placeholder="Mesaj yaz...">
                <button id="sendBtn" class="btn btn-success">Gönder</button>
                <button id="addStoryBtn" class="btn btn-secondary ms-1">+ Hikaye</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.4.1/socket.io.min.js"></script>
    <script>
    const socket = io();
    const username = "{{ user.username }}";

    // Bağlantı
    socket.on('connect', () => {
        socket.emit('join_room', {room: 'Genel Sohbet'});
    });

    // Mesaj alma
    socket.on('message', (data) => {
        const box = document.getElementById('messages');
        const div = document.createElement('div');
        div.innerHTML = `<b>${data.user}:</b> ${data.msg}`;
        box.appendChild(div);
    });

    document.getElementById('sendBtn').onclick = () => {
        const msg = document.getElementById('msgInput').value;
        socket.emit('send_message', {room: 'Genel Sohbet', msg, type: 'text'});
        document.getElementById('msgInput').value = '';
    };

    // Hikaye Ekle
    document.getElementById('addStoryBtn').onclick = () => {
        const content = prompt("Hikayen için bir metin veya resim linki gir:");
        if (content) socket.emit('add_story', {content, type: 'text'});
    };

    // Hikaye Liste Güncelle
    socket.on('story_list', (stories) => {
        const bar = document.getElementById('storyBar');
        bar.innerHTML = '';
        for (const [uname, info] of Object.entries(stories)) {
            const div = document.createElement('div');
            div.className = 'story-item';
            div.innerHTML = `<img src="${info.avatar}" title="${uname}"><br>${uname}`;
            bar.appendChild(div);
        }
    });
    </script>
</body>
</html>
