<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Sohbet</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>

<style>
body{margin:0;display:flex;height:100vh;font-family:Arial}
#left{width:260px;background:#fff;border-right:1px solid #ccc;overflow:auto}
#right{flex:1;display:flex;flex-direction:column;background:#e5ddd5}
.user{padding:10px;border-bottom:1px solid #eee}
.online{color:green;font-size:12px}
#chat{flex:1;overflow:auto;padding:10px}
.msg{background:#fff;margin:5px;padding:6px;border-radius:6px;max-width:70%;display:flex;gap:6px}
.me{background:#dcf8c6;margin-left:auto}
.msg img{width:32px;height:32px;border-radius:50%}
#bar{display:flex;padding:10px}
#bar input{flex:1;padding:10px;border-radius:20px;border:none}
</style>
</head>

<body>

<div id="left">
<h4>Kullanıcılar</h4>
{% for u in users %}
<div class="user">
{{ u.username }}
{% if u.online %}<span class="online">●</span>{% endif %}
</div>
{% endfor %}
</div>

<div id="right">
<div id="chat"></div>
<div id="bar">
<input id="msg" placeholder="Mesaj yaz">
<button onclick="send()">➤</button>
</div>
</div>

<script>
const socket = io();
const room = "genel";
const me = "{{ user.username }}";

socket.emit("join_room",{room});

function send(){
    if(msg.value){
        socket.emit("send_msg",{room,msg:msg.value});
        msg.value="";
    }
}

socket.on("history",list=>list.forEach(add));
socket.on("new_msg",add);

function add(d){
    const m=document.createElement("div");
    m.className="msg "+(d.user===me?"me":"");
    m.innerHTML=`<img src="${d.avatar}">
    <div><b>${d.user}</b><br>${d.msg}<br>
    <small>${d.read?"✔✔":"✔"}</small></div>`;
    chat.appendChild(m);
    chat.scrollTop=99999;
    socket.emit("read_msg",{id:d.id});
}
</script>

</body>
</html>
