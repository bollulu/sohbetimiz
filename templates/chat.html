<!DOCTYPE html>
<html>
<head>
    <title>WhatsApp Ultra Final</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script> <style>
        :root { --wa-green: #075e54; --wa-blue: #34b7f1; --bg: #e5ddd5; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; background: var(--bg); }
        
        /* Sol Panel & Hikayeler */
        #side-panel { width: 350px; background: white; border-right: 1px solid #ddd; display: flex; flex-direction: column; }
        #story-area { padding: 10px; border-bottom: 1px solid #eee; display: flex; gap: 10px; overflow-x: auto; background: #f9f9f9; }
        .story-circle { width: 55px; height: 55px; border-radius: 50%; border: 3px solid #25D366; cursor: pointer; padding: 2px; object-fit: cover; }
        
        /* Chat */
        #main { flex: 1; display: flex; flex-direction: column; }
        #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .msg-row { display: flex; align-items: flex-end; gap: 8px; max-width: 80%; }
        .is-me { align-self: flex-end; flex-direction: row-reverse; }
        .msg-bubble { padding: 8px 12px; border-radius: 12px; font-size: 14px; position: relative; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .is-me .msg-bubble { background: #dcf8c6; }
        .not-me .msg-bubble { background: white; }
        .msg-avatar { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; }
        
        /* Tikler */
        .ticks { font-size: 10px; margin-left: 5px; color: #999; }
        .read-blue { color: var(--wa-blue) !important; }

        /* Görüntülü Konuşma Ekranı */
        #video-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 2000; flex-direction: column; align-items: center; justify-content: center; }
        video { width: 300px; border-radius: 10px; background: #333; }
        #remote-video { width: 80%; max-width: 600px; }
    </style>
</head>
<body>

<div id="side-panel">
    <div style="padding:15px; background:var(--wa-green); color:white; display:flex; justify-content:space-between;">
        <img src="{{ user.avatar }}" id="my-profile" style="width:40px; height:40px; border-radius:50%; cursor:pointer;" onclick="changeAvatar()">
        <div style="display:flex; gap:10px;">
            <span onclick="startCallPrompt()" style="cursor:pointer; font-size:20px;">📞</span>
            <span onclick="document.getElementById('sIn').click()" style="cursor:pointer; font-size:20px;">📷</span>
        </div>
    </div>
    
    <div id="story-area">
        <div onclick="document.getElementById('sIn').click()" style="text-align:center; min-width:60px;">
            <img src="{{ user.avatar }}" style="width:55px; height:55px; border-radius:50%; border:2px dashed #ccc;">
            <div style="font-size:10px;">Hikaye Ekle</div>
        </div>
        <div id="others-stories" style="display:flex; gap:10px;"></div>
    </div>

    <div id="online-list" style="overflow-y:auto; flex:1;"></div>
</div>

<div id="main">
    <div id="chat-box"></div>
    <div style="padding:15px; background:#f0f0f0; display:flex; gap:10px; align-items:center;">
        <button onclick="document.getElementById('fIn').click()">📁</button>
        <button id="rec-btn" onmousedown="startRec()" onmouseup="stopRec()">🎤</button>
        <input type="text" id="mIn" style="flex:1; padding:10px; border-radius:20px; border:none;" placeholder="Mesaj yaz..." onkeydown="if(event.key==='Enter') sendMsg()">
        <button onclick="sendMsg()" style="color:var(--wa-green); border:none; background:none; font-size:20px;">➤</button>
    </div>
</div>

<input type="file" id="sIn" style="display:none" onchange="uploadFile(this, 'story')">
<input type="file" id="fIn" style="display:none" onchange="uploadFile(this, 'chat')">

<div id="video-overlay">
    <video id="remote-video" autoplay playsinline></video>
    <video id="local-video" autoplay muted playsinline style="position:absolute; bottom:20px; right:20px; width:150px;"></video>
    <div style="margin-top:20px;">
        <button onclick="switchCamera()" id="cam-switch">Kamera Değiştir</button>
        <button onclick="endCall()" style="background:red; color:white;">Kapat</button>
    </div>
</div>

<script>
    const socket = io();
    const myName = "{{ user.username }}";
    let mediaRecorder;
    let audioChunks = [];
    let currentCamera = "user"; // "user" (ön) veya "environment" (arka)

    // --- HİKAYE MANTIĞI (ÇOKLU) ---
    socket.on('story_list', data => {
        const box = document.getElementById('others-stories');
        box.innerHTML = '';
        for(let user in data) {
            const img = document.createElement('img');
            img.src = data[user].avatar;
            img.className = 'story-circle';
            img.onclick = () => showStories(data[user].items, user);
            box.appendChild(img);
        }
    });

    function showStories(items, user) {
        let index = 0;
        const modal = (content) => {
            const m = document.createElement('div');
            m.style = "position:fixed;top:0;left:0;width:100%;height:100%;background:black;z-index:3000;display:flex;align-items:center;justify-content:center;flex-direction:column;";
            m.innerHTML = `<img src="${items[index].content}" style="max-width:90%;max-height:80%;">
                           <div style="color:white;margin-top:20px;">${user} - ${index+1}/${items.length}</div>
                           ${user === myName ? `<button onclick="deleteSt(${items[index].id})">Sil</button>` : ''}`;
            m.onclick = () => {
                index++;
                if(index < items.length) { document.body.removeChild(m); modal(items[index]); }
                else document.body.removeChild(m);
            };
            document.body.appendChild(m);
        };
        modal(items[0]);
    }

    // --- MESAJLAR VE TİKLER ---
    function sendMsg() {
        const i = document.getElementById('mIn');
        if(i.value.trim()) { socket.emit('message', {msg: i.value, type:'text'}); i.value=''; }
    }

    socket.on('message', d => {
        addMsgToUI(d);
        if(d.user !== myName) socket.emit('mark_as_read', {id: d.id});
    });

    function addMsgToUI(d) {
        const box = document.getElementById('chat-box');
        const isMe = d.user === myName;
        const div = document.createElement('div');
        div.className = `msg-row ${isMe ? 'is-me' : 'not-me'}`;
        div.id = `msg-${d.id}`;
        
        let content = d.msg;
        if(d.type === 'image') content = `<img src="${d.msg}" style="max-width:200px;border-radius:10px;">`;
        if(d.type === 'audio') content = `<audio src="${d.msg}" controls></audio>`;

        div.innerHTML = `
            <img src="${d.avatar}" class="msg-avatar">
            <div class="msg-bubble">
                <div style="font-size:10px;font-weight:bold;color:var(--wa-green);">${isMe ? 'Siz' : d.user}</div>
                ${content}
                <div style="text-align:right;">
                    <span style="font-size:9px;color:#999;">${d.time}</span>
                    ${isMe ? `<span class="ticks ${d.read ? 'read-blue' : ''}" id="tick-${d.id}">${d.read ? '✓✓' : '✓'}</span>` : ''}
                </div>
            </div>`;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    socket.on('msg_read_update', d => {
        const tick = document.getElementById(`tick-${d.id}`);
        if(tick) { tick.innerText = '✓✓'; tick.classList.add('read-blue'); }
    });

    // --- SES KAYDI ---
    async function startRec() {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
        mediaRecorder.onstop = () => {
            const blob = new Blob(audioChunks, { type: 'audio/webm' });
            const reader = new FileReader();
            reader.onload = e => socket.emit('message', {msg: e.target.result, type: 'audio'});
            reader.readAsDataURL(blob);
            audioChunks = [];
        };
        mediaRecorder.start();
        document.getElementById('rec-btn').style.color = 'red';
    }
    function stopRec() { mediaRecorder.stop(); document.getElementById('rec-btn').style.color = 'black'; }

    // --- GÖRÜNTÜLÜ KONUŞMA ---
    let localStream;
    async function switchCamera() {
        currentCamera = currentCamera === "user" ? "environment" : "user";
        if(localStream) {
            localStream.getTracks().forEach(t => t.stop());
            startVideo();
        }
    }

    async function startVideo() {
        document.getElementById('video-overlay').style.display = 'flex';
        localStream = await navigator.mediaDevices.getUserMedia({ 
            video: { facingMode: currentCamera }, 
            audio: true 
        });
        document.getElementById('local-video').srcObject = localStream;
    }

    function endCall() {
        if(localStream) localStream.getTracks().forEach(t => t.stop());
        document.getElementById('video-overlay').style.display = 'none';
    }

    // Dosya yükleme (Hikaye/Chat)
    function uploadFile(input, mode) {
        const reader = new FileReader();
        reader.onload = e => {
            if(mode === 'story') socket.emit('add_story', {image: e.target.result});
            else socket.emit('message', {msg: e.target.result, type: 'image'});
        };
        reader.readAsDataURL(input.files[0]);
    }

    socket.emit('join', {});
</script>
</body>
</html>
