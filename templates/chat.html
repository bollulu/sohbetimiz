<!DOCTYPE html>
<html>
<head>
    <title>Ultimate Chat 2026</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        :root { --wa-green: #075e54; --wa-light: #dcf8c6; --blue-tick: #34b7f1; }
        body { font-family: sans-serif; margin: 0; display: flex; height: 100vh; background: #ece5dd; }
        
        /* Yan Panel */
        #side-panel { width: 300px; background: white; border-right: 1px solid #ddd; display: flex; flex-direction: column; }
        .user-row { padding: 15px; display: flex; align-items: center; gap: 10px; cursor: pointer; border-bottom: 1px solid #eee; }
        .user-row:hover { background: #f5f5f5; }

        /* Ana Alan */
        #main-chat { flex: 1; display: flex; flex-direction: column; position: relative; }
        #chat-bg { position: absolute; top:0; left:0; width:100%; height:100%; z-index:1; background-size: cover; opacity: 0.1; pointer-events: none; }
        
        #story-bar { display: flex; gap: 10px; padding: 10px; background: white; overflow-x: auto; border-bottom: 1px solid #ddd; z-index: 2; }
        .story-circle { width: 45px; height: 45px; border-radius: 50%; border: 2px solid #25D366; padding: 2px; }

        #chat-area { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 2; }
        
        /* Mesaj Balonları */
        .msg { padding: 8px 12px; border-radius: 8px; max-width: 70%; position: relative; box-shadow: 0 1px 1px rgba(0,0,0,0.1); }
        .sent { align-self: flex-end; background: var(--wa-light); }
        .received { align-self: flex-start; background: white; }
        .del-btn { color: red; font-size: 10px; cursor: pointer; margin-left: 8px; }
        .chat-img { max-width: 200px; border-radius: 5px; display: block; }

        #input-area { background: #f0f0f0; padding: 10px; display: flex; align-items: center; gap: 10px; z-index: 10; }
        input[type="text"] { flex: 1; padding: 10px; border-radius: 20px; border: none; }
    </style>
</head>
<body>

<div id="side-panel">
    <div style="padding:15px; background:var(--wa-green); color:white; font-weight:bold;">Sohbetler</div>
    <div class="user-row" onclick="joinPrivate('Genel')"><b>🌍 Genel Sohbet</b></div>
    <div id="user-list"></div>
</div>

<div id="main-chat">
    <div id="chat-bg"></div>
    <div id="story-bar">
        <div onclick="document.getElementById('stIn').click()" style="cursor:pointer; text-align:center;">
            <div style="width:45px; height:45px; border:2px dashed #999; border-radius:50%; line-height:45px;">+</div>
            <input type="file" id="stIn" style="display:none" onchange="upStory(this)">
        </div>
        <div id="stories" style="display:flex; gap:10px;"></div>
    </div>

    <div style="background:#eee; padding:5px 15px; display:flex; justify-content:space-between; z-index:2;">
        <span id="chat-with">Genel Sohbet</span>
        <button onclick="document.getElementById('bgIn').click()">🖼️ Arka Plan</button>
        <input type="file" id="bgIn" style="display:none" onchange="changeBg(this)">
    </div>

    <div id="chat-area"></div>

    <div id="input-area">
        <button onclick="document.getElementById('fileIn').click()">📁</button>
        <input type="file" id="fileIn" style="display:none" onchange="sendFile(this)">
        <input type="text" id="msgInput" placeholder="Mesaj yazın...">
        <button onclick="send()">Gönder</button>
    </div>
</div>

<script>
    const socket = io();
    const myName = "{{ user.username }}";
    let currentRoom = 'Genel';

    socket.emit('join', {room: 'Genel'});

    function joinPrivate(targetUser) {
        let newRoom = targetUser === 'Genel' ? 'Genel' : [myName, targetUser].sort().join('-');
        if(newRoom === currentRoom) return;
        currentRoom = newRoom;
        document.getElementById('chat-with').innerText = targetUser;
        document.getElementById('chat-area').innerHTML = '';
        socket.emit('join', {room: currentRoom});
    }

    function send() {
        const val = document.getElementById('msgInput').value;
        if(val) { socket.emit('message', {msg: val, type:'text', room: currentRoom}); document.getElementById('msgInput').value=''; }
    }

    function sendFile(input) {
        const reader = new FileReader();
        reader.onload = e => socket.emit('message', {msg: e.target.result, type: input.files[0].type.startsWith('image')?'image':'video', room: currentRoom});
        reader.readAsDataURL(input.files[0]);
    }

    function changeBg(input) {
        const reader = new FileReader();
        reader.onload = e => document.getElementById('chat-bg').style.backgroundImage = `url(${e.target.result})`;
        reader.readAsDataURL(input.files[0]);
    }

    socket.on('message', data => addMsg(data));
    socket.on('history', msgs => msgs.forEach(addMsg));
    socket.on('remove_message', d => document.getElementById('m-'+d.id)?.remove());

    function addMsg(data) {
        const area = document.getElementById('chat-area');
        const div = document.createElement('div');
        div.id = 'm-' + data.id;
        div.className = `msg ${data.user === myName ? 'sent' : 'received'}`;
        
        let content = data.type === 'text' ? data.msg : `<img src="${data.msg}" class="chat-img">`;
        let del = data.user === myName ? `<span class="del-btn" onclick="socket.emit('delete_message',{id:${data.id}})">Sil</span>` : '';
        
        div.innerHTML = `<img src="${data.avatar}" style="width:20px; border-radius:50%"> <b>${data.user}</b><br>${content}<br><small>${data.time} ${del}</small>`;
        area.appendChild(div);
        area.scrollTop = area.scrollHeight;
    }

    socket.on('user_list', users => {
        const list = document.getElementById('user-list'); list.innerHTML = '';
        for(let u in users) {
            if(u !== myName) list.innerHTML += `<div class="user-row" onclick="joinPrivate('${u}')"><img src="${users[u]}" style="width:30px; border-radius:50%"> ${u}</div>`;
        }
    });

    function upStory(i){
        const r = new FileReader(); r.onload=e=>socket.emit('upload_story',{img:e.target.result}); r.readAsDataURL(i.files[0]);
    }
    socket.on('story_list', s => s.forEach(addSt));
    socket.on('new_story', addSt);
    function addSt(d){
        const s = document.getElementById('stories');
        s.innerHTML += `<img src="${d.avatar}" class="story-circle" onclick="alert('Hikaye açıldı')">`;
    }
</script>
</body>
</html>
