<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Sohbet</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://cdn.socket.io/4.0.1/socket.io.min.js"></script>

<style>
body{margin:0;font-family:Arial;background:#e5ddd5}
#chat{height:80vh;overflow:auto;padding:10px}
.msg{background:white;padding:8px;margin:5px;border-radius:8px;max-width:70%}
.me{background:#dcf8c6;margin-left:auto}
#bar{display:flex;padding:10px;background:#f0f0f0}
#bar input{flex:1;padding:10px;border-radius:20px;border:none}
#bar button{margin-left:10px;background:#25d366;color:white;border:none;padding:10px}
#story{display:flex;gap:10px;padding:10px;background:white}
.story img{width:60px;height:60px;border-radius:50%;border:2px solid #25d366}
</style>
</head>
<body>

<div id="story">
    <div onclick="uploadStory()">
        <img src="{{ user.avatar }}">
        <div>Hikaye+</div>
    </div>
    <div id="stories"></div>
</div>

<div id="chat"></div>

<div id="bar">
<input id="msg" placeholder="Mesaj yaz">
<button onclick="send()">Gönder</button>
</div>

<input type="file" id="storyfile" accept="image/*,video/*" hidden>

<script>
const socket = io();
let room="genel";

socket.emit("join_room",{room});

socket.on("history",d=>{
    d.forEach(add);
});
socket.on("message",add);

function send(){
    let i=document.getElementById("msg");
    if(i.value){
        socket.emit("send_message",{room,msg:i.value});
        i.value="";
    }
}

function add(d){
    let div=document.createElement("div");
    div.className="msg "+(d.user=="{{ user.username }}"?"me":"");
    div.innerText=d.user+": "+d.msg;
    chat.appendChild(div);
    chat.scrollTop=99999;
}

function uploadStory(){
    document.getElementById("storyfile").click();
}

document.getElementById("storyfile").onchange=e=>{
    let f=e.target.files[0];
    let r=new FileReader();
    r.onload=x=>{
        socket.emit("add_story",{content:x.target.result,type:f.type.includes("video")?"video":"image"});
    }
    r.readAsDataURL(f);
}

socket.on("story_list",data=>{
    let s=document.getElementById("stories");
    s.innerHTML="";
    for(let u in data){
        s.innerHTML+=`<div class="story"><img src="${data[u].avatar}"><div>${u}</div></div>`;
    }
});
</script>

</body>
</html>
