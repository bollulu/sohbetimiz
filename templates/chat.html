<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOHBETİMİZ</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        :root { --bg: #e5ddd5; }
        body { margin:0; display:flex; height:100vh; font-family:sans-serif; background: var(--bg); }
        
        /* Sol Panel */
        #left { width:300px; background:white; border-right:1px solid #ddd; display:flex; flex-direction:column; }
        .panel-title { padding:15px; background:#075e54; color:white; font-weight:bold; }
        .user-item { padding:10px; border-bottom:1px solid #eee; cursor:pointer; display:flex; align-items:center; gap:10px; }
        .user-item img { width:40px; height:40px; border-radius:50%; }

        /* Orta Panel */
        #mid { flex:1; display:flex; flex-direction:column; position:relative; }
        #top-info { position:absolute; top:10px; right:20px; font-size:12px; color:white; background:rgba(0,0,0,0.5); padding:5px 10px; border-radius:15px; z-index:10; }
        
        /* Hikaye Barı */
        #story-bar { height:100px; background:white; border-bottom:1px solid #ddd; display:flex; align-items:center; padding:0 15px; gap:15px; overflow-x:auto; }
        .story-node { width:60px; text-align:center; cursor:pointer; }
        .story-node img { width:55px; height:55px; border-radius:50%; border:2px solid #25D366; }

        /* Mesajlar */
        #chat-box { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:10px; }
        .msg { display:flex; gap:10px; max-width:70%; }
        .msg.me { align-self:flex-end; flex-direction:row-reverse; }
        .bubble { background:white; padding:10px; border-radius:10px; position:relative; box-shadow:0 1px 2px rgba(0,0,0,0.1); }
        .me .bubble { background:#dcf8c6; }
        .delete-btn { font-size:10px; color:red; cursor:pointer; display:block; margin-top:5px; }

        /* Alt Bar */
        footer { padding:10px; background:#f0f0f0; display:flex; gap:10px; align-items:center; }
        #mIn { flex:1; padding:10px; border-radius:20px; border:none; outline:none; }
    </style>
</head>
<body>

<div id="left">
    <div class="panel-title">Aktif Üyeler</div>
    <div id="active-list"></div>
    <hr>
    <div style="padding:10px;">
        <button onclick="changeBg()" style="width:100%;">Arka Plan Değiştir</button>
        <button onclick="resetBg()" style="width:100%; margin-top:5px;">Eski Haline Dön</button>
        <button onclick="showDeleteAcc()" style="width:100%; margin-top:5px; background:red; color:white; border:none;">Hesabı Sil</button>
    </div>
</div>

<div id="mid">
    <div id="top-info"><span id="live-clock"></span></div>
    
    <div id="story-bar">
        <div class="story-node" onclick="addStory()">
            <div style="width:55px;height:55px;background:#eee;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;">+</div>
            <small>Ekle</small>
        </div>
        <div id="story-list" style="display:flex; gap:10px;"></div>
    </div>

    <div id="chat-box"></div>

    <footer>
        <button onclick="document.getElementById('fileIn').click()">📁</button>
        <button id="recBtn" onclick="toggleRecord()">🎤</button>
        <input type="text" id="mIn" placeholder="Bir mesaj yazın..." onkeypress="if(event.key==='Enter') send()">
        <button onclick="send()">🚀</button>
    </footer>
</div>

<input type="file" id="fileIn" style="display:none" onchange="sendFile(this)">

<script>
    const socket = io();
    const myName = "{{ user.username }}";
    
    // Saat Güncelleme
    setInterval(() => {
        document.getElementById('live-clock').innerText = new Date().toLocaleString();
    }, 1000);

    // Mesaj Gönderme
    function send() {
        const i = document.getElementById('mIn');
        if(i.value.trim()){
            socket.emit('send_msg', {content: i.value, type: 'text'});
            i.value = '';
        }
    }

    socket.on('new_msg', d => {
        const isMe = d.sender === myName;
        const html = `
            <div class="msg ${isMe?'me':''}" id="msg-${d.id}">
                <img src="${d.avatar}" style="width:30px;height:30px;border-radius:50%">
                <div class="bubble">
                    <small><b>${d.sender}</b></small><br>
                    ${renderContent(d)}
                    <small style="font-size:9px; color:#888;">${d.time}</small>
                    ${isMe ? `<span class="delete-btn" onclick="deleteMsg(${d.id})">Sil</span>` : ''}
                </div>
            </div>`;
        document.getElementById('chat-box').insertAdjacentHTML('beforeend', html);
        document.getElementById('chat-box').scrollTop = document.getElementById('chat-box').scrollHeight;
    });

    function renderContent(d) {
        if(d.type === 'file') return `<a href="${d.content}" target="_blank">📄 Dosyayı Görüntüle</a>`;
        if(d.type === 'audio') return `<audio src="${d.content}" controls></audio>`;
        return d.content;
    }

    // Aktif Listesi ve Engelleme
    socket.on('update_users', users => {
        let html = "";
        for(let u in users) {
            const label = (u === myName) ? `${u} (Siz)` : u;
            html += `<div class="user-item" onclick="showUserOptions('${u}')">
                <img src="${users[u].avatar}">
                <span>${label}</span>
            </div>`;
        }
        document.getElementById('active-list').innerHTML = html;
    });

    function showUserOptions(target) {
        if(target === myName) return;
        if(confirm(`${target} adlı kullanıcıyı engellemek istiyor musunuz?`)) {
            // Engelleme sinyali gönder...
        }
    }

    // Arka Plan
    function changeBg() { 
        const url = prompt("Resim URL'si girin:");
        if(url) document.getElementById('mid').style.backgroundImage = `url(${url})`; 
    }
    function resetBg() { document.getElementById('mid').style.backgroundImage = 'none'; }

    // Kamera (Telefon/PC Ayrımı)
    async function openCam() {
        const constraints = {
            video: {
                facingMode: (navigator.userAgent.match(/iPhone|Android/i)) ? "user" : "environment"
            },
            audio: true
        };
        // WebRTC işlemleri...
    }

    // Ses Kaydı
    let mediaRecorder;
    let audioChunks = [];
    async function toggleRecord() {
        const btn = document.getElementById('recBtn');
        if(!mediaRecorder || mediaRecorder.state === "inactive") {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
            mediaRecorder.onstop = () => {
                const blob = new Blob(audioChunks, { type: 'audio/ogg' });
                const reader = new FileReader();
                reader.onload = e => socket.emit('send_msg', {content: e.target.result, type: 'audio'});
                reader.readAsDataURL(blob);
                audioChunks = [];
            };
            mediaRecorder.start();
            btn.innerText = "🛑";
        } else {
            mediaRecorder.stop();
            btn.innerText = "🎤";
        }
    }
    
    function showDeleteAcc() {
        if(confirm("Hesabınızı silmek istediğinize emin misiniz? Tüm veriler yok olacak.")){
            const pass = prompt("Güvenlik için şifrenizi girin:");
            if(pass) {
                // Formu post et...
            }
        }
    }
</script>
</body>
</html>
