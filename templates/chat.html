<!DOCTYPE html>
<html>
<head>
    <title>Süper Chat</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>

    <style>
        :root { --bg:#e5ddd5; --green:#008069; --bubble-me:#dcf8c6 }
        body { margin:0; font-family:Arial; height:100vh; display:flex; background:#d1d7db }

        #sidebar { width:350px; background:white; border-right:1px solid #ddd; display:flex; flex-direction:column }
        .header { padding:10px; background:#ededed; display:flex; justify-content:space-between; align-items:center }
        .my-ava { width:40px; height:40px; border-radius:50%; object-fit:cover; cursor:pointer }

        .tab-bar { display:flex }
        .tab { flex:1; padding:12px; text-align:center; cursor:pointer; font-weight:bold; color:gray }
        .tab.active { color:var(--green); border-bottom:3px solid var(--green) }

        #main { flex:1; display:flex; flex-direction:column; background:var(--bg) }

        /* STORY */
        #story-bar { background:white; padding:10px; display:flex; gap:15px; border-bottom:1px solid #ddd; overflow-x:auto }
        .st-circle { width:60px; height:60px; border-radius:50%; border:2px solid var(--green); object-fit:cover; cursor:pointer }

        #chat-area { flex:1; padding:15px; overflow-y:auto }
        .msg { max-width:65%; margin-bottom:8px }
        .msg.me { margin-left:auto }
        .bubble { background:white; padding:8px 12px; border-radius:8px }
        .me .bubble { background:var(--bubble-me) }

        .footer { background:#f0f0f0; padding:10px; display:flex; gap:10px }
        input[type=text] { flex:1; padding:10px; border-radius:20px; border:none }
    </style>
</head>

<body>

<input type="file" id="st-media" accept="image/*,video/*" style="display:none" onchange="uploadStory(this)">

<div id="sidebar">
    <div class="header">
        <div style="display:flex; gap:10px; align-items:center">
            <img src="{{ user.avatar }}" class="my-ava">
            <b>{{ user.username }}</b>
        </div>
        <a href="/logout">🚪</a>
    </div>

    <div class="tab-bar">
        <div class="tab active">Sohbet</div>
        <div class="tab">Grup</div>
        <div class="tab">Müzik</div>
    </div>
</div>

<div id="main">

    <!-- STORY BAR -->
    <div id="story-bar">
        <div onclick="document.getElementById('st-media').click()" style="text-align:center">
            <div class="st-circle" style="border:dashed 2px #999; display:flex; align-items:center; justify-content:center">+</div>
            <div style="font-size:11px">Hikaye</div>
        </div>
        <div id="story-items" style="display:flex; gap:10px"></div>
    </div>

    <!-- CHAT -->
    <div id="chat-area"></div>

    <div class="footer">
        <input type="text" id="mIn" placeholder="Mesaj yaz..." onkeydown="if(event.key==='Enter')send()">
        <button onclick="send()">➤</button>
    </div>

</div>

<script>
const socket = io();
const myName = "{{ user.username }}";

socket.on('connect', () => {
    socket.emit('join_room', {room:'Genel'});
    socket.emit('get_stories');
});

/* ---------------- CHAT ---------------- */

function send() {
    const i = document.getElementById('mIn');
    if(i.value.trim()) {
        socket.emit('send_message', {room:'Genel', msg:i.value, type:'text'});
        i.value='';
    }
}

socket.on('message', d => {
    const div = document.createElement('div');
    div.className = 'msg ' + (d.user===myName?'me':'');
    div.innerHTML = `<div class="bubble">${d.msg}</div>`;
    document.getElementById('chat-area').appendChild(div);
});

/* ---------------- STORY (HTTP UPLOAD) ---------------- */

function uploadStory(input) {
    const f = input.files[0];
    if(!f) return;

    const fd = new FormData();
    fd.append('file', f);

    fetch('/upload_story', {
        method:'POST',
        body:fd
    }).then(() => {
        socket.emit('get_stories');
    });
}

socket.on('story_list', data => {
    const bar = document.getElementById('story-items');
    bar.innerHTML = '';
    for(let u in data) {
        bar.innerHTML += `
        <div onclick="openStory('${data[u].items[0].url}')">
            <img src="${data[u].avatar}" class="st-circle">
        </div>`;
    }
});

function openStory(url) {
    window.open(url, '_blank');
}
</script>

</body>
</html>
