<!DOCTYPE html>
<html>
<head>
    <title>SOHBETİMİZ</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        :root { --wa-green: #25D366; --wa-dark: #075e54; --bg: #e5ddd5; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; background: #f0f2f5; }
        
        #side { width: 350px; background: white; border-right: 1px solid #ddd; display: flex; flex-direction: column; }
        #main { flex: 1; display: flex; flex-direction: column; background: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); }

        /* Story Bar */
        #story-bar { height: 110px; background: white; border-bottom: 1px solid #ddd; display: flex; align-items: center; padding: 0 15px; gap: 15px; overflow-x: auto; }
        .st-item { text-align: center; cursor: pointer; min-width: 70px; }
        .st-circle { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; border: 2px solid var(--wa-green); padding: 2px; }

        /* Online List */
        .user-row { display: flex; align-items: center; padding: 12px 15px; border-bottom: 1px solid #f2f2f2; cursor: pointer; }
        .user-row:hover { background: #f5f5f5; }
        .user-ava { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; margin-right: 15px; }
        .user-row.me { background: #e3f2fd; font-weight: bold; }

        /* Chat */
        #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .msg { display: flex; gap: 10px; max-width: 80%; }
        .msg.me { align-self: flex-end; flex-direction: row-reverse; }
        .bubble { padding: 8px 12px; border-radius: 12px; background: white; box-shadow: 0 1px 1px rgba(0,0,0,0.1); }
        .me .bubble { background: #dcf8c6; }
        .msg-ava-chat { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; }
        .msg-user { font-size: 11px; font-weight: bold; color: #d32f2f; margin-bottom: 2px; }

        .footer { padding: 10px; background: #f0f0f0; display: flex; align-items: center; gap: 10px; }
        #mIn { flex: 1; border: none; padding: 12px; border-radius: 20px; outline: none; }
        .btn { border: none; background: none; cursor: pointer; font-size: 20px; }
    </style>
</head>
<body>

<div id="side">
    <div style="padding:15px; background:#ededed; display:flex; justify-content:space-between; align-items:center;">
        <div style="display:flex; align-items:center; gap:10px;">
            <img src="{{ user.avatar }}" id="my-ava-side" onclick="document.getElementById('p-file').click()" class="user-ava" style="cursor:pointer">
            <b>{{ user.username }}</b>
        </div>
        <div>
            <button class="btn" onclick="location.href='/live'">📹</button>
            <button class="btn" onclick="location.href='/logout'">🚪</button>
        </div>
    </div>
    <div id="online-list" style="overflow-y:auto"></div>
</div>

<div id="main">
    <div id="story-bar">
        <div class="st-item" onclick="document.getElementById('st-file').click()">
            <div class="st-circle" style="display:flex; align-items:center; justify-content:center; border:2px dashed #999; color:#999">+</div>
            <div style="font-size:12px">Ekle</div>
        </div>
        <div id="st-list" style="display:flex; gap:15px"></div>
    </div>

    <div id="chat-box">
        {% for m in initial_msgs %}
        <div class="msg {{ 'me' if m.username == user.username else '' }}" data-user="{{ m.username }}" id="msg-{{ m.id }}">
            <img src="{{ m.user_avatar }}" class="msg-ava-chat">
            <div class="bubble">
                <div class="msg-user">{{ m.username }}</div>
                {% if m.msg_type == 'image' %}<img src="{{ m.content }}" style="max-width:200px; border-radius:8px">
                {% else %}{{ m.content }}{% endif %}
                <div style="font-size:10px; color:#888; text-align:right; margin-top:4px">
                    {{ m.timestamp }}
                    {% if m.username == user.username %}<span style="color:red; cursor:pointer" onclick="deleteMsg({{ m.id }})">🗑️</span>{% endif %}
                </div>
            </div>
        </div>
        {% endfor %}
    </div>

    <div class="footer">
        <input type="text" id="mIn" placeholder="Mesaj yazın..." autocomplete="off">
        <button class="btn" onclick="sendMsg()">🚀</button>
    </div>
</div>

<input type="file" id="p-file" style="display:none" onchange="uploadProfile(this)" accept="image/*">
<input type="file" id="st-file" style="display:none" onchange="uploadStory(this)" accept="image/*">

<script>
    const socket = io();
    const myName = "{{ user.username }}";
    const chatBox = document.getElementById('chat-box');
    chatBox.scrollTop = chatBox.scrollHeight;

    // --- ENTER BASINCA MESAJ GİTSİN ---
    document.getElementById('mIn').addEventListener('keypress', (e) => {
        if(e.key === 'Enter') sendMsg();
    });

    function sendMsg() {
        const input = document.getElementById('mIn');
        if(input.value.trim()) {
            socket.emit('message', {msg: input.value, type: 'text'});
            input.value = '';
        }
    }

    socket.on('new_message', d => {
        const isMe = d.user === myName;
        const html = `
            <div class="msg ${isMe?'me':''}" data-user="${d.user}" id="msg-${d.id}">
                <img src="${d.avatar}" class="msg-ava-chat">
                <div class="bubble">
                    <div class="msg-user">${d.user}</div>
                    ${d.msg}
                    <div style="font-size:10px; color:#888; text-align:right; margin-top:4px">
                        ${d.time} ${isMe ? `<span style="color:red; cursor:pointer" onclick="deleteMsg(${d.id})">🗑️</span>` : ''}
                    </div>
                </div>
            </div>`;
        chatBox.insertAdjacentHTML('beforeend', html);
        chatBox.scrollTop = chatBox.scrollHeight;
    });

    // --- AKTİF KİŞİLERDE KENDİNİ GÖRME ---
    socket.on('update_user_list', users => {
        const list = document.getElementById('online-list');
        list.innerHTML = "";
        
        // Önce Kendini Ekle (Siz)
        if(users[myName]) {
            list.innerHTML += `<div class="user-row me"><img src="${users[myName].avatar}" class="user-ava"> Siz (Çevrimiçi)</div>`;
        }

        for(let u in users) {
            if(u !== myName) {
                list.innerHTML += `<div class="user-row"><img src="${users[u].avatar}" class="user-ava"> ${u}</div>`;
            }
        }
    });

    function deleteMsg(id) { socket.emit('delete_message', {id: id}); }
    socket.on('message_deleted', d => document.getElementById('msg-'+d.id)?.remove());

    // --- PROFİL VE HİKAYE ---
    function uploadProfile(input) {
        if(!input.files[0]) return;
        const reader = new FileReader();
        reader.onload = e => {
            socket.emit('update_profile', {avatar: e.target.result});
            document.getElementById('my-ava-side').src = e.target.result;
        };
        reader.readAsDataURL(input.files[0]);
    }

    socket.on('profile_sync', d => {
        document.querySelectorAll(`.msg[data-user="${d.username}"] .msg-ava-chat`).forEach(img => img.src = d.avatar);
    });

    function uploadStory(input) {
        if(!input.files[0]) return;
        const reader = new FileReader();
        reader.onload = e => socket.emit('add_story', {content: e.target.result, type: 'image'});
        reader.readAsDataURL(input.files[0]);
    }

    socket.emit('get_stories');
    socket.on('receive_stories', grouped => {
        const list = document.getElementById('st-list');
        list.innerHTML = "";
        for(let user in grouped) {
            list.innerHTML += `
                <div class="st-item">
                    <img src="${grouped[user].avatar}" class="st-circle">
                    <div style="font-size:12px">${user === myName ? 'Sen' : user}</div>
                </div>`;
        }
    });
</script>
</body>
</html>
