<!DOCTYPE html>
<html>
<head>
    <title>SOHBETİMİZ</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        :root { 
            --wa-green: #25D366; 
            --wa-dark: #075e54; 
            --default-bg: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');
        }
        
        body { font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; background: #f0f2f5; }
        
        #side { width: 350px; background: white; border-right: 1px solid #ddd; display: flex; flex-direction: column; }
        
        /* Arka Planın Uygulandığı Ana Panel */
        #main { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            background-image: var(--default-bg); /* Varsayılan */
            background-size: cover;
            background-position: center;
            transition: background 0.3s ease-in-out;
        }

        /* Arka Plan Ayar Menüsü */
        .bg-menu { display: none; position: absolute; top: 60px; right: 80px; background: white; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); z-index: 100; padding: 10px; }
        .bg-menu button { display: block; width: 100%; padding: 8px; border: none; background: none; text-align: left; cursor: pointer; border-radius: 4px; }
        .bg-menu button:hover { background: #f5f5f5; }

        /* Story Bar */
        #story-bar { height: 110px; background: rgba(255,255,255,0.9); border-bottom: 1px solid #ddd; display: flex; align-items: center; padding: 0 15px; gap: 15px; overflow-x: auto; backdrop-filter: blur(5px); }
        .st-item { text-align: center; cursor: pointer; min-width: 70px; }
        .st-circle { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; border: 2px solid var(--wa-green); padding: 2px; }

        /* Messages */
        #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .msg { display: flex; gap: 10px; max-width: 80%; }
        .msg.me { align-self: flex-end; flex-direction: row-reverse; }
        .bubble { padding: 8px 12px; border-radius: 12px; background: white; box-shadow: 0 1px 1px rgba(0,0,0,0.1); position: relative; }
        .me .bubble { background: #dcf8c6; }
        .msg-ava-chat { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; }
        .msg-user { font-size: 11px; font-weight: bold; color: #d32f2f; margin-bottom: 2px; }

        .footer { padding: 10px; background: #f0f0f0; display: flex; align-items: center; gap: 10px; }
        #mIn { flex: 1; border: none; padding: 12px; border-radius: 20px; outline: none; }
        .btn { border: none; background: none; cursor: pointer; font-size: 20px; }
    </style>
</head>
<body>

<div id="side">
    <div style="padding:15px; background:#ededed; display:flex; justify-content:space-between; align-items:center;">
        <div style="display:flex; align-items:center; gap:10px;">
            <img src="{{ user.avatar }}" id="my-ava-side" onclick="document.getElementById('p-file').click()" style="width:40px; height:40px; border-radius:50%; object-fit:cover; cursor:pointer">
            <b>{{ user.username }}</b>
        </div>
        <div style="position: relative;">
            <button class="btn" onclick="toggleBgMenu()">🎨</button>
            <div id="bg-menu" class="bg-menu">
                <button onclick="document.getElementById('bg-file').click()">🖼️ Resim Seç</button>
                <button onclick="resetBackground()">🔄 Varsayılana Dön</button>
            </div>
            <button class="btn" onclick="location.href='/live'">📹</button>
            <button class="btn" onclick="location.href='/logout'">🚪</button>
        </div>
    </div>
    <div id="online-list" style="overflow-y:auto"></div>
</div>

<div id="main" style="background-image: {{ 'url(' + user.bg_img + ')' if user.bg_img else 'var(--default-bg)' }}">
    <div id="story-bar">
        <div class="st-item" onclick="document.getElementById('st-file').click()">
            <div class="st-circle" style="display:flex; align-items:center; justify-content:center; border:2px dashed #999; color:#999">+</div>
            <div style="font-size:12px">Ekle</div>
        </div>
        <div id="st-list" style="display:flex; gap:15px"></div>
    </div>

    <div id="chat-box">
        {% for m in initial_msgs %}
        <div class="msg {{ 'me' if m.username == user.username else '' }}" data-user="{{ m.username }}" id="msg-{{ m.id }}">
            <img src="{{ m.user_avatar }}" class="msg-ava-chat">
            <div class="bubble">
                <div class="msg-user">{{ m.username }}</div>
                {% if m.msg_type == 'image' %}<img src="{{ m.content }}" style="max-width:200px; border-radius:8px">
                {% else %}{{ m.content }}{% endif %}
                <div style="font-size:10px; color:#888; text-align:right; margin-top:4px">
                    {{ m.timestamp }}
                    {% if m.username == user.username %}<span style="color:red; cursor:pointer" onclick="deleteMsg({{ m.id }})">🗑️</span>{% endif %}
                </div>
            </div>
        </div>
        {% endfor %}
    </div>

    <div class="footer">
        <input type="text" id="mIn" placeholder="Mesaj yazın..." autocomplete="off">
        <button class="btn" onclick="sendMsg()">🚀</button>
    </div>
</div>

<input type="file" id="p-file" style="display:none" onchange="uploadProfile(this)" accept="image/*">
<input type="file" id="st-file" style="display:none" onchange="uploadStory(this)" accept="image/*">
<input type="file" id="bg-file" style="display:none" onchange="changeBackground(this)" accept="image/*">

<script>
    const socket = io();
    const myName = "{{ user.username }}";
    const chatBox = document.getElementById('chat-box');
    const mainArea = document.getElementById('main');
    chatBox.scrollTop = chatBox.scrollHeight;

    // --- ARKA PLAN YÖNETİMİ ---
    function toggleBgMenu() {
        const menu = document.getElementById('bg-menu');
        menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
    }

    function changeBackground(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const bgData = e.target.result;
                mainArea.style.backgroundImage = `url(${bgData})`;
                socket.emit('update_bg', {bg: bgData});
                toggleBgMenu();
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    function resetBackground() {
        mainArea.style.backgroundImage = 'var(--default-bg)';
        socket.emit('update_bg', {bg: null});
        toggleBgMenu();
    }

    // --- ENTER İLE MESAJ ---
    document.getElementById('mIn').addEventListener('keypress', (e) => {
        if(e.key === 'Enter') sendMsg();
    });

    function sendMsg() {
        const input = document.getElementById('mIn');
        if(input.value.trim()) {
            socket.emit('message', {msg: input.value, type: 'text'});
            input.value = '';
        }
    }

    // --- SOCKET OLAYLARI ---
    socket.on('new_message', d => {
        const isMe = d.user === myName;
        const html = `
            <div class="msg ${isMe?'me':''}" data-user="${d.user}" id="msg-${d.id}">
                <img src="${d.avatar}" class="msg-ava-chat">
                <div class="bubble">
                    <div class="msg-user">${d.user}</div>
                    ${d.msg}
                    <div style="font-size:10px; color:#888; text-align:right; margin-top:4px">
                        ${d.time} ${isMe ? `<span style="color:red; cursor:pointer" onclick="deleteMsg(${d.id})">🗑️</span>` : ''}
                    </div>
                </div>
            </div>`;
        chatBox.insertAdjacentHTML('beforeend', html);
        chatBox.scrollTop = chatBox.scrollHeight;
    });

    socket.on('update_user_list', users => {
        const list = document.getElementById('online-list');
        list.innerHTML = "";
        // Önce 'Siz'
        if(users[myName]) {
            list.innerHTML += `<div class="user-row me" style="display:flex; align-items:center; padding:10px; background:#e3f2fd;"><img src="${users[myName].avatar}" style="width:40px; height:40px; border-radius:50%; margin-right:10px; object-fit:cover;"> <b>Siz (Çevrimiçi)</b></div>`;
        }
        for(let u in users) {
            if(u !== myName) {
                list.innerHTML += `<div class="user-row" style="display:flex; align-items:center; padding:10px; border-bottom:1px solid #eee;"><img src="${users[u].avatar}" style="width:40px; height:40px; border-radius:50%; margin-right:10px; object-fit:cover;"> ${u}</div>`;
            }
        }
    });

    function deleteMsg(id) { socket.emit('delete_message', {id: id}); }
    socket.on('message_deleted', d => document.getElementById('msg-'+d.id)?.remove());

    // Diğer hikaye ve profil fonksiyonları öncekiyle aynı...
    function uploadProfile(input) {
        const reader = new FileReader();
        reader.onload = e => {
            socket.emit('update_profile', {avatar: e.target.result});
            document.getElementById('my-ava-side').src = e.target.result;
        };
        reader.readAsDataURL(input.files[0]);
    }

    socket.on('profile_sync', d => {
        document.querySelectorAll(`.msg[data-user="${d.username}"] .msg-ava-chat`).forEach(img => img.src = d.avatar);
    });

    function uploadStory(input) {
        const reader = new FileReader();
        reader.onload = e => socket.emit('add_story', {content: e.target.result, type: 'image'});
        reader.readAsDataURL(input.files[0]);
    }
</script>
</body>
</html>
