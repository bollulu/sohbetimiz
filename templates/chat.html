<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Sohbet</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #ece5dd;
    height: 100vh;
    display: flex;
}

#users {
    width: 260px;
    background: #fff;
    border-right: 1px solid #ddd;
    overflow-y: auto;
}

#users h3 {
    margin: 0;
    padding: 15px;
    background: #075e54;
    color: #fff;
}

.user {
    padding: 10px;
    cursor: pointer;
    border-bottom: 1px solid #eee;
}
.user:hover {
    background: #f5f5f5;
}

#chat {
    flex: 1;
    display: flex;
    flex-direction: column;
}

#messages {
    flex: 1;
    padding: 15px;
    overflow-y: auto;
}

.msg {
    margin-bottom: 12px;
    max-width: 75%;
}

.me {
    margin-left: auto;
    text-align: right;
}

.bubble {
    background: #fff;
    padding: 8px 12px;
    border-radius: 8px;
    display: inline-block;
}

.me .bubble {
    background: #dcf8c6;
}

footer {
    display: flex;
    padding: 10px;
    background: #f0f0f0;
    gap: 6px;
}

footer input[type=text] {
    flex: 1;
    padding: 10px;
    border-radius: 20px;
    border: 1px solid #ccc;
    outline: none;
}

footer button {
    border: none;
    background: none;
    font-size: 22px;
    cursor: pointer;
}
</style>
</head>

<body>

<div id="users">
    <h3>Aktif Kullanıcılar</h3>
    <div id="userList"></div>
</div>

<div id="chat">
    <div id="messages"></div>

    <footer>
        <button onclick="document.getElementById('fileInput').click()">📎</button>
        <input type="text" id="textInput" placeholder="Mesaj yaz..."
               onkeydown="if(event.key==='Enter') sendText()">
        <button onclick="sendText()">➤</button>
    </footer>
</div>

<input type="file" id="fileInput" hidden onchange="processFile(this)">

<script>
const socket = io();
const myUser = "{{ user.username }}";
let blockedUsers = [];

/* --------- DOSYA GÖNDERME --------- */
function processFile(input) {
    const file = input.files[0];
    if (!file) return;

    let type = "text";
    if (file.type.startsWith("image/")) type = "image";
    else if (file.type.startsWith("video/")) type = "video";
    else if (file.type.startsWith("audio/")) type = "audio";

    const reader = new FileReader();
    reader.onload = e => {
        socket.emit("send_msg", {
            content: e.target.result,
            type: type
        });
    };
    reader.readAsDataURL(file);

    input.value = "";
}

/* --------- METİN MESAJ --------- */
function sendText() {
    const input = document.getElementById("textInput");
    if (!input.value.trim()) return;

    socket.emit("send_msg", {
        content: input.value,
        type: "text"
    });

    input.value = "";
}

/* --------- MESAJ GÖSTER --------- */
function renderMsg(d) {
    if (blockedUsers.includes(d.sender)) return;

    let html = "";

    if (d.type === "image") {
        html = `<img src="${d.content}" style="max-width:220px;border-radius:8px;">`;
    }
    else if (d.type === "video") {
        html = `<video src="${d.content}" controls style="max-width:240px;border-radius:8px;"></video>`;
    }
    else if (d.type === "audio") {
        html = `<audio src="${d.content}" controls></audio>`;
    }
    else {
        html = d.content;
    }

    const msg = document.createElement("div");
    msg.className = "msg" + (d.sender === myUser ? " me" : "");
    msg.innerHTML = `
        <div class="bubble">
            <b>${d.sender}</b><br>${html}
        </div>
    `;

    document.getElementById("messages").appendChild(msg);
    document.getElementById("messages").scrollTop =
        document.getElementById("messages").scrollHeight;
}

/* --------- SOCKET EVENTLERİ --------- */
socket.on("new_msg", d => {
    renderMsg(d);
});

socket.on("load_history", msgs => {
    document.getElementById("messages").innerHTML = "";
    msgs.forEach(m => renderMsg(m));
});

socket.on("update_online", users => {
    const list = document.getElementById("userList");
    list.innerHTML = "";
    users.forEach(u => {
        const div = document.createElement("div");
        div.className = "user";
        div.textContent = u;
        list.appendChild(div);
    });
});
</script>

</body>
</html>
