<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chat V10</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        :root { --main: #075e54; --me: #dcf8c6; }
        body { font-family: sans-serif; margin: 0; display: flex; height: 100vh; background: #e5ddd5; overflow: hidden; }
        
        .sidebar { width: 280px; background: #fff; border-right: 1px solid #ddd; display: flex; flex-direction: column; transition: 0.3s; z-index: 1000; }
        .chat-area { flex: 1; display: flex; flex-direction: column; position: relative; min-width: 0; }
        
        #chat-box { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; background-size: cover; background-position: center; }
        
        /* Mesaj Yazma Alanı - Alt Kısma Sabit */
        .input-bar { padding: 10px; background: #f0f2f5; display: flex; align-items: center; gap: 8px; border-top: 1px solid #ddd; }
        #chat-form { display: flex; flex: 1; gap: 8px; align-items: center; }
        #msgIn { flex: 1; padding: 12px; border-radius: 25px; border: 1px solid #ddd; font-size: 16px; outline: none; }
        
        .msg-row { display: flex; gap: 8px; margin-bottom: 10px; max-width: 85%; }
        .msg-row.me { align-self: flex-end; flex-direction: row-reverse; }
        .msg-bubble { padding: 8px 12px; border-radius: 10px; background: #fff; box-shadow: 0 1px 1px rgba(0,0,0,0.1); }
        .me .msg-bubble { background: var(--me); }
        .avatar { width: 35px; height: 35px; border-radius: 50%; object-fit: cover; }
        
        .room-btn { width: 100%; padding: 15px; border: none; background: #fff; text-align: left; cursor: pointer; border-bottom: 1px solid #eee; }
        .room-btn.active { background: #e9edef; border-left: 5px solid var(--main); font-weight: bold; }
        
        .mobile-header { display: none; padding: 10px; background: var(--main); color: white; align-items: center; gap: 10px; }
        
        @media (max-width: 768px) {
            .sidebar { position: absolute; left: -280px; height: 100%; }
            .sidebar.open { left: 0; }
            .mobile-header { display: flex; }
        }
        .media-msg { max-width: 200px; border-radius: 8px; margin-top: 5px; display: block; }
    </style>
</head>
<body>
    <audio id="notifSound" src="https://assets.mixkit.co/active_storage/sfx/2358/2358-preview.mp3"></audio>

    <div class="sidebar" id="sidebar">
        <div style="padding:20px; background: var(--main); color:white; text-align:center;">
            <img src="{{ user.avatar or 'https://cdn-icons-png.flaticon.com/512/149/149071.png' }}" id="myAv" class="avatar" style="width:60px; height:60px; cursor:pointer;" onclick="$('#avInput').click()">
            <div style="margin-top:5px;">@{{ user.username }}</div>
            <input type="file" id="avInput" style="display:none" accept="image/*">
        </div>
        <div style="flex:1; overflow-y:auto;">
            <button class="room-btn active" onclick="changeRoom('Genel')">📢 Genel Sohbet</button>
            <button class="room-btn" onclick="changeRoom('Özel Oda', true)">🔒 Özel Oda (Şifreli)</button>
            <div id="user-list" style="padding:15px; font-size:13px;"></div>
        </div>
        <div style="padding:10px; border-top:1px solid #eee;">
            <button onclick="$('#bgInput').click()" style="width:100%; padding:8px; background:#3498db; color:white; border:none; border-radius:5px; margin-bottom:5px;">🖼️ Duvar Kağıdı</button>
            <input type="file" id="bgInput" style="display:none" accept="image/*">
            <a href="/logout" style="display:block; text-align:center; color:red; text-decoration:none; padding:5px;">Çıkış</a>
        </div>
    </div>

    <div class="chat-area">
        <div class="mobile-header">
            <button onclick="$('#sidebar').toggleClass('open')" style="background:none; border:none; color:white; font-size:24px;">☰</button>
            <b id="room-title">Oda: Genel</b>
        </div>
        
        <div id="chat-box"></div>
        
        <div class="input-bar">
            <button onclick="$('#fileIn').click()" style="background:none; border:none; font-size:20px; cursor:pointer;">📎</button>
            <input type="file" id="fileIn" style="display:none" accept="image/*,video/*">
            
            <form id="chat-form" onsubmit="sendMsg(event)">
                <input type="text" id="msgIn" placeholder="Mesaj yazın..." autocomplete="off">
                <button type="submit" style="background:var(--main); color:white; border:none; width:40px; height:40px; border-radius:50%; cursor:pointer;">➔</button>
            </form>
        </div>
    </div>

    <script>
        var socket = io({transports: ['websocket', 'polling']});
        var myUser = "{{ user.username }}";
        var currentRoom = "Genel";

        $(document).ready(function() {
            let savedBg = localStorage.getItem('chat_bg');
            if(savedBg) $('#chat-box').css('background-image', `url(${savedBg})`);
        });

        function changeRoom(name, isPrivate = false) {
            let pass = isPrivate ? prompt("Şifre giriniz:") : '';
            if(isPrivate && !pass) return;
            currentRoom = name;
            $('#room-title').text("Oda: " + name);
            $('.room-btn').removeClass('active');
            $('#chat-box').empty();
            $('#sidebar').removeClass('open');
            socket.emit('join', {room: name, password: pass});
        }

        socket.emit('join', {room: 'Genel'});

        function sendMsg(e) {
            e.preventDefault();
            let input = $('#msgIn');
            if(input.val().trim()) {
                socket.emit('message', {msg: input.val(), type: 'text'});
                input.val('').focus();
            }
        }

        function addMessage(d, isHistory = false) {
            let isMe = d.user == myUser;
            if(!isMe && !isHistory) document.getElementById('notifSound').play().catch(()=>{});
            
            let content = d.msg;
            if(d.type == 'image') content = `<img src="${d.msg}" class="media-msg" onclick="window.open(this.src)">`;
            else if(d.type == 'video') content = `<video src="${d.msg}" class="media-msg" controls></video>`;

            let html = `
            <div class="msg-row ${isMe?'me':''}" id="m-${d.id}">
                <img src="${d.avatar || 'https://cdn-icons-png.flaticon.com/512/149/149071.png'}" class="avatar">
                <div class="msg-bubble">
                    <small style="color:var(--main); font-weight:bold;">${d.user}</small>
                    <div style="margin-top:2px;">${content}</div>
                    <small style="color:gray; font-size:9px;">${d.time}</small>
                    ${isMe ? `<span style="color:red; font-size:9px; cursor:pointer; margin-left:10px;" onclick="socket.emit('delete_message',{id:'${d.id}'})">SİL</span>` : ''}
                </div>
            </div>`;
            $('#chat-box').append(html);
            $('#chat-box').scrollTop($('#chat-box')[0].scrollHeight);
        }

        socket.on('message', d => addMessage(d));
        socket.on('history', data => data.forEach(d => addMessage(d, true)));
        socket.on('remove_message', d => $(`#m-${d.id}`).remove());
        socket.on('user_list', list => {
            let html = '<b>Çevrimiçi:</b><br>';
            list.forEach(u => html += `<div style="font-size:12px;">🟢 ${u.name}</div>`);
            $('#user-list').html(html);
        });

        $('#fileIn').change(function(e) {
            let reader = new FileReader();
            reader.onload = ev => socket.emit('message', {msg: ev.target.result, type: e.target.files[0].type.startsWith('image')?'image':'video'});
            reader.readAsDataURL(e.target.files[0]);
        });

        $('#avInput').change(function(e) {
            let reader = new FileReader();
            reader.onload = ev => { socket.emit('update_avatar', {img: ev.target.result}); $('#myAv').attr('src', ev.target.result); };
            reader.readAsDataURL(e.target.files[0]);
        });

        $('#bgInput').change(function(e) {
            let reader = new FileReader();
            reader.onload = ev => { $('#chat-box').css('background-image', `url(${ev.target.result})`); localStorage.setItem('chat_bg', ev.target.result); };
            reader.readAsDataURL(e.target.files[0]);
        });

        socket.on('error', d => { alert(d.msg); location.reload(); });
    </script>
</body>
</html>
