<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Chat + Story</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>

<style>
body{margin:0;font-family:Arial;background:#ece5dd;height:100vh;display:flex;flex-direction:column}
#top{background:#075e54;color:white;padding:10px;font-weight:bold}
#story-bar{display:flex;gap:15px;padding:10px;background:white;overflow-x:auto}
.story-wrap{text-align:center;cursor:pointer}
.story-circle{width:60px;height:60px;border-radius:50%;border:3px solid #25D366;object-fit:cover}
.story-add{border:3px dashed #999;display:flex;align-items:center;justify-content:center;font-size:28px;color:#999}
#chat-area{flex:1;padding:10px;overflow-y:auto}
#footer{display:flex;padding:10px;background:#f0f0f0;gap:10px}
#footer input{flex:1;padding:10px;border-radius:20px;border:none}
#viewer{display:none;position:fixed;inset:0;background:black;z-index:999;align-items:center;justify-content:center}
#viewer img,#viewer video{max-width:100%;max-height:90vh}
.viewer-top{position:absolute;top:10px;left:10px;color:white;display:flex;gap:10px;align-items:center}
.viewer-close{position:absolute;top:10px;right:10px;font-size:24px;color:white;cursor:pointer}
.viewer-del{position:absolute;bottom:20px;right:20px;background:red;color:white;border:none;padding:10px}
</style>
</head>

<body>

<div id="top">Chat</div>

<!-- STORY BAR -->
<div id="story-bar">
  <div class="story-wrap" onclick="pickStory()">
    <div class="story-circle story-add">+</div>
    <div style="font-size:11px">Hikaye</div>
  </div>
  <div id="stories"></div>
</div>

<div id="chat-area"></div>

<div id="footer">
  <input type="text" placeholder="Mesaj yaz (demo)">
</div>

<!-- STORY VIEWER -->
<div id="viewer">
  <div class="viewer-top">
    <img id="v-ava" width="30" height="30" style="border-radius:50%">
    <b id="v-name"></b>
  </div>
  <div class="viewer-close" onclick="closeViewer()">✕</div>
  <button id="delBtn" class="viewer-del" onclick="deleteStory()">Sil</button>

  <img id="v-img" style="display:none">
  <video id="v-vid" controls autoplay style="display:none"></video>
</div>

<input type="file" id="st-media" accept="image/*,video/*" hidden>
<input type="file" id="st-music" accept="audio/*" hidden>

<script>
const socket = io();
let stories = {};
let curUser = null;
let curIndex = 0;
let audio = new Audio();

function pickStory(){
  document.getElementById("st-media").click();
}

document.getElementById("st-media").onchange = e=>{
  const file = e.target.files[0];
  if(!file) return;
  const type = file.type.startsWith("video")?"video":"image";

  if(confirm("Müzik eklemek ister misiniz?")){
    document.getElementById("st-music").onchange = m=>{
      readStory(file,type,m.target.files[0]);
    };
    document.getElementById("st-music").click();
  }else{
    readStory(file,type,null);
  }
};

function readStory(media,type,music){
  const r1=new FileReader();
  r1.onload=e1=>{
    if(music){
      const r2=new FileReader();
      r2.onload=e2=>{
        socket.emit("add_story",{media:e1.target.result,music:e2.target.result,type:type});
      };
      r2.readAsDataURL(music);
    }else{
      socket.emit("add_story",{media:e1.target.result,music:null,type:type});
    }
  };
  r1.readAsDataURL(media);
}

socket.on("story_list",data=>{
  stories=data;
  const s=document.getElementById("stories");
  s.innerHTML="";
  Object.keys(stories).forEach(u=>{
    s.innerHTML+=`
      <div class="story-wrap" onclick="openStory('${u}')">
        <img src="${stories[u].avatar}" class="story-circle">
        <div style="font-size:11px">${u}</div>
      </div>`;
  });
});

function openStory(u){
  curUser=u;
  curIndex=0;
  showStory();
}

function showStory(){
  const item=stories[curUser].items[curIndex];
  if(!item){closeViewer();return;}

  document.getElementById("viewer").style.display="flex";
  document.getElementById("v-ava").src=stories[curUser].avatar;
  document.getElementById("v-name").innerText=curUser;

  document.getElementById("delBtn").style.display=item.can_delete?"block":"none";

  const img=document.getElementById("v-img");
  const vid=document.getElementById("v-vid");

  img.style.display="none";
  vid.style.display="none";
  audio.pause();

  if(item.type==="video"){
    vid.src=item.media;
    vid.style.display="block";
  }else{
    img.src=item.media;
    img.style.display="block";
    if(item.music){
      audio.src=item.music;
      audio.play();
    }
  }

  socket.emit("view_story",{id:item.id});

  setTimeout(()=>{curIndex++;showStory();},5000);
}

function closeViewer(){
  document.getElementById("viewer").style.display="none";
  audio.pause();
}

function deleteStory(){
  const id=stories[curUser].items[curIndex].id;
  socket.emit("delete_story",{id:id});
  closeViewer();
}
</script>

</body>
</html>
