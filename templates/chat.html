<!DOCTYPE html>
<html lang="tr">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sohbet</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        body { margin:0; font-family:sans-serif; background:#e5ddd5; overflow:hidden; display:flex; flex-direction:column; height:100vh; }
        header { background:#075e54; color:white; padding:10px 15px; display:flex; justify-content:space-between; align-items:center; z-index:100; }
        
        /* Video Katmanı */
        #video-overlay { display:none; position:fixed; inset:0; background:black; z-index:2000; flex-direction:column; }
        #remote-video { width:100%; height:100%; object-fit:cover; }
        #local-video { width:30%; height:20%; position:absolute; top:20px; right:20px; border-radius:10px; border:2px solid white; object-fit:cover; z-index:2001; transform: scaleX(-1); }
        .call-tools { position:absolute; bottom:40px; width:100%; display:flex; justify-content:center; gap:20px; }
        .btn-call { padding:15px; border-radius:50%; border:none; cursor:pointer; font-size:20px; }

        /* Mesajlaşma Alanı */
        #chat-area { flex:1; overflow-y:auto; padding:15px; display:flex; flex-direction:column; gap:10px; }
        .msg { background:white; padding:10px; border-radius:10px; max-width:80%; align-self:flex-start; box-shadow:0 1px 2px rgba(0,0,0,0.1); }
        .msg.me { background:#dcf8c6; align-self:flex-end; }

        footer { background:#f0f0f0; padding:10px; display:flex; gap:10px; align-items:center; }
        input { flex:1; padding:12px; border:none; border-radius:25px; outline:none; font-size:16px; }
        button#send { background:none; border:none; font-size:24px; cursor:pointer; }
    </style>
</head>
<body>

<header>
    <b>{{ user.username }}</b>
    <div>
        <button onclick="startCall()" style="background:none; border:none; color:white; font-size:20px; cursor:pointer;">📞</button>
        <button onclick="location.href='/logout'" style="background:none; border:none; color:white; margin-left:15px;">🚪</button>
    </div>
</header>

<div id="video-overlay">
    <video id="local-video" autoplay muted playsinline></video>
    <video id="remote-video" autoplay playsinline></video>
    <div class="call-tools">
        <button class="btn-call" style="background:red; color:white;" onclick="endCall()">🚫</button>
    </div>
</div>

<div id="chat-area">
    <div class="msg">Sohbetimize hoş geldiniz! Aramayı başlatmak için üstteki telefon simgesine tıklayın.</div>
</div>

<footer>
    <input type="text" id="mIn" placeholder="Mesaj yazın...">
    <button id="send" onclick="sendMsg()">🚀</button>
</footer>

<script>
    const socket = io();
    let localStream;
    let peerConnection;
    const iceCfg = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

    // Mesajlaşma
    function sendMsg() {
        const i = document.getElementById('mIn');
        if(i.value.trim()) {
            socket.emit('message', {content: i.value}); // Sunucuda handle_msg fonksiyonu önceki kodda olduğu gibi çalışır.
            i.value = '';
        }
    }

    // Video Chat Mantığı
    async function startCall() {
        document.getElementById('video-overlay').style.display = 'flex';
        localStream = await navigator.mediaDevices.getUserMedia({video:true, audio:true});
        document.getElementById('local-video').srcObject = localStream;

        peerConnection = new RTCPeerConnection(iceCfg);
        localStream.getTracks().forEach(t => peerConnection.addTrack(t, localStream));

        peerConnection.onicecandidate = e => e.candidate && socket.emit('new-ice-candidate', e.candidate);
        peerConnection.ontrack = e => document.getElementById('remote-video').srcObject = e.streams[0];

        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);
        socket.emit('video-offer', offer);
    }

    socket.on('video-offer', async (offer) => {
        if(!peerConnection) {
            document.getElementById('video-overlay').style.display = 'flex';
            localStream = await navigator.mediaDevices.getUserMedia({video:true, audio:true});
            document.getElementById('local-video').srcObject = localStream;
            peerConnection = new RTCPeerConnection(iceCfg);
            localStream.getTracks().forEach(t => peerConnection.addTrack(t, localStream));
            peerConnection.onicecandidate = e => e.candidate && socket.emit('new-ice-candidate', e.candidate);
            peerConnection.ontrack = e => document.getElementById('remote-video').srcObject = e.streams[0];
        }
        await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));
        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);
        socket.emit('video-answer', answer);
    });

    socket.on('video-answer', async (answer) => {
        await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
    });

    socket.on('new-ice-candidate', async (c) => {
        try { await peerConnection.addIceCandidate(c); } catch(e) {}
    });

    function endCall() { location.reload(); }
</script>
</body>
</html>
