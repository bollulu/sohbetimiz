<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Giriş Yap</title>
    <style>
        :root { --wp-green: #25D366; --wp-dark: #075e54; }
        body { 
            margin: 0; padding: 0; height: 100vh; display: flex; 
            justify-content: center; align-items: center; 
            background: #f0f2f5; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .container { 
            background: white; padding: 30px; border-radius: 20px; 
            width: 85%; max-width: 380px; text-align: center; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.08); 
        }
        .logo { width: 70px; height: 70px; background: var(--wp-green); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; color: white; font-size: 30px; }
        h2 { color: var(--wp-dark); margin-bottom: 25px; font-size: 24px; }
        input { 
            width: 100%; padding: 14px; margin: 10px 0; 
            border: 1px solid #ddd; border-radius: 10px; 
            box-sizing: border-box; font-size: 16px; outline: none;
        }
        button { 
            width: 100%; padding: 14px; background: var(--wp-dark); 
            color: white; border: none; border-radius: 10px; 
            font-weight: bold; font-size: 16px; cursor: pointer; 
            margin-top: 15px;
        }
        .footer-text { margin-top: 20px; font-size: 14px; color: #666; }
        .footer-text a { color: var(--wp-green); text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">💬</div>
        <h2>Hoş Geldiniz</h2>
        <form method="POST" action="/login">
            <input type="text" name="username" placeholder="Kullanıcı Adı" required autofocus>
            <input type="password" name="password" placeholder="Şifre" required>
            <button type="submit">Giriş Yap</button>
        </form>
        <div class="footer-text">
            Henüz üye değil misin? <a href="{{ url_for('register') }}">Kayıt Ol</a>
        </div>
    </div>
</body>
</html>
