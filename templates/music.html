<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Sohbetimiz - Müzik</title>
    <style>
        body { background: #121212; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        .player { background: #282828; padding: 30px; border-radius: 15px; text-align: center; width: 300px; }
        input[type=range] { width: 100%; cursor: pointer; }
        button { background: #1db954; border: none; padding: 10px 20px; border-radius: 20px; color: white; font-weight: bold; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="player">
        <h2>Müzik Çalar</h2>
        <input type="file" id="f" accept="audio/*" onchange="load(this)">
        <div id="name">Şarkı seçilmedi</div>
        <audio id="a"></audio>
        <input type="range" id="s" value="0" oninput="seek(this)">
        <button onclick="play()">Oynat/Duraklat</button>
        <button onclick="history.back()" style="background:#555;">Geri Dön</button>
    </div>
    <script>
        const a = document.getElementById('a');
        const s = document.getElementById('s');
        function load(i) {
            const file = i.files[0];
            document.getElementById('name').innerText = file.name;
            a.src = URL.createObjectURL(file);
        }
        function play() { a.paused ? a.play() : a.pause(); }
        a.ontimeupdate = () => { s.max = a.duration; s.value = a.currentTime; };
        function seek(el) { a.currentTime = el.value; }
    </script>
</body>
</html>
